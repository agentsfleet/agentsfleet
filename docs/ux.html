:root{color-scheme:dark;--canvas:#101114;--surface:#181a1e;--panel:#202328;--raised:#2b2e35;--text:#f5f6f8;--secondary:#c2c7d0;--muted:#a3abb7;--line:#3d424b;--soft-line:#30343c;--accent:#c1f0d6;--accent-text:#153d29;--warning:#f3cb87;--error:#ffb3b6;--error-bg:#302126;--success:#b6e4c8;--radius-sm:10px;--radius:16px;--radius-lg:22px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;--rail:72px;--icon-rail:20px;--icon-control:16px;--icon-composer:18px}
[data-theme=light]{color-scheme:light;--canvas:#e9ebee;--surface:#fafbfc;--panel:#f0f2f5;--raised:#e3e7ec;--text:#20242b;--secondary:#495361;--muted:#5e6876;--line:#bdc5ce;--soft-line:#d7dce2;--accent:#24593d;--accent-text:#fff;--warning:#765017;--error:#a42938;--error-bg:#fff0f1;--success:#286644}
*{box-sizing:border-box} [hidden]{display:none!important}html,body{margin:0;height:100%;overflow:hidden}body{font:500 14px/1.5 Manrope,sans-serif;letter-spacing:0;background:var(--canvas);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;font-weight:650}button,a,input,textarea,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent)}button:disabled{cursor:not-allowed;opacity:1;background:var(--raised);color:var(--muted);border-color:var(--soft-line)}button:hover:not(:disabled){background:var(--raised)}a{color:inherit;text-underline-offset:4px}button,i{flex-shrink:0}i{width:var(--icon-control);height:var(--icon-control);display:inline-flex;vertical-align:middle}i svg{width:100%;height:100%;fill:currentColor}p{margin:0 0 var(--s4)}h1,h2,h3{margin:0;font-weight:750;line-height:1.3}h2{font-size:20px}h3{font-size:15px}small{font-size:12px}strong{font-weight:750}code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}textarea,input,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm)}input,select{min-height:44px;padding:var(--s2) var(--s3)}input[type=checkbox]{min-height:auto;width:18px;height:18px;accent-color:var(--accent)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.skip{position:fixed;top:-100px;left:16px;z-index:99;padding:12px;background:var(--accent);color:var(--accent-text)}.skip:focus{top:8px}

.setup-summary .setup-origin{display:flex;align-items:center;gap:6px;color:var(--muted);margin:0 0 14px;font-size:12px;line-height:16px}.setup-summary .setup-origin i{width:14px;height:14px}
.setup-summary .summary-section{padding:14px 0}.setup-summary .summary-section:last-child{padding-bottom:0}
.setup-summary .setup-section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.setup-summary .summary-label{font-size:12px;line-height:18px;font-weight:400;margin:0}.setup-summary .setup-manage{min-height:28px;padding:4px 0 4px 8px;font-size:12px;line-height:16px;color:var(--muted);border-radius:4px}
.setup-summary .setup-resource{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;line-height:20px;overflow-wrap:anywhere}.setup-summary .setup-resource i{width:16px;height:16px;color:var(--secondary)}
.setup-summary .setup-none{margin:0;color:var(--muted);font-size:13px;line-height:20px}.setup-summary .setup-tools{font-size:12px;line-height:18px;color:var(--secondary);margin:8px 0 0}.setup-summary .setup-tools span{color:var(--muted);margin-right:8px}
.setup-policy-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}.setup-policy-row+.setup-policy-row{padding-top:8px;border-top:1px solid var(--soft-line)}
.setup-policy-label{display:flex;align-items:center;gap:2px;min-width:0;font-size:12px;line-height:18px}.setup-policy-label label{cursor:pointer}.setup-policy-info{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:24px;height:28px;padding:4px;border-radius:4px;color:var(--muted)}.setup-policy-info i{width:13px;height:13px}
.setup-summary input.setup-switch{appearance:none;display:block;min-height:0;width:32px;height:20px;padding:3px;margin:0;flex-shrink:0;border:0;border-radius:20px;background:var(--line);cursor:pointer;box-shadow:none}
.setup-summary input.setup-switch::before{content:'';display:block;width:14px;height:14px;background:var(--surface);border-radius:50%;transition:transform .15s ease-out}
.setup-summary input.setup-switch:checked{background:var(--accent)}.setup-summary input.setup-switch:checked::before{transform:translateX(12px);background:var(--accent-text)}.setup-summary input.setup-switch:disabled{cursor:not-allowed;opacity:.4}.setup-policy-row[data-inactive] .setup-policy-label{color:var(--muted);opacity:.6}
.setup-publish-wrap{display:flex;justify-content:center;margin:0 0 12px}.setup-publish{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:10px 18px;min-height:40px;border:1px solid var(--line);border-radius:24px;background:var(--panel);font-size:13px;line-height:20px;font-weight:500}.setup-publish i{width:14px;height:14px;color:var(--muted)}
.setup-editor textarea{width:100%;min-height:180px;padding:12px;font-size:13px;line-height:20px}.setup-selection{display:grid;gap:8px;margin:20px 0}.setup-selection .checkbox{margin:0;min-height:44px;align-items:center;overflow-wrap:anywhere}
.setup-published{margin:0;color:var(--success);font-size:13px;line-height:20px}
.setup-live{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;line-height:20px}
.setup-live-spinner{display:inline-flex;align-items:center;flex-shrink:0;color:var(--muted)}.setup-live-spinner i{width:16px;height:16px}
.setup-live-text{font-weight:600;color:var(--muted);background-image:linear-gradient(100deg,var(--muted) 30%,var(--text) 50%,var(--muted) 70%);background-size:250% 100%;background-clip:text;-webkit-text-fill-color:transparent;animation:setup-text-sweep 2.8s ease-in-out infinite}
.setup-live-seconds{font-variant-numeric:tabular-nums;font-weight:400;color:var(--muted);white-space:nowrap}.setup-live-spinner{animation:setup-spinner-turn 1s linear infinite}
@keyframes setup-text-sweep{0%,12%{background-position:100% 0}88%,100%{background-position:0 0}}
@keyframes setup-spinner-turn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.setup-live-text{animation:none;background:none;-webkit-text-fill-color:currentColor}.setup-live-spinner{animation:none}}
@media(max-width:1100px){.review-caption{display:none}.setup-review-picker{margin-left:8px;padding-left:8px}.review-bar{padding-left:12px;padding-right:12px}}
@media(max-width:680px){.review-bar{height:auto;min-height:82px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.review-bar>span{width:100%;justify-content:space-between}.review-links{width:100%}.app{height:calc(100dvh - 82px)}.setup-review-picker{border:0;padding:0;margin:0}.setup-summary .setup-meta{gap:8px}.setup-summary .summary-section{padding:12px 0}.setup-summary .setup-resource{min-height:36px}.setup-summary .setup-manage{min-height:44px;padding:8px}.setup-policy-info{width:36px;height:44px}.setup-policy-row{min-height:48px}.setup-summary .setup-section-heading{margin-bottom:0}.setup-editor textarea{font-size:16px;line-height:24px}.setup-publish{min-height:44px}.setup-summary .setup-origin{margin-bottom:12px}}
@media(prefers-reduced-motion:reduce){.setup-summary input.setup-switch::before{transition:none}}
</style>
</head>

function updateCredentialMode() {

  $('#new-key-fields').hidden=saved;$('#saved-key-fields').hidden=!saved;

function usageData(period,scope) {
  const samples={month:{all:['42.68','128','3.2M','November 1–11',[['Release watch','Image build and security scans','Default model','$18.24','52'],['Support triage','Issue investigation and handoffs','Default model','$16.18','48'],['Merge watch','Scheduled pull request checks','Economy model','$8.26','28']]],release:['18.24','52','1.4M','November 1–11',[['Release watch','Image build and security scans','Default model','$18.24','52']]],merge:['8.26','28','620K','November 1–11',[['Merge watch','Scheduled pull request checks','Economy model','$8.26','28']]]},week:{all:['26.14','76','1.9M','November 5–11',[['Release watch','Image build and security scans','Default model','$11.32','30'],['Support triage','Issue investigation and handoffs','Default model','$9.42','28'],['Merge watch','Scheduled pull request checks','Economy model','$5.40','18']]],release:['11.32','30','840K','November 5–11',[['Release watch','Image build and security scans','Default model','$11.32','30']]],merge:['5.40','18','390K','November 5–11',[['Merge watch','Scheduled pull request checks','Economy model','$5.40','18']]]}};
  const [cost,count,tokens,range,rows]=samples[period][scope];
  const weights=period==='week'?[11,20,28,16,24,33,18]:[14,8,16,20,13,16,25,34,21,28,38];
  const cents=Math.round(Number(cost)*100),weightTotal=weights.reduce((a,b)=>a+b,0);
  const daily=weights.map(n=>Math.floor(cents*n/weightTotal));daily[daily.length-1]+=cents-daily.reduce((a,b)=>a+b,0);
  const peak=Math.max(...daily);
  return `<div class="metric-strip"><div class="metric"><label>Settled charges</label><strong>$${cost}</strong><small>${range} · USD</small></div><div class="metric"><label>Activities</label><strong>${count}</strong><small>With settled usage</small></div><div class="metric"><label>Tokens</label><strong>${tokens}</strong><small>Input and output combined</small></div></div><figure class="usage-chart" aria-label="Daily settled charges, ${range}, total $${cost}" style="margin-left:0;margin-right:0"><figcaption class="chart-title"><span>Daily spend · ${scope==='all'?'All fleets':scope==='release'?'Release watch':'Merge watch'}</span><span>Daily high $${(peak/100).toFixed(2)}</span></figcaption><div class="bar-chart" aria-hidden="true">${daily.map((n,i)=>`<span title="Nov ${i+(period==='week'?5:1)}: $${(n/100).toFixed(2)}" style="height:${Math.round(n/peak*90)}%"></span>`).join('')}</div><div class="chart-axis"><span>${period==='week'?'Nov 5':'Nov 1'}</span><span>Nov 11</span></div></figure><div class="section-title"><h3>By fleet</h3><span class="subtle">${range}</span></div><div class="panel table-scroll" role="region" aria-label="Data table" tabindex="0"><table class="data-table"><thead><tr><th scope="col">Fleet</th><th scope="col">Model</th><th scope="col">Activities</th><th scope="col">Charged</th></tr></thead><tbody>${rows.map(([name,desc,model,money,activities])=>`<tr><td><strong>${name}</strong><small>${desc}</small></td><td>${model}</td><td>${activities}</td><td>${money}</td></tr>`).join('')}</tbody></table></div><p class="page-note">Pending and unavailable usage are excluded from settled charges. Charges remain in your history if a fleet is deleted.</p>`;
}

    case 'changes':dialog('3 files changed',`<p>platform-images · Runner update</p><div class="tool-output"><header>Dockerfile</header><pre><span class="diff-remove">− FROM rust:1.97</span>\n<span class="diff-add">+ FROM rust:1.98</span></pre></div><p class="preview-note">Also changed: release.yml and README.md. Illustrative diff.</p>`);break;
    case 'output':dialog('Update runner image',`<p>Pull request #58 · platform-images</p><p>3 files changed. Build and security scans passed.</p>${previewNote('This is an illustrative pull request; it has no external destination.')}`);break;
    case 'reconnect':appState.retried=true;showView('failure');break;
    case 'schedule':scheduleDialog();break;
    case 'pause-schedule':scheduleFor().state=scheduleFor().state==='paused'?'active':'paused';showView(appState.view);break;
    case 'cancel-schedule':confirmLocal('Cancel scheduled wake-up?',`${fleetNames[appState.view]} will stop waking up on a schedule.`,'confirm-cancel-schedule','Cancel wake-up');break;
    case 'confirm-cancel-schedule':scheduleFor().state='cancelled';$('#modal').close();showView(appState.view);break;
    case 'rename':dialog('Rename fleet',`<form id="rename-form"><label class="field">Fleet name<input id="fleet-name" value="${esc(fleetNames[appState.view])}" required maxlength="70"></label>${previewNote()}${modalActions('<button class="primary" type="submit">Save name</button>')}</form>`);break;
    case 'archive':case 'delete':appState.pendingFleet=appState.view;confirmLocal(action==='delete'?'Permanently delete this fleet?':'Archive this fleet?',action==='delete'?'Stop this fleet and permanently remove its setup and conversation history. This cannot be undone. Usage history is retained.':'Permanently stop this fleet and keep its setup and conversation history. It cannot resume or be restored.',action==='delete'?'confirm-delete':'confirm-archive',action==='delete'?'Permanently Delete':'Archive');break;
    case 'confirm-delete':case 'confirm-archive':{const view=appState.pendingFleet;const deleted=action==='confirm-delete';appState.lifecycle[view]=deleted?'deleted':'archived';$('#modal').close();showView('empty',true);showActionNotice(deleted?'Fleet permanently deleted':'Fleet archived',view,deleted);break;}
    case 'dismiss-notice':dismissActionNotice();break;
    case 'view-archived':{const view=noticeFleet;dismissActionNotice();showView(view,true);break;}
    case 'sign-out':dialog('Sign out',`<p>Sign out of agentsfleet on this device.</p>${previewNote('Sign out is shown in the avatar menu and Security. This preview has no signed-in session.')}<div class="modal-actions"><button class="primary" data-action="close">Back to preview</button></div>`);break;
    case 'revoke-other-sessions':confirmLocal('Sign out other sessions?','Your current session will stay signed in.','confirm-revoke-others','Sign out other sessions');break;
    case 'confirm-revoke-others':appState.sessions=appState.sessions.slice(0,1);$('#modal').close();showView('security');break;
    case 'confirm-revoke-session':appState.sessions=appState.sessions.filter(x=>x!==appState.pendingSession);$('#modal').close();showView('security');break;
    case 'confirm-revoke-key':appState.keys=appState.keys.filter(x=>x!==appState.pendingKey);$('#modal').close();showView('security');break;
    case 'create-key':dialog('Create API key',`<form id="key-form"><label class="field">Name<input id="key-name" placeholder="e.g. Release automation" required maxlength="60"></label><p class="preview-note">Sample key only. This preview does not create credentials.</p>${modalActions('<button class="primary" type="submit">Create sample key</button>')}</form>`);break;
    case 'attach':dialog('Attach a document',`<p>Add a file to your next message.</p><label class="field">Choose a sample file<input id="file-input" type="file" multiple></label>${previewNote('File names are shown locally. No file content is read or uploaded.')}`);break;
    case 'mention':dialog('Mention in your message',`<p>Choose a source for this fleet.</p><div class="modal-options"><button class="secondary" data-action="insert-source">${icon('folder-simple')}platform-images</button></div>`);break;
    case 'insert-source':$('#modal').close();insertText('@platform-images');break;
    case 'models':modelPicker();break;
    case 'model-default':case 'model-economy':appState.models[appState.view]=action==='model-default'?'Default model':'Economy model';$('#modal').close();showView(appState.view);break;
    case 'quote':insertText('> '+(appState.view==='activity'?'The changes are ready.':appState.view==='failure'?'The health check hasn’t run.':appState.view==='scheduled'?'Next check at '+scheduleFor().wake+' UTC.':'The runner update is ready.')+'\n\n');break;
    case 'copy-reply':{const text=b.closest('.assistant-turn')?.innerText||'';navigator.clipboard?.writeText(text).then(()=>{b.setAttribute('aria-label','Response copied');b.title='Copied';}).catch(()=>dialog('Copy response',`<p>Select and copy this text.</p><pre>${esc(text)}</pre>`));break;}
    case 'create-plugin':case 'edit-plugin':$('#modal').close();showView('empty');insertText(action==='create-plugin'?'Create a deployment-check fleet setup that I can save as a Plugin.':'Update my '+(appState.pendingPlugin||'Release checklist')+' plugin.');break;
    case 'use-plugin':{const name=appState.pendingPlugin||'Release checklist';$('#modal').close();showView('empty');insertText('Start a new fleet from '+name+'. I want to review and adapt its setup.');$('#draft-status').hidden=false;$('#draft-status').textContent='Preview only. The app will load the selected saved version into a new setup.';break;}
    case 'connection-details':dialog('Connection access','<p>Manage connected accounts and the fleets that can use them.</p>'+previewNote());break;
    case 'add-secret':dialog('Add secret',`<form id="secret-form"><label class="field">Name<input id="variable-name" placeholder="MY_VARIABLE" pattern="[A-Za-z_][A-Za-z0-9_]*" required><small>Letters, numbers, and underscores.</small></label><label class="field">Value<input id="variable-value" type="password" autocomplete="off" required placeholder="Use a sample value"></label><p class="subtle">Secret values are hidden after saving.</p>${previewNote('Use sample values. Nothing is stored on a server.')} ${modalActions('<button class="primary" type="submit">Add</button>')}</form>`);break;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='setup-selection-form'){const kind=e.target.dataset.kind;setupPreview[appState.view][kind]=[...e.target.querySelectorAll('input[name="selection"]:checked')].map(input=>input.value);$('#modal').close();showView(appState.view);}
  if(e.target.id==='setup-budget-form'){setupPreview[appState.view].dailyLimit=Number($('#setup-budget').value);$('#modal').close();showView(appState.view);}
  if(e.target.id==='setup-instructions-form'){setupPreview[appState.view].instructions=$('#setup-instructions-text').value;$('#modal').close();}
  if(e.target.id==='schedule-form'){scheduleFor().wake=$('#wake-time').value;scheduleFor().state='active';$('#modal').close();showView(appState.view);}
  if(e.target.id==='rename-form'){fleetNames[appState.view]=$('#fleet-name').value.trim()||fleetNames[appState.view];$('#modal').close();showView(appState.view);}
  if(e.target.id==='key-form'){const name=$('#key-name').value.trim();if(!name)return;appState.keys.push(name);$('#modal').close();showView('security');dialog('API key created · Preview',`<p>Copy your key now. It won’t be shown again.</p><div class="tool-output"><pre>af_sample_not_a_real_key_7f2a</pre></div>${previewNote('This is a deliberately invalid sample credential.')}<div class="modal-actions"><button class="primary" data-action="close">Done</button></div>`);}
  if(e.target.id==='secret-form'){const name=$('#variable-name').value;if(['REGISTRY_TOKEN','SUPPORT_API_KEY',...appState.variables.map(v=>v.name)].includes(name)){$('#variable-name').setCustomValidity('This name already exists.');$('#variable-name').reportValidity();return;}appState.variables.push({name,secret:true,value:''});$('#modal').close();showView('secrets');}
});
document.addEventListener('change',e=>{
  if(e.target.closest('#setup-review-picker')){showView(e.target.value,true);return;}
  if(e.target.id==='setup-public-internet'){const enabled=e.target.checked;setupPreview[appState.view].publicInternet=enabled;$('#setup-package-domains').disabled=enabled;$('#setup-package-row').toggleAttribute('data-inactive',enabled);}
  if(e.target.id==='setup-package-domains')setupPreview[appState.view].packageDomains=e.target.checked;
  if(e.target.id==='usage-period'||e.target.id==='usage-fleet')$('#usage-data').innerHTML=usageData($('#usage-period').value,$('#usage-fleet').value);
  if(e.target.id==='file-input'){appState.files[appState.view]=(appState.files[appState.view]||[]).concat([...e.target.files].map(f=>f.name));$('#modal').close();showView(appState.view);}
});
document.addEventListener('input',e=>{
  if(e.target.id==='message')appState.drafts[appState.view]=e.target.value;
  if(e.target.id==='variable-name')e.target.setCustomValidity('');
  if(e.target.id==='fleet-search')syncFleetList();
});
document.addEventListener('keydown',e=>{if(e.target.id==='message'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}if(e.key==='Escape'&&!$('#modal').open){const open=$$('.popover:not([hidden])')[0];const trigger=open?({ 'fleet-list':'fleet-toggle','account-menu':'account-toggle','fleet-menu':'fleet-more'}[open.id]):null;closeMenus();if(trigger)$('#'+trigger).focus();}});
document.addEventListener('click',e=>{if(!e.target.closest('.popover,#fleet-toggle,#account-toggle,#fleet-more'))closeMenus();});
$('#modal').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
let noticeTimer, noticeFleet;
function pauseActionNotice(){clearTimeout(noticeTimer);}
function scheduleNoticeDismiss(){
  pauseActionNotice();
  if(!$('#action-notice').hidden&&!$('#action-notice').matches(':hover,:focus-within'))noticeTimer=setTimeout(dismissActionNotice,8000);
}
function dismissActionNotice(){
  pauseActionNotice();
  const hadFocus=$('#action-notice').contains(document.activeElement);
  $('#action-notice').hidden=true;
  if(hadFocus)$('#main').focus();
}
function showActionNotice(message,view,deleted){
  pauseActionNotice();noticeFleet=view;
  $('#action-notice-text').textContent=message;
  $('#action-notice').title=fleetNames[view];
  $('#action-notice-icon').dataset.icon=deleted?'check-circle':'archive';
  $('#view-archived').hidden=deleted;
  $('#action-notice').hidden=false;
  $('#action-announcement').textContent=fleetNames[view]+'. '+message+'. '+(deleted?'This cannot be undone.':'Permanently stopped; history retained.');
  icons();scheduleNoticeDismiss();
}
function syncFleetList(){
  const query=$('#fleet-search').value.toLowerCase();let visible=0;
  $$('#fleet-list > [data-fleet-name]').forEach(row=>{row.hidden=!!appState.lifecycle[row.dataset.view]||!row.dataset.fleetName.toLowerCase().includes(query);if(!row.hidden)visible++;});
  const archived=Object.keys(appState.lifecycle).filter(view=>appState.lifecycle[view]==='archived'&&fleetNames[view].toLowerCase().includes(query));
  $('#archived-fleets').innerHTML=archived.length?'<p class="eyebrow">Archived</p>'+archived.map(view=>`<button class="fleet-row" data-view="${view}"><span><strong>${esc(fleetNames[view])}</strong><small>History · Permanently stopped</small></span>${icon('archive')}</button>`).join(''):'';
  $('#no-fleets').hidden=visible+archived.length>0;
  icons();
}
$('#action-notice').addEventListener('mouseenter',pauseActionNotice);
$('#action-notice').addEventListener('mouseleave',scheduleNoticeDismiss);
$('#action-notice').addEventListener('focusin',pauseActionNotice);
$('#action-notice').addEventListener('focusout',()=>setTimeout(scheduleNoticeDismiss,0));
showView([...Object.keys(pageTitles),...Object.keys(fleetNames)].includes(location.hash.slice(1))?location.hash.slice(1):'draft');
</script>
</body></html>
