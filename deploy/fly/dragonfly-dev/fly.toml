app = "dragonfly-dev"
primary_region = "iad"

# Same region as agentsfleetd-dev and otelcol-dev, deliberately. The daemon
# reaches this app over 6PN, which is in-region and already WireGuard
# encrypted, so the seed is plaintext and DRAGONFLY_TLS_CA_CERT_FILE stays
# unset. That is a saving worth naming: a TLS handshake against an RSA-2048
# leaf costs ~230 ms, a lane opens hundreds of connections, and that cost
# queued in front of a connect budget is what turns a healthy datastore into
# ConnectTimeout.
[build]
  # Relative to THIS file's directory, not to the build context. The context
  # is the repository root (the image copies scripts/dragonfly-cluster.sh), and
  # spelling the full path here made flyctl look for it twice over:
  # deploy/fly/dragonfly-dev/deploy/fly/dragonfly-dev/Dockerfile.
  dockerfile = "Dockerfile"

# ONE machine running four Dragonfly processes, not four machines. The script
# announces each node's address and bootstraps DFLYCLUSTER CONFIG on every
# start, because Dragonfly forgets its layout on restart. Four machines would
# each announce a 6PN address Fly reassigns, so every restart would need the
# layout pushed from outside; one machine keeps the rig the integration lane
# already proves on every run.
#
# shared-cpu-1x, sized for cost, not speed (Indy, Oct 26, 2026: dev may be the
# bottleneck; production is where latency is fixed). Measured on
# performance-2x before the move: 154 MB resident across all five nodes and
# about 2.8% of one core (user + system + softirq), under a shared vCPU's
# 6.25% baseline, so the burst balance refills between bursts. Each node's
# --maxmemory (512mb, the TLS node 256mb) is a ceiling below the machine's
# 1 GB, which is what Dragonfly checks at boot; the 2.25 GB sum is never
# resident at dev's data size. A dataset that grows toward it, or throttle
# time in fly_instance_cpu_throttle, is the signal to size back up.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Dragonfly writes its cluster layout, its slot ownership and its minted
# certificates under /data. On a machine without this they are lost on every
# restart, and the bootstrap would push the canonical layout over whatever the
# previous run left — which is exactly the failure `reset` exists to undo by
# hand.
[mounts]
  source = "dragonfly_data"
  destination = "/data"
  # Pinned, because flyctl provisions a 1GB volume when this is absent and
  # 1GB sits UNDER the 2.25GB of memory the four nodes are configured for.
  # Dragonfly snapshots to /data, so the default would run out on a dataset
  # the cluster is sized to hold in RAM. initial_size applies to volumes
  # flyctl creates from here on; one already provisioned at the default needs
  # `flyctl vol extend` to catch up.
  initial_size = "10gb"

[[restart]]
  policy = "always"

# No [[services]] block: no public address, no Fly proxy. Only agentsfleetd-dev
# reaches this, at dragonfly-dev.internal:7001 over the private network, the
# same way it reaches otelcol-dev.internal:4318.
#
# A TCP check proves a node is listening and nothing more. Whether the CLUSTER
# is bootstrapped is a question only `dragonfly-cluster.sh healthy` can answer
# (every node online in CLUSTER SHARDS, plus the TLS handshake), and the deploy
# workflow runs exactly that over `flyctl ssh console` before it lets the
# daemon deploy proceed. Fly's own checks cannot run a command, so the split is
# forced, not chosen.
[checks.seed]
  type = "tcp"
  port = 7001
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
