app = "agentsfleetd-dev"
primary_region = "iad"

[build]
  image = "ghcr.io/agentsfleet/agentsfleetd:dev-latest"

[deploy]
  release_command = "/usr/local/bin/agentsfleetd migrate"

[processes]
  app = "/usr/local/bin/agentsfleetd serve"

# HTTP concurrency and backpressure match production, which explains each
# (deploy/fly/agentsfleetd-prod/fly.toml): a tokio runtime sized by the core
# count, a configured 256-request in-flight ceiling for API-class routes,
# and 256 Server-Sent Events (SSE) streams in agentsfleetd.toml.
# Postgres connections this replica may open, measured against the cluster's
# own ceiling rather than left to the code's default.
#
# `SHOW max_connections` on the dev cluster is 25, of which 3 are
# superuser-reserved and 3 more are permanently held by PlanetScale's
# `pscale_admin` and `pscale_exporter`. That leaves about 17 for this service
# once an operator session and the release-time migrator are kept clear. Two
# replicas at 8 is 16.
#
# The code's default is 20 (`SERVICE_CONNECTION_BUDGET / EXPECTED_REPLICAS`,
# 80/4 in afd_db/src/config/sizing.rs), and that file says in as many words that a
# deployment knowing its own budget must set its application pool setting — the budget travels
# with the Postgres a deployment actually runs, which no source file can know.
# Two replicas at 20 asked 40 of 17, and the instance that had to grow past its
# warm floor was refused `53300 too_many_connections`; sqlx retried that
# silently to the acquire budget and reported it as a timeout, which the daemon
# answered as UZ-INTERNAL-001.
#
# This rises again once DATABASE_URL_API names PlanetScale's PgBouncer on port
# 6432: client connections to a pooler are cheap, and it is the bouncer's
# `default_pool_size` that then counts against the 25.
[env]
  AGENTSFLEET_CONFIG_FILE = "/etc/agentsfleet/config/dev.toml"

# shared-cpu-2x, the smallest size where dev latency means something. A shared
# vCPU's baseline is 5 ms per 80 ms period (6.25%), pooled across a machine's
# vCPUs, and a machine whose burst balance is spent is frozen for the rest of
# each period. At rest this daemon uses about 7-8% of one core (user + system
# + softirq, Oct 26, 2026, mostly the runner fleet's run polls), so on
# shared-cpu-1x it sat throttled with an empty balance and every request
# stalled in ~75 ms slices. Two vCPUs give a 12.5% baseline: the balance
# refills at rest and bursts run unthrottled. Watch fly_instance_cpu_throttle
# and fly_instance_cpu_balance; sustained throttle time means size up.
[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

# No public Fly service. Cloudflare Tunnel reaches
# agentsfleetd-dev.internal:3000 over Fly's private IPv6 network (6PN).
# Continuous Integration (CI) explicitly starts machines before tunnel checks.
[[restart]]
  policy = "always"
  processes = ["app"]

[checks.readiness]
  type = "http"
  port = 3000
  method = "get"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"

# Fly decodes the staged secrets into files before the application starts.
# The certificate authority signing key is never loaded by a deployment job.
[[files]]
  guest_path = "/etc/agentsfleet/runner-stream/server-chain.pem"
  secret_name = "RUNNER_STREAM_TLS_CERT_BASE64"
  processes = ["app"]

[[files]]
  guest_path = "/etc/agentsfleet/runner-stream/server.key"
  secret_name = "RUNNER_STREAM_TLS_KEY_BASE64"
  processes = ["app"]
