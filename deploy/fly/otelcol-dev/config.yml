# The collector hop. It receives what the daemon already exports and forwards
# it unchanged to the same Grafana Cloud endpoint the daemon used to post to
# directly.
#
# NOTHING IN THIS FILE MAY RENAME, DROP OR DECORATE A SERIES. Continuity across
# the binary swap is graded through this path, so a collector that adds an
# attribute or rewrites a family makes a dashboard gap indistinguishable from a
# daemon regression — which is the exact attribution loss standing the
# collectors up early exists to prevent. No attributes processor, no filter, no
# transform: receive, batch, forward.

receivers:
  otlp:
    protocols:
      # HTTP only. The daemon posts to {endpoint}/v1/{logs,traces,metrics}
      # (src/agentsfleetd/observability/otel_logs.zig), which is what the OTLP
      # HTTP receiver serves. No gRPC listener, because nothing dials one.
      http:
        endpoint: 0.0.0.0:4318
        # Without this the receiver is an OPEN RELAY. Fly's 6PN spans the whole
        # organisation rather than just this app pair, so any workload on it
        # could post series that this collector forwards upstream under the real
        # vendor credential. Before the hop existed that boundary was "you hold
        # the vendor key"; the authenticator is what keeps it that way.
        auth:
          authenticator: basicauth/ingest

processors:
  # memory_limiter must be FIRST in every pipeline: it sheds at admission, and
  # a limiter placed after the batcher is a limiter that has already let the
  # batch be built. Sized against the 512mb in fly.toml.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15
  batch:
    timeout: 5s
    send_batch_size: 8192

extensions:
  # Fly's [checks.health] block polls this. A collector whose upstream is
  # refusing is still healthy as a receiver — the drop shows up in the
  # collector's own logs and on the dashboard, not as a failed Fly check.
  health_check:
    endpoint: 0.0.0.0:13133
  # The server half, and it costs no daemon change: the daemon ALREADY sends
  # this pair as a Basic header on every export, built unconditionally from its
  # own GRAFANA_OTLP_* triple. Requiring it here turns a header that was
  # previously transmitted and discarded into the actual boundary.
  #
  # Deliberately its own env pair rather than reading the GRAFANA_OTLP_* names
  # directly. Today the deploy stages these FROM the vendor pair, so they match
  # what the daemon sends. Moving to a dedicated ingest credential — so the
  # vendor key lives only on this collector and never on the daemon — is then a
  # vault-path change in the two workflows, with this file untouched.
  basicauth/ingest:
    htpasswd:
      inline: |
        ${env:OTLP_INGEST_USER}:${env:OTLP_INGEST_PASSWORD}
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_OTLP_INSTANCE_ID}
      password: ${env:GRAFANA_OTLP_API_KEY}

exporters:
  otlphttp/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana
    retry_on_failure:
      enabled: true
    # The queue absorbs a brief Grafana Cloud outage. Read the bound honestly:
    # it is IN-MEMORY (no `storage:` backing), so it survives an outage but NOT
    # a collector restart — and `[[restart]] policy = "always"` in fly.toml,
    # the workflow's restart branch, and an OOM kill are all restarts. An
    # outage that overlaps one of those loses what was queued, as a process
    # kill rather than a logged drop.
    #
    # It also moves where delivery is proven. The daemon counts an export
    # successful once this collector returns 2xx, which now means "enqueued"
    # rather than "Grafana accepted" — a queue-full refusal still propagates
    # back, but retry-exhaustion after admission does not. Persisting the queue
    # (file_storage extension) or reading the collector's own
    # otelcol_exporter_send_failed_* families is what closes that gap; neither
    # is done here, and the runbook's dashboard watch is the current cover.
    sending_queue:
      enabled: true
      queue_size: 1000

service:
  extensions: [health_check, basicauth/ingest, basicauth/grafana]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
  telemetry:
    logs:
      level: info
