app = "agentsfleetd-prod"
primary_region = "iad"

[build]
  image = "ghcr.io/agentsfleet/agentsfleetd:latest"

[processes]
  app = "/usr/local/bin/agentsfleetd serve"

# HTTP concurrency. agentsfleetd serves on a multi-threaded tokio runtime
# (`Runtime::new` in rustd/crates/agentsfleetd/src/main.rs), which starts one
# worker thread per core: four on this machine size. A request and an event
# stream are each a task, so neither pins a thread while it waits on Postgres,
# Dragonfly or the client, and the runner lease is a single non-blocking poll
# (docs/architecture/scaling.md). The core count sizes the runtime, and no
# environment knob changes it. Watch saturation via the exported runtime families in Grafana; the
# next lever is more replicas (the binding constraint per scaling.md).
#
# Backpressure:
#   In-flight request ceiling — 256 per instance, `DEFAULT_MAX_IN_FLIGHT` in
#                      rustd/crates/afd_http/src/admission/mod.rs, installed at
#                      boot by rustd/crates/agentsfleetd/src/serve.rs. It is a
#                      constant: no environment knob sets it. API-class routes
#                      only: /healthz and /readyz are ops-class and are NEVER
#                      shed (an overload must not blind the operators), and the
#                      SSE stream is gated by its own cap below, not this one.
#                      API requests above the ceiling are answered 429 +
#                      Retry-After instead of queueing. Watch
#                      agentsfleet_api_backpressure_rejections_total.
#   SSE_MAX_STREAMS  — concurrent event streams per instance (default 256,
#                      agentsfleetd preflight/knobs.rs); over-cap streams get 503. Streams
#                      hold a slot of their own (rustd/crates/afd_sse/src/
#                      ceiling.rs) rather than an admission permit, so a
#                      viewer's lifetime never consumes request capacity.
#                      Budget ~13 KiB of heap + 1 client fd per stream; the
#                      Dragonfly side is ONE shared SubscriptionHub pub/sub
#                      connection per instance regardless of viewers
#                      (rustd/crates/afd_dragonfly/src/hub.rs).
#                      Watch agentsfleet_sse_in_flight_streams +
#                      agentsfleet_sse_dropped_frames_total.
# Postgres connections this replica may open. Same reasoning as the
# development app's, different arithmetic: `SHOW max_connections` on the
# production cluster is also 25, with the same 6 held by reservations and
# PlanetScale's own roles, and the release workflow runs exactly three
# machines. Three at 5 is 15, inside the ~17 the service may take.
#
# Fifteen concurrent statements across the fleet is genuinely tight, and it is
# the constraint PgBouncer exists to remove: once DATABASE_URL_API names port
# 6432, this number is client connections to a pooler rather than backends on
# the primary, and it rises. Until then, a pool that promises more than the
# server can give does not serve more traffic — it answers 503 to the request
# that needed connection eighteen.
[env]
  DATABASE_POOL_SIZE_API = "5"
  # Clerk's public REST API base, versioned. Not a secret — Clerk's own host,
  # not a credential — so it lives here rather than in the 1Password-staged
  # secrets list. agentsfleetd builds `{CLERK_API_BASE}/users/{id}` directly
  # (afd_identity/src/provider.rs) with no version segment inserted for it,
  # so the value has to carry `/v1` itself.
  CLERK_API_BASE = "https://api.clerk.com/v1"

[[vm]]
  # Fly applies this size to every machine during a rolling deploy. The release
  # workflow owns the machine count.
  size = "shared-cpu-4x"
  memory = "4gb"

[deploy]
  strategy = "rolling"
  release_command = "/usr/local/bin/agentsfleetd migrate"

# No public Fly service. Cloudflare Tunnel reaches
# agentsfleetd-prod.internal:3000 over Fly's private IPv6 network (6PN).
[[restart]]
  policy = "always"
  processes = ["app"]

[checks.readiness]
  type = "http"
  port = 3000
  method = "get"
  path = "/readyz"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"
