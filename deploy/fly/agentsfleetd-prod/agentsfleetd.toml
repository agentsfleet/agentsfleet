# Read once at startup. Credentials arrive through the deployment secret source.
[server]
port = 3000
api_url = "https://api.agentsfleet.net"
app_url = "https://app.agentsfleet.net"
# Raise it when callers get 429 UZ-API-001 while CPU and the database pool have room;
# lower it when requests slow down under load.
max_in_flight_requests = 256
# Raise it when dashboards get 503 UZ-API-002 opening live streams;
# lower it when open streams use too much of this machine's memory.
max_sse_streams = 256
# Raise it when slow clients on poor links are dropped while still sending a request;
# lower it when idle or stalled connections hold sockets too long. Never cuts a live stream.
read_timeout_seconds = 300

# Performance knobs: list page sizes. Values are today's compiled defaults.
[api]
# Raise it when clients fetch long lists one small page after another;
# lower it when list reads are slow.
default_page_size = 50
# Lower it when one large list read slows the API or the database;
# raise it when clients need bigger pages.
max_page_size = 100

[database.api]
# Raise it when requests wait for a database connection and Postgres has free slots;
# keep the sum across every replica under Postgres max_connections.
max_connections = 5
# Raise it when the first requests after a quiet spell are slow;
# lower it when idle connections crowd Postgres.
min_connections = 1
# Raise it when short load spikes fail with UZ-INTERNAL-001;
# lower it when callers should fail fast instead of waiting.
acquire_timeout_ms = 5000
connect_timeout_ms = 10000
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
ping_after_idle_ms = 1000

# Schema changes use one session and no warm idle sessions.
[database.migrator]
max_connections = 1
min_connections = 0
acquire_timeout_ms = 5000
connect_timeout_ms = 10000
idle_timeout_seconds = 600
max_lifetime_seconds = 1800
ping_after_idle_ms = 1000

# Includes the first lock poll; only contention retries.
[database.migration]
lock_max_attempts = 30
lock_retry_interval_ms = 1000

[runner.listener]
address = "[::]:4443"
tls_cert_file = "/etc/agentsfleet/runner-stream/server-chain.pem"
tls_key_file = "/etc/agentsfleet/runner-stream/server.key"

# UDP payload ceiling; the default fits a 1280-byte IPv6 path.
max_udp_payload_bytes = 1232

# Shared by all runner connections to this daemon; half receive, half send.
# Control includes heartbeats, renewals, cancellation and small commands/replies.
[runner.stream.control]
max_buffered_bytes = 16_777_216

# Work offers, reports and activity share the data budget.
[runner.stream.data]
max_buffered_bytes = 67_108_864

[runner.run]
ttl_seconds = 35

[runner.health]
heartbeat_interval_seconds = 10
offline_after_seconds = 105
healthy_before_uncordon_seconds = 30

[runner.sandboxes]
max_idle_hold_seconds = 600

[runner.recovery]
resume_from_checkpoint = false

[runner.scheduling]
# Assignments handed out at once when the bus wake link starts, drops or garbles a wake-up
# and the daemon offers waiting work to every runner. Raise it when that catch-up is slow;
# lower it when it loads the database.
max_concurrent_recovery_assignments = 8

# Performance knobs: how fast waiting turns reach runners. Values are today's compiled defaults.
[runners]
# Raise it when turns wait while runners sit idle;
# lower it when each assignment pass makes slow database reads.
turns_per_assignment_pass = 64

[turns]
# Raise it when new messages are refused during a burst runners can absorb;
# lower it to refuse sooner when runners cannot keep up.
max_queued_turns = 100_000

# Inline vendor sends per answer, the first included; once exhausted, the
# delivery is abandoned.
[outbound.retries]
max_attempts = 3
initial_backoff_ms = 200
max_backoff_ms = 800

[fleet.durable_tasks]
max_unfinished_per_fleet = 16
max_inputs_per_safe_boundary = 4
max_actions_per_message = 4
max_objective_bytes = 16_384
max_title_bytes = 160
max_completion_questions = 6
max_question_text_bytes = 512
max_authored_question_bytes = 1_024

[fleet.durable_tasks.defaults]
model_budget_nanodollars = 5_000_000_000
wall_seconds = 604_800
running_seconds = 7_200
max_runs = 12
max_publication_attempts = 8
max_decision_calls = 128

[nats]
# Raise it when agentsfleet_fleet_ready_wake_queue_events_total shows evicted wake-ups;
# lower it to hold less in memory. Evicted work is not lost: it stays in Postgres.
wake_queue_capacity_fleets = 64

[identity]
audience = "https://api.agentsfleet.net"
clerk_api_base = "https://api.clerk.com/v1"

[telemetry]
log_level = "info"
# Performance knob, today's compiled default. Raise it when runner metrics show
# runner `_other`; lower it when the metrics backend struggles with series count.
max_metric_series = 4_096
otlp_endpoint = "http://otelcol-prod.internal:4318"

[telemetry.otlp]
metrics_export_interval_seconds = 60
trace_export_interval_seconds = 5
log_export_interval_seconds = 1
export_timeout_seconds = 10
trace_queue_capacity = 2_048
trace_batch_size = 512
log_queue_capacity = 2_048
log_batch_size = 512
