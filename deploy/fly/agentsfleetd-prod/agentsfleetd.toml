# Read once at startup. Credentials arrive through the deployment secret source.
[server]
port = 3000
api_url = "https://api.agentsfleet.net"
app_url = "https://app.agentsfleet.net"
max_in_flight_requests = 256
max_sse_streams = 256

[database.api]
max_connections = 5

[runner.listener]
address = "[::]:4443"
tls_cert_file = "/etc/agentsfleet/runner-stream/server-chain.pem"
tls_key_file = "/etc/agentsfleet/runner-stream/server.key"

# UDP payload ceiling; the default fits a 1280-byte IPv6 path.
max_udp_payload_bytes = 1232

# Shared by all runner connections to this daemon; half receive, half send.
# Control includes heartbeats, renewals, cancellation and small commands/replies.
[runner.stream.control]
max_buffered_bytes = 16_777_216

# Work offers, reports and activity share the data budget.
[runner.stream.data]
max_buffered_bytes = 50_331_648

[runner.lease]
ttl_seconds = 35

[runner.recovery]
resume_from_checkpoint = false

[runner.scheduling]
missed_wake_probe_seconds = 5
max_concurrent_recovery_claims = 8

[nats]
wake_queue_capacity_fleets = 64

[identity]
audience = "https://api.agentsfleet.net"
clerk_api_base = "https://api.clerk.com/v1"

[telemetry]
log_level = "info"
otlp_endpoint = "http://otelcol-prod.internal:4318"
