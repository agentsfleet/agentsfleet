app = "cloudflared-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# cloudflared is an outbound tunnel agent; it has no inbound HTTP service.
# The deployment workflow loads TUNNEL_TOKEN from the vault.
# Ingress reaches agentsfleetd-dev.internal:3000 over Fly's private IPv6
# network (6PN).
[[restart]]
  policy = "always"
