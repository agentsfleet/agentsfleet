coverage:
  status:
    project:
      default:
        # Keep the aggregate status fixed rather than following the parent.
        # Local Rust whole-workspace and patch checks use distinct floors;
        # this aggregate also includes the TypeScript package reports.
        target: 100%
        threshold: 0%
        informational: false
    # Grade changed lines per language using the same floors as local lanes.
    # TypeScript requires 100%; Rust must exceed 99.5% (Indy, Nov 04,
    # 2026), enforced as 99.51% here and by RUSTD_PATCH_FLOOR in
    # make/test-integration-rustd.mk. Whole-workspace and per-file floors remain
    # separate checks. No rounding margin or exclusions are introduced.
    patch:
      rust-afd:
        flags:
          - rust-afd
        target: 99.51%
        threshold: 0%
        informational: false

      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false

  # Every measured lane is held at 100, so the gradient only needs to make a
  # slip visible: 95 renders red-ish, 100 renders green.
  range: "95..100"
  round: down
  precision: 2

flags:
  rust-afd:
    paths:
      - rustd/crates/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "schema/**"
  - "tests/**"
  - "rustd/target/**"
  # The bench crate is a measuring instrument, not shipped code, and leaves
  # the measurement on Indy's call (2026-09-07): "the afd_bench/ crate must be
  # ignored from codecov and the coverage we conduct, that is just an optional
  # crate to measure bench and no where used in production". The lane's own
  # grade excludes the same path through RUSTD_COVERAGE_IGNORE in
  # make/test-integration-rustd.mk, so the two gates read one denominator.
  - "rustd/crates/afd_bench/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/e2e/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "ui/packages/app/app/(dev)/**"
  - "ui/packages/website/src/pages/DesignSystemGallery.tsx"
  - "ui/packages/website/src/components/domain/background-beams-with-collision.tsx"
  - "ui/packages/website/src/components/domain/animated-terminal.tsx"
  - "ui/packages/website/src/components/domain/use-in-view.ts"
