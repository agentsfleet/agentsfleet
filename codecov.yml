coverage:
  status:
    project:
      default:
        # 100, not `auto`. Everything Codecov now measures is held to 100 by its
        # own runner: app, website and the agentsfleet CLI by their vitest and
        # enforce-coverage configs, and the Rust workspace by `cargo llvm-cov`.
        # `auto` compares against the parent commit, which would have quietly
        # accepted a slide the moment one lane dropped a point.
        #
        # The Zig tree is NOT measured and is ignored below, so it cannot drag
        # this number. Its source still builds; nothing grades it.
        target: 100%
        threshold: 0%
        informational: false
    # Patch targets bind per flag so a red names the lane that caused it, not
    # just "coverage fell". Every one of them is 100: the three TypeScript
    # packages are pinned there by their own runners (cli/bunfig.toml plus
    # scripts/enforce-coverage.mjs, ui/packages/app/vitest.config.ts,
    # ui/packages/website/vite.config.ts) and the Rust workspace measures 100.00%
    # lines and functions today.
    #
    # Every threshold is 0%: the target IS the bar, with no give. A patch status
    # grades only the lines this diff touched, so on a small diff one unhit line
    # reds the build — intentionally. A red always names a genuinely unhit added
    # line, and the answer is a test, never absorbed slack.
    patch:
      # 100, not a measured-minus-margin floor. These crates are pure value and
      # serialization with no input/output, no runtime and no external
      # dependency, so every line is reachable from a test and `cargo llvm-cov`
      # reports 100.00% lines and 100.00% functions today. A floor below what the
      # suite actually achieves is slack nobody asked for, and the TypeScript
      # packages are already held to exactly this bar.
      #
      # If a later milestone adds a genuinely untestable line, move this number
      # in the same change and say why — do not let it drift down silently.
      #
      # NOT a required context — the Rust job is absent from test.yml's `test`
      # aggregate while the port is built. Promoting either is an M181 cutover
      # decision.
      rust-afd:
        flags:
          - rust-afd
        # 90%, not 100%, and moved in the commit that made it true rather than
        # at a red CI run. M176 §1 reached 99.62% on pure-value crypto; §2 and
        # §3 added Postgres and Redis, and three classes of line came with them
        # that no test reaches:
        #
        #   - `afd_db/src/migration.rs` — `version_of` is evaluated at COMPILE
        #     time (every call site is a `static` initialiser), so its lines
        #     never execute at runtime and can never be covered. 40% lines, and
        #     it is fully proven: `test_every_version_is_its_filename_prefix`
        #     checks all 47 derivations.
        #   - reconnect and mid-flight-drop branches in `afd_redis`'s client and
        #     hub pump: reaching them needs a Redis that accepts a connection
        #     and then dies inside a specific await, which the lane can do for
        #     the pub/sub socket (it does — `test_hub_reconnect_resubscribes`)
        #     but not for each individual command.
        #   - `afd_db/src/migrate/lock.rs` retry logging on the contended path,
        #     where the bound itself is proven by `classify` unit tests and by
        #     `test_migrate_gives_up_when_the_lock_never_frees`.
        #
        # Measured across BOTH tiers (`make test-coverage-rustd`, 322 tests
        # against live Postgres and Redis): 92.45% lines, 91.19% functions.
        # The floor sits below that on purpose — it is a floor, not a target to
        # tune against. §7 revisits it with the full crate set.
        target: 90%
        threshold: 0%
        informational: false

      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false

  # Every measured lane is held at 100, so the gradient only needs to make a
  # slip visible: 95 renders red-ish, 100 renders green.
  range: "95..100"
  round: down
  precision: 2

# The Zig tree publishes per folder, never as one blended figure. Three trees
# move independently underneath it, and a single number lets any one of them
# fall while the average holds steady — the same reasoning that made the gate's
# own floors per-folder in make/test.mk. Each flag filters the ONE merged union
# report by path, so every badge and every patch status above reads the exact
# denominator `check_zig_coverage.py` graded, split three ways rather than
# re-measured. `scripts/check_readme_badges_test.py` holds these flags, the
# README badges, and the workflow uploads to each other.
flags:
  rust-afd:
    paths:
      - rustd/crates/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  # The Zig tree is unmeasured: its lint, unit, coverage and leak lanes retired
  # with the daemon, so nothing uploads a report covering these paths. Listing
  # them explicitly keeps the project percentage honest — without this, a future
  # uploader that happened to touch them would silently move the number.
  - "src/**"
  - "build.zig"
  - "build_runner.zig"
  - "build.zig.zon"
  - "schema/**"
  - "zig-pkg/**"
  - "tests/**"
  - "rustd/target/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/e2e/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "ui/packages/app/app/(dev)/**"
  - "ui/packages/website/src/pages/DesignSystemGallery.tsx"
  - "ui/packages/website/src/components/domain/background-beams-with-collision.tsx"
  - "ui/packages/website/src/components/domain/animated-terminal.tsx"
  - "ui/packages/website/src/components/domain/use-in-view.ts"
