coverage:
  status:
    # Rust carries no Codecov status: its floor lives once, as
    # RUSTD_COVERAGE_FLOOR in make/test-integration-rustd.mk, and CI's
    # test-integration-rustd merge job grades the overall and patch coverage
    # with it (Indy, Nov 23, 2026: "make the change in 1 place and it fixes
    # across"). Codecov still reports the rust-afd flag.
    project:
      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false
    patch:
      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false

  # The gradient spans the current language floors.
  range: "94..100"
  round: down
  precision: 2

flags:
  rust-afd:
    # Every workspace member, the layer crates and the agent harness beside
    # them (`rustd/Cargo.toml`), so this flag measures what the lane's own judge
    # grades.
    paths:
      - rustd/crates/
      - rustd/guffbolt/
      - rustd/guffbolt-ai/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "rustd/crates/daemon/afd_db/schema/**"
  - "tests/**"
  - "rustd/target/**"
  # The bench crate is a measuring instrument, not shipped code, and leaves
  # the measurement on Indy's call (2026-09-07): "the afd_bench/ crate must be
  # ignored from codecov and the coverage we conduct, that is just an optional
  # crate to measure bench and no where used in production". The lane's own
  # grade excludes the same path through RUSTD_COVERAGE_IGNORE in
  # make/test-integration-rustd.mk, so the two gates read one denominator.
  - "rustd/crates/daemon/afd_bench/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/e2e/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "ui/packages/app/app/(dev)/**"
  - "ui/packages/website/src/pages/DesignSystemGallery.tsx"
  - "ui/packages/website/src/components/domain/background-beams-with-collision.tsx"
  - "ui/packages/website/src/components/domain/animated-terminal.tsx"
  - "ui/packages/website/src/components/domain/use-in-view.ts"
