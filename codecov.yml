coverage:
  status:
    project:
      rust-afd:
        flags:
          - rust-afd
        target: 98.5%
        threshold: 0%
        informational: false
      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false
    # Grade changed lines per language using the same floors as local lanes.
    # Indy reset Rust floors on Nov 06, 2026 to the verified M236 baseline:
    # 98.5561% overall and 94.3990% patch. Later milestones raise these floors.
    # Patch raised to 97.5% on Nov 08, 2026 (Indy: "move the coverage from 94 to
    # 97.5"), on #816's measured 97.67%.
    # RUSTD_PATCH_FLOOR and RUSTD_COVERAGE_FLOOR use the same values locally.
    # TypeScript remains at 100%; measurement paths and exclusions are unchanged.
    patch:
      rust-afd:
        flags:
          - rust-afd
        target: 97.5%
        threshold: 0%
        informational: false

      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false

  # The gradient spans the current language floors.
  range: "94..100"
  round: down
  precision: 2

flags:
  rust-afd:
    paths:
      - rustd/crates/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "schema/**"
  - "tests/**"
  - "rustd/target/**"
  # The bench crate is a measuring instrument, not shipped code, and leaves
  # the measurement on Indy's call (2026-09-07): "the afd_bench/ crate must be
  # ignored from codecov and the coverage we conduct, that is just an optional
  # crate to measure bench and no where used in production". The lane's own
  # grade excludes the same path through RUSTD_COVERAGE_IGNORE in
  # make/test-integration-rustd.mk, so the two gates read one denominator.
  - "rustd/crates/daemon/afd_bench/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/e2e/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "ui/packages/app/app/(dev)/**"
  - "ui/packages/website/src/pages/DesignSystemGallery.tsx"
  - "ui/packages/website/src/components/domain/background-beams-with-collision.tsx"
  - "ui/packages/website/src/components/domain/animated-terminal.tsx"
  - "ui/packages/website/src/components/domain/use-in-view.ts"
