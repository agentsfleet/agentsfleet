coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    # Patch targets bind PER FLAG, not once across the repository. One global
    # number cannot judge six lanes that sit thirteen points apart: the Zig
    # folders measure 87–90% on Linux (their floors live in make/test.mk and
    # docs/architecture/testing.md), while all three TypeScript packages are
    # pinned at a hard 100% by their own runners — cli/bunfig.toml
    # (+ scripts/enforce-coverage.mjs), ui/packages/app/vitest.config.ts, and
    # ui/packages/website/vite.config.ts. The single 97% these replace was
    # wrong in both directions at once: it failed every Zig diff by
    # construction, and it would have let any TypeScript package quietly drop
    # three points below the bar its own suite refuses to build under.
    #
    # Each target states what its lane already enforces elsewhere, so this file
    # follows those gates rather than competing with them. Move the Zig entries
    # when make/test.mk's floors move, and keep the TypeScript entry at 100 for
    # exactly as long as those three configs say 100.
    #
    # Every threshold is 0%: the target IS the bar, with no give (decided
    # Aug 18, 2026). A patch status grades only the lines this diff touched,
    # so on a small diff one unhit line can cost several points and red the
    # build — that is intentional. A red always names a genuinely unhit added
    # line, and the answer is a test or an explicit target change in this
    # file, never absorbed slack. Holding every PR to the exact bar is what
    # lets the targets themselves ratchet upward over time.
    patch:
      zig-agentsfleetd:
        flags:
          - zig-agentsfleetd
        target: 90%
        threshold: 0%
        informational: false
      zig-runner:
        flags:
          - zig-runner
        target: 87%
        threshold: 0%
        informational: false
      zig-lib:
        flags:
          - zig-lib
        target: 94%
        threshold: 0%
        informational: false
      # Measured, never guessed: `cargo llvm-cov --workspace --all-features`
      # reported 96.64% lines on the first green suite (Aug 23, 2026), so the
      # bar sits just under it, exactly like the Zig entries sit under theirs.
      # A floor of 0 would be a gate that grades nothing.
      #
      # NOT a required context — the Rust job is absent from test.yml's `test`
      # aggregate while the port is built. Promoting either is an M181 cutover
      # decision.
      rust-afd:
        flags:
          - rust-afd
        target: 95%
        threshold: 0%
        informational: false

      typescript:
        flags:
          - app
          - website
          - cli
        target: 100%
        threshold: 0%
        informational: false

  # The badge colour scale, tightened to where the code actually sits. At
  # 70..90 every lane rendered the same green — the runner at 87 and the
  # TypeScript packages at 100 were indistinguishable, so the gradient carried
  # no signal. 86 sits just under the lowest floor (runner, 87); 100 is the
  # TypeScript bar.
  range: "86..100"
  round: down
  precision: 2

# The Zig tree publishes per folder, never as one blended figure. Three trees
# move independently underneath it, and a single number lets any one of them
# fall while the average holds steady — the same reasoning that made the gate's
# own floors per-folder in make/test.mk. Each flag filters the ONE merged union
# report by path, so every badge and every patch status above reads the exact
# denominator `check_zig_coverage.py` graded, split three ways rather than
# re-measured. `scripts/check_readme_badges_test.py` holds these flags, the
# README badges, and the workflow uploads to each other.
flags:
  zig-agentsfleetd:
    paths:
      - src/agentsfleetd/
  zig-runner:
    paths:
      - src/runner/
  zig-lib:
    paths:
      - src/lib/
  rust-afd:
    paths:
      - rustd/crates/

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

ignore:
  - "rustd/target/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/tests/e2e/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "ui/packages/app/app/(dev)/**"
  - "ui/packages/website/src/pages/DesignSystemGallery.tsx"
  - "ui/packages/website/src/components/domain/background-beams-with-collision.tsx"
  - "ui/packages/website/src/components/domain/animated-terminal.tsx"
  - "ui/packages/website/src/components/domain/use-in-view.ts"
