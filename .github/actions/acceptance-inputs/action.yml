name: Observe the deployed acceptance candidate
description: Restore genuine build artifacts and observe the live development runner.
inputs:
  op-token:
    description: 1Password service account token
    required: true
  vault-dev:
    description: Development vault
    required: true
  vault-prod:
    description: Infrastructure vault
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: acceptance-build-${{ github.sha }}
        path: .tmp
    - name: Restore the deployed component outputs
      shell: bash
      run: tar -xf .tmp/acceptance-build.tar
    - uses: 1password/install-cli-action@v2
    - uses: 1password/load-secrets-action@v5
      with:
        export-env: true
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        ACCEPTANCE_RUNNER_TOKEN: op://${{ inputs.vault-dev }}/agentsfleet-dev-runner-ant/runner-token
        TS_OAUTH_CLIENT_ID: op://${{ inputs.vault-prod }}/tailscale/oauth-client-id
        TS_OAUTH_SECRET: op://${{ inputs.vault-prod }}/tailscale/oauth-secret
    - uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ env.TS_OAUTH_SECRET }}
        tags: tag:ci
    - name: Observe the running candidate executable
      shell: bash
      run: |
        bash scripts/observe-dev-runner.sh
        echo "ACCEPTANCE_RUNNER_PROCESS_EVIDENCE=$PWD/.tmp/acceptance-runner-process.json" >> "$GITHUB_ENV"
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ inputs.op-token }}
        VAULT_DEV: ${{ inputs.vault-dev }}
        ALLOW_VAULT_READS: '1'
