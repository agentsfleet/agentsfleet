name: Restore or build the guest set
description: The monitor, jailer and guest kernel a Firecracker microVM boots from, built once per pinned manifest and builder and cached; given the guest agent binary, the initramfs around it and the set's record. No release credentials.
inputs:
  pinned-dir:
    description: Directory that holds the cached monitor, jailer, kernel and their record.
    default: dist/guest-pinned
  guest-binary:
    description: The static agentsfleet-guest binary the initramfs is built around. Empty stops once the pinned files are cached.
    default: ''
  output-dir:
    description: Directory the whole guest set is written to, beside the toolbox it ships with.
    default: dist/candidate/toolbox
  install:
    description: Set to 'true' to install the set where the engine boots from, as a host deploy does.
    default: 'false'
outputs:
  kernel:
    description: Absolute path of the guest kernel.
    value: ${{ steps.set.outputs.kernel }}
  initrd:
    description: Absolute path of the initramfs.
    value: ${{ steps.set.outputs.initrd }}
runs:
  using: composite
  steps:
    - name: Install the guest builder
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        bash scripts/toolbox/guest.sh packages | xargs sudo apt-get install -y -qq --no-install-recommends

    # The kernel's bytes are the compiler's output, so the builder's package
    # versions, its compiler and its linker are part of the key.
    - name: Fingerprint the installed builder tools
      id: builder
      shell: bash
      run: |
        set -euo pipefail
        fingerprint=$({
          bash scripts/toolbox/guest.sh packages | xargs dpkg-query -W -f="\${Package}=\${Version}\n"
          gcc --version | sed -n 1p
          ld --version | sed -n 1p
        } | sha256sum | cut -d' ' -f1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    # Restore and save are separate steps, as in kernel-toolbox: a combined
    # cache step saves only when the whole job succeeds, so a failure after a
    # good build would throw the kernel away.
    - name: Restore the pinned guest files
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.pinned-dir }}
        key: guest-pinned-${{ runner.arch }}-v1-${{ steps.builder.outputs.fingerprint }}-${{ hashFiles('scripts/toolbox/guest.sh', 'scripts/toolbox/guest.txt', 'scripts/toolbox/guest.config') }}

    - name: Build from the pinned manifest on a cache miss
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        PINNED_DIR: ${{ inputs.pinned-dir }}
      run: make --no-print-directory guest-pinned GUEST_PINNED_DIR="$PWD/$PINNED_DIR"

    - name: Save the pinned guest files
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.pinned-dir }}
        key: ${{ steps.restore.outputs.cache-primary-key }}

    # guest.sh checks the pinned files against their record and the manifest
    # on hits and misses alike, then the host's own check reads the set back.
    - name: Assemble the guest set around the guest agent
      id: set
      if: inputs.guest-binary != ''
      shell: bash
      env:
        PINNED_DIR: ${{ inputs.pinned-dir }}
        GUEST_BINARY: ${{ inputs.guest-binary }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        make --no-print-directory guest-set GUEST_PINNED_DIR="$PWD/$PINNED_DIR" GUEST_BINARY="$GUEST_BINARY" GUEST_DIR="$PWD/$OUTPUT_DIR"
        source deploy/baremetal/toolbox.sh
        guest_set_files "$OUTPUT_DIR" >/dev/null
        echo "kernel=$PWD/$OUTPUT_DIR/vmlinux" >> "$GITHUB_OUTPUT"
        echo "initrd=$PWD/$OUTPUT_DIR/guest.cpio" >> "$GITHUB_OUTPUT"

    - name: Install the set where the engine boots from
      if: inputs.guest-binary != '' && inputs.install == 'true'
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        sudo bash -c 'set -euo pipefail; source deploy/baremetal/toolbox.sh; install_guest "$1"' -- "$PWD/$OUTPUT_DIR"
