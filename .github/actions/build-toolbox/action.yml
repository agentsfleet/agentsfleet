name: Build and scan an unsigned toolbox
description: Cache the pinned toolbox and SBOM; scan with current vulnerability data on every invocation. No release credentials.
inputs:
  output-dir:
    description: Directory for the unsigned image, manifest, SBOM and scan.
    default: dist/candidate/toolbox
outputs:
  digest:
    description: Content-addressed toolbox image digest.
    value: ${{ steps.identity.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Install builder tools
      shell: bash
      run: bash .github/actions/build-toolbox/install-tools.sh

    - name: Fingerprint installed builder tools
      id: builder
      shell: bash
      run: |
        fingerprint=$(dpkg-query -W -f="\${Package}=\${Version}\n" mmdebstrap erofs-utils debian-archive-keyring uidmap python3 curl | sha256sum | cut -d' ' -f1)
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ inputs.output-dir }}
        key: toolbox-amd64-v1-${{ steps.builder.outputs.fingerprint }}-${{ hashFiles('scripts/toolbox/**', 'VERSION', '.github/actions/build-toolbox/action.yml', '.github/actions/toolbox-tools/action.yml') }}

    - name: Build from the pinned manifest on a cache miss
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        sudo make --no-print-directory toolbox-image TOOLBOX_DIR="$PWD/$OUTPUT_DIR"
        sudo chown -R "$(id -u):$(id -g)" "$OUTPUT_DIR"

    - name: Verify image identity and size on cache hits too
      id: identity
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        images=("$OUTPUT_DIR"/toolbox-*.erofs)
        [ "${#images[@]}" = 1 ]
        image="${images[0]}"
        source deploy/baremetal/toolbox.sh
        digest="$(toolbox_digest_of "$image")"
        [ "$(sha256sum "$image" | cut -d' ' -f1)" = "$digest" ]
        [ "$(wc -c < "$image")" -le 262848512 ]
        echo "digest=$digest" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/toolbox-tools

    - name: Write the SBOM over the image and its retained package records
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
        DIGEST: ${{ steps.identity.outputs.digest }}
        SYFT_CACHE_DIR: ${{ runner.temp }}/toolbox-syft-cache
      run: |
        set -euo pipefail
        out="$PWD/$OUTPUT_DIR"
        scratch=$(mktemp -d "$RUNNER_TEMP/toolbox-scan.XXXXXX")
        staged="$out/.toolbox-$DIGEST.sbom.$$.json"
        cleanup() {
          local result=$? child
          trap - EXIT INT TERM
          for child in $(jobs -pr); do
            sudo kill -TERM "$child" 2>/dev/null || true
            wait "$child" || true
          done
          for point in "$scratch/ram/view" "$scratch/ram" "$scratch/lower"; do
            if mountpoint -q "$point" && ! sudo umount "$point"; then
              echo "toolbox scan: cannot unmount $point; retaining $scratch" >&2
              exit 1
            fi
          done
          sudo rm -rf "$scratch"
          rm -f "$staged"
          exit "$result"
        }
        trap cleanup EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        mkdir "$scratch/lower" "$scratch/ram"
        sudo modprobe erofs
        sudo mount -t erofs -o loop,ro,nosuid,nodev "$out/toolbox-$DIGEST.erofs" "$scratch/lower"
        sudo mount -t tmpfs -o size=32m,nosuid,nodev tmpfs "$scratch/ram"
        sudo mkdir "$scratch/ram/upper" "$scratch/ram/work" "$scratch/ram/view"
        release="$out/toolbox-$DIGEST.json"
        [ "$(stat -c %s "$release")" -le 1048576 ]
        jq -e --arg sha "$DIGEST" --argjson length "$(stat -c %s "$out/toolbox-$DIGEST.erofs")" \
          '.sha256==$sha and .length==$length' "$release" >/dev/null
        jq -er '.package_metadata|select(type=="string")' "$release" | base64 --decode > "$scratch/metadata.gz"
        marker="$scratch/lower/etc/toolbox-inventory.sha256"
        [ -f "$marker" ] && [ ! -L "$marker" ] && [ "$(stat -c %s "$marker")" = 65 ]
        [ "$(sha256sum "$scratch/metadata.gz" | cut -d' ' -f1)" = "$(cat "$marker")" ]
        gzip -dc "$scratch/metadata.gz" | head -c 4194305 > "$scratch/metadata.tar"
        [ "$(stat -c %s "$scratch/metadata.tar")" -le 4194304 ]
        tar -tf "$scratch/metadata.tar" > "$scratch/entries"
        [ "$(wc -l < "$scratch/entries")" -le 1027 ]
        [ "$(sort -u "$scratch/entries" | wc -l)" = "$(wc -l < "$scratch/entries")" ]
        grep -Fx status "$scratch/entries"
        grep -Fx packages.json "$scratch/entries"
        awk '!/^(status|packages[.]json|info\/|info\/[a-z0-9][a-z0-9+.-]+(:[a-z0-9][a-z0-9-]*)?[.](list|md5sums|conffiles|postinst|postrm|prerm|preinst|templates|triggers|config|shlibs|symbols))$/ {exit 1}' "$scratch/entries"
        LC_ALL=C tar -tvf "$scratch/metadata.tar" | awk '$1 ~ /^d/ && $NF=="info/" {next} $1 !~ /^-/ {exit 1}'
        tar -xOf "$scratch/metadata.tar" packages.json > "$scratch/packages.json"
        jq -e --slurpfile packages "$scratch/packages.json" \
          '.packages==$packages[0] and (.packages|type=="array" and length>0 and length<=512)' "$release" >/dev/null
        database="$scratch/ram/upper/var/lib/dpkg"
        sudo mkdir -p "$database/info"
        while IFS= read -r name; do
          case "$name" in status|info/*.*) ;;
            *) continue ;;
          esac
          tar -xOf "$scratch/metadata.tar" -- "$name" > "$scratch/record"
          sudo install -m 644 "$scratch/record" "$database/$name"
        done < "$scratch/entries"
        sudo mount -t overlay -o "lowerdir=$scratch/lower,upperdir=$scratch/ram/upper,workdir=$scratch/ram/work" overlay "$scratch/ram/view"
        sudo -E "$(command -v syft)" scan "dir:$scratch/ram/view" -o "spdx-json=$scratch/sbom.json" &
        wait "$!"
        sudo umount "$scratch/ram/view"
        sudo umount "$scratch/ram"
        sudo umount "$scratch/lower"
        sudo install -m 644 -o "$(id -u)" -g "$(id -g)" "$scratch/sbom.json" "$staged"
        mv "$staged" "$out/toolbox-$DIGEST.sbom.spdx.json"

    - uses: ./.github/actions/scan-toolbox
      with:
        output-dir: ${{ inputs.output-dir }}
