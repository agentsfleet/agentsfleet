name: Post-Release Verification

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

jobs:
  resolve-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve the released version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          case "$VERSION" in
            *[!0-9A-Za-z._-]*)
              echo "Invalid VERSION value: $VERSION"
              exit 1
              ;;
          esac
          test "$(npm view "@agentsfleet/cli@$VERSION" version)" = "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

  verify-npm:
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macOS (arm64)
          - runner: ubuntu-latest
            name: Linux (x64)
          - runner: ubuntu-24.04-arm
            name: Linux (arm64)
          - runner: windows-latest
            name: Windows (x64)
    runs-on: ${{ matrix.runner }}
    name: npm — ${{ matrix.name }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org

      - name: Install the exact released agentsfleet package
        run: npm install -g @agentsfleet/cli@${{ needs.resolve-release.outputs.version }}

      - name: Verify the installed version
        run: |
          EXPECTED="${{ needs.resolve-release.outputs.version }}"
          VERSION="$(agentsfleet --version 2>&1 | head -1)"
          echo "agentsfleet version: $VERSION"
          echo "$VERSION" | grep -qF "$EXPECTED"
        shell: bash

      - name: Verify help exits successfully
        run: agentsfleet --help
        shell: bash

      - name: Write per-platform summary row
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi
          echo "| ${{ matrix.name }} | npm ${{ needs.resolve-release.outputs.version }} | $ICON |" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  # Command-Line Interface (CLI) acceptance runs only after 🤠 Indy marks the
  # production runner ready. The exact package from the triggering release is
  # tested against the live production API before the mutable latest tag moves.
  acceptance-cli-prod:
    if: vars.PROD_RUNNER_READY == 'true'
    needs: [resolve-release, verify-npm]
    runs-on: ubuntu-latest
    name: CLI acceptance — api.agentsfleet.net
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 25

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install repository dependencies before loading secrets
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Install the exact released agentsfleet package
        run: npm install -g @agentsfleet/cli@${{ needs.resolve-release.outputs.version }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: cli

      - name: Load production Clerk credentials after installation
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLERK_SECRET_KEY: op://${{ vars.VAULT_PROD }}/clerk-prod/secret-key
          CLERK_PUBLISHABLE_KEY: op://${{ vars.VAULT_PROD }}/clerk-prod/publishable-key
          CLERK_WEBHOOK_SECRET: op://${{ vars.VAULT_PROD }}/clerk-prod/webhook-secret
          AUTH_E2E_REGULAR_EMAIL: op://${{ vars.VAULT_PROD }}/e2e-fixtures-email/regular
          AUTH_E2E_ADMIN_EMAIL: op://${{ vars.VAULT_PROD }}/e2e-fixtures-email/admin

      - name: Run CLI acceptance against api.agentsfleet.net
        run: bun run test:acceptance
        working-directory: cli
        env:
          AGENTSFLEET_ACCEPTANCE_TARGET: https://api.agentsfleet.net
          AGENTSFLEET_ACCEPTANCE_BINARY: global
          AGENTSFLEET_ACCEPTANCE_LOGIN_HANDSHAKE: "1"
          CLERK_SECRET_KEY: ${{ env.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ env.CLERK_PUBLISHABLE_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ env.CLERK_WEBHOOK_SECRET }}
          AUTH_E2E_REGULAR_EMAIL: ${{ env.AUTH_E2E_REGULAR_EMAIL }}
          AUTH_E2E_ADMIN_EMAIL: ${{ env.AUTH_E2E_ADMIN_EMAIL }}

      - name: Write CLI acceptance summary row
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi
          echo "| CLI acceptance (api.agentsfleet.net) | npm ${{ needs.resolve-release.outputs.version }} | $ICON |" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  promote-latest:
    needs: [resolve-release, verify-npm, acceptance-cli-prod]
    runs-on: ubuntu-latest
    name: Promote npm latest tag
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org

      # This token STAYS when release.yml's publish goes tokenless. Trusted
      # Publishing authenticates one operation — `npm publish` — and hands back
      # a short-lived credential scoped to it. `npm dist-tag add` below is a
      # separate registry write that no trusted publisher covers, so this job
      # would lose its only credential and start failing after a green release,
      # at the point where `latest` is meant to move. The migration is partial
      # by design, not half-finished.
      - name: Load npm publication token
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: op://${{ vars.VAULT_PROD }}/npm-publish-token/credential

      - name: Promote the verified version
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.resolve-release.outputs.version }}"
          npm dist-tag add "@agentsfleet/cli@$VERSION" latest
          test "$(npm view @agentsfleet/cli@latest version)" = "$VERSION"

  summary:
    needs: [resolve-release, verify-npm, acceptance-cli-prod, promote-latest]
    if: always()
    runs-on: ubuntu-latest
    name: Post-Release Summary
    steps:
      - name: Generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Post-Release Verification Results

          | Check | Result |
          |-------|--------|
          | Exact npm version | ${{ needs.resolve-release.outputs.version || 'unresolved' }} |
          | Platform installs | ${{ needs.verify-npm.result }} |
          | Production CLI acceptance | ${{ needs.acceptance-cli-prod.result }} |
          | npm latest promotion | ${{ needs.promote-latest.result }} |
          EOF

      - uses: actions/checkout@v7

      # This summary only ever reached the run page, so a failed prod
      # verification was invisible unless someone opened Actions.
      - name: Compose verdict
        id: verdict
        env:
          VERSION: ${{ needs.resolve-release.outputs.version || 'unresolved' }}
          NPM_RESULT: ${{ needs.verify-npm.result }}
          CLI_RESULT: ${{ needs.acceptance-cli-prod.result }}
          PROMOTE_RESULT: ${{ needs.promote-latest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LINE="installs: ${NPM_RESULT} | acceptance-cli: ${CLI_RESULT} | npm latest: ${PROMOTE_RESULT}"

          # acceptance-cli-prod is gated by PROD_RUNNER_READY, so skipped is allowed.
          ok=1
          [ "$NPM_RESULT" = success ] || ok=0
          [ "$PROMOTE_RESULT" = success ] || ok=0
          case "$CLI_RESULT" in success|skipped) ;; *) ok=0 ;; esac

          if [ "$ok" = 1 ]; then
            STATUS=success
            MESSAGE="✅ PROD verified \`$VERSION\`\\n$LINE"
          else
            STATUS=failure
            MESSAGE="❌ PROD verification failed \`$VERSION\`\\n$LINE\\nCheck: ${RUN_URL}"
          fi

          # printf, not echo: the \n markers must reach the action as literal
          # backslash-n for its printf %b to expand. echo's handling varies.
          printf 'status=%s\n' "$STATUS" >>"$GITHUB_OUTPUT"
          printf 'message=%s\n' "$MESSAGE" >>"$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ steps.verdict.outputs.status }}
          message: ${{ steps.verdict.outputs.message || '❌ PROD verification verdict could not be computed — inspect the summary job' }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
          webhook-item: discord-release-webhook
