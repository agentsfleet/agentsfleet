name: deploy-dev / dashboard

on:
  workflow_call:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # All installation completes before loading deployment credentials.
      - name: Install candidate dependencies
        run: |
          bun install --frozen-lockfile
          (cd cli && bun install --frozen-lockfile)
          for package in ui/packages/*; do
            (cd "$package" && bun install --frozen-lockfile)
          done

      - name: Load Vercel deployment credential
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VERCEL_TOKEN: op://${{ vars.VAULT_PROD }}/vercel-api-token/credential

      - name: Prepare the existing development dashboard project
        run: |
          mkdir -p .vercel
          curl --silent --show-error --fail --max-time 15 --max-filesize 1048576 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v9/projects/agentsfleet-app \
            | jq -e 'select(.rootDirectory == "ui/packages/app") | {projectId: .id, orgId: .accountId} | select((.projectId | type == "string" and length > 0) and (.orgId | type == "string" and length > 0))' \
            > .vercel/project.json
          node_modules/.bin/vercel pull --yes --environment=development-agentsfleet
          # Dependencies were installed before credentials were loaded.
          jq '.settings.installCommand = "true"' .vercel/project.json > .vercel/project.tmp
          mv .vercel/project.tmp .vercel/project.json

      - name: Build the candidate command-line application
        run: bun run build
        working-directory: cli

      - name: Build the candidate dashboard
        run: node_modules/.bin/vercel build --target=development-agentsfleet

      - name: Deploy the prebuilt candidate dashboard
        run: |
          deployment_url="$(node_modules/.bin/vercel deploy --prebuilt --yes --target=development-agentsfleet \
            --meta "githubCommitSha=$GITHUB_SHA" --meta githubCommitRef=main)"
          printf '%s' "$deployment_url" | jq -Rer 'select(test("^https://[a-zA-Z0-9-]+[.]vercel[.]app/?$"))'
          node_modules/.bin/vercel alias set "$deployment_url" app-dev.agentsfleet.net
