name: deploy-dev / promote

# No compiler or image builder: consume the successful PR's exact tree.
on:
  workflow_call:
    outputs:
      runner:
        description: Candidate verification result.
        value: ${{ jobs.result.outputs.runner }}
      toolbox:
        description: Fresh scan and signing result.
        value: ${{ jobs.result.outputs.toolbox }}
      daemon:
        description: Candidate verification result.
        value: ${{ jobs.result.outputs.daemon }}
      ghcr:
        description: Prebuilt image publication result.
        value: ${{ jobs.result.outputs.ghcr }}
      image:
        description: Immutable multi-platform image built in the PR.
        value: ${{ jobs.promote.outputs.image }}
      build-commit:
        description: Original compiled revision, as returned by healthz.
        value: ${{ jobs.promote.outputs.build-commit }}
      version:
        description: Verified candidate version.
        value: ${{ jobs.promote.outputs.version }}

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.verify.outcome }}
      toolbox: ${{ steps.scan.outcome == 'success' && steps.sign.outcome || steps.scan.outcome }}
      ghcr: ${{ steps.publish.outcome }}
      image: ${{ steps.publish.outputs.image }}
      build-commit: ${{ steps.verify.outputs.build-commit }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Find a successful test run for this exact source tree
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make candidate-select
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          name: ${{ steps.candidate.outputs.artifact }}
          path: dist/candidate
      - name: Verify workflow, source identity, profiles, platforms and checksums
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run-id }}
        run: make candidate-verify
      - uses: ./.github/actions/toolbox-tools
      - uses: ./.github/actions/scan-toolbox
        id: scan
        with:
          report: dist/candidate/promotion.scan.json
      - name: Retain fresh vulnerability evidence on failure too
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-promotion-audit
          path: dist/candidate/promotion.scan.json
          retention-days: 90
      - uses: ./.github/actions/sign-toolbox
        id: sign
        with:
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
      - name: Package the existing binaries and signed toolbox
        run: make candidate-package
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to the existing registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish prebuilt runtime images by digest
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make candidate-publish-runtime
      - uses: actions/upload-artifact@v7
        with:
          name: runner-binary
          path: dist/candidate/bin/agentsfleet-runner-linux-amd64
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: runner-toolbox
          path: dist/candidate/toolbox
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: promoted-candidate
          path: dist/candidate
          if-no-files-found: error
          retention-days: 3

  result:
    runs-on: ubuntu-latest
    needs: promote
    if: always()
    outputs:
      runner: ${{ needs.promote.outputs.verified }}
      toolbox: ${{ needs.promote.outputs.toolbox }}
      daemon: ${{ needs.promote.outputs.verified }}
      ghcr: ${{ needs.promote.outputs.ghcr }}
    steps:
      - run: echo 'Candidate promotion result = ${{ needs.promote.result }}'
