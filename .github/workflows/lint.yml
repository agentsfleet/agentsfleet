name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Run website lint gate
        run: make lint-website

  lint-apps-designsystem-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Install agentsfleet dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      # The root install carries ast-grep, pinned in package.json, which
      # lint-source runs.
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Run app + design-system + agentsfleet lint gate
        run: make lint-apps-designsystem-cli

  lint-agentsfleet-sh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gates the merge: a broken installer can't reach main, so the git-connected
      # Cloudflare Pages project never auto-deploys a broken curl|bash target.
      - name: Shellcheck + smoke-test the installer
        run: |
          shellcheck -s bash ui/agentsfleet.dev/dist/install.sh ui/agentsfleet.dev/install_test.sh
          bash ui/agentsfleet.dev/install_test.sh

  check-gh-actions-valid:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Validate GH Actions workflows (actionlint + make-target refs)
        run: make check-gh-actions-valid

  safety-gates:
    # Repo-hygiene gates that lived under `make lint-all` but were never run by
    # CI, so a broken architecture reference, an ungated vault reader, or a
    # deploy-safety regression could merge green. Each is a static check needing
    # only shellcheck (on the runner image), flock (util-linux, present) and Bun,
    # which the model seeder's secrets test runs the seeder under; no cargo build.
    # GitHub sets CI=true, so check-deploy-safety's flock lock tests run here
    # rather than skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Playbooks (shellcheck + refs + vault-gate parity)
        run: make check-playbooks
      - name: Deploy version/lock safety
        run: make check-deploy-safety
      # A documented pre-Pull-Request gate that no job ran, so a VERSION out of
      # step with rustd/Cargo.toml or cli/package.json could merge green and only
      # surface at release. Lands here rather than in a job of its own: this is
      # the existing home for static repository-hygiene gates that need no
      # toolchain, and it already runs on every Pull Request.
      - name: Version manifests match VERSION
        run: make check-version
      # Two lint-all checks no other job runs, so their findings would merge
      # green: shellcheck over scripts/ and the curated model catalogue. Help
      # text, public API wording and tests that read a repository file are
      # ast-grep rules, run by lint-source in the jobs above. The root install
      # carries the model check's tsrs.
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Shell and model catalogue checks
        run: make lint-shell _model_allowlist_check

  lint:
    runs-on: ubuntu-latest
    needs: [lint-website, lint-apps-designsystem-cli, lint-agentsfleet-sh, check-gh-actions-valid, safety-gates]
    steps:
      - name: Preserve legacy lint check name
        run: echo "All lint lanes passed"
