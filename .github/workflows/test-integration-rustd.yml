name: test-integration-rustd

# The Rust substrate against live Postgres and Redis.
#
# A separate workflow rather than a job in `test.yml`, on purpose. That file's
# `test` aggregate is a required check and carries no `services:` block;
# hanging a datastore-dependent job off it would make a live Postgres a
# precondition for every pull request, including the ones that touch only the
# website. Here the dependency is contained: if the datastores are unavailable,
# this lane fails and the fast lanes still say what they know.
#
# The services come from `docker compose` via `make/test-infra.mk`, not from a
# `services:` block, so CI boots exactly what a developer boots — the same
# compose file, the same reset, the same Redis TLS certificate extraction. A
# `services:` block would be a second definition of the environment that drifts
# from the first one silently.

on:
  push:
    branches: [main]
    paths:
      - 'rustd/**'
      - 'schema/**'
      - 'make/**'
      - 'docker-compose.yml'
      - '.github/workflows/test-integration-rustd.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs populate the cache every branch restores
  # from, so cancelling one to start the next leaves no warm cache at all.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-integration-rustd:
    runs-on: ubuntu-latest
    # The suite creates a database per test and applies all 47 migrations into
    # each. Generous, because the alternative to a timeout that is too tight is
    # a lane that goes red on a slow runner and teaches people to re-run it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # No toolchain input: rustd/rust-toolchain.toml is the single pin, and
      # rustup installs it on first use inside that directory. Naming a version
      # here would be a second source of truth that silently disagrees.
      - name: Show the pinned toolchain
        run: rustup show && cargo --version
        working-directory: rustd
      # Compiler artifacts, shared with the unit lane through `shared-key`.
      #
      # This replaced a hand-rolled `actions/cache` over `~/.cargo` +
      # `rustd/target`, which had two faults the comment beside it recorded
      # honestly and then worked around rather than fixed:
      #
      #  - `actions/cache` never re-saves on a hit, so `rustd/target` was frozen
      #    at whatever the FIRST run under a given `Cargo.lock` left there,
      #    including a partial tree from a failed job.
      #  - Two lanes compiling the same crates had to hold two caches under two
      #    keys, because one shared key meant whichever finished last overwrote
      #    the other every run. That is the workaround `shared-key` removes.
      #
      # Prior art checked before choosing this, per the operating model: the
      # sibling `e2e-observability-platform` runs the SAME rustc 1.98.0 under
      # GitLab CI and caches `.cargo/registry` + `.cargo/git` while explicitly
      # refusing to cache `target/` — "to avoid stale artifact/fingerprint
      # mismatches across pipeline runs" (`.gitlab/ci/quality-gates.yml`). Its
      # conclusion is right and is exactly what `rust-cache` implements
      # properly: it keeps dependency builds, PRUNES the workspace's own
      # artifacts before saving, keys on the lockfile plus the rustc version
      # plus the enabled features, and sets `CARGO_INCREMENTAL=0` — which that
      # sibling has to set by hand on every job.
      #
      # It also declines that sibling's other half deliberately. It reaches for
      # `sccache` as a `RUSTC_WRAPPER`, then has to switch it back off for the
      # unit-test job over proc-macro cache corruption (mozilla/sccache#1924,
      # cited in its own config). A compilation cache that must be disabled per
      # job to stay correct is not one to adopt on the evidence of the repo that
      # disabled it.
      #
      # `save-if` is what makes the sharing deliberate rather than racy. A
      # `shared-key` drops the job name from the cache key, so BOTH lanes
      # compute the same primary key; Actions caches are immutable and the two
      # run concurrently, so whichever reached its post step first would save
      # and the other would be rejected as already-existing, its artifacts
      # discarded — with a race deciding which lane's build got kept. This lane never writes;
      # the unit lane on the default branch is the one writer. That
      # is the arrangement `test.yml` already reasons about at the top of this
      # file, where the `push: branches: [main]` trigger exists so a main run
      # populates the cache each Pull Request branch restores from.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustd
          shared-key: rustd
          save-if: false
      # `make test-integration-rustd` depends on `_reset-test-db`, which brings
      # compose up, waits for healthchecks, drops schemas and flushes Redis.
      # KEEP_TEST_STATE is never set here: a green run under it would prove
      # nothing about a clean checkout, which is the whole point of this tier.
      - uses: taiki-e/install-action@cargo-llvm-cov
      # One invocation, both tiers, instrumented. `test-integration-rustd` is
      # what a developer runs (no cargo-llvm-cov needed); this is the same
      # suite plus the unit tier under measurement, which is where the
      # coverage number has to come from — the integration tests are
      # `#[ignore]`d, so a unit-only run reports every datastore-touching line
      # as uncovered.
      - name: Run both Rust test tiers under coverage against live datastores
        run: make test-coverage-rustd
      - name: Upload Rust coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rustd/lcov.info
          flags: rust-afd
          disable_search: true
          fail_ci_if_error: true
      - name: Show datastore logs when the suite fails
        if: failure()
        run: docker compose logs --tail 200 postgres redis
