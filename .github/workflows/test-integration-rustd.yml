name: test-integration-rustd

# The Rust substrate against live Postgres and Redis.
#
# A separate workflow rather than a job in `test.yml`, on purpose. That file's
# `test` aggregate is a required check and carries no `services:` block;
# hanging a datastore-dependent job off it would make a live Postgres a
# precondition for every pull request, including the ones that touch only the
# website. Here the dependency is contained: if the datastores are unavailable,
# this lane fails and the fast lanes still say what they know.
#
# The services come from `docker compose` via `make/test-infra.mk`, not from a
# `services:` block, so CI boots exactly what a developer boots — the same
# compose file, the same reset, the same Redis TLS certificate extraction. A
# `services:` block would be a second definition of the environment that drifts
# from the first one silently.

# No push-to-main trigger, by owner decision (Indy, Aug 2026): merges are not
# squashed, so the merged tree is what the pull request already proved.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs populate the cache every branch restores
  # from, so cancelling one to start the next leaves no warm cache at all.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The shard list lives in make/test-integration-rustd.mk once; the matrix
  # reads it, so a shard added there is measured here without a second edit.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - id: shards
        run: echo "shards=$(make -s --no-print-directory rustd-coverage-shards | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

  # One shard per runner, each with its own compose Postgres and Dragonfly, so
  # no shard's tests share a database or a ready stream with another's. A shard
  # grades nothing: its tests cover only part of the lines, and the floor is a
  # claim about all of them (the merge job below).
  shard:
    needs: plan
    name: coverage (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports even when one fails, so a red run says which.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # CI never performs an edit-build-edit loop, so incremental objects buy it
    # no latency and made the restored/uploaded target cache several gigabytes
    # larger. Keep developers' dev-profile default intact; bound this lane only.
    env:
      CARGO_INCREMENTAL: '0'
    # The suite shares one migrated database per shard; only migrator fault
    # tests create scratch databases because schema state is what they
    # exercise. This still covers a cold instrumented workspace build on an
    # uncached runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # No toolchain input: rustd/rust-toolchain.toml is the single pin, and
      # rustup installs it on first use inside that directory. Naming a version
      # here would be a second source of truth that silently disagrees.
      - name: Show the pinned toolchain
        run: rustup show && cargo --version
        working-directory: rustd
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Instrumented binaries cannot be restored across source revisions:
          # the accumulate mode combines the migration and test passes, and
          # cargo-llvm-cov would then discover both revisions in one report.
          # Registry sources are immutable by checksum and retain the useful
          # network saving without uploading multi-gigabyte target trees.
          key: cargo-integration-v3-${{ runner.os }}-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}
          restore-keys: |
            cargo-integration-v3-${{ runner.os }}-
      # Versioned pin plus a `tool:` input, not the `@cargo-llvm-cov` tag alias.
      # Both install the same binary, but the alias is a moving ref: it resolves
      # to whatever that tag points at when the job starts, so a third party can
      # change what executes here with no commit in this repository.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # `_reset-test-db` brings compose up, waits for healthchecks, drops
      # schemas and flushes Dragonfly. KEEP_TEST_STATE is never set here: a
      # green run under it would prove nothing about a clean checkout.
      - name: Measure shard ${{ matrix.shard }} against live datastores
        run: make test-coverage-rustd RUSTD_SHARD=${{ matrix.shard }}
      - name: Keep the shard's report for the merge
        uses: actions/upload-artifact@v7
        with:
          name: rustd-lcov-${{ matrix.shard }}
          path: |
            rustd/lcov-${{ matrix.shard }}.info
            rustd/lcov-${{ matrix.shard }}.rev
          if-no-files-found: error
          retention-days: 3
      - name: Show datastore logs when the shard fails
        if: failure()
        # `dragonfly`, not `redis`. The service was renamed with the store and
        # this line was not, so the one step whose whole job is explaining a
        # failed suite exited 1 with `no such service: redis` and printed no
        # logs at all -- a diagnostic that fails exactly when it is needed.
        run: docker compose logs --tail 200 postgres dragonfly

  # The lane's verdict, under the name it has always reported: every shard's
  # report merged line by line, the floor graded once over the union, one
  # Codecov upload. It runs when a shard failed too, and fails in turn, so a
  # red shard is a red lane rather than a skipped check.
  test-integration-rustd:
    needs: [plan, shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard measured
        if: needs.shard.result != 'success'
        run: |
          echo "✗ [rustd] a coverage shard did not finish (result: ${{ needs.shard.result }}); the floor is not graded over part of the lane"
          exit 1
      # Depth 2: a pull request checks out GitHub's merge commit, whose first
      # parent is the base the patch floor measures from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Collect the shards' reports
        uses: actions/download-artifact@v8
        with:
          pattern: rustd-lcov-*
          path: rustd
          merge-multiple: true
      - name: Grade the line and patch floors over every shard
        run: make test-coverage-rustd-merge RUSTD_PATCH_BASE="${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}"
      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rustd/lcov.info
          flags: rust-afd
          disable_search: true
          fail_ci_if_error: true
