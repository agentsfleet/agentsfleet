name: test-integration-rustd

# The Rust substrate against live Postgres and Redis.
#
# A separate workflow rather than a job in `test.yml`, on purpose. That file's
# `test` aggregate is a required check and carries no `services:` block;
# hanging a datastore-dependent job off it would make a live Postgres a
# precondition for every pull request, including the ones that touch only the
# website. Here the dependency is contained: if the datastores are unavailable,
# this lane fails and the fast lanes still say what they know.
#
# The services come from `docker compose` via `make/test-infra.mk`, not from a
# `services:` block, so CI boots exactly what a developer boots — the same
# compose file, the same reset, the same Redis TLS certificate extraction. A
# `services:` block would be a second definition of the environment that drifts
# from the first one silently.

# No push-to-main trigger, by owner decision (Indy, Aug 2026): merges are not
# squashed, so the merged tree is what the pull request already proved.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      toolbox_baseline_sha:
        description: Optional full commit to compare against on this kernel host
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs populate the cache every branch restores
  # from, so cancelling one to start the next leaves no warm cache at all.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The shard list lives in make/test-integration-rustd.mk once; the matrix
  # reads it, so a shard added there is measured here without a second edit.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: shards
        run: echo "shards=$(make -s --no-print-directory rustd-coverage-shards | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

  # One shard per runner, each with its own compose Postgres and Dragonfly, so
  # no shard's tests share a database or a ready stream with another's. A shard
  # grades nothing: its tests cover only part of the lines, and the floor is a
  # claim about all of them (the merge job below).
  shard:
    needs: plan
    name: coverage (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports even when one fails, so a red run says which.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # CI never performs an edit-build-edit loop, so incremental objects buy it
    # no latency and made the restored/uploaded target cache several gigabytes
    # larger. Keep developers' dev-profile default intact; bound this lane only.
    env:
      CARGO_INCREMENTAL: '0'
    # The suite shares one migrated database per shard; only migrator fault
    # tests create scratch databases because schema state is what they
    # exercise. This still covers a cold instrumented workspace build on an
    # uncached runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No toolchain input: rustd/rust-toolchain.toml is the single pin, and
      # rustup installs it on first use inside that directory. Naming a version
      # here would be a second source of truth that silently disagrees.
      - name: Show the pinned toolchain
        run: rustup show && cargo --version
        working-directory: rustd
      # Restore only. warm-cache.yml saves this key from main, so pull requests read
      # a complete registry rather than writing their own.
      - name: Cache cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # Instrumented binaries cannot be restored across source revisions:
          # the accumulate mode combines the migration and test passes, and
          # cargo-llvm-cov would then discover both revisions in one report.
          # Registry sources are immutable by checksum and retain the useful
          # network saving without uploading multi-gigabyte target trees.
          key: cargo-integration-v3-${{ runner.os }}-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}
          restore-keys: |
            cargo-integration-v3-${{ runner.os }}-
      # Versioned pin plus a `tool:` input, not the `@cargo-llvm-cov` tag alias.
      # Both install the same binary, but the alias is a moving ref: it resolves
      # to whatever that tag points at when the job starts, so a third party can
      # change what executes here with no commit in this repository.
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov
      # The catalogue seeder's integration test runs the seeder under Bun.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install the seeder's dependencies
        run: bun install --frozen-lockfile
      # `_reset-test-db` brings compose up, waits for healthchecks, drops
      # schemas and flushes Dragonfly. KEEP_TEST_STATE is never set here: a
      # green run under it would prove nothing about a clean checkout.
      - name: Measure shard ${{ matrix.shard }} against live datastores
        run: make test-coverage-rustd RUSTD_SHARD=${{ matrix.shard }}
      - name: Keep the shard's report for the merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustd-lcov-${{ matrix.shard }}
          path: |
            rustd/lcov-${{ matrix.shard }}.info
            rustd/lcov-${{ matrix.shard }}.rev
          if-no-files-found: error
          retention-days: 3
      - name: Show datastore logs when the shard fails
        if: failure()
        # `dragonfly`, not `redis`. The service was renamed with the store and
        # this line was not, so the one step whose whole job is explaining a
        # failed suite exited 1 with `no such service: redis` and printed no
        # logs at all -- a diagnostic that fails exactly when it is needed.
        run: docker compose logs --tail 200 postgres dragonfly

  # The kernel lane, as root on the hosted runner, which is a virtual machine
  # of its own: no nested virtualization is needed, only what a runner host is
  # prepared with. It is the only run that reaches the Linux-only sandbox
  # lines (egress, cgroups, mounts), so its report joins the shards' in the
  # merge below. `make test-coverage-runner-kernel` runs the lane under the
  # instrument and fails, never skips, when the kernel lacks a mechanism.
  kernel:
    name: coverage (kernel)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
    # A cold instrumented build, the toolbox's mmdebstrap, then the lane.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show the pinned toolchain
        run: rustup show && cargo --version
        working-directory: rustd
      # Restore only. warm-cache.yml saves this key from main, so pull requests read
      # a complete registry rather than writing their own.
      - name: Cache cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-kernel-v1-${{ runner.os }}-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}
          restore-keys: |
            cargo-kernel-v1-${{ runner.os }}-
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-llvm-cov
      - name: Install the toolbox builder and bubblewrap
        run: bash .github/actions/build-toolbox/install-tools.sh bubblewrap
      # The host the runner playbook prepares: IPv4 forwarding on, and no
      # forward chain that drops by policy (Docker's `FORWARD` chain does, and
      # the runner's probe refuses such a host). Ubuntu's AppArmor denies
      # capabilities inside an unprivileged user namespace, and bubblewrap
      # starts as the sandbox's own user. The toolbox is an EROFS image, and
      # the probe reads /proc/filesystems, which lists erofs only once its
      # module is loaded; the hosted kernel may ship it in modules-extra.
      - name: Prepare the host as a runner host
        run: |
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -P FORWARD ACCEPT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe erofs || {
            sudo apt-get update -q
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe erofs
          }
          grep -qw erofs /proc/filesystems
      - name: Build matched toolbox images for explicit qualification
        if: github.event_name == 'workflow_dispatch' && inputs.toolbox_baseline_sha != ''
        env:
          BASELINE_SHA: ${{ inputs.toolbox_baseline_sha }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          proof="$RUNNER_TEMP/toolbox-proof"
          mkdir -p "$proof"
          git rev-parse HEAD > "$proof/candidate-revision.txt"
          printf '%s\n' "$BASELINE_SHA" > "$proof/baseline-revision.txt"
          uname -a > "$proof/host.txt"
          git fetch --no-tags origin "$BASELINE_SHA"
          git worktree add --detach "$RUNNER_TEMP/toolbox-baseline-source" "$BASELINE_SHA"
          sudo make -C "$RUNNER_TEMP/toolbox-baseline-source" --no-print-directory toolbox-image TOOLBOX_DIR="$proof/baseline" 2>&1 | tee "$proof/baseline-build.log"
          sudo make --no-print-directory toolbox-image TOOLBOX_DIR="$proof/candidate" 2>&1 | tee "$proof/candidate-build.log"
          images=("$proof/candidate"/toolbox-*.erofs)
          [ "${#images[@]}" = 1 ]
          echo "AFR_TOOLBOX_IMAGE=${images[0]}" >> "$GITHUB_ENV"
      - name: Measure the kernel lane
        run: make test-coverage-runner-kernel
      - name: Measure matched cold first use after compilation
        if: github.event_name == 'workflow_dispatch' && inputs.toolbox_baseline_sha != ''
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/toolbox-proof"
          baseline=("$proof/baseline"/toolbox-*.erofs)
          sudo bash playbooks/operations/acceptance/measure_toolbox_first_use.sh "${baseline[0]}" "$proof/baseline-first-use.json" 120
          sudo bash playbooks/operations/acceptance/measure_toolbox_first_use.sh "$AFR_TOOLBOX_IMAGE" "$proof/candidate-first-use.json" 120 "$proof/baseline-first-use.json"
          python3 - "$proof" <<'PYPROOF'
          import hashlib, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          lengths = {}
          for role in ('baseline', 'candidate'):
              image, = (root / role).glob('*.erofs')
              release = json.loads(image.with_suffix('.json').read_text())
              with image.open('rb') as handle:
                  sha = hashlib.file_digest(handle, 'sha256').hexdigest()
              assert sha == release['sha256'] and image.stat().st_size == release['length']
              report = json.loads((root / f'{role}-first-use.json').read_text())
              assert report['image_sha256'] == sha and report['image_bytes'] == release['length']
              lengths[role] = release['length']
          assert lengths['candidate'] < lengths['baseline'], lengths
          (root / 'historical-comparison.txt').write_text('NOT_COMPARABLE: amd64 hosted runner versus historical arm64 host\n')
          print(lengths)
          PYPROOF
      - name: Retain toolbox qualification evidence including failures
        if: always() && github.event_name == 'workflow_dispatch' && inputs.toolbox_baseline_sha != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-qualification
          path: ${{ runner.temp }}/toolbox-proof
          if-no-files-found: error
          retention-days: 14
      - name: Keep the kernel lane's report for the merge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustd-lcov-kernel
          path: |
            rustd/lcov-kernel.info
            rustd/lcov-kernel.rev
          if-no-files-found: error
          retention-days: 3

  # The lane's verdict, under the name it has always reported: every report,
  # the shards' and the kernel lane's, merged line by line, the floor graded
  # once over the union, one Codecov upload. It runs when a shard failed too,
  # and fails in turn, so a red shard is a red lane rather than a skipped check.
  test-integration-rustd:
    needs: [plan, shard, kernel]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard measured
        if: needs.shard.result != 'success' || needs.kernel.result != 'success'
        run: |
          echo "✗ [rustd] a coverage report did not finish (shards: ${{ needs.shard.result }}, kernel: ${{ needs.kernel.result }}); the floor is not graded over part of the lane"
          exit 1
      # Depth 2: a pull request checks out GitHub's merge commit, whose first
      # parent is the base the patch floor measures from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Collect the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustd-lcov-*
          path: rustd
          merge-multiple: true
      - name: Grade the line and patch floors over every shard
        run: make test-coverage-rustd-merge RUSTD_PATCH_BASE="${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}"
      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: rustd/lcov.info
          flags: rust-afd
          disable_search: true
          fail_ci_if_error: true
