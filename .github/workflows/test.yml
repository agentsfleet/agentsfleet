name: test

on:
  # Run on merges to main (Zig-relevant paths only) so the default branch
  # populates the actions/cache for each Zig job. GitHub scopes caches per
  # branch with a fallback to the default branch, so without a main run every
  # new PR branch starts from a COLD Zig cache (~5 min full recompile). A warmed
  # main cache lets PR branches restore it and recompile only changed modules.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'build_runner.zig'
      - 'make/**'
      - 'scripts/**'
      - 'schema/**'
      - '.github/workflows/test.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  # Every other trigger here needs a Pull Request or a merge to main, so a long
  # branch cannot exercise these lanes until review time — which is exactly when
  # a first-run failure is most expensive. `bench.yml` and `cache-prune.yml`
  # already carry this for the same reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs exist to populate the cache every branch
  # restores from, so cancelling one to start the next leaves no warm cache at
  # all — silently undoing the reason the main trigger is here. Pull Request
  # runs stay cancellable; a superseded push has nothing worth finishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zig-unit-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0-r4
      options: --security-opt seccomp=unconfined --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Run every Zig unit owner once under coverage
        run: make test-coverage-zig
      - name: Upload unit verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: zig-verification-unit
          path: |
            coverage/zig
            .tmp/verification-graph.json
            .tmp/verification-results/unit
          if-no-files-found: error

  zig-integration-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-integration-${{ matrix.shard }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-integration-${{ matrix.shard }}-0.16.0-
      - name: Provision this shard's isolated datastores
        run: |
          python3 scripts/verification_evidence.py start \
            --output .tmp/verification-timings/integration-shard-${{ matrix.shard }}.started
          make _reset-test-db
      - name: Run integration shard once under coverage
        run: |
          python3 scripts/run_with_timeout.py --seconds 1200 \
            --label integration-shard-${{ matrix.shard }} \
            --started-at-file .tmp/verification-timings/integration-shard-${{ matrix.shard }}.started \
            --timing-output .tmp/verification-timings/integration-shard-${{ matrix.shard }}.json -- \
          docker run --rm --network host --privileged \
            --security-opt seccomp=unconfined --cap-add=SYS_PTRACE \
            -v "${{ github.workspace }}":"${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e TEST_INFRA=provided \
            -e TEST_DATABASE_URL="postgres://agentsfleet:agentsfleet@localhost:5432/agentsfleetdb?sslmode=disable" \
            -e TEST_REDIS_TLS_URL="rediss://:agentsfleet@localhost:6379" \
            -e AGENTSFLEET_QSTASH_LIVE_URL="http://localhost:8080" \
            -e INTEGRATION_SHARD_ISOLATION_KEY="ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}" \
            ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0-r4@sha256:b27550eb4910e77e532f061a7c1f3453815cb275dd188bdcc7db0448dd656948 \
            sh -c 'git config --global --add safe.directory "${{ github.workspace }}" && \
              make _test-integration-daemon-build && \
              python3 scripts/check_verification_graph.py shards --count 5 \
                --binary zig-out/bin/agentsfleetd-integration-tests \
                --output .tmp/verification-graph.json && \
              make _test-integration-shard SHARD_INDEX=${{ matrix.shard }}'
      - name: Migrate from empty as a non-superuser
        if: matrix.shard == 0
        run: make check-migrate-unprivileged
      - name: Upload shard verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: zig-verification-shard-${{ matrix.shard }}
          path: |
            coverage/zig
            .tmp/verification-results/integration-shard-${{ matrix.shard }}
            .tmp/verification-timings/integration-shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Stop services
        if: always()
        run: docker compose down

  zig-runner-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0-r4
      options: --privileged --cgroupns=private
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Run runner kernel owner once under coverage
        run: |
          python3 scripts/verification_evidence.py start \
            --output .tmp/verification-timings/runner-kernel.started
          python3 scripts/check_verification_graph.py validate --output .tmp/verification-graph.json
          make _test-integration-runner-build
          python3 scripts/run_with_timeout.py --seconds 900 --label runner-kernel \
            --started-at-file .tmp/verification-timings/runner-kernel.started \
            --timing-output .tmp/verification-timings/runner-kernel.json -- \
            sh scripts/cgroup-delegate.sh make _test-integration-runner-coverage-native
      - name: Upload runner-kernel verification evidence
        uses: actions/upload-artifact@v6
        with:
          name: zig-verification-runner-kernel
          path: |
            coverage/zig
            .tmp/verification-results/runner-kernel
            .tmp/verification-timings/runner-kernel.json
          if-no-files-found: error

  zig-coverage-grade:
    runs-on: ubuntu-latest
    needs: [zig-unit-coverage, zig-integration-shard, zig-runner-kernel]
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0-r4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: zig-verification-*
          path: .
          merge-multiple: true
      - name: Validate provenance and grade the complete coverage union
        run: |
          python3 scripts/check_verification_graph.py validate --output .tmp/verification-graph.json
          make _test-integration-grade
          make _test-integration-timing
      - name: Publish Zig coverage summary
        if: always()
        run: |
          test -s .tmp/zig-coverage.txt || exit 0
          {
            cat .tmp/zig-coverage.txt
            printf '\n### Verification concurrency\n\n```json\n'
            cat .tmp/verification-results/timing-summary.json
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload agentsfleetd coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/zig/merged/cobertura.xml
          flags: zig-agentsfleetd
          disable_search: true
          fail_ci_if_error: true
      - name: Upload runner coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/zig/merged/cobertura.xml
          flags: zig-runner
          disable_search: true
          fail_ci_if_error: true
      - name: Upload library coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/zig/merged/cobertura.xml
          flags: zig-lib
          disable_search: true
          fail_ci_if_error: true
      - name: Upload merged Zig coverage report
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: zig-coverage-html
          path: coverage/zig/merged
          if-no-files-found: error
          retention-days: 14

  test-unit-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install agentsfleet dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Test agentsfleet (100% coverage floor enforced)
        run: bun run test
        working-directory: cli
      # Written by the step above; the cli lane already emits lcov.
      - name: Upload cli coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage/lcov.info
          flags: cli
          disable_search: true
          fail_ci_if_error: true

  test-unit-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Test website
        run: bun run test:coverage
        working-directory: ui/packages/website
      # Written by the step above; the website lane already emits lcov.
      - name: Upload website coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/packages/website/coverage/lcov.info
          flags: website
          disable_search: true
          fail_ci_if_error: true

  test-unit-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Test app
        run: bun run test:coverage
        working-directory: ui/packages/app
      # Written by the step above; the app lane already emits lcov.
      - name: Upload app coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/packages/app/coverage/lcov.info
          flags: app
          disable_search: true
          fail_ci_if_error: true

  test-unit-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install design-system dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/design-system
      - name: Test design-system (97% coverage gate)
        run: bun run test:coverage
        working-directory: ui/packages/design-system

  bundle-size-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Build website
        run: bun run build
        working-directory: ui/packages/website
      - name: Enforce bundle size budgets (§5.6.1)
        run: bun run size
        working-directory: ui/packages/website

  bundle-size-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Build app and enforce authenticated route budgets
        run: bun run build && bun run size
        working-directory: ui/packages/app
        env:
          NEXT_PUBLIC_API_URL: https://api-test.agentsfleet.net

  test:
    runs-on: ubuntu-latest
    needs: [zig-coverage-grade, test-unit-cli, test-unit-website, test-unit-app, test-unit-design-system, bundle-size-website, bundle-size-app]
    steps:
      - name: Preserve legacy test check name
        run: echo "All test lanes passed"

  test-integration:
    runs-on: ubuntu-latest
    needs: [zig-coverage-grade]
    steps:
      - name: Preserve required integration check without re-executing a root
        run: echo "The same-run integration shards and coverage union passed"
