name: test

on:
  # Run on merges to main (Zig-relevant paths only) so the default branch
  # populates the actions/cache for each Zig job. GitHub scopes caches per
  # branch with a fallback to the default branch, so without a main run every
  # new PR branch starts from a COLD Zig cache (~5 min full recompile). A warmed
  # main cache lets PR branches restore it and recompile only changed modules.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'build_runner.zig'
      - 'make/**'
      - 'schema/**'
      - '.github/workflows/test.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  # Every other trigger here needs a Pull Request or a merge to main, so a long
  # branch cannot exercise these lanes until review time — which is exactly when
  # a first-run failure is most expensive. `bench.yml` and `cache-prune.yml`
  # already carry this for the same reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs exist to populate the cache every branch
  # restores from, so cancelling one to start the next leaves no warm cache at
  # all — silently undoing the reason the main trigger is here. Pull Request
  # runs stay cancellable; a superseded push has nothing worth finishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-unit-agentsfleetd:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Test agentsfleetd (Zig units)
        run: make test-unit-agentsfleetd

  test-unit-agentsfleet-runner:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Test agentsfleet-runner (Zig units)
        run: make test-unit-agentsfleet-runner

  test-unit-agentsfleet-lib:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Test shared src/lib (Zig units)
        run: make test-unit-agentsfleet-lib

  test-coverage-zig:
    runs-on: ubuntu-latest
    # The suite runs under kcov's ptrace, and this lane now measures the
    # integration binary as well as the five unit ones, so it is the long pole.
    timeout-minutes: 30
    # No job-level `container:`. The coverage target now runs the integration
    # binary, which needs a live Postgres and Redis, and a GitHub Actions job
    # container is forced onto GitHub's own managed network where `--network
    # host` is rejected. `test-integration.yml` documents the same constraint
    # and resolves it the same way — `docker run` below, which also carries
    # kcov's two required permissions.
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-r2-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-r2-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-r2-
      - name: Gate merged Zig line coverage
        run: |
          # The HOST does every step that needs docker, with the same recipes the
          # gate runs locally — no forked logic — as memleak.yml does. This
          # replaces a bare `docker compose up -d`: that left the container to
          # boot and reset the datastores itself, which is the only reason it
          # ever needed the host's Docker socket. It does not need it now.
          #
          # `_reset-test-db` rather than `_ensure-test-infra`: it depends on the
          # latter, so this boots AND drops schemas / flushes Redis. Both are
          # required, because the coverage target runs the full integration suite
          # and several suites leave fixture rows that break the next run — and
          # both reach for `docker compose exec`, which the container cannot do.
          make _reset-test-db
          # Run inside the project's CI image via `docker run` rather than a job
          # `container:`, for the reason test-integration.yml already records:
          # --network host keeps localhost:5432/6379 pointing at the compose-
          # published ports, and a GitHub Actions job container is forced onto
          # GitHub's managed network, which rejects it. kcov's two required
          # permissions ride the same invocation — it calls
          # personality(ADDR_NO_RANDOMIZE) to pin addresses across runs, which
          # Docker's default seccomp profile omits from its personality
          # allow-list, and it drives the binary under ptrace.
          #
          # NO `-v /var/run/docker.sock`. This job runs branch-controlled make
          # targets on a pull_request trigger, so mounting the host socket would
          # let any contributor spawn privileged sibling containers, mount host
          # paths, and take over the runner. TEST_INFRA=provided removes the
          # reason it was ever mounted, and fails closed: it re-verifies the CA
          # cert the host extracted and dies loudly if infra was claimed but not
          # provided.
          docker run --rm --network host \
            --security-opt seccomp=unconfined --cap-add=SYS_PTRACE \
            -v "${{ github.workspace }}":"${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -e TEST_INFRA=provided \
            -e KEEP_TEST_STATE=1 \
            -e TEST_DATABASE_URL="postgres://agentsfleet:agentsfleet@localhost:5432/agentsfleetdb?sslmode=disable" \
            -e TEST_REDIS_TLS_URL="rediss://:agentsfleet@localhost:6379" \
            ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0-r2@sha256:40cbacd00584601a4794471e01cb11942ef5319c0531e4185c54d78733285803 \
            sh -c 'make test-coverage-zig'
      - name: Publish Zig coverage summary
        if: always()
        run: |
          test -s .tmp/zig-coverage.txt || exit 0
          coverage="$(sed -n 's/^zig_line_coverage_pct=//p' .tmp/zig-coverage.txt)"
          minimum="$(sed -n 's/^zig_line_coverage_min_pct=//p' .tmp/zig-coverage.txt)"
          {
            echo "## Zig coverage"
            echo
            echo "| Measured | Required |"
            echo "| ---: | ---: |"
            echo "| ${coverage}% | ${minimum}% |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Zig coverage report
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: zig-coverage-html
          path: coverage/zig/merged
          if-no-files-found: error
          retention-days: 14
      # The datastores were booted on the host by this job, not by a service
      # block Actions tears down for us, so this job owns stopping them.
      - name: Stop services
        if: always()
        run: docker compose down

  test-unit-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install agentsfleet dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Test agentsfleet (100% coverage floor enforced)
        run: bun run test
        working-directory: cli

  test-unit-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Test website
        run: bun run test:coverage
        working-directory: ui/packages/website

  test-unit-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Test app
        run: bun run test:coverage
        working-directory: ui/packages/app

  test-unit-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install design-system dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/design-system
      - name: Test design-system (97% coverage gate)
        run: bun run test:coverage
        working-directory: ui/packages/design-system

  bundle-size-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Build website
        run: bun run build
        working-directory: ui/packages/website
      - name: Enforce bundle size budgets (§5.6.1)
        run: bun run size
        working-directory: ui/packages/website

  bundle-size-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Build app and enforce authenticated route budgets
        run: bun run build && bun run size
        working-directory: ui/packages/app
        env:
          NEXT_PUBLIC_API_URL: https://api-test.agentsfleet.net

  test:
    runs-on: ubuntu-latest
    needs: [test-unit-agentsfleetd, test-unit-agentsfleet-runner, test-unit-agentsfleet-lib, test-coverage-zig, test-unit-cli, test-unit-website, test-unit-app, test-unit-design-system, bundle-size-website, bundle-size-app]
    steps:
      - name: Preserve legacy test check name
        run: echo "All test lanes passed"
