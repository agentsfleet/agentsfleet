name: test

on:
  # No push-to-main trigger, by owner decision (Indy, Aug 2026): merges here
  # are not squashed, so the merged tree is the tree the pull request already
  # tested, and running the same suite twice buys nothing. The trade-off that
  # goes with it: caches are scoped per-branch with fallback to the default
  # branch, so with no main runs a new branch starts from a cold cache. If
  # pull requests get slow, the fix is a cache-warm-only job on main — never
  # a second test run.
  pull_request:
    types: [opened, synchronize, reopened]
  # Every other trigger here needs a Pull Request or a merge to main, so a long
  # branch cannot exercise these lanes until review time — which is exactly when
  # a first-run failure is most expensive. `bench.yml` and `cache-prune.yml`
  # already carry this for the same reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-unit-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install agentsfleet dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Test agentsfleet (100% coverage floor enforced)
        run: bun run test
        working-directory: cli
      # Written by the step above; the cli lane already emits lcov.
      - name: Upload cli coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage/lcov.info
          flags: cli
          disable_search: true
          fail_ci_if_error: true

  test-unit-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Test website
        run: bun run test:coverage
        working-directory: ui/packages/website
      # Written by the step above; the website lane already emits lcov.
      - name: Upload website coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/packages/website/coverage/lcov.info
          flags: website
          disable_search: true
          fail_ci_if_error: true

  test-unit-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Test app
        run: bun run test:coverage
        working-directory: ui/packages/app
      # Written by the step above; the app lane already emits lcov.
      - name: Upload app coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/packages/app/coverage/lcov.info
          flags: app
          disable_search: true
          fail_ci_if_error: true

  test-unit-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install design-system dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/design-system
      - name: Test design-system (97% coverage gate)
        run: bun run test:coverage
        working-directory: ui/packages/design-system

  bundle-size-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Build website
        run: bun run build
        working-directory: ui/packages/website
      - name: Enforce bundle size budgets (§5.6.1)
        run: bun run size
        working-directory: ui/packages/website

  bundle-size-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Build app and enforce authenticated route budgets
        run: bun run build && bun run size
        working-directory: ui/packages/app
        env:
          NEXT_PUBLIC_API_URL: https://api-test.agentsfleet.net

  # ── Cross-compile proof for the Rust daemon ─────────────────────────────
  #
  # THE FAILURE THIS EXISTS TO PREVENT.
  #
  # Nothing on a pull request built `agentsfleetd-rs` at all. The first musl
  # build happened at MERGE (deploy-dev-build, amd64 only) and the first arm64
  # build happened at TAG, inside `release.yml`. So an arm64-only break — a
  # dependency without an aarch64 musl path, a target-gated `cfg`, an assembly
  # backend that resolves differently — stayed invisible until a release was
  # already underway, which is the most expensive possible moment to find it.
  #
  # This job builds BOTH linux targets and asserts the result is what the
  # distroless runtime requires. It publishes nothing: the binary a release
  # ships must be built from the TAGGED tree, and reusing a pull request's
  # binary would ship something never compiled from the released commit. That
  # is the same rule `release.yml` follows when it deploys an immutable digest
  # rather than a mutable tag.
  #
  # What IS reused is the compilation work, through the cargo cache — and only
  # from the default branch, because GitHub scopes a pull request's cache to
  # that pull request. The key matches `release.yml`'s `cargo-dist-<arch>-`
  # exactly so a warm default-branch cache serves both.
  #
  # Native runners per architecture, not QEMU: emulating an LTO build across
  # thirty crates costs more than the runner it saves, and `release.yml` made
  # the same call for the same reason.
  build-daemon-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            rustd/target
          key: cargo-dist-${{ matrix.arch }}-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}
          restore-keys: cargo-dist-${{ matrix.arch }}-

      # `docker run` rather than a job `container:`: JS actions cannot run
      # inside an Alpine container on an ARM64 runner, which is the constraint
      # release.yml documents on the same build.
      # One `cargo build` per binary, as deploy-dev-build.yml builds them: a
      # single invocation unifies features across both dependency graphs and
      # would pass a binary that only compiles with the other's features.
      - name: Build both binaries in the pinned builder (musl-native)
        run: |
          mkdir -p .cargo-cache/registry .cargo-cache/git rustd/target
          # DERIVED, never spelled twice — see check_builder_pin.sh.
          RUST_VERSION="$(sed -n 's/^RUST_VERSION=//p' playbooks/operations/ci_rust_images/versions.env)"
          ALPINE_SERIES="$(sed -n 's/^ALPINE_SERIES=//p' playbooks/operations/ci_rust_images/versions.env)"
          BUILDER="ghcr.io/agentsfleet/ci-rust-alpine:$RUST_VERSION-alpine$ALPINE_SERIES"
          echo "→ building for linux/${{ matrix.arch }} in $BUILDER"
          docker run --rm \
            -v "$PWD:/w" \
            -v "$PWD/.cargo-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-cache/git:/usr/local/cargo/git" \
            -e GIT_COMMIT="${GITHUB_SHA::7}" \
            -w /w/rustd \
            "$BUILDER" \
            sh -c '
              set -e
              cargo build --profile dist --bin agentsfleetd
              cargo build --profile dist --bin agentsfleet-runner
            '
          sudo chown -R "$(id -u):$(id -g)" .cargo-cache rustd/target

      # The distroless runtime carries no loader and no libc. A binary with a
      # NEEDED entry or an INTERP section builds green here and dies at boot
      # there, so the assertion belongs on this side of the wall.
      - name: Verify static ELF — zero NEEDED, no INTERP
        run: |
          for bin in rustd/target/dist/agentsfleetd rustd/target/dist/agentsfleet-runner; do
            test -f "$bin"
            if readelf -d "$bin" 2>/dev/null | grep -q " (NEEDED)"; then
              echo "FAIL: $bin has dynamic NEEDED entries"
              readelf -d "$bin" | grep NEEDED
              exit 1
            fi
            if readelf -l "$bin" 2>/dev/null | grep -q "INTERP"; then
              echo "FAIL: $bin has INTERP (dynamic linker) section"
              exit 1
            fi
            echo "✓ linux/${{ matrix.arch }} $bin: fully static (zero NEEDED, no INTERP), $(wc -c < "$bin") bytes"
          done

  test:
    runs-on: ubuntu-latest
    needs: [test-unit-cli, test-unit-website, test-unit-app, test-unit-design-system, bundle-size-website, bundle-size-app, build-daemon-musl]
    # `if: always()` + an explicit result check — a needs-only aggregate is
    # SKIPPED when a dependency fails, and branch protection treats a skipped
    # required check as passing.
    if: always()
    steps:
      - name: Fail unless every needed job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "needed job results: $results"
          for result in $results; do
            [ "$result" = "success" ] || { echo "✗ a needed job finished '$result'"; exit 1; }
          done
          echo "All test lanes passed"
