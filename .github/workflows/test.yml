name: test

on:
  # Run on merges to main (Zig-relevant paths only) so the default branch
  # populates the actions/cache for each Zig job. GitHub scopes caches per
  # branch with a fallback to the default branch, so without a main run every
  # new PR branch starts from a COLD Zig cache (~5 min full recompile). A warmed
  # main cache lets PR branches restore it and recompile only changed modules.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'build_runner.zig'
      - 'make/**'
      - 'schema/**'
      - '.github/workflows/test.yml'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs exist to populate the cache every branch
  # restores from, so cancelling one to start the next leaves no warm cache at
  # all — silently undoing the reason the main trigger is here. Pull Request
  # runs stay cancellable; a superseded push has nothing worth finishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-unit-agentsfleetd:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Test agentsfleetd (Zig units)
        run: make test-unit-agentsfleetd

  test-unit-agentsfleet-runner:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Test agentsfleet-runner (Zig units)
        run: make test-unit-agentsfleet-runner

  test-unit-agentsfleet-lib:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-
      - name: Test shared src/lib (Zig units)
        run: make test-unit-agentsfleet-lib

  test-coverage-zig:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agentsfleet/ci-zig-ubuntu:0.16.0-r2@sha256:40cbacd00584601a4794471e01cb11942ef5319c0531e4185c54d78733285803
      # kcov needs exactly two things the default container posture denies, and
      # nothing else: it calls personality(ADDR_NO_RANDOMIZE) to pin addresses
      # across runs — a value Docker's default seccomp profile does not carry in
      # its personality allow-list, so the call returns EPERM — and it drives the
      # binary under ptrace. `--privileged` bought both by handing the container
      # every capability plus host device access, which is far more than a job
      # that checks out branch code should hold.
      options: --security-opt seccomp=unconfined --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v6
      - name: Cache Zig build
        uses: actions/cache@v5
        with:
          # Only the LOCAL cache is persisted. Zig writes nothing to the global
          # cache for this build graph — a build with a warm local cache and a
          # freshly created global one leaves that directory at 0 bytes and
          # takes the same time. Listing it here cached a directory the make
          # targets never even create (their default global path is under
          # $HOME), so actions/cache skipped it with a warning every run.
          path: .tmp/zig-local-cache
          key: zig-${{ runner.os }}-${{ github.job }}-0.16.0-r2-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-${{ hashFiles('src/**/*.zig', 'schema/**/*.sql') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-r2-${{ hashFiles('build.zig.zon', 'build.zig', 'build_runner.zig') }}-
            zig-${{ runner.os }}-${{ github.job }}-0.16.0-r2-
      - name: Gate merged Zig line coverage
        run: make test-coverage-zig
      - name: Publish Zig coverage summary
        if: always()
        run: |
          test -s .tmp/zig-coverage.txt || exit 0
          coverage="$(sed -n 's/^zig_line_coverage_pct=//p' .tmp/zig-coverage.txt)"
          minimum="$(sed -n 's/^zig_line_coverage_min_pct=//p' .tmp/zig-coverage.txt)"
          {
            echo "## Zig coverage"
            echo
            echo "| Measured | Required |"
            echo "| ---: | ---: |"
            echo "| ${coverage}% | ${minimum}% |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Zig coverage report
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: zig-coverage-html
          path: coverage/zig/merged
          if-no-files-found: error
          retention-days: 14

  test-unit-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install agentsfleet dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Test agentsfleet
        run: bun run test:coverage
        working-directory: cli

  test-unit-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Test website
        run: bun run test:coverage
        working-directory: ui/packages/website

  test-unit-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Test app
        run: bun run test:coverage
        working-directory: ui/packages/app

  test-unit-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install design-system dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/design-system
      - name: Test design-system (97% coverage gate)
        run: bun run test:coverage
        working-directory: ui/packages/design-system

  bundle-size-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Build website
        run: bun run build
        working-directory: ui/packages/website
      - name: Enforce bundle size budgets (§5.6.1)
        run: bun run size
        working-directory: ui/packages/website

  bundle-size-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Build app and enforce authenticated route budgets
        run: bun run build && bun run size
        working-directory: ui/packages/app
        env:
          NEXT_PUBLIC_API_URL: https://api-test.agentsfleet.net

  test:
    runs-on: ubuntu-latest
    needs: [test-unit-agentsfleetd, test-unit-agentsfleet-runner, test-unit-agentsfleet-lib, test-coverage-zig, test-unit-cli, test-unit-website, test-unit-app, test-unit-design-system, bundle-size-website, bundle-size-app]
    steps:
      - name: Preserve legacy test check name
        run: echo "All test lanes passed"
