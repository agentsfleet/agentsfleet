name: test

on:
  # Run on merges to main (Zig-relevant paths only) so the default branch
  # populates the actions/cache for each Zig job. GitHub scopes caches per
  # branch with a fallback to the default branch, so without a main run every
  # new PR branch starts from a COLD Zig cache (~5 min full recompile). A warmed
  # main cache lets PR branches restore it and recompile only changed modules.
  push:
    branches: [main]
    paths:
      - 'rustd/**'
      - 'make/**'
      - '.github/workflows/test.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  # Every other trigger here needs a Pull Request or a merge to main, so a long
  # branch cannot exercise these lanes until review time — which is exactly when
  # a first-run failure is most expensive. `bench.yml` and `cache-prune.yml`
  # already carry this for the same reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel on main: these runs exist to populate the cache every branch
  # restores from, so cancelling one to start the next leaves no warm cache at
  # all — silently undoing the reason the main trigger is here. Pull Request
  # runs stay cancellable; a superseded push has nothing worth finishing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-unit-rustd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No toolchain input here: rustd/rust-toolchain.toml is the single pin, and
      # rustup installs it on first use inside that directory. Naming a version
      # in this file would be a second source of truth that silently disagrees.
      - name: Show the pinned toolchain
        run: rustup show && rustc --version && cargo --version
        working-directory: rustd
      # Compiler artifacts, shared with the integration lane through `shared-key`.
      #
      # This replaced a hand-rolled `actions/cache` over `~/.cargo` +
      # `rustd/target`, which had two faults the comment beside it recorded
      # honestly and then worked around rather than fixed:
      #
      #  - `actions/cache` never re-saves on a hit, so `rustd/target` was frozen
      #    at whatever the FIRST run under a given `Cargo.lock` left there,
      #    including a partial tree from a failed job.
      #  - Two lanes compiling the same crates had to hold two caches under two
      #    keys, because one shared key meant whichever finished last overwrote
      #    the other every run. That is the workaround `shared-key` removes.
      #
      # Prior art checked before choosing this, per the operating model: the
      # sibling `e2e-observability-platform` runs the SAME rustc 1.98.0 under
      # GitLab CI and caches `.cargo/registry` + `.cargo/git` while explicitly
      # refusing to cache `target/` — "to avoid stale artifact/fingerprint
      # mismatches across pipeline runs" (`.gitlab/ci/quality-gates.yml`). Its
      # conclusion is right and is exactly what `rust-cache` implements
      # properly: it keeps dependency builds, PRUNES the workspace's own
      # artifacts before saving, keys on the lockfile plus the rustc version
      # plus the enabled features, and sets `CARGO_INCREMENTAL=0` — which that
      # sibling has to set by hand on every job.
      #
      # It also declines that sibling's other half deliberately. It reaches for
      # `sccache` as a `RUSTC_WRAPPER`, then has to switch it back off for the
      # unit-test job over proc-macro cache corruption (mozilla/sccache#1924,
      # cited in its own config). A compilation cache that must be disabled per
      # job to stay correct is not one to adopt on the evidence of the repo that
      # disabled it.
      #
      # `save-if` is what makes the sharing deliberate rather than racy. A
      # `shared-key` drops the job name from the cache key, so BOTH lanes
      # compute the same primary key; Actions caches are immutable and the two
      # run concurrently, so whichever reached its post step first would save
      # and the other would be rejected as already-existing, its artifacts
      # discarded — with a race deciding which lane's build got kept. Only the
      # unit lane on the default branch writes; every other run restores. That
      # is the arrangement `test.yml` already reasons about at the top of this
      # file, where the `push: branches: [main]` trigger exists so a main run
      # populates the cache each Pull Request branch restores from.
      # Pinned to the commit `v2` resolved to, not the tag. A tag is mutable:
      # retargeting it upstream changes the code that runs against this
      # checkout and the shared build cache, with no diff here to review.
      # The trailing comment is what a reader and Dependabot both bump.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustd
          shared-key: rustd
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the Rust workspace
        run: make lint-rustd
      - name: Test the Rust workspace
        run: make test-unit-rustd
      # No coverage measurement here. This job runs the unit tier only — the
      # integration tests are `#[ignore]`d and need Postgres and Redis, which
      # this workflow deliberately does not have. Measuring here reported every
      # pool, stream and migrator line as uncovered while the lane that runs
      # them said nothing, so the number described the instrument's position
      # rather than the code. `test-integration-rustd.yml` measures both tiers
      # in the one run that executes both.

  test-unit-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install agentsfleet dependencies
        run: bun install --frozen-lockfile
        working-directory: cli
      - name: Test agentsfleet (100% coverage floor enforced)
        run: bun run test
        working-directory: cli
      # Written by the step above; the cli lane already emits lcov.
      - name: Upload cli coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cli/coverage/lcov.info
          flags: cli
          disable_search: true
          fail_ci_if_error: true

  test-unit-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Test website
        run: bun run test:coverage
        working-directory: ui/packages/website
      # Written by the step above; the website lane already emits lcov.
      - name: Upload website coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/packages/website/coverage/lcov.info
          flags: website
          disable_search: true
          fail_ci_if_error: true

  test-unit-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Test app
        run: bun run test:coverage
        working-directory: ui/packages/app
      # Written by the step above; the app lane already emits lcov.
      - name: Upload app coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ui/packages/app/coverage/lcov.info
          flags: app
          disable_search: true
          fail_ci_if_error: true

  test-unit-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install design-system dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/design-system
      - name: Test design-system (97% coverage gate)
        run: bun run test:coverage
        working-directory: ui/packages/design-system

  bundle-size-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/website
      - name: Build website
        run: bun run build
        working-directory: ui/packages/website
      - name: Enforce bundle size budgets (§5.6.1)
        run: bun run size
        working-directory: ui/packages/website

  bundle-size-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install app dependencies
        run: bun install --frozen-lockfile
        working-directory: ui/packages/app
      - name: Build app and enforce authenticated route budgets
        run: bun run build && bun run size
        working-directory: ui/packages/app
        env:
          NEXT_PUBLIC_API_URL: https://api-test.agentsfleet.net

  test:
    runs-on: ubuntu-latest
    needs: [test-unit-cli, test-unit-website, test-unit-app, test-unit-design-system, bundle-size-website, bundle-size-app]
    # `if: always()` + an explicit result check — a needs-only aggregate is
    # SKIPPED when a dependency fails, and branch protection treats a skipped
    # required check as passing.
    if: always()
    steps:
      - name: Fail unless every needed job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "needed job results: $results"
          for result in $results; do
            [ "$result" = "success" ] || { echo "✗ a needed job finished '$result'"; exit 1; }
          done
          echo "All test lanes passed"
