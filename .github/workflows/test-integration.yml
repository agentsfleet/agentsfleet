name: test-integration-legacy

on:
  # Pull requests and main pushes are owned by test.yml's same-run verification
  # DAG. Keep this manual stub only so old workflow links explain the move rather
  # than disappearing; it executes no registered test root.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - name: Point to the canonical required check
        run: echo "The required test-integration job now runs in test.yml"
