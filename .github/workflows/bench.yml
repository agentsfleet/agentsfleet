name: bench

on:
  # Temporarily disabled from automatic CI while bench gate is being stabilized.
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      HEY_VERSION: 0.1.5
    steps:
      - uses: actions/checkout@v7
      # `make bench` is the hey loadgen gate; the runner image carries node for
      # the fixture below and Go for this install. hey publishes no release
      # binaries, so it is built from its module, which the Go checksum
      # database verifies at this exact version.
      - name: Install hey
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rakyll/hey@v${HEY_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run bench gate against local health fixture
        run: |
          node -e '
          const http = require("http");
          const server = http.createServer((req, res) => {
            if (req.url === "/healthz") {
              res.writeHead(200, { "content-type": "application/json" });
              res.end(JSON.stringify({ status: "ok" }));
              return;
            }
            res.writeHead(404);
            res.end("not found");
          });
          server.listen(38080, "127.0.0.1");
          setInterval(() => {}, 1 << 30);
          ' &
          fixture_pid=$!
          trap 'kill "$fixture_pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:38080/healthz >/dev/null; then
              break
            fi
            sleep 0.5
          done

          API_BENCH_URL=http://127.0.0.1:38080/healthz \
          API_BENCH_DURATION_SEC=10 \
          API_BENCH_CONCURRENCY=16 \
          make bench
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-artifacts
          path: .tmp/api-bench-*.csv
          if-no-files-found: warn
          retention-days: 7
