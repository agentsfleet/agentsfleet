name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── 0a. Credential gate — initial PROD deployment inputs must exist ───────
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: 1password/install-cli-action@v3

      - name: Check vault credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_DEV: ${{ vars.VAULT_DEV }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
        run: ENV=prod STAGE=deployment ./playbooks/founding/02_preflight/00_gate.sh

  # ── 0b. Tag and version agreement ───────────────────────────────────────
  verify-tag:
    runs-on: ubuntu-latest
    needs: check-credentials
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches VERSION file
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(cat VERSION)
          if [ "$TAG" != "$VERSION" ]; then
            echo "✗ tag v$TAG does not match VERSION file ($VERSION)"
            exit 1
          fi
          echo "✓ tag v$TAG matches VERSION $VERSION"

  # ── 1a. x86_64 binary: build inside Alpine container ──────────────────
  # JS actions work inside Alpine on x86_64 runners.
  # Alpine's openssl-libs-static provides musl-native .a — fully static output.
  binaries-linux-x86:
    needs: verify-tag
    runs-on: ubuntu-latest
    container:
      # Pre-baked: alpine:3.21 + Zig 0.16.0 + apk deps + x86_64-linux-gnu OpenSSL
      # static-link symlinks. Multi-arch image; linux/amd64 selected on x86_64 runner.
      image: ghcr.io/agentsfleet/ci-zig-alpine:0.16.0
    steps:
      - uses: actions/checkout@v6

      - name: Build (x86_64-linux)
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dgit-commit="${GITHUB_SHA::7}"
          zig build --build-file build_runner.zig -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl

      - name: Verify static ELF — zero NEEDED, no INTERP (x86_64-linux)
        run: |
          for bin in zig-out/bin/agentsfleetd zig-out/bin/agentsfleet-runner; do
            test -f "$bin"
            if readelf -d "$bin" 2>/dev/null | grep -q " (NEEDED)"; then
              echo "FAIL: $bin has dynamic NEEDED entries"
              readelf -d "$bin" | grep NEEDED
              exit 1
            fi
            if readelf -l "$bin" 2>/dev/null | grep -q "INTERP"; then
              echo "FAIL: $bin has INTERP (dynamic linker) section"
              exit 1
            fi
            echo "✓ $bin: fully static (zero NEEDED, no INTERP)"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/agentsfleetd       dist/agentsfleetd-linux-amd64
          cp zig-out/bin/agentsfleet-runner dist/agentsfleet-runner-linux-amd64
          chmod +x dist/agentsfleetd-linux-amd64 dist/agentsfleet-runner-linux-amd64
          tar czf dist/agentsfleetd-linux-amd64.tar.gz -C dist agentsfleetd-linux-amd64
          tar czf dist/agentsfleet-runner-linux-amd64.tar.gz -C dist agentsfleet-runner-linux-amd64

      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleetd-linux-amd64
          path: dist/agentsfleetd-linux-amd64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleet-runner-linux-amd64
          path: dist/agentsfleet-runner-linux-amd64.tar.gz

      # Upload unpackaged binary for runtime compat verification job below.
      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleetd-linux-amd64-ci
          path: dist/agentsfleetd-linux-amd64
          retention-days: 1

  # ── 1b. Runtime compat: verify release x86_64 binary runs on all target envs ──
  # Mirrors verify-runtime-compat from cross-compile.yml.
  # Release binaries must pass before Docker image is pushed to GHCR.
  verify-runtime-compat:
    runs-on: ubuntu-latest
    needs: binaries-linux-x86
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agentsfleetd-linux-amd64-ci
          path: dist

      - name: Make binary executable
        run: chmod +x dist/agentsfleetd-linux-amd64

      - name: Verify in debian:bookworm-slim (Fly.io target)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/test:ro" \
            mirror.gcr.io/library/debian:bookworm-slim \
            sh -c 'ldd /test/agentsfleetd-linux-amd64 2>&1 | grep -q "not a dynamic executable" && echo "✓ bookworm-slim: static binary confirmed" || (echo "FAIL: dynamic deps found in bookworm-slim"; ldd /test/agentsfleetd-linux-amd64 2>&1; exit 1)'

      - name: Verify in alpine:3.21 (musl-native)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/test:ro" \
            mirror.gcr.io/library/alpine:3.21 \
            sh -c 'ldd /test/agentsfleetd-linux-amd64 2>&1 | grep -qiE "not a dynamic|Not a valid dynamic" && echo "✓ alpine: static binary confirmed" || (echo "FAIL: dynamic deps found in alpine"; ldd /test/agentsfleetd-linux-amd64 2>&1; exit 1)'

      - name: Verify in debian:trixie-slim (bare-metal worker target)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dist:/test:ro" \
            mirror.gcr.io/library/debian:trixie-slim \
            sh -c 'ldd /test/agentsfleetd-linux-amd64 2>&1 | grep -q "not a dynamic executable" && echo "✓ trixie-slim: static binary confirmed" || (echo "FAIL: dynamic deps found in trixie-slim"; ldd /test/agentsfleetd-linux-amd64 2>&1; exit 1)'

  # ── 1c. aarch64 binary: bare runner + docker run alpine ───────────────
  # JS actions cannot run inside Alpine containers on ARM64 runners.
  # Solution: use the bare ubuntu-24.04-arm runner and invoke docker run
  # to execute the Zig build inside Alpine — same approach as `make build-linux-alpine`.
  binaries-linux-aarch64:
    needs: verify-tag
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Build aarch64-linux inside Alpine (musl-native static OpenSSL)
        # Pre-baked image: ci-zig-alpine multi-arch manifest carries linux/arm64,
        # so docker pulls the arm64 variant (no QEMU emulation on the native
        # ubuntu-24.04-arm runner). Image already has openssl-libs-static, the
        # aarch64-linux-gnu symlinks, and Zig 0.16.0 in /opt/zig on $PATH.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zig-out/bin"
          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/zig-out:/zig-out" \
            ghcr.io/agentsfleet/ci-zig-alpine:0.16.0 \
            sh -c '
              set -e
              cp -a /src/. /build
              cd /build
              echo "  compiling agentsfleetd + agentsfleet-runner (aarch64-linux)..."
              zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl -Dgit-commit="${GITHUB_SHA::7}"
              zig build --build-file build_runner.zig -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl
              for bin in zig-out/bin/agentsfleetd zig-out/bin/agentsfleet-runner; do
                test -f "$bin"
                if readelf -d "$bin" 2>/dev/null | grep -q " (NEEDED)"; then
                  echo "FAIL: $bin has dynamic NEEDED entries"
                  readelf -d "$bin" | grep NEEDED
                  exit 1
                fi
                if readelf -l "$bin" 2>/dev/null | grep -q "INTERP"; then
                  echo "FAIL: $bin has INTERP (dynamic linker) section"
                  exit 1
                fi
                echo "  ✓ $bin: fully static (zero NEEDED, no INTERP)"
              done
              cp zig-out/bin/agentsfleetd       /zig-out/bin/agentsfleetd
              cp zig-out/bin/agentsfleet-runner /zig-out/bin/agentsfleet-runner
            '

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/agentsfleetd       dist/agentsfleetd-linux-arm64
          cp zig-out/bin/agentsfleet-runner dist/agentsfleet-runner-linux-arm64
          chmod +x dist/agentsfleetd-linux-arm64 dist/agentsfleet-runner-linux-arm64
          tar czf dist/agentsfleetd-linux-arm64.tar.gz -C dist agentsfleetd-linux-arm64
          tar czf dist/agentsfleet-runner-linux-arm64.tar.gz -C dist agentsfleet-runner-linux-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleetd-linux-arm64
          path: dist/agentsfleetd-linux-arm64.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleet-runner-linux-arm64
          path: dist/agentsfleet-runner-linux-arm64.tar.gz

  binaries-macos:
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Ensure OpenSSL is available (macOS)
        run: brew install openssl@3 || true

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-macos -Dgit-commit="${GITHUB_SHA::7}"

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/agentsfleetd dist/agentsfleetd-darwin-arm64
          chmod +x dist/agentsfleetd-darwin-arm64
          tar czf dist/agentsfleetd-darwin-arm64.tar.gz -C dist agentsfleetd-darwin-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleetd-darwin-arm64
          path: dist/agentsfleetd-darwin-arm64.tar.gz

  # ── 2. Docker: multi-arch build + push stable to GHCR ──────────────────
  push-prod:
    runs-on: ubuntu-latest
    needs: [verify-tag, binaries-linux-x86, binaries-linux-aarch64, binaries-macos, verify-runtime-compat]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: agentsfleetd-linux-amd64
          path: dist

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: agentsfleetd-linux-arm64
          path: dist

      - name: Extract binaries
        run: |
          cd dist
          tar xzf agentsfleetd-linux-amd64.tar.gz
          tar xzf agentsfleetd-linux-arm64.tar.gz

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        run: make push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  # ── 3. CLI: publish @agentsfleet/cli to npm ─────────────────────────
  # Tag lifecycle:
  #   - Release publishes to `next` dist-tag (--tag next)
  #   - Post-Release Verification installs the exact version on every target
  #     and promotes it to `latest` only after live production acceptance
  #   - Users installing without a tag pin (`npm install -g @agentsfleet/cli`)
  #     resolve `latest`, not `next`
  npm:
    runs-on: ubuntu-latest
    needs: verify-tag
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Load npm token from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: op://${{ vars.VAULT_PROD }}/npm-publish-token/credential

      - name: Sync package.json version from git tag
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version

      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Publish to npm (skip if version already exists)
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "@agentsfleet/cli@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "✓ @agentsfleet/cli@${VERSION} already published — skipping"
          else
            npm publish --provenance --access public --tag next
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  # ── 4. GitHub Release: changelog + attach binaries ─────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [binaries-linux-x86, binaries-linux-aarch64, binaries-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The changelog is published at docs.agentsfleet.net, not carried in the
      # repo: one source of truth, and no version-heading promotion step to
      # forget. `generate_release_notes` fills the body with the merged pull
      # requests for this tag, so the release still says what shipped without a
      # file to maintain.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: "[Full changelog for this release →](https://docs.agentsfleet.net/changelog)"
          generate_release_notes: true
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Verify: DEV gate before PROD rollout ──────────────────────────────
  verify-dev-gate:
    runs-on: ubuntu-latest
    needs: [create-release, push-prod]
    steps:
      - name: Verify DEV readiness gate
        run: |
          echo "Checking DEV API health before PROD rollout..."
          curl -sf https://api-dev.agentsfleet.net/healthz >/dev/null
          curl -sf https://api-dev.agentsfleet.net/readyz | jq -e '.ready == true' >/dev/null
          echo "✓ DEV readiness gate passed"

  # ── 6. Deploy: prod API ───────────────────────────────────────────────
  deploy-fly-prod:
    runs-on: ubuntu-latest
    needs: verify-dev-gate
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Load PROD deploy secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://${{ vars.VAULT_PROD }}/fly-api-token/credential
          TUNNEL_TOKEN: op://${{ vars.VAULT_PROD }}/cloudflare-tunnel-prod/credential
          DATABASE_URL_API: op://${{ vars.VAULT_PROD }}/planetscale-prod/api-connection-string
          DATABASE_URL_MIGRATOR: op://${{ vars.VAULT_PROD }}/planetscale-prod/migrator-connection-string
          REDIS_URL_API: op://${{ vars.VAULT_PROD }}/upstash-prod/api-url
          ENCRYPTION_MASTER_KEY: op://${{ vars.VAULT_PROD }}/encryption-master-key/credential
          AUTH_SESSION_CODE_PEPPER: op://${{ vars.VAULT_PROD }}/auth-session-code-pepper/credential
          APPROVAL_SIGNING_SECRET: op://${{ vars.VAULT_PROD }}/approval-signing-secret/credential
          AUDIT_LOG_PEPPER: op://${{ vars.VAULT_PROD }}/audit-log-pepper/credential
          POSTHOG_API_KEY: op://${{ vars.VAULT_PROD }}/posthog-prod/credential
          CLERK_PUBLISHABLE_KEY: op://${{ vars.VAULT_PROD }}/clerk-prod/publishable-key
          CLERK_SECRET_KEY: op://${{ vars.VAULT_PROD }}/clerk-prod/secret-key
          CLERK_WEBHOOK_SECRET: op://${{ vars.VAULT_PROD }}/clerk-prod/webhook-secret
          GRAFANA_OTLP_ENDPOINT: op://${{ vars.VAULT_PROD }}/grafana-prod/otlp-endpoint
          GRAFANA_OTLP_INSTANCE_ID: op://${{ vars.VAULT_PROD }}/grafana-prod/instance-id
          GRAFANA_OTLP_API_KEY: op://${{ vars.VAULT_PROD }}/grafana-prod/api-key
          OIDC_ISSUER: op://${{ vars.VAULT_PROD }}/clerk-prod/issuer
          R2_ACCOUNT_ID: op://${{ vars.VAULT_PROD }}/cloudflare-r2/account-id
          R2_ACCESS_KEY_ID: op://${{ vars.VAULT_PROD }}/cloudflare-r2/access-key-id
          R2_SECRET_ACCESS_KEY: op://${{ vars.VAULT_PROD }}/cloudflare-r2/secret-access-key
          R2_BUCKET: op://${{ vars.VAULT_PROD }}/cloudflare-r2/bucket
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage Fly secrets from vault (applied on next deploy)
        run: |
          flyctl secrets set \
            DATABASE_URL_API="$DATABASE_URL_API" \
            DATABASE_URL_MIGRATOR="$DATABASE_URL_MIGRATOR" \
            REDIS_URL_API="$REDIS_URL_API" \
            ENCRYPTION_MASTER_KEY="$ENCRYPTION_MASTER_KEY" \
            AUTH_SESSION_CODE_PEPPER="$AUTH_SESSION_CODE_PEPPER" \
            APPROVAL_SIGNING_SECRET="$APPROVAL_SIGNING_SECRET" \
            AUDIT_LOG_PEPPER="$AUDIT_LOG_PEPPER" \
            POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            CLERK_WEBHOOK_SECRET="$CLERK_WEBHOOK_SECRET" \
            OIDC_ISSUER="$OIDC_ISSUER" \
            OIDC_PROVIDER="clerk" \
            OIDC_AUDIENCE="https://api.agentsfleet.net" \
            GRAFANA_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT" \
            GRAFANA_OTLP_INSTANCE_ID="$GRAFANA_OTLP_INSTANCE_ID" \
            GRAFANA_OTLP_API_KEY="$GRAFANA_OTLP_API_KEY" \
            R2_ACCOUNT_ID="$R2_ACCOUNT_ID" \
            R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            R2_BUCKET="$R2_BUCKET" \
            --stage \
            --app "$FLY_APP_PROD"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_APP_PROD: ${{ vars.FLY_APP_PROD }}

      - name: Resolve latest digest
        id: digest
        # Deploy the IMMUTABLE digest, never the mutable :latest tag — Fly caches
        # the tag -> image-id mapping and can otherwise redeploy a stale image
        # even after push-prod publishes a new one. push-prod (a needs: ancestor)
        # has already pushed, so :latest in GHCR points at this release's image.
        run: |
          # Bounded retry: GHCR's package-versions API can lag a few seconds
          # behind push-prod moving the tag, so a single lookup may transiently
          # return empty for an image that pushed fine. Retry before failing.
          DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            DIGEST=$(gh api "/orgs/${{ github.repository_owner }}/packages/container/agentsfleetd/versions" \
              --jq '[.[] | select(.metadata.container.tags[]? == "latest")][0].name')
            if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then break; fi
            echo "latest not yet indexed by GHCR (attempt $attempt/6); retrying in 5s..."
            sleep 5
          done
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "FAIL: could not resolve latest digest from GHCR after retries"; exit 1
          fi
          echo "latest -> $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy PROD API to Fly.io
        run: |
          flyctl deploy \
            --app "$FLY_APP_PROD" \
            --image "ghcr.io/agentsfleet/agentsfleetd@${{ steps.digest.outputs.digest }}" \
            --config deploy/fly/agentsfleetd-prod/fly.toml \
            --wait-timeout 120
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_APP_PROD: ${{ vars.FLY_APP_PROD }}

      - name: Enforce PROD API machine count
        run: |
          APP="$FLY_APP_PROD"
          DESIRED_API_MACHINES=3
          flyctl scale count "$DESIRED_API_MACHINES" \
            --app "$APP" \
            --process-group app \
            --yes

          for attempt in $(seq 1 12); do
            MACHINES="$(flyctl machine list --app "$APP" --json)"
            TOTAL="$(printf '%s' "$MACHINES" | jq 'length')"
            RUNNING="$(printf '%s' "$MACHINES" | jq '[.[] | select(.state == "started")] | length')"
            echo "API machines (attempt $attempt/12): $RUNNING/$TOTAL running; expected $DESIRED_API_MACHINES"
            if [ "$TOTAL" -eq "$DESIRED_API_MACHINES" ] && \
               [ "$RUNNING" -eq "$DESIRED_API_MACHINES" ]; then
              break
            fi
            sleep 5
          done

          test "$TOTAL" -eq "$DESIRED_API_MACHINES"
          test "$RUNNING" -eq "$DESIRED_API_MACHINES"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_APP_PROD: ${{ vars.FLY_APP_PROD }}

      - name: Ensure cloudflared-prod tunnel is running
        # cloudflared-prod bridges Cloudflare Edge to
        # agentsfleetd-prod.internal:3000 over Fly's private IPv6 network (6PN).
        # If its machines are stopped/crashed, every /healthz poll returns status=000.
        # Restart stopped machines or deploy from scratch if no machines exist.
        # Sync TUNNEL_TOKEN from vault on every deploy so a rotated secret is always
        # pushed before we check tunnel health — prevents "Invalid tunnel secret" failures.
        run: |
          TUNNEL_APP="cloudflared-prod"
          TUNNEL_DIR="deploy/fly/cloudflared-prod"   # build-context dir (config.yml + Dockerfile live here)
          echo "Syncing tunnel token from vault..."
          flyctl secrets set TUNNEL_TOKEN="$TUNNEL_TOKEN" --app "$TUNNEL_APP"
          echo "Checking tunnel connector ($TUNNEL_APP)..."
          MACHINES="$(flyctl machine list --app "$TUNNEL_APP" --json 2>/dev/null || echo '[]')"
          RUNNING="$(echo "$MACHINES" | jq '[.[] | select(.state == "started")] | length')"
          TOTAL="$(echo "$MACHINES" | jq 'length')"
          echo "  machines: $RUNNING/$TOTAL running"
          if [ "$RUNNING" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "  ▲ no running machines — restarting..."
            for MID in $(echo "$MACHINES" | jq -r '.[].id'); do
              flyctl machine start "$MID" --app "$TUNNEL_APP" || true
            done
            echo "  waiting 15s for tunnel reconnect..."
            sleep 15
          elif [ "$TOTAL" -eq 0 ]; then
            echo "  ▲ no machines found — deploying $TUNNEL_APP from scratch..."
            # Positional path = build context; flyctl >=0.4.5x uses CWD otherwise and
            # the Dockerfile COPY config.yml then fails ("/config.yml not found").
            flyctl deploy "$TUNNEL_DIR" --app "$TUNNEL_APP" --wait-timeout 60 \
              || { echo "  ✗ flyctl deploy failed for $TUNNEL_APP — check logs above"; true; }
            echo "  waiting 15s for tunnel reconnect..."
            sleep 15
          else
            echo "  ✓ tunnel is running"
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}

      - name: Verify PROD API rollout via Cloudflare Tunnel
        run: |
          echo "Waiting for PROD API..."
          STATUS=000
          for i in $(seq 1 24); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              https://api.agentsfleet.net/healthz || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /healthz green after $((i * 10))s"
              break
            fi
            echo "  attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "✗ /healthz did not return 200 after 240s"
            exit 1
          fi
          curl -sf https://api.agentsfleet.net/readyz | jq -e '.ready == true'

  # ── 7. Deploy: canary runner (first host) ────────────────────────────────
  deploy-worker-canary-prod:
    runs-on: ubuntu-latest
    needs: deploy-fly-prod
    if: vars.PROD_WORKER_READY == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: agentsfleet-runner-linux-amd64
          path: dist

      - name: Extract runner binary
        run: tar -xzf dist/agentsfleet-runner-linux-amd64.tar.gz -C dist

      - name: Load Tailscale credentials from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://${{ vars.VAULT_PROD }}/tailscale/oauth-client-id
          TS_OAUTH_SECRET: op://${{ vars.VAULT_PROD }}/tailscale/oauth-secret

      - name: Parse canary host from fleet config
        id: canary
        run: |
          vault_key="$(
            printf '%s' "$PROD_WORKER_HOSTS" |
              jq -er '
                select(type == "array" and length > 0)
                | .[0].vault_key
                | select(type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              '
          )"
          echo "vault_key=$vault_key" >> "$GITHUB_OUTPUT"
        env:
          PROD_WORKER_HOSTS: ${{ vars.PROD_WORKER_HOSTS }}

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy and verify canary runner
        run: |
          ENV=prod \
          RUNNER_BINARY=dist/agentsfleet-runner-linux-amd64 \
          RUNNER_VERSION="${GITHUB_REF#refs/tags/}" \
            ./playbooks/lib/runner/deploy.sh
          ENV=prod \
            ./playbooks/lib/runner/verify.sh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
          WORKER_ITEM: ${{ steps.canary.outputs.vault_key }}
          ALLOW_VAULT_READS: "1"

  # ── 8. Deploy: remaining fleet (with approval gate) ─────────────────────
  deploy-worker-fleet-prod:
    runs-on: ubuntu-latest
    needs: deploy-worker-canary-prod
    environment: production-fleet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: agentsfleet-runner-linux-amd64
          path: dist

      - name: Extract runner binary
        run: tar -xzf dist/agentsfleet-runner-linux-amd64.tar.gz -C dist

      - name: Load Tailscale credentials from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://${{ vars.VAULT_PROD }}/tailscale/oauth-client-id
          TS_OAUTH_SECRET: op://${{ vars.VAULT_PROD }}/tailscale/oauth-secret

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy remaining fleet sequentially
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PROD_WORKER_HOSTS: ${{ vars.PROD_WORKER_HOSTS }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
          ALLOW_VAULT_READS: "1"
        run: |
          printf '%s' "$PROD_WORKER_HOSTS" | jq -e '
            type == "array" and
            length > 0 and
            all(.[].vault_key;
              type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
          ' >/dev/null
          mapfile -t workers < <(
            printf '%s' "$PROD_WORKER_HOSTS" |
              jq -r '.[1:][] | .vault_key'
          )

          for worker in "${workers[@]}"; do
            echo "Deploying $worker"
            ENV=prod \
            WORKER_ITEM="$worker" \
            RUNNER_BINARY=dist/agentsfleet-runner-linux-amd64 \
            RUNNER_VERSION="${GITHUB_REF#refs/tags/}" \
              ./playbooks/lib/runner/deploy.sh
            ENV=prod \
            WORKER_ITEM="$worker" \
              ./playbooks/lib/runner/verify.sh
          done

  # ── Release verdict ──────────────────────────────────────────────────────
  # PROD had no Discord notification at all: every workflow but deploy-dev.yml
  # posted nothing, so a prod release succeeded or failed in silence. This is
  # the one message that says which.
  notify:
    runs-on: ubuntu-latest
    needs:
      - npm
      - create-release
      - deploy-fly-prod
      - deploy-worker-canary-prod
      - deploy-worker-fleet-prod
    if: always()
    steps:
      - uses: actions/checkout@v6

      - name: Compose release verdict
        id: verdict
        env:
          NPM_RESULT: ${{ needs.npm.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
          FLY_RESULT: ${{ needs.deploy-fly-prod.result }}
          CANARY_RESULT: ${{ needs.deploy-worker-canary-prod.result }}
          FLEET_RESULT: ${{ needs.deploy-worker-fleet-prod.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          LINE="npm: ${NPM_RESULT} | release: ${RELEASE_RESULT} | fly: ${FLY_RESULT} | canary: ${CANARY_RESULT} | fleet: ${FLEET_RESULT}"

          # A skipped worker stage is allowed — PROD_WORKER_READY gates it, and
          # the fleet stage waits on a human approval that may not have landed.
          ok=1
          for r in "$NPM_RESULT" "$RELEASE_RESULT" "$FLY_RESULT"; do
            [ "$r" = success ] || ok=0
          done
          for r in "$CANARY_RESULT" "$FLEET_RESULT"; do
            case "$r" in success|skipped) ;; *) ok=0 ;; esac
          done

          if [ "$ok" = 1 ]; then
            STATUS=success
            MESSAGE="✅ PROD release \`$TAG\` shipped\\n$LINE"
          else
            STATUS=failure
            MESSAGE="❌ PROD release \`$TAG\` failed\\n$LINE\\nCheck: ${RUN_URL}"
          fi

          # printf, not echo: the \n markers must reach the action as literal
          # backslash-n for its printf %b to expand. echo's handling varies.
          printf 'status=%s\n' "$STATUS" >>"$GITHUB_OUTPUT"
          printf 'message=%s\n' "$MESSAGE" >>"$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ steps.verdict.outputs.status }}
          message: ${{ steps.verdict.outputs.message || '❌ PROD release verdict could not be computed — inspect the notify job' }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
          webhook-item: discord-release-webhook
