name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ── 0a. Credential gate — initial PROD deployment inputs must exist ───────
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: 1password/install-cli-action@v4

      - name: Check vault credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_DEV: ${{ vars.VAULT_DEV }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
        run: ENV=prod STAGE=deployment ./playbooks/founding/02_preflight/00_gate.sh

  # ── 0b. Tag and version agreement ───────────────────────────────────────
  verify-tag:
    runs-on: ubuntu-latest
    needs: check-credentials
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches VERSION file
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(cat VERSION)
          if [ "$TAG" != "$VERSION" ]; then
            echo "✗ tag v$TAG does not match VERSION file ($VERSION)"
            exit 1
          fi
          echo "✓ tag v$TAG matches VERSION $VERSION"

  # Native release outputs were compiled and exercised by test.yml, then
  # signed and verified in development. Tags never invoke Cargo or image builds.
  prepare-artifacts:
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.candidate.outputs.run-id }}
      artifact: ${{ steps.candidate.outputs.artifact }}
      image: ${{ steps.verify.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Select successful development evidence for the tagged source tree
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make candidate-select-development
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          name: ${{ steps.candidate.outputs.artifact }}
          path: dist/candidate
      - name: Verify original build, development rollout and all payload checksums
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.run-id }}
        run: make candidate-verify-development
      - uses: ./.github/actions/toolbox-tools
      - name: Verify the existing toolbox signature against the embedded key
        run: make candidate-verify-signature
      - uses: ./.github/actions/scan-toolbox
        with:
          report: dist/production.scan.json
      - name: Retain fresh vulnerability evidence on failure too
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-production-audit
          path: dist/production.scan.json
          retention-days: 90
      - name: Stage unchanged release files and their evidence
        run: |
          mkdir -p dist/release
          cp dist/candidate/archives/*.tar.gz dist/release/
          cp dist/candidate/toolbox/* dist/release/
          cp dist/candidate/candidate.json dist/candidate/development.json dist/candidate/images.json dist/release/
          cp dist/production.scan.json dist/release/
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: dist/release
          if-no-files-found: error
          retention-days: 90
      # Keep the existing names consumed by both production runner jobs.
      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleet-runner-linux-amd64
          path: dist/candidate/archives/agentsfleet-runner-linux-amd64.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: agentsfleet-runner-toolbox-amd64
          path: dist/candidate/toolbox
          if-no-files-found: error

  push-ghcr:
    runs-on: ubuntu-latest
    needs: prepare-artifacts
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      image: ${{ steps.promote.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.prepare-artifacts.outputs.run-id }}
          name: ${{ needs.prepare-artifacts.outputs.artifact }}
          path: dist/candidate
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to the existing registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Promote the development-verified image without rebuilding
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make candidate-promote-runtime

  # ── 3. CLI: publish @agentsfleet/cli to npm ─────────────────────────
  # Tag lifecycle:
  #   - Release publishes to `next` dist-tag (--tag next)
  #   - Post-Release Verification installs the exact version on every target
  #     and promotes it to `latest` only after live production acceptance
  #   - Users installing without a tag pin (`npm install -g @agentsfleet/cli`)
  #     resolve `latest`, not `next`
  npm:
    runs-on: ubuntu-latest
    needs: [verify-tag, prepare-artifacts]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # The token is the FALLBACK now, not the primary credential. `id-token:
      # write` above mints an OIDC identity, and the npm CLI "automatically
      # detects OIDC environments and uses them for authentication before
      # falling back to traditional tokens" — so once a Trusted Publisher is
      # configured on npmjs.com this step stops being load-bearing and can go.
      #
      # It cannot go YET, and the reason is a fact about the registry rather
      # than a preference: `@agentsfleet/cli` has never been published. Checked
      # Aug 17, 2026, authenticated as a scope member — `npm view` 404s and
      # `npm access list packages @agentsfleet` is empty. A Trusted Publisher is
      # configured on a package's own settings page, so there is nothing to
      # attach one to until a first version exists. Removing the token before
      # then would leave the first publish with neither route.
      #
      # Sequence to finish this: publish once on this token → configure the
      # publisher (agentsfleet/agentsfleet, workflow release.yml, blank
      # environment) → delete this step, `NODE_AUTH_TOKEN` below, and
      # `--provenance`. The publisher pins owner/repo/workflow, so renaming any
      # of the three breaks it silently.
      - name: Load npm token from 1Password (fallback until a publisher exists)
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NPM_TOKEN: op://${{ vars.VAULT_PROD }}/npm-publish-token/credential

      - name: Sync package.json version from git tag
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version --allow-same-version

      - run: bun install --frozen-lockfile
      - run: bun run build
      # setup-node's bundled npm predates OIDC support. An npm older than
      # 11.5.1 ignores the identity entirely and falls straight back to a token
      # lookup, which fails with an auth error that names neither cause — so the
      # version is forced rather than inferred from `node-version`. Same step,
      # same reason, as indykish/dotfiles' release.yml.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest
      - name: Publish to npm (skip if version already exists)
        # `--provenance` STAYS while the token fallback does. Trusted Publishing
        # implies provenance, but a token-authenticated publish only attests
        # when asked, and dropping the flag before the publisher exists would
        # silently ship the first releases unattested.
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "@agentsfleet/cli@${VERSION}" version 2>/dev/null | grep -qF "${VERSION}"; then
            echo "✓ @agentsfleet/cli@${VERSION} already published — skipping"
          else
            npm publish --provenance --access public --tag next
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

  # ── 4. GitHub Release: changelog + attach binaries ─────────────────────
  create-release:
    runs-on: ubuntu-latest
    needs: [prepare-artifacts, push-ghcr]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: dist

      # The changelog is published at docs.agentsfleet.net, not carried in the
      # repo: one source of truth, and no version-heading promotion step to
      # forget. `generate_release_notes` fills the body with the merged pull
      # requests for this tag, so the release still says what shipped without a
      # file to maintain.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          body: "[Full changelog for this release →](https://docs.agentsfleet.net/changelog)"
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/toolbox-*
            dist/release.pub
            dist/candidate.json
            dist/development.json
            dist/images.json
            dist/production.scan.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Verify: DEV gate before PROD rollout ──────────────────────────────
  # Publishing the GitHub release is not a precondition for deploying.
  #
  # The retained development receipt qualifies this exact tree; live readiness
  # still gates production rollout after the immutable image is promoted.
  verify-dev-gate:
    runs-on: ubuntu-latest
    needs: push-ghcr
    steps:
      - name: Verify DEV readiness gate
        run: |
          echo "Checking DEV API health before PROD rollout..."
          curl -sf https://api-dev.agentsfleet.net/healthz >/dev/null
          curl -sf https://api-dev.agentsfleet.net/readyz | jq -e '.ready == true' >/dev/null
          echo "✓ DEV readiness gate passed"

  # ── 6. Deploy: prod API ───────────────────────────────────────────────
  deploy-fly-prod:
    runs-on: ubuntu-latest
    needs: [verify-dev-gate, push-ghcr]
    permissions:
      contents: read
      packages: read
    # The collector hop, production side. Same shape as deploy-dev-fly.yml: the
    # daemon's OTLP endpoint points at this app, and the collector holds the
    # Grafana Cloud credentials and forwards. Named at job scope so a repoint
    # cannot update one spelling and miss the other.
    env:
      OTLP_COLLECTOR_APP: otelcol-prod
      OTLP_COLLECTOR_DIR: deploy/fly/otelcol-prod
      OTLP_COLLECTOR_MACHINES: "2"
      OTLP_COLLECTOR_ENDPOINT: http://otelcol-prod.internal:4318
      # The datastore hop, wired by M196_001 alongside the dev one and graded
      # by its own next run rather than by that milestone. A production lane
      # still resolving an Upstash seed cannot boot the daemon at all -- the
      # transport has been cluster-only since M192 -- so leaving this to a
      # later change would leave production unshippable, not merely
      # unrehearsed.
      #
      # Build context is the repository root: the image copies
      # scripts/dragonfly-cluster.sh, the same bootstrap the integration lane
      # runs and the same one dev deploys.
      DRAGONFLY_APP: dragonfly-prod
      DRAGONFLY_BUILD_CONTEXT: .
      DRAGONFLY_CONFIG: deploy/fly/dragonfly-prod/fly.toml
      DRAGONFLY_MACHINES: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Load PROD deploy secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://${{ vars.VAULT_PROD }}/fly-api-token/credential
          TUNNEL_TOKEN: op://${{ vars.VAULT_PROD }}/cloudflare-tunnel-prod/credential
          DATABASE_URL_API: op://${{ vars.VAULT_PROD }}/planetscale-prod/api-connection-string
          DATABASE_URL_MIGRATOR: op://${{ vars.VAULT_PROD }}/planetscale-prod/migrator-connection-string
          DRAGONFLY_URL: op://${{ vars.VAULT_PROD }}/dragonfly-prod/api-url
          ENCRYPTION_MASTER_KEY: op://${{ vars.VAULT_PROD }}/encryption-master-key/credential
          AUTH_SESSION_CODE_PEPPER: op://${{ vars.VAULT_PROD }}/auth-session-code-pepper/credential
          APPROVAL_SIGNING_SECRET: op://${{ vars.VAULT_PROD }}/approval-signing-secret/credential
          POSTHOG_API_KEY: op://${{ vars.VAULT_PROD }}/posthog-prod/credential
          CLERK_PUBLISHABLE_KEY: op://${{ vars.VAULT_PROD }}/clerk-prod/publishable-key
          CLERK_SECRET_KEY: op://${{ vars.VAULT_PROD }}/clerk-prod/secret-key
          CLERK_WEBHOOK_SECRET: op://${{ vars.VAULT_PROD }}/clerk-prod/webhook-secret
          GRAFANA_OTLP_ENDPOINT: op://${{ vars.VAULT_PROD }}/grafana-prod/otlp-endpoint
          GRAFANA_OTLP_INSTANCE_ID: op://${{ vars.VAULT_PROD }}/grafana-prod/instance-id
          GRAFANA_OTLP_API_KEY: op://${{ vars.VAULT_PROD }}/grafana-prod/api-key
          OIDC_ISSUER: op://${{ vars.VAULT_PROD }}/clerk-prod/issuer
      - uses: 1password/install-cli-action@v4

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08
      - name: Ensure the OTLP collector is running
        # Must be serving BEFORE the daemon's repointed endpoint takes effect on
        # the next deploy, or the first export lands nowhere. The three values
        # staged here are the COLLECTOR's upstream credentials; the daemon keeps
        # its own copy of the auth pair but now reaches this app instead, which
        # ignores the inbound header and re-authenticates upstream with these.
        #
        # scripts/ensure_fly_app.sh refuses rather than falling through: a
        # collector that is not serving takes every production dashboard dark at
        # the next daemon deploy. Shared with the dev workflow because the two
        # inline copies of this logic drifted into real defects.
        run: |
          # The app must exist before secrets can be set on it. `--create-only`
          # creates without deploying, which is the ordering Dimension 0.2
          # shipped the flag for: the secrets step below runs FIRST and fails
          # on an app that was never created.
          bash scripts/ensure_fly_app.sh --create-only "$OTLP_COLLECTOR_APP"
          flyctl secrets set \
            GRAFANA_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT" \
            GRAFANA_OTLP_INSTANCE_ID="$GRAFANA_OTLP_INSTANCE_ID" \
            GRAFANA_OTLP_API_KEY="$GRAFANA_OTLP_API_KEY" \
            OTLP_INGEST_USER="$GRAFANA_OTLP_INSTANCE_ID" \
            OTLP_INGEST_PASSWORD="$GRAFANA_OTLP_API_KEY" \
            --app "$OTLP_COLLECTOR_APP"
          bash scripts/ensure_fly_app.sh \
            "$OTLP_COLLECTOR_APP" "$OTLP_COLLECTOR_DIR" "$OTLP_COLLECTOR_MACHINES"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_ORG: agentsfleet-prod

      - name: Ensure the Dragonfly cluster is serving
        # Before the daemon, and for a harder reason than the collector's: a
        # daemon that cannot reach telemetry still serves, while a daemon whose
        # seed is not a cluster refuses to boot with a permanently classified
        # error no retry clears. Standing this up afterwards would guarantee a
        # crash-loop in between.
        run: |
          bash scripts/ensure_fly_app.sh --create-only "$DRAGONFLY_APP"
          bash scripts/ensure_fly_app.sh \
            "$DRAGONFLY_APP" "$DRAGONFLY_BUILD_CONTEXT" "$DRAGONFLY_MACHINES" "$DRAGONFLY_CONFIG"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_ORG: agentsfleet-prod

      - name: Prove the cluster is bootstrapped, not merely listening
        # Fly's check is TCP, which a node holding no DFLYCLUSTER CONFIG passes
        # happily. The daemon's preflight wants more than a listening socket,
        # so the gate is the script's own `healthy` verb.
        run: |
          bash scripts/dragonfly_cluster_ready.sh "$DRAGONFLY_APP"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}

      - name: Stage Fly secrets from vault (applied on next deploy)
        run: |
          # The collector's ingest credential, as the standard header the daemon
          # reads. Masked before use: GitHub masks the vault pair, not this
          # encoding of it.
          otlp_ingest="$(printf '%s:%s' "$GRAFANA_OTLP_INSTANCE_ID" "$GRAFANA_OTLP_API_KEY" | base64 | tr -d '\n')"
          echo "::add-mask::$otlp_ingest"
          flyctl secrets set \
            DATABASE_URL_API="$DATABASE_URL_API" \
            DATABASE_URL_MIGRATOR="$DATABASE_URL_MIGRATOR" \
            DRAGONFLY_URL="$DRAGONFLY_URL" \
            ENCRYPTION_MASTER_KEY="$ENCRYPTION_MASTER_KEY" \
            AUTH_SESSION_CODE_PEPPER="$AUTH_SESSION_CODE_PEPPER" \
            APPROVAL_SIGNING_SECRET="$APPROVAL_SIGNING_SECRET" \
            POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            CLERK_WEBHOOK_SECRET="$CLERK_WEBHOOK_SECRET" \
            OIDC_ISSUER="$OIDC_ISSUER" \
            OIDC_PROVIDER="clerk" \
            OIDC_AUDIENCE="https://api.agentsfleet.net" \
            OTEL_EXPORTER_OTLP_ENDPOINT="$OTLP_COLLECTOR_ENDPOINT" \
            OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic $otlp_ingest" \
            --stage \
            --app "$FLY_APP_PROD"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_APP_PROD: ${{ vars.FLY_APP_PROD }}

      - name: Deploy PROD API to Fly.io
        run: |
          flyctl deploy \
            --app "$FLY_APP_PROD" \
            --image "$CANDIDATE_IMAGE" \
            --config deploy/fly/agentsfleetd-prod/fly.toml \
            --wait-timeout 120
        env:
          CANDIDATE_IMAGE: ${{ needs.push-ghcr.outputs.image }}
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_APP_PROD: ${{ vars.FLY_APP_PROD }}

      - name: Enforce PROD API machine count
        run: |
          APP="$FLY_APP_PROD"
          DESIRED_API_MACHINES=3
          flyctl scale count "$DESIRED_API_MACHINES" \
            --app "$APP" \
            --process-group app \
            --yes

          for attempt in $(seq 1 12); do
            MACHINES="$(flyctl machine list --app "$APP" --json)"
            TOTAL="$(printf '%s' "$MACHINES" | jq 'length')"
            RUNNING="$(printf '%s' "$MACHINES" | jq '[.[] | select(.state == "started")] | length')"
            echo "API machines (attempt $attempt/12): $RUNNING/$TOTAL running; expected $DESIRED_API_MACHINES"
            if [ "$TOTAL" -eq "$DESIRED_API_MACHINES" ] && \
               [ "$RUNNING" -eq "$DESIRED_API_MACHINES" ]; then
              break
            fi
            sleep 5
          done

          test "$TOTAL" -eq "$DESIRED_API_MACHINES"
          test "$RUNNING" -eq "$DESIRED_API_MACHINES"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_APP_PROD: ${{ vars.FLY_APP_PROD }}

      - name: Ensure cloudflared-prod tunnel is running
        # cloudflared-prod bridges Cloudflare Edge to
        # agentsfleetd-prod.internal:3000 over Fly's private IPv6 network (6PN).
        # If its machines are stopped/crashed, every /healthz poll returns status=000.
        # Restart stopped machines or deploy from scratch if no machines exist.
        # Sync TUNNEL_TOKEN from vault on every deploy so a rotated secret is always
        # pushed before we check tunnel health — prevents "Invalid tunnel secret" failures.
        run: |
          TUNNEL_APP="cloudflared-prod"
          TUNNEL_DIR="deploy/fly/cloudflared-prod"   # build-context dir (config.yml + Dockerfile live here)
          echo "Syncing tunnel token from vault..."
          flyctl secrets set TUNNEL_TOKEN="$TUNNEL_TOKEN" --app "$TUNNEL_APP"
          echo "Checking tunnel connector ($TUNNEL_APP)..."
          MACHINES="$(flyctl machine list --app "$TUNNEL_APP" --json 2>/dev/null || echo '[]')"
          RUNNING="$(echo "$MACHINES" | jq '[.[] | select(.state == "started")] | length')"
          TOTAL="$(echo "$MACHINES" | jq 'length')"
          echo "  machines: $RUNNING/$TOTAL running"
          if [ "$RUNNING" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
            echo "  ▲ no running machines — restarting..."
            for MID in $(echo "$MACHINES" | jq -r '.[].id'); do
              flyctl machine start "$MID" --app "$TUNNEL_APP" || true
            done
            echo "  waiting 15s for tunnel reconnect..."
            sleep 15
          elif [ "$TOTAL" -eq 0 ]; then
            echo "  ▲ no machines found — deploying $TUNNEL_APP from scratch..."
            # Positional path = build context; flyctl >=0.4.5x uses CWD otherwise and
            # the Dockerfile COPY config.yml then fails ("/config.yml not found").
            flyctl deploy "$TUNNEL_DIR" --app "$TUNNEL_APP" --wait-timeout 60 \
              || { echo "  ✗ flyctl deploy failed for $TUNNEL_APP — check logs above"; true; }
            echo "  waiting 15s for tunnel reconnect..."
            sleep 15
          else
            echo "  ✓ tunnel is running"
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}

      - name: Verify PROD API rollout via Cloudflare Tunnel
        run: |
          echo "Waiting for PROD API..."
          STATUS=000
          for i in $(seq 1 24); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              https://api.agentsfleet.net/healthz || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ /healthz green after $((i * 10))s"
              break
            fi
            echo "  attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "✗ /healthz did not return 200 after 240s"
            exit 1
          fi
          curl -sf https://api.agentsfleet.net/readyz | jq -e '.ready == true'

      # AFTER the rollout verification, not before the tunnel: the write goes
      # through the daemon's own secrets API at api.agentsfleet.net, reachable
      # only once cloudflared-prod is up and the rollout has answered green.
      # Placed earlier, its fail-fast curl would abort the release for exactly
      # the condition the tunnel step above exists to repair.
      #
      # `approval-signing` is the deployment-level HMAC key. The retired daemon
      # read it from APPROVAL_SIGNING_SECRET in the environment; `agentsfleetd`
      # reads it as an admin-workspace vault row. The Fly secret staged above is
      # still set for anything reading the environment, but it is NOT what the
      # connector flow resolves — without this row every provider answers 503
      # UZ-CONN-001 on a deployment whose Fly secret is set and correct.
      - name: Seed platform vault secrets
        run: ENV=prod ./playbooks/lib/platform_secret_sync.sh approval-signing
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT: ${{ vars.VAULT_PROD }}
          ALLOW_VAULT_READS: "1"
          ALLOW_PLATFORM_SECRET_WRITES: "1"

  # ── 7. Deploy: canary runner (first host) ────────────────────────────────
  deploy-metal-canary-prod:
    runs-on: ubuntu-latest
    needs: deploy-fly-prod
    if: vars.PROD_RUNNER_READY == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: agentsfleet-runner-linux-amd64
          path: dist

      - name: Extract runner binary
        run: tar -xzf dist/agentsfleet-runner-linux-amd64.tar.gz -C dist

      # The toolbox ships with the binary: a host without both refuses leases.
      - uses: actions/download-artifact@v8
        with:
          name: agentsfleet-runner-toolbox-amd64
          path: dist/toolbox

      - name: Load Tailscale credentials from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://${{ vars.VAULT_PROD }}/tailscale/oauth-client-id
          TS_OAUTH_SECRET: op://${{ vars.VAULT_PROD }}/tailscale/oauth-secret

      - name: Parse canary host from fleet config
        id: canary
        run: |
          vault_key="$(
            printf '%s' "$PROD_RUNNER_HOSTS" |
              jq -er '
                select(type == "array" and length > 0)
                | .[0].vault_key
                | select(type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              '
          )"
          echo "vault_key=$vault_key" >> "$GITHUB_OUTPUT"
        env:
          PROD_RUNNER_HOSTS: ${{ vars.PROD_RUNNER_HOSTS }}

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy and verify canary runner
        run: |
          ENV=prod \
          RUNNER_BINARY=dist/agentsfleet-runner-linux-amd64 \
          RUNNER_VERSION="${GITHUB_REF#refs/tags/}" \
            ./playbooks/lib/runner/deploy.sh
          ENV=prod \
            ./playbooks/lib/runner/verify.sh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
          RUNNER_ITEM: ${{ steps.canary.outputs.vault_key }}
          ALLOW_VAULT_READS: "1"

  # ── 8. Deploy: remaining fleet (with approval gate) ─────────────────────
  deploy-metal-fleet-prod:
    runs-on: ubuntu-latest
    needs: deploy-metal-canary-prod
    environment: production-fleet
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: agentsfleet-runner-linux-amd64
          path: dist

      - name: Extract runner binary
        run: tar -xzf dist/agentsfleet-runner-linux-amd64.tar.gz -C dist

      - uses: actions/download-artifact@v8
        with:
          name: agentsfleet-runner-toolbox-amd64
          path: dist/toolbox

      - name: Load Tailscale credentials from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://${{ vars.VAULT_PROD }}/tailscale/oauth-client-id
          TS_OAUTH_SECRET: op://${{ vars.VAULT_PROD }}/tailscale/oauth-secret

      - name: Join Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy remaining fleet sequentially
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PROD_RUNNER_HOSTS: ${{ vars.PROD_RUNNER_HOSTS }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
          ALLOW_VAULT_READS: "1"
        run: |
          printf '%s' "$PROD_RUNNER_HOSTS" | jq -e '
            type == "array" and
            length > 0 and
            all(.[].vault_key;
              type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
          ' >/dev/null
          mapfile -t runners < <(
            printf '%s' "$PROD_RUNNER_HOSTS" |
              jq -r '.[1:][] | .vault_key'
          )

          for runner in "${runners[@]}"; do
            echo "Deploying $runner"
            ENV=prod \
            RUNNER_ITEM="$runner" \
            RUNNER_BINARY=dist/agentsfleet-runner-linux-amd64 \
            RUNNER_VERSION="${GITHUB_REF#refs/tags/}" \
              ./playbooks/lib/runner/deploy.sh
            ENV=prod \
            RUNNER_ITEM="$runner" \
              ./playbooks/lib/runner/verify.sh
          done

  # ── Release verdict ──────────────────────────────────────────────────────
  # PROD had no Discord notification at all: every workflow but deploy-dev.yml
  # posted nothing, so a prod release succeeded or failed in silence. This is
  # the one message that says which.
  notify:
    runs-on: ubuntu-latest
    needs:
      - npm
      - create-release
      - deploy-fly-prod
      - deploy-metal-canary-prod
      - deploy-metal-fleet-prod
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Compose release verdict
        id: verdict
        env:
          NPM_RESULT: ${{ needs.npm.result }}
          RELEASE_RESULT: ${{ needs.create-release.result }}
          FLY_RESULT: ${{ needs.deploy-fly-prod.result }}
          CANARY_RESULT: ${{ needs.deploy-metal-canary-prod.result }}
          FLEET_RESULT: ${{ needs.deploy-metal-fleet-prod.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          LINE="npm: ${NPM_RESULT} | release: ${RELEASE_RESULT} | fly: ${FLY_RESULT} | canary: ${CANARY_RESULT} | fleet: ${FLEET_RESULT}"

          # A skipped metal stage is allowed — PROD_RUNNER_READY gates it, and
          # the fleet stage waits on a human approval that may not have landed.
          ok=1
          for r in "$NPM_RESULT" "$RELEASE_RESULT" "$FLY_RESULT"; do
            [ "$r" = success ] || ok=0
          done
          for r in "$CANARY_RESULT" "$FLEET_RESULT"; do
            case "$r" in success|skipped) ;; *) ok=0 ;; esac
          done

          if [ "$ok" = 1 ]; then
            STATUS=success
            MESSAGE="✅ PROD release \`$TAG\` shipped\\n$LINE"
          else
            STATUS=failure
            MESSAGE="❌ PROD release \`$TAG\` failed\\n$LINE\\nCheck: ${RUN_URL}"
          fi

          # printf, not echo: the \n markers must reach the action as literal
          # backslash-n for its printf %b to expand. echo's handling varies.
          printf 'status=%s\n' "$STATUS" >>"$GITHUB_OUTPUT"
          printf 'message=%s\n' "$MESSAGE" >>"$GITHUB_OUTPUT"

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ steps.verdict.outputs.status }}
          message: ${{ steps.verdict.outputs.message || '❌ PROD release verdict could not be computed — inspect the notify job' }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
          webhook-item: discord-release-webhook
