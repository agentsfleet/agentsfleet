name: warm-cache

# Pull requests restore Rust caches from the default branch, and the unit
# shards save only on it. No workflow ran a pull request's selections on main,
# so a new branch started every Rust lane from a cold cache. This job runs on
# main and compiles the unit shards' test binaries without executing them, so
# the shared `rustd-unit` cache is saved there for pull requests to restore.
#
# It compiles and never runs a test: a second test run on main buys nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm-rustd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show the pinned toolchain
        run: rustup show && rustc --version && cargo --version
        working-directory: rustd

      # The key must match test-unit-rustd.yml's shards, and save-if is always
      # true here: this job exists to save it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustd
          shared-key: rustd-unit
          save-if: true

      - name: Compile the unit shards' test binaries
        run: make build-test-unit-rustd

  # The integration shards and the kernel lane restore only the cargo registry
  # and git checkouts, which their own comments keep out of the target tree.
  # `cargo fetch` fills them without compiling anything, and the keys match the
  # ones test-integration-rustd.yml restores.
  warm-rustd-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show the pinned toolchain
        run: rustup show && cargo --version
        working-directory: rustd

      # Restore first: an exact hit means `cargo fetch` finds nothing to download.
      # On a miss the post step saves whatever `cargo fetch` added.
      - name: Restore the shards' registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-integration-v3-${{ runner.os }}-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}

      - name: Restore the kernel lane's registry cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-kernel-v1-${{ runner.os }}-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}

      - name: Fetch the locked dependencies
        run: cargo fetch --locked
        working-directory: rustd

  # The musl gate's fast-profile build, saved under the key test.yml restores.
  # It builds the same two binaries and stops there: the static check belongs to
  # the gate, and a second run of it on main buys nothing.
  warm-musl-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore and save the fast-profile musl cache
        uses: actions/cache@v6
        with:
          path: |
            .cargo-cache/registry
            .cargo-cache/git
            rustd/target
          key: cargo-fast-amd64-${{ hashFiles('rustd/Cargo.lock', 'rustd/rust-toolchain.toml') }}
          restore-keys: cargo-fast-amd64-

      - name: Build both binaries in the pinned builder (musl-native)
        run: |
          mkdir -p .cargo-cache/registry .cargo-cache/git rustd/target
          RUST_VERSION="$(sed -n 's/^RUST_VERSION=//p' playbooks/operations/ci_rust_images/versions.env)"
          ALPINE_SERIES="$(sed -n 's/^ALPINE_SERIES=//p' playbooks/operations/ci_rust_images/versions.env)"
          BUILDER="ghcr.io/agentsfleet/ci-rust-alpine:$RUST_VERSION-alpine$ALPINE_SERIES"
          docker run --rm \
            -v "$PWD:/w" \
            -v "$PWD/.cargo-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-cache/git:/usr/local/cargo/git" \
            -e GIT_COMMIT="${GITHUB_SHA::7}" \
            -w /w/rustd \
            "$BUILDER" \
            sh -c '
              set -e
              cargo build --profile fast-profile -p agentsfleetd --bin agentsfleetd
              cargo build --profile fast-profile -p agentsfleet_runner --bin agentsfleet-runner
            '
          sudo chown -R "$(id -u):$(id -g)" .cargo-cache rustd/target
