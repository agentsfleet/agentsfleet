name: deploy-dev / worker

# Called by deploy-dev.yml after build. Deploys the bare-metal DEV runner over
# Tailscale SSH, gated both directions: the host must prove cgroup capability
# BEFORE receiving a runner, and the freshly deployed daemon must prove its
# delegated subtree AFTER. Exposes the deploy job's result as an output so the
# caller's release verdict can distinguish success / skipped / failure — a
# reusable workflow whose only job skipped reads as success at the caller,
# which would erase the documented DEV_WORKER_READY skip from the verdict.

on:
  workflow_call:
    outputs:
      result:
        description: deploy-worker-dev job result (success | failure | cancelled | skipped)
        value: ${{ jobs.result.outputs.result }}

jobs:
  # ── 3. Deploy DEV worker to bare-metal via Tailscale SSH ─────────────────
  # Skips until zombie-dev-worker-ant bootstrap is complete (M4_001).
  # Enable by setting DEV_WORKER_READY=true in GitHub → Settings → Variables.
  deploy-worker-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.DEV_WORKER_READY == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: dev-binaries
          path: dist

      - name: Load DEV worker secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://${{ vars.VAULT_PROD }}/tailscale/oauth-client-id
          TS_OAUTH_SECRET: op://${{ vars.VAULT_PROD }}/tailscale/oauth-secret
          WORKER_ANT_SSH_KEY: op://${{ vars.VAULT_DEV }}/zombie-dev-worker-ant/ssh-private-key
          WORKER_ANT_HOST: op://${{ vars.VAULT_DEV }}/zombie-dev-worker-ant/tailscale-hostname
          WORKER_ANT_USER: op://${{ vars.VAULT_DEV }}/zombie-dev-worker-ant/deploy-user
          DISCORD_WEBHOOK_URL: op://${{ vars.VAULT_PROD }}/discord-ci-webhook/credential

      - name: Join Tailscale network
        # Non-expiring Tailscale OAuth client (replaces the static authkey that
        # hit Tailscale's 90-day cap). Mints an ephemeral tag:ci node per run.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Section 3 hard-fails on /opt/agentsfleet/.env, and Section 4 is the script that
      # writes it — so readiness gated on an artifact no CI step produced, and the job
      # could never pass on a host that had not been hand-provisioned. Idempotent:
      # re-running it rewrites the same env file from vault. It restarts an installed
      # runner, or defers startup to deploy.sh when the binary is not installed yet.
      - name: Provision runner env file from vault
        run: VAULT_DEV="${{ vars.VAULT_DEV }}" ./playbooks/founding/06_runner_bootstrap_dev/04_provision_runner_env.sh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # Runs BEFORE the deploy, and gates it: REQUIRE_HOST_CGROUP_CAPABILITY
      # checks the kernel's root controller set and system.slice's delegation —
      # both true with no runner running. A host that cannot enforce cpu/memory/
      # pids limits is refused here rather than receiving a runner that would
      # then execute leases with no limits at all.
      - name: Verify worker host readiness
        run: REQUIRE_HOST_CGROUP_CAPABILITY=1 VAULT_DEV="${{ vars.VAULT_DEV }}" ./playbooks/founding/06_runner_bootstrap_dev/03_deploy_readiness.sh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Deploy runner to bare-metal
        timeout-minutes: 8
        run: |
          ANT_KEY="$RUNNER_TEMP/dev-worker-ant.key"
          printf '%s\n' "$WORKER_ANT_SSH_KEY" > "$ANT_KEY"
          chmod 600 "$ANT_KEY"
          SSH="ssh -i $ANT_KEY -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          SCP="scp -i $ANT_KEY -o StrictHostKeyChecking=no -o ConnectTimeout=15"
          TARGET="${WORKER_ANT_USER}@${WORKER_ANT_HOST}"
          VERSION="dev-${GITHUB_SHA::7}"

          # Stage binaries, deploy script, and systemd units on the server
          $SSH "$TARGET" "mkdir -p /opt/agentsfleet/bin /opt/agentsfleet/deploy"
          $SCP dist/agentsfleet-runner-linux-amd64 "$TARGET:/opt/agentsfleet/bin/agentsfleet-runner"
          $SCP deploy/baremetal/deploy.sh     "$TARGET:/opt/agentsfleet/deploy/deploy.sh"
          $SCP deploy/baremetal/*.service     "$TARGET:/opt/agentsfleet/deploy/"
          $SSH "$TARGET" "chmod +x /opt/agentsfleet/deploy/deploy.sh /opt/agentsfleet/bin/*"

          # Log binary type and shared library deps for diagnostics
          $SSH "$TARGET" "file /opt/agentsfleet/bin/agentsfleet-runner && ldd /opt/agentsfleet/bin/agentsfleet-runner 2>&1 || true"

          # Write Discord webhook to server env file. deploy.sh sources this file
          # at startup so the value never appears in sudo's argument list and stays
          # out of ps/cmdline output. Cleanup runs in a separate always step below.
          $SSH "$TARGET" "printf 'DISCORD_WEBHOOK_URL=%s\n' '$DISCORD_WEBHOOK_URL' > /opt/agentsfleet/.discord-env && chmod 600 /opt/agentsfleet/.discord-env"

          # ── Diagnostics: verify sudo works without password prompt ──
          echo "::group::sudo diagnostics"
          $SSH "$TARGET" "echo 'ssh ok'; sudo -n true && echo 'sudo NOPASSWD ok' || echo 'FAIL: sudo requires password'"
          $SSH "$TARGET" "sudo -n id && echo 'sudo id ok' || echo 'FAIL: sudo -n id failed'"
          $SSH "$TARGET" "systemctl is-active agentsfleet-runner.service 2>&1 || echo 'runner: not active (first deploy?)'"
          echo "::endgroup::"

          # Deploy the runner. DRAIN_TIMEOUT=60 keeps drain within CI budget.
          # deploy.sh sources /opt/agentsfleet/.discord-env for DISCORD_WEBHOOK_URL.
          # NOTE: the runner needs the bootstrap pair in /etc/default/agentsfleet-runner:
          #   AGENTSFLEET_API_URL, AGENTSFLEET_RUNNER_TOKEN (a pre-minted agt_r; Option B)
          # — written by the "Provision runner env file from vault" step above
          # (playbooks/founding/06_runner_bootstrap_dev/04_provision_runner_env.sh),
          # which deploy.sh then copies from /opt/agentsfleet/.env on every run.
          # This job is enabled per repo variable DEV_WORKER_READY.
          echo ">>> deploying runner..."
          $SSH "$TARGET" \
            "sudo DRAIN_TIMEOUT=60 /opt/agentsfleet/deploy/deploy.sh runner $VERSION /opt/agentsfleet/bin/agentsfleet-runner"

      # The post-deploy half: the host was proven capable before the deploy, so a
      # failure here means the DAEMON did not enable its own delegated subtree.
      # It writes those controllers at startup, so this is a settled fact by the
      # time deploy.sh has reported the unit healthy — not a race with the first
      # heartbeat, which is what made this check flap before.
      - name: Verify delegated runner cgroup
        run: REQUIRE_RUNNER_CGROUP_DELEGATION=1 VAULT_DEV="${{ vars.VAULT_DEV }}" ./playbooks/founding/06_runner_bootstrap_dev/03_deploy_readiness.sh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Clean up Discord env file on server
        if: always()
        run: |
          ANT_KEY="$RUNNER_TEMP/dev-worker-ant.key"
          if [ -f "$ANT_KEY" ] && [ -n "${WORKER_ANT_USER:-}" ] && [ -n "${WORKER_ANT_HOST:-}" ]; then
            ssh -i "$ANT_KEY" -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              "${WORKER_ANT_USER}@${WORKER_ANT_HOST}" "rm -f /opt/agentsfleet/.discord-env" || true
          fi
          rm -f "$ANT_KEY"

  # Report the deploy job's result as a workflow output — runs even when the
  # deploy job skipped or failed, so the verdict never loses the distinction.
  result:
    runs-on: ubuntu-latest
    needs: deploy-worker-dev
    if: always()
    outputs:
      result: ${{ needs.deploy-worker-dev.result }}
    steps:
      - name: Record worker result
        run: echo "deploy-worker-dev result = ${{ needs.deploy-worker-dev.result }}"
