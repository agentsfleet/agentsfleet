name: deploy-dev / metal

# Called by deploy-dev.yml after build. Deploys the bare-metal development
# runner over Tailscale Secure Shell (SSH), gated both directions: the host
# must prove cgroup capability before receiving a runner, and the freshly
# deployed daemon must prove its delegated subtree after. Exposes the deploy
# job's result as an output so the
# caller's release verdict can distinguish success / skipped / failure — a
# reusable workflow whose only job skipped reads as success at the caller,
# which would erase the documented DEV_RUNNER_READY skip from the verdict.

on:
  workflow_call:
    inputs:
      build-commit:
        description: Original seven-character revision compiled into the runner.
        type: string
        required: true
    outputs:
      result:
        description: deploy-metal job result (success | failure | cancelled | skipped)
        value: ${{ jobs.result.outputs.result }}

jobs:
  # ── 3. Deploy the development runner to bare metal via Tailscale SSH ─────
  # Enable after agentsfleet-dev-runner-ant is prepared and registered.
  deploy-metal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.DEV_RUNNER_READY == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-binary
          path: dist

      # The toolbox is staged beside the binary: the runner admits it at boot
      # and refuses every lease until one is admitted.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-toolbox
          path: dist/toolbox

      - name: Load Tailscale credentials from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          TS_OAUTH_CLIENT_ID: op://${{ vars.VAULT_PROD }}/tailscale/oauth-client-id
          TS_OAUTH_SECRET: op://${{ vars.VAULT_PROD }}/tailscale/oauth-secret
          RUNNER_STREAM_CA_CERTIFICATE: op://${{ vars.VAULT_DEV }}/agentsfleet-runner-stream/ca-certificate
          RUNNER_STREAM_SERVER_NAME: op://${{ vars.VAULT_DEV }}/agentsfleet-runner-stream/server-name
          RUNNER_STREAM_WIREGUARD_CONFIG: op://${{ vars.VAULT_DEV }}/agentsfleet-runner-stream/wireguard-config

      - name: Join Tailscale network
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy runner
        run: |
          [[ "$CANDIDATE_BUILD_COMMIT" =~ ^[0-9a-f]{7}$ ]]
          RUNNER_BINARY=dist/agentsfleet-runner-linux-amd64 \
          RUNNER_VERSION="dev-$CANDIDATE_BUILD_COMMIT" \
            ./playbooks/founding/05_runner_bootstrap_dev/deploy.sh
        env:
          CANDIDATE_BUILD_COMMIT: ${{ inputs.build-commit }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_DEV: ${{ vars.VAULT_DEV }}
          ALLOW_VAULT_READS: "1"

      - name: Verify runner
        run: ./playbooks/founding/05_runner_bootstrap_dev/00_gate.sh
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_DEV: ${{ vars.VAULT_DEV }}
          ALLOW_VAULT_READS: "1"

  # Report the deploy job's result as a workflow output — runs even when the
  # deploy job skipped or failed, so the verdict never loses the distinction.
  result:
    runs-on: ubuntu-latest
    needs: deploy-metal
    if: always()
    outputs:
      result: ${{ needs.deploy-metal.result }}
    steps:
      - name: Record metal result
        run: echo "deploy-metal result = ${{ needs.deploy-metal.result }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner deploy used to announce itself from the target host, via a
      # webhook file the workflow wrote there. A merge dropped the step that
      # wrote it and the host-side notifier failed silent, so this went quiet
      # for weeks. Notifying from here keeps the webhook off the runner box.
      # A skipped deploy still reports, because DEV_RUNNER_READY=false looking
      # identical to a broken deploy is what makes silence dangerous.
      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ needs.deploy-metal.result }}
          message: >-
            ${{ needs.deploy-metal.result == 'success'
            && format('✅ DEV agentsfleet-runner deployed — `dev-{0}`', inputs.build-commit)
            || format('❌ DEV agentsfleet-runner deploy {0} — `dev-{1}`\nCheck: {2}/{3}/actions/runs/{4}', needs.deploy-metal.result, inputs.build-commit, github.server_url, github.repository, github.run_id) }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
