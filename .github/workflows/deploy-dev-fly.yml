name: deploy-dev / fly

# Called by deploy-dev.yml after build. Stages vault secrets onto the Fly app,
# deploys agentsfleetd-dev using the selected candidate's immutable digest.

on:
  workflow_call:
    inputs:
      image:
        description: Verified candidate image by digest.
        type: string
        required: true
    outputs:
      result:
        description: deploy-fly job result (success | failure | cancelled | skipped)
        value: ${{ jobs.result.outputs.result }}

jobs:
  # ── 2. Deploy to Fly.io DEV ─────────────────────────────────────────────
  deploy-fly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The collector hop. The daemon's OTLP endpoint points HERE, and the
    # collector holds the Grafana Cloud credentials and forwards. Named at job
    # scope because the address is read by the daemon's staged secret and the
    # app name by the collector's own deploy, and a repoint that updated one
    # spelling and not the other would send telemetry to an app that is not
    # listening.
    env:
      OTLP_COLLECTOR_APP: otelcol-dev
      OTLP_COLLECTOR_DIR: deploy/fly/otelcol-dev
      OTLP_COLLECTOR_MACHINES: "1"
      OTLP_COLLECTOR_ENDPOINT: http://otelcol-dev.internal:4318
      # The event bus (M244 §8): core NATS, two nodes, no volume. Its build
      # context is its own directory; the image copies nothing.
      # Fly app names are global across every organisation, and `nats-dev` is
      # held elsewhere, so the app carries the product prefix.
      NATS_APP: agentsfleet-nats-dev
      NATS_BUILD_CONTEXT: deploy/fly/nats-dev
      NATS_CONFIG: deploy/fly/nats-dev/fly.toml
      NATS_MACHINES: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://${{ vars.VAULT_DEV }}/fly-api-token/credential
          DATABASE_URL_API: op://${{ vars.VAULT_DEV }}/planetscale-dev/api-connection-string
          DATABASE_URL_MIGRATOR: op://${{ vars.VAULT_DEV }}/planetscale-dev/migrator-connection-string
          NATS_URL: op://${{ vars.VAULT_DEV }}/nats-dev/api-url
          ENCRYPTION_MASTER_KEY: op://${{ vars.VAULT_DEV }}/encryption-master-key/credential
          RUNNER_STREAM_CERTIFICATE_CHAIN: op://${{ vars.VAULT_DEV }}/agentsfleet-runner-stream/certificate-chain
          RUNNER_STREAM_PRIVATE_KEY: op://${{ vars.VAULT_DEV }}/agentsfleet-runner-stream/private-key
          AUTH_SESSION_CODE_PEPPER: op://${{ vars.VAULT_DEV }}/auth-session-code-pepper/credential
          APPROVAL_SIGNING_SECRET: op://${{ vars.VAULT_DEV }}/approval-signing-secret/credential
          POSTHOG_API_KEY: op://${{ vars.VAULT_DEV }}/posthog-dev/credential
          CLERK_PUBLISHABLE_KEY: op://${{ vars.VAULT_DEV }}/clerk-dev/publishable-key
          CLERK_SECRET_KEY: op://${{ vars.VAULT_DEV }}/clerk-dev/secret-key
          CLERK_WEBHOOK_SECRET: op://${{ vars.VAULT_DEV }}/clerk-dev/webhook-secret
          GRAFANA_OTLP_ENDPOINT: op://${{ vars.VAULT_DEV }}/grafana-dev/otlp-endpoint
          GRAFANA_OTLP_INSTANCE_ID: op://${{ vars.VAULT_DEV }}/grafana-dev/instance-id
          GRAFANA_OTLP_API_KEY: op://${{ vars.VAULT_DEV }}/grafana-dev/api-key
          OIDC_ISSUER: op://${{ vars.VAULT_DEV }}/clerk-dev/issuer
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master, 2026-04-08
      - name: Ensure the OTLP collector is running
        # The collector must be serving BEFORE the daemon's endpoint is
        # repointed at it, or the first export after the next deploy lands
        # nowhere. Same shape as the cloudflared tunnel step in
        # deploy-dev-verify.yml: sync secrets from the vault, then restart or
        # deploy from scratch.
        #
        # The three GRAFANA_OTLP_* values staged here are the COLLECTOR's
        # upstream credentials — the real Grafana Cloud endpoint and its Basic
        # auth pair. The daemon keeps its own copy of the pair but no longer
        # reaches Grafana with them; it reaches this app, which ignores the
        # inbound header and re-authenticates upstream with these.
        #
        # scripts/ensure_fly_app.sh refuses rather than falling through: a
        # collector that is not serving takes every dashboard dark at the next
        # daemon deploy. That is also why the block is a script — it was inline
        # in both workflows, and the two copies drifted into real defects.
        run: |
          # The app must exist before secrets can be set on it. `--create-only`
          # creates without deploying, which is the ordering Dimension 0.2
          # shipped the flag for: the secrets step below runs FIRST and fails
          # on an app that was never created.
          bash scripts/ensure_fly_app.sh --create-only "$OTLP_COLLECTOR_APP"
          flyctl secrets set \
            GRAFANA_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT" \
            GRAFANA_OTLP_INSTANCE_ID="$GRAFANA_OTLP_INSTANCE_ID" \
            GRAFANA_OTLP_API_KEY="$GRAFANA_OTLP_API_KEY" \
            OTLP_INGEST_USER="$GRAFANA_OTLP_INSTANCE_ID" \
            OTLP_INGEST_PASSWORD="$GRAFANA_OTLP_API_KEY" \
            --app "$OTLP_COLLECTOR_APP"
          bash scripts/ensure_fly_app.sh \
            "$OTLP_COLLECTOR_APP" "$OTLP_COLLECTOR_DIR" "$OTLP_COLLECTOR_MACHINES"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_ORG: agentsfleet-dev

      - name: Ensure the NATS cluster is serving
        # BEFORE the daemon deploys: boot refuses, as UZ-STARTUP-004, a bus no
        # seed answers for, so a daemon deployed first would crash-loop.
        #
        # The nodes take their password from the same item the daemon dials
        # with, so it is staged here before the app's first deploy applies it.
        run: |
          bash scripts/ensure_fly_app.sh --create-only "$NATS_APP"
          flyctl secrets set NATS_URL="$NATS_URL" --stage --app "$NATS_APP"
          bash scripts/ensure_fly_app.sh \
            "$NATS_APP" "$NATS_BUILD_CONTEXT" "$NATS_MACHINES" "$NATS_CONFIG"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
          FLY_ORG: agentsfleet-dev

      - name: Stage Fly secrets from vault (applied on next deploy)
        run: |
          # The collector's ingest credential, as the standard header the daemon
          # reads. Masked before use: GitHub masks the vault pair, not this
          # encoding of it.
          otlp_ingest="$(printf '%s:%s' "$GRAFANA_OTLP_INSTANCE_ID" "$GRAFANA_OTLP_API_KEY" | base64 | tr -d '\n')"
          echo "::add-mask::$otlp_ingest"
          stream_chain="$(printf '%s' "$RUNNER_STREAM_CERTIFICATE_CHAIN" | base64 | tr -d '\n')"
          stream_key="$(printf '%s' "$RUNNER_STREAM_PRIVATE_KEY" | base64 | tr -d '\n')"
          echo "::add-mask::$stream_chain"
          echo "::add-mask::$stream_key"
          flyctl secrets set \
            AGENTSFLEET_LOG_LEVEL="info" \
            DATABASE_URL_API="$DATABASE_URL_API" \
            DATABASE_URL_MIGRATOR="$DATABASE_URL_MIGRATOR" \
            NATS_URL="$NATS_URL" \
            ENCRYPTION_MASTER_KEY="$ENCRYPTION_MASTER_KEY" \
            RUNNER_STREAM_TLS_CERT_BASE64="$stream_chain" \
            RUNNER_STREAM_TLS_KEY_BASE64="$stream_key" \
            AUTH_SESSION_CODE_PEPPER="$AUTH_SESSION_CODE_PEPPER" \
            APPROVAL_SIGNING_SECRET="$APPROVAL_SIGNING_SECRET" \
            POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            CLERK_WEBHOOK_SECRET="$CLERK_WEBHOOK_SECRET" \
            OIDC_ISSUER="$OIDC_ISSUER" \
            OIDC_PROVIDER="clerk" \
            OIDC_AUDIENCE="https://api-dev.agentsfleet.net" \
            OTEL_EXPORTER_OTLP_ENDPOINT="$OTLP_COLLECTOR_ENDPOINT" \
            OTEL_EXPORTER_OTLP_HEADERS="Authorization=Basic $otlp_ingest" \
            --stage \
            --app "${{ vars.FLY_APP_DEV }}"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}

      - name: Validate the selected immutable image
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
        run: '[[ "$CANDIDATE_IMAGE" =~ ^ghcr\.io/agentsfleet/agentsfleetd@sha256:[0-9a-f]{64}$ ]]'

      - name: Deploy agentsfleetd-dev
        run: |
          IMAGE="$CANDIDATE_IMAGE"
          echo "Deploying immutable image: $IMAGE"
          if ! python3 scripts/deploy_fly.py --app "${{ vars.FLY_APP_DEV }}" --image "$IMAGE" --config deploy/fly/agentsfleetd-dev/fly.toml --wait-timeout 120; then
            APP="${{ vars.FLY_APP_DEV }}"
            echo "Fly deploy failed; collecting diagnostics for ${APP}..."
            flyctl status --app "${APP}" || true
            echo "Fly releases:"
            flyctl releases --app "${APP}" || true
            echo "Fly logs (bounded to 30s):"
            timeout 30s flyctl logs --app "${APP}" || true
            exit 1
          fi
        env:
          CANDIDATE_IMAGE: ${{ inputs.image }}
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}

      # always(): the point of this notification is the deploy that failed.
      # job.status is read after the deploy step, so it carries that verdict.
      - name: Notify Discord
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ job.status }}
          message: >-
            ${{ job.status == 'success'
            && format('✅ DEV agentsfleetd deployed — `{0}` @ `{1}`', vars.FLY_APP_DEV, github.sha)
            || format('❌ DEV agentsfleetd deploy {0} — `{1}` @ `{2}`\nCheck: {3}/{4}/actions/runs/{5}', job.status, vars.FLY_APP_DEV, github.sha, github.server_url, github.repository, github.run_id) }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}

  # Same shape as build and metal: the caller's verdict reads this rather than
  # inferring a Fly failure from a downstream stage that never ran.
  result:
    runs-on: ubuntu-latest
    needs: deploy-fly
    if: always()
    outputs:
      result: ${{ needs.deploy-fly.result }}
    steps:
      - name: Record fly result
        run: echo "deploy-fly result = ${{ needs.deploy-fly.result }}"
