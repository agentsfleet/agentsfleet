name: deploy-dev / fly

# Called by deploy-dev.yml after build. Stages vault secrets onto the Fly app,
# resolves the immutable dev-latest digest, and deploys agentsfleetd-dev.

on:
  workflow_call:

jobs:
  # ── 2. Deploy to Fly.io DEV ─────────────────────────────────────────────
  deploy-fly-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          FLY_API_TOKEN: op://${{ vars.VAULT_DEV }}/fly-api-token/credential
          DATABASE_URL_API: op://${{ vars.VAULT_DEV }}/planetscale-dev/api-connection-string
          DATABASE_URL_MIGRATOR: op://${{ vars.VAULT_DEV }}/planetscale-dev/migrator-connection-string
          REDIS_URL_API: op://${{ vars.VAULT_DEV }}/upstash-dev/api-url
          ENCRYPTION_MASTER_KEY: op://${{ vars.VAULT_DEV }}/encryption-master-key/credential
          AUTH_SESSION_CODE_PEPPER: op://${{ vars.VAULT_DEV }}/auth-session-code-pepper/credential
          APPROVAL_SIGNING_SECRET: op://${{ vars.VAULT_DEV }}/approval-signing-secret/credential
          AUDIT_LOG_PEPPER: op://${{ vars.VAULT_DEV }}/audit-log-pepper/credential
          POSTHOG_API_KEY: op://${{ vars.VAULT_DEV }}/posthog-dev/credential
          CLERK_PUBLISHABLE_KEY: op://${{ vars.VAULT_DEV }}/clerk-dev/publishable-key
          CLERK_SECRET_KEY: op://${{ vars.VAULT_DEV }}/clerk-dev/secret-key
          CLERK_WEBHOOK_SECRET: op://${{ vars.VAULT_DEV }}/clerk-dev/webhook-secret
          GRAFANA_OTLP_ENDPOINT: op://${{ vars.VAULT_DEV }}/grafana-dev/otlp-endpoint
          GRAFANA_OTLP_INSTANCE_ID: op://${{ vars.VAULT_DEV }}/grafana-dev/instance-id
          GRAFANA_OTLP_API_KEY: op://${{ vars.VAULT_DEV }}/grafana-dev/api-key
          PLATFORM_ADMIN_WORKSPACE_ID: op://${{ vars.VAULT_DEV }}/agentsfleet-admin/platform_admin_workspace_id
          OIDC_ISSUER: op://${{ vars.VAULT_DEV }}/clerk-dev/issuer
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stage Fly secrets from vault (applied on next deploy)
        run: |
          flyctl secrets set \
            LOG_LEVEL="debug" \
            DATABASE_URL_API="$DATABASE_URL_API" \
            DATABASE_URL_MIGRATOR="$DATABASE_URL_MIGRATOR" \
            REDIS_URL_API="$REDIS_URL_API" \
            ENCRYPTION_MASTER_KEY="$ENCRYPTION_MASTER_KEY" \
            AUTH_SESSION_CODE_PEPPER="$AUTH_SESSION_CODE_PEPPER" \
            APPROVAL_SIGNING_SECRET="$APPROVAL_SIGNING_SECRET" \
            AUDIT_LOG_PEPPER="$AUDIT_LOG_PEPPER" \
            POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" \
            CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
            CLERK_WEBHOOK_SECRET="$CLERK_WEBHOOK_SECRET" \
            PLATFORM_ADMIN_WORKSPACE_ID="$PLATFORM_ADMIN_WORKSPACE_ID" \
            OIDC_ISSUER="$OIDC_ISSUER" \
            OIDC_PROVIDER="clerk" \
            OIDC_AUDIENCE="https://api-dev.agentsfleet.net" \
            GRAFANA_OTLP_ENDPOINT="$GRAFANA_OTLP_ENDPOINT" \
            GRAFANA_OTLP_INSTANCE_ID="$GRAFANA_OTLP_INSTANCE_ID" \
            GRAFANA_OTLP_API_KEY="$GRAFANA_OTLP_API_KEY" \
            --stage \
            --app "${{ vars.FLY_APP_DEV }}"
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}

      - name: Resolve dev-latest digest
        id: digest
        # Deploy the IMMUTABLE digest, never the mutable :dev-latest tag. Fly
        # caches the tag -> image-id mapping on its side and can redeploy a stale
        # (old) image even after push-dev publishes a new one — the exact failure
        # that crash-looped agentsfleetd-dev on an old binary. The caller's build
        # stage has already pushed, so dev-latest in GHCR points at this run's image.
        run: |
          # Bounded retry: GHCR's package-versions API can lag a few seconds
          # behind push-dev moving the tag, so a single lookup may transiently
          # return empty for an image that pushed fine. Retry before failing.
          DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            DIGEST=$(gh api "/orgs/${{ github.repository_owner }}/packages/container/agentsfleetd/versions" \
              --jq '[.[] | select(.metadata.container.tags[]? == "dev-latest")][0].name')
            if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then break; fi
            echo "dev-latest not yet indexed by GHCR (attempt $attempt/6); retrying in 5s..."
            sleep 5
          done
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "FAIL: could not resolve dev-latest digest from GHCR after retries"; exit 1
          fi
          echo "dev-latest -> $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy agentsfleetd-dev
        run: |
          IMAGE="ghcr.io/agentsfleet/agentsfleetd@${{ steps.digest.outputs.digest }}"
          echo "Deploying immutable image: $IMAGE"
          if ! flyctl deploy --app "${{ vars.FLY_APP_DEV }}" --image "$IMAGE" --config deploy/fly/agentsfleetd-dev/fly.toml --wait-timeout 120; then
            APP="${{ vars.FLY_APP_DEV }}"
            echo "Fly deploy failed; collecting diagnostics for ${APP}..."
            flyctl status --app "${APP}" || true
            echo "Fly releases:"
            flyctl releases --app "${APP}" || true
            echo "Fly logs (bounded to 30s):"
            timeout 30s flyctl logs --app "${APP}" || true
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
