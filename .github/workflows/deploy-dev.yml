name: deploy (dev)

# A clean rebuild runs twice: first with DEV_WORKER_READY=false for the control
# plane, then with it true after the runner bootstrap.
#
# This file is the job graph only. Each stage's jobs live in a called
# workflow (deploy-dev-*.yml) so every file stays within the repository's
# 350-line bound and a stage can be read and reviewed on its own:
#   deploy-dev-build.yml       compile-dev + push-dev
#   deploy-dev-fly.yml         deploy-fly-dev
#   deploy-dev-worker.yml      deploy-worker-dev (+ result output)
#   deploy-dev-verify.yml      verify-dev
#   deploy-dev-acceptance.yml  qa-dev + acceptance-e2e-dev + cli-acceptance-dev
#                              (+ per-gate result outputs)
# Invariants preserved from the single-file shape: the credential gate blocks
# everything; worker and Fly always ship together (worker needs build, so a
# failed image push updates neither); verify waits only on Fly; the release
# gates wait on the worker too, because they grade the runner it deploys; the
# verdict
# keeps per-gate granularity and treats a skipped or cancelled release gate as
# red, with deploy-worker-dev allowed its documented DEV_WORKER_READY skip.
# Worker additionally needs Fly — see the note on the worker job for why its
# own readiness gate cannot run while the API is still cycling.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ── 0. Credential gate — initial development inputs must exist ──────────
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: 1password/install-cli-action@v3

      - name: Check vault credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_DEV: ${{ vars.VAULT_DEV }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
        run: ENV=dev STAGE=deployment ./playbooks/founding/02_preflight/00_gate.sh

  # ── 1. Compile + push dev-latest ────────────────────────────────────────
  build:
    needs: check-credentials
    uses: ./.github/workflows/deploy-dev-build.yml
    secrets: inherit

  # ── 2. Deploy to Fly.io development environment ─────────────────────────
  fly:
    needs: build
    uses: ./.github/workflows/deploy-dev-fly.yml
    secrets: inherit

  # ── 3. Deploy development worker via Tailscale Secure Shell (SSH) ───────
  # needs build so the bare-metal worker and Fly.io API always move together:
  # if the Docker push fails the worker binary is not updated either, keeping
  # the development environment consistent.
  #
  # needs fly because this lane does not stop at deploying: its own gate
  # (`playbooks/lib/runner/verify.sh`, verify_control_plane) curls the API's
  # /readyz *from the runner host*. Run alongside fly and that curl lands
  # mid-cycle and answers 502, failing a worker that deployed fine. The
  # production lane already orders it this way — release.yml's
  # deploy-worker-canary-prod needs deploy-fly-prod.
  worker:
    needs: [build, fly]
    uses: ./.github/workflows/deploy-dev-worker.yml
    secrets: inherit

  # ── 4. Wait for the Fly development environment to go green ─────────────
  verify:
    needs: fly
    uses: ./.github/workflows/deploy-dev-verify.yml
    secrets: inherit

  # ── 5. Release gates: quality assurance (QA) smoke + acceptance suites ──
  # Waits on WORKER as well as verify. The acceptance suites steer real fleets,
  # so they measure the bare-metal runner's behaviour, not just the API's — and
  # `worker` is a parallel branch of the graph. Ordering was previously left to
  # luck: on the run that surfaced this, the worker deploy finished ten seconds
  # before the suites started. A slower deploy and the suites grade the PREVIOUS
  # runner, reporting a fixed fault as still broken (or a broken one as fixed).
  # A documented `DEV_WORKER_READY=false` skip still lets this run: the called
  # workflow's `result` job is `if: always()`, so a skipped deploy concludes
  # success. A FAILED worker deploy skips these gates, which the verdict below
  # already reads as red — the honest reading, since nothing was measured.
  acceptance:
    needs: [verify, worker]
    uses: ./.github/workflows/deploy-dev-acceptance.yml
    secrets: inherit

  # ── 6. Discord notify ────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [acceptance, worker]
    if: always()
    steps:
      - uses: actions/checkout@v6

      # One verdict, every gate. Green requires qa-dev, acceptance-e2e-dev,
      # and cli-acceptance-dev to be "success". A skipped or canceled
      # release-critical job is red, with deploy-worker-dev allowed its
      # documented DEV_WORKER_READY skip. Results arrive as called-workflow
      # outputs; an upstream failure that skipped a whole stage leaves an
      # output empty, which the verdict reads as skipped — still red.
      - name: Compose release verdict
        id: verdict
        env:
          QA_RESULT: ${{ needs.acceptance.outputs.qa }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.outputs.acceptance }}
          CLI_RESULT: ${{ needs.acceptance.outputs.cli }}
          WORKER_RESULT: ${{ needs.worker.outputs.result }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          QA_RESULT="${QA_RESULT:-skipped}"
          ACCEPTANCE_RESULT="${ACCEPTANCE_RESULT:-skipped}"
          CLI_RESULT="${CLI_RESULT:-skipped}"
          WORKER_RESULT="${WORKER_RESULT:-skipped}"
          for entry in "qa-dev=$QA_RESULT" "acceptance-e2e-dev=$ACCEPTANCE_RESULT" "cli-acceptance-dev=$CLI_RESULT" "deploy-worker-dev=$WORKER_RESULT"; do
            echo "dev_release_acceptance_summary job=${entry%%=*} result=${entry#*=} commit=$SHORT_SHA"
          done

          if [ "$QA_RESULT" = success ] && [ "$ACCEPTANCE_RESULT" = success ] && [ "$CLI_RESULT" = success ] \
            && { [ "$WORKER_RESULT" = success ] || [ "$WORKER_RESULT" = skipped ]; }; then
            STATUS=success
            MESSAGE="✅ DEV deploy green — \`$REF_NAME\` @ \`$SHORT_SHA\`\\nQA: passed | acceptance-e2e: passed | cli-acceptance: passed | worker: ${WORKER_RESULT}\\n→ ready for tag release"
          else
            STATUS=failure
            MESSAGE="❌ DEV deploy not releasable — \`$REF_NAME\` @ \`$SHORT_SHA\`\\nQA: ${QA_RESULT} | acceptance-e2e: ${ACCEPTANCE_RESULT} | cli-acceptance: ${CLI_RESULT} | worker: ${WORKER_RESULT}\\nCheck: ${RUN_URL}"
          fi

          echo "status=$STATUS" >>"$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >>"$GITHUB_OUTPUT"

      - name: Notify Discord
        # always(): a verdict-step failure must still produce a red
        # notification — a silently absent message is the worst possible
        # outcome for a release gate. The message falls back rather than
        # going out empty.
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ steps.verdict.outputs.status }}
          message: ${{ steps.verdict.outputs.message || '❌ DEV deploy verdict could not be computed — inspect the notify job' }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
