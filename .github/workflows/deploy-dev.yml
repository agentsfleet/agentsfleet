name: deploy (dev)

# Deployment runs twice: first with DEV_RUNNER_READY=false for the control
# plane, then with it true after the runner bootstrap.
#
# This file is the job graph only. Each stage's jobs live in a called
# workflow (deploy-dev-*.yml) so every file stays within the repository's
# 350-line bound and a stage can be read and reviewed on its own:
#   deploy-dev-build.yml       verify + sign + promote prebuilt images
#   deploy-dev-fly.yml         deploy-fly
#   deploy-dev-metal.yml      deploy-metal (+ result output)
#   deploy-dev-verify.yml      verify
#   deploy-dev-acceptance.yml  qa + acceptance-e2e + acceptance-cli
#                              (+ per-gate result outputs)
# Invariants preserved from the single-file shape: the credential gate blocks
# everything; metal and Fly always ship together (metal needs build, so a
# failed image push updates neither); verify waits only on Fly; the release
# gates wait on metal too, because they grade the runner it deploys; the
# verdict
# keeps per-gate granularity and treats a skipped or cancelled release gate as
# red, with deploy-metal allowed its documented DEV_RUNNER_READY skip.
# Metal additionally needs Fly — see the note on the metal job for why its
# own readiness gate cannot run while the API is still cycling.

# Automatic on merge to main. Promotion requires a successful PR candidate
# whose full source tree matches this merge. No candidate means failure;
# deployment does not silently compile replacement artifacts.
# workflow_dispatch redeploys the selected tree through the same verification.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  # ── 0. Credential gate — initial development inputs must exist ──────────
  check-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: 1password/install-cli-action@v4

      - name: Check vault credentials
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VAULT_DEV: ${{ vars.VAULT_DEV }}
          VAULT_PROD: ${{ vars.VAULT_PROD }}
        run: ENV=dev STAGE=deployment ./playbooks/founding/02_preflight/00_gate.sh

  # ── 1. Verify and promote the PR candidate ─────────────────────────────
  build:
    needs: check-credentials
    uses: ./.github/workflows/deploy-dev-build.yml
    secrets: inherit

  # ── 2. Deploy to Fly.io development environment ─────────────────────────
  fly:
    needs: build
    uses: ./.github/workflows/deploy-dev-fly.yml
    with:
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  # ── 3. Deploy the development runner to bare metal via Tailscale SSH ────
  # needs build so the bare-metal runner and Fly.io API always move together:
  # if the Docker push fails the runner binary is not updated either, keeping
  # the development environment consistent.
  #
  # needs fly because this lane does not stop at deploying: its own gate
  # (`playbooks/lib/runner/verify.sh`, verify_control_plane) curls the API's
  # /readyz *from the runner host*. Run alongside fly and that curl lands
  # mid-cycle and answers 502, failing a runner that deployed fine. The
  # production lane already orders it this way — release.yml's
  # deploy-metal-canary-prod needs deploy-fly-prod.
  metal:
    needs: [build, fly]
    uses: ./.github/workflows/deploy-dev-metal.yml
    with:
      build-commit: ${{ needs.build.outputs.build-commit }}
    secrets: inherit

  # Build, deploy, and retain the same dashboard and command-line outputs
  # whose identities acceptance checks alongside the native component builds.
  dashboard:
    needs: [build, fly]
    uses: ./.github/workflows/deploy-dev-dashboard.yml
    secrets: inherit

  # ── 4. Wait for the Fly development environment to go green ─────────────
  verify:
    needs: [fly, build]
    uses: ./.github/workflows/deploy-dev-verify.yml
    with:
      build-commit: ${{ needs.build.outputs.build-commit }}
      version: ${{ needs.build.outputs.version }}
    secrets: inherit

  # ── 5. Release gates: quality assurance (QA) smoke + acceptance suites ──
  # Waits on METAL as well as verify. The acceptance suites steer real fleets,
  # so they measure the bare-metal runner's behaviour, not just the API's — and
  # `metal` is a parallel branch of the graph. Ordering was previously left to
  # luck: on the run that surfaced this, the runner deploy finished ten seconds
  # before the suites started. A slower deploy and the suites grade the PREVIOUS
  # runner, reporting a fixed fault as still broken (or a broken one as fixed).
  # A documented `DEV_RUNNER_READY=false` skip still lets this run: the called
  # workflow's `result` job is `if: always()`, so a skipped deploy concludes
  # success. A FAILED runner deploy skips these gates, which the verdict below
  # already reads as red — the honest reading, since nothing was measured.
  acceptance:
    needs: [verify, metal, dashboard]
    uses: ./.github/workflows/deploy-dev-acceptance.yml
    secrets: inherit

  # Only actual runner + dashboard + acceptance success qualifies a release.
  # The documented bootstrap skip can deploy control-plane components but
  # deliberately cannot produce a development-qualified candidate.
  qualify-candidate:
    needs: [build, fly, metal, dashboard, verify, acceptance]
    if: >-
      needs.fly.outputs.result == 'success' && needs.metal.outputs.result == 'success' &&
      needs.dashboard.result == 'success' && needs.verify.result == 'success' &&
      needs.acceptance.outputs.qa == 'success' && needs.acceptance.outputs.acceptance == 'success' &&
      needs.acceptance.outputs.cli == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: promoted-candidate
          path: dist/candidate
      - name: Record the verified candidate and actual development gate results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_FLY: ${{ needs.fly.outputs.result }}
          GATE_METAL: ${{ needs.metal.outputs.result }}
          GATE_DASHBOARD: ${{ needs.dashboard.result }}
          GATE_VERIFY: ${{ needs.verify.result }}
          GATE_QA: ${{ needs.acceptance.outputs.qa }}
          GATE_ACCEPTANCE: ${{ needs.acceptance.outputs.acceptance }}
          GATE_CLI: ${{ needs.acceptance.outputs.cli }}
        id: identity
        run: make candidate-qualify
      - uses: actions/upload-artifact@v7
        with:
          name: development-candidate-${{ steps.identity.outputs.tree }}
          path: dist/candidate
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # ── 6. Discord notify ────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [build, fly, acceptance, metal, dashboard, qualify-candidate]
    if: always()
    steps:
      - uses: actions/checkout@v7

      # Green requires qa, short acceptance-e2e and acceptance-cli to succeed.
      # Indy deferred ten-fleet acceptance to a manual run after merge.
      # A skipped or canceled
      # release-critical job is red, with deploy-metal allowed its
      # documented DEV_RUNNER_READY skip. Results arrive as called-workflow
      # outputs; an upstream failure that skipped a whole stage leaves an
      # output empty, which the verdict reads as skipped — still red.
      #
      # The build and Fly stages are REPORTED but not re-judged. They already
      # decide the verdict transitively: nothing downstream can pass if the
      # image never pushed or Fly never went green, so the acceptance outputs
      # come back empty and the verdict is red on their account. What was
      # missing was WHICH stage broke — a build failure read as four bare
      # skips and sent the reader to the run log to find out why. These lines
      # answer that in the message itself; they deliberately do not change
      # what counts as green.
      - name: Compose release verdict
        id: verdict
        env:
          RUNNER_BUILD: ${{ needs.build.outputs.runner }}
          TOOLBOX_BUILD: ${{ needs.build.outputs.toolbox }}
          DAEMON_BUILD: ${{ needs.build.outputs.daemon }}
          GHCR_RESULT: ${{ needs.build.outputs.ghcr }}
          QUALIFICATION_RESULT: ${{ needs.qualify-candidate.result }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          FLY_RESULT: ${{ needs.fly.outputs.result }}
          QA_RESULT: ${{ needs.acceptance.outputs.qa }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.outputs.acceptance }}
          CLI_RESULT: ${{ needs.acceptance.outputs.cli }}
          TEN_FLEETS_RESULT: deferred-manual-by-Indy
          METAL_RESULT: ${{ needs.metal.outputs.result }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          RUNNER_BUILD="${RUNNER_BUILD:-skipped}"
          TOOLBOX_BUILD="${TOOLBOX_BUILD:-skipped}"
          DAEMON_BUILD="${DAEMON_BUILD:-skipped}"
          GHCR_RESULT="${GHCR_RESULT:-skipped}"
          FLY_RESULT="${FLY_RESULT:-skipped}"
          DASHBOARD_RESULT="${DASHBOARD_RESULT:-skipped}"
          QA_RESULT="${QA_RESULT:-skipped}"
          ACCEPTANCE_RESULT="${ACCEPTANCE_RESULT:-skipped}"
          CLI_RESULT="${CLI_RESULT:-skipped}"
          METAL_RESULT="${METAL_RESULT:-skipped}"
          for entry in "verify-runner=$RUNNER_BUILD" "scan-sign-toolbox=$TOOLBOX_BUILD" "verify-daemon=$DAEMON_BUILD" "push-ghcr=$GHCR_RESULT" "qualify-candidate=$QUALIFICATION_RESULT" "deploy-fly=$FLY_RESULT" "dashboard=$DASHBOARD_RESULT" "qa=$QA_RESULT" "acceptance-e2e=$ACCEPTANCE_RESULT" "acceptance-cli=$CLI_RESULT" "ten-fleets=$TEN_FLEETS_RESULT" "deploy-metal=$METAL_RESULT"; do
            echo "dev_release_acceptance_summary job=${entry%%=*} result=${entry#*=} commit=$SHORT_SHA"
          done

          if [ "$DASHBOARD_RESULT" = success ] && [ "$QA_RESULT" = success ] && [ "$ACCEPTANCE_RESULT" = success ] && [ "$CLI_RESULT" = success ] \
            && { { [ "$METAL_RESULT" = success ] && [ "$QUALIFICATION_RESULT" = success ]; } || [ "$METAL_RESULT" = skipped ]; }; then
            STATUS=success
            MESSAGE="✅ DEV deploy green — \`$REF_NAME\` @ \`$SHORT_SHA\`\\nQA: passed | acceptance-e2e: passed | acceptance-cli: passed | ten-fleets: ${TEN_FLEETS_RESULT} | metal: ${METAL_RESULT} | dashboard: ${DASHBOARD_RESULT}\\n→ ten-fleet check awaits Indy's manual run"
          else
            STATUS=failure
            MESSAGE="❌ DEV deploy not releasable — \`$REF_NAME\` @ \`$SHORT_SHA\`\\nbuild: runner ${RUNNER_BUILD} | toolbox ${TOOLBOX_BUILD} | daemon ${DAEMON_BUILD} | ghcr ${GHCR_RESULT} | fly ${FLY_RESULT}\\nQA: ${QA_RESULT} | acceptance-e2e: ${ACCEPTANCE_RESULT} | acceptance-cli: ${CLI_RESULT} | ten-fleets: ${TEN_FLEETS_RESULT} | metal: ${METAL_RESULT} | dashboard: ${DASHBOARD_RESULT}\\nCheck: ${RUN_URL}"
          fi

          echo "status=$STATUS" >>"$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >>"$GITHUB_OUTPUT"

      - name: Notify Discord
        # always(): a verdict-step failure must still produce a red
        # notification — a silently absent message is the worst possible
        # outcome for a release gate. The message falls back rather than
        # going out empty.
        if: always()
        uses: ./.github/actions/notify-discord
        with:
          status: ${{ steps.verdict.outputs.status }}
          message: ${{ steps.verdict.outputs.message || '❌ DEV deploy verdict could not be computed — inspect the notify job' }}
          op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          vault: ${{ vars.VAULT_PROD }}
