[extend]
useDefault = true

# Single merged allowlist — uses the universally-supported `[allowlist]`
# (singular) form. The `[[allowlists]]` array-of-tables form is only honored
# reliably by gitleaks >= 8.19, but CI pins gitleaks-action@v2.3.9 which
# bundles gitleaks v8.18.4. With the singular form everything is merged
# into one allowlist block that both old and new gitleaks respect.
[allowlist]
description = "Merged allowlist — build artifacts, deterministic test fixtures, and error-code false positives"
paths = [
  # Generated Next.js build artifacts
  '''(^|/)app/\.next/.*''',
  # Repository scratch directory (gitignored): make targets write throwaway
  # test certificates and bench artifacts there.
  '''(^|/)\.tmp/''',
  # These match files that exist only in git history, which `gitleaks detect`
  # scans commit by commit: deterministic test fixtures and offline test JSON
  # Web Tokens (JWTs), never real credentials, plus a vendored Postgres
  # client's upstream Transport Layer Security (TLS) test key and the
  # "SCRAM-SHA-256" mechanism string its Simple Authentication and Security
  # Layer (SASL) handshake advertises. Dropping them surfaces 114 findings.
  '''(^|/).*_test\.zig$''',
  '''(^|/)test_fixtures\.zig$''',
  '''(^|/)test_scope_tokens\.zig$''',
  '''(^|/)vendor/pg/tests/.*''',
  '''(^|/)vendor/pg/src/proto/authentication_request\.zig$''',
]
regexTarget = "match"
regexes = [
  # Pre-M104 test JWTs (kid=rbac-test-kid) still present in git HISTORY — gitleaks
  # `detect` scans every commit, not just the working tree, and these fixtures
  # persist there. Deterministic, not real creds.
  # Do NOT remove based on a working-tree-only grep — history still trips it.
  '''eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InJiYWMtdGVzdC1raWQifQ\..*''',
  # UZ-* error codes in structured log messages (false positive: generic-api-key)
  '''UZ-[A-Z]+-\d{3}''',
  # Auth middleware test fixtures — deterministic signing secrets & nonces
  '''nonce1234567890abcdef''',
  '''8f742231b10e8888abcd99yyyzz0ek9i''',
]
stopwords = [
  "nonce1234567890abcdef",
  "8f742231b10e8888abcd99yyyzz0ek9i",
]

[[rules]]
id = "generic-api-key"

  [rules.allowlist]
  description = "Retired Oracle lock digests in history. The .oracle/ruleset.lock file no longer exists in the tree, but gitleaks scans every commit, so this allowlist stays. The values are Secure Hash Algorithm 256-bit (SHA-256) checksums of markdown and shell files, never credentials."
  condition = "AND"
  paths = ['''(^|/)\.oracle/ruleset\.lock$''']
  regexTarget = "line"
  regexes = ['''"(ruleset_digest|[^"]+\.(md|sh|json))":\s*"[0-9a-f]{64}"''']
