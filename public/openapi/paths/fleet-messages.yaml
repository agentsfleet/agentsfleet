# The fleet messages sub-resource: the chat ingress (POST) and the
# bodies-included thread read (GET). Split from paths/fleets.yaml per the
# REST guide's split-by-sub-resource rule for oversized path files.
/v1/workspaces/{workspace_id}/fleets/{fleet_id}/messages:
  get:
    operationId: list_fleet_messages
    summary: List a fleet's chat thread with bodies
    description: >
      Returns the newest chat events first. Each item carries the trigger
      payload (`request_json`) and the agent's full answer (`response_text`).
      One request replaces reading the event list and then each event's detail.
      A page holds at most `limit` items and at most 512 KiB of encoded items.
      The newest item always ships, even alone. Follow `next_cursor` to read
      the rest.
    tags:
    - Fleets
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    - name: fleet_id
      in: path
      required: true
      description: UUIDv7 of the fleet.
      schema:
        type: string
        format: uuid
    - name: starting_after
      in: query
      required: false
      description: Opaque continuation cursor from a previous page's `next_cursor`.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 20
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - total
              - next_cursor
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/components/schemas/FleetEventDetail
                total:
                  type: integer
                  nullable: true
                  description: Always null — the thread is cursor-walked, never counted.
                next_cursor:
                  type: string
                  nullable: true
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
  post:
    operationId: post_fleet_message
    summary: Post a chat message to a fleet
    description: Starts a fleet run with a chat event. Returns an event identifier for tracking in the activity stream.
    tags:
    - Fleets
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    - name: fleet_id
      in: path
      required: true
      description: UUIDv7 of the fleet.
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
                description: Operator message body. Up to 8192 bytes. The server wraps it in a JSON object with a "message"
                  field as the envelope's request payload.
    responses:
      '202':
        description: Event enqueued. The CLI uses event_id to filter SSE frames.
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - event_id
              properties:
                status:
                  type: string
                  enum:
                  - accepted
                event_id:
                  type: string
                  description: Accepted event identifier. Format `<MILLISECONDS>-<SEQUENCE>`.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      '409':
        description: Fleet is not active (`UZ-AGT-012`). Resume with `agentsfleet resume <FLEET>`, then retry.
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
