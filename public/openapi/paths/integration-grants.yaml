/v1/workspaces/{workspace_id}/fleets/{fleet_id}/integration-grants:
  get:
    operationId: list_integration_grants
    summary: List integration grants for a fleet
    description: Returns pending, approved, and revoked grants, newest first.
    tags:
    - Integration Grants
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    - name: fleet_id
      in: path
      required: true
      description: UUIDv7 of the fleet.
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - total
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/components/schemas/IntegrationGrant
                total:
                  type: integer
                  description: Count of items in this response (not total across pages).
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/workspaces/{workspace_id}/fleets/{fleet_id}/integration-grants/{grant_id}:
  delete:
    operationId: revoke_integration_grant
    summary: Revoke an integration grant
    description: Immediately revokes a grant. A revoked grant blocks the fleet on its next call
      against the affected service.
    tags:
    - Integration Grants
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    - name: fleet_id
      in: path
      required: true
      description: UUIDv7 of the fleet.
      schema:
        type: string
        format: uuid
    - name: grant_id
      in: path
      required: true
      schema:
        type: string
      description: Grant ID (UUIDv7). Grants are seeded when a fleet is installed, from the credentials its bundle declares.
    responses:
      '204':
        description: No Content
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
