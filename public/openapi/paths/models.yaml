/v1/models:
  get:
    operationId: get_model_library
    summary: List available models
    description: >
      Returns models available to the tenant. Each item includes its provider,
      context limit, and usage fields. An empty library returns an empty array.


      A bounded keyset page ordered by normalized `model_id`, then normalized
      `provider`, then an opaque row identity. Every comparison runs under
      `COLLATE "C"`, so the order is byte-wise and stable across locales. Follow
      `next_cursor` to read the whole catalogue; a client that reads only the
      first page silently loses every model past it.


      The response is conditionally revalidated. Every answer carries an `ETag`
      over the exact bytes served, plus `Cache-Control: private, no-cache` and
      `Vary: Authorization`. Send the tag back as `If-None-Match` and a match
      answers `304` with no body and the same headers. `private` is what stops a
      shared proxy handing one tenant's response to another even though the
      payload is identical for every authorized caller.
    tags:
    - Model Library
    parameters:
    - name: limit
      in: query
      required: false
      description: Rows per page, 1..100. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: starting_after
      in: query
      required: false
      description: >-
        Opaque cursor from a previous page's `next_cursor`. Bound to the filters
        and page size that produced it. A cursor this endpoint never issued is
        `UZ-LIBRARY-001`. A real cursor carrying different filters or a different
        page size is `UZ-LIBRARY-002`, rather than a silently different page.
        Only the sort boundary is read from it — the filters applied are always
        the request's.
      schema:
        type: string
    - name: provider
      in: query
      required: false
      description: >-
        Exact match on the normalized provider. At most 128 bytes once
        normalized; empty after normalization is treated as absent.
      schema:
        type: string
        maxLength: 128
    responses:
      '200':
        description: One page of the model library catalogue.
        headers:
          ETag:
            description: Strong validator over the exact bytes served.
            schema:
              type: string
          Cache-Control:
            description: Always `private, no-cache` — store, but revalidate before reuse.
            schema:
              type: string
          Vary:
            description: Always `Authorization`.
            schema:
              type: string
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              - models
              - total
              - next_cursor
              properties:
                version:
                  type: string
                  description: Date of the most recently updated model, formatted as YYYY-MM-DD in UTC.
                models:
                  type: array
                  description: >-
                    The page's rows. Named `models` rather than `items` because
                    renaming a shipped `/v1` field is a breaking change. `total`
                    and `next_cursor` are added beside it, so the page is
                    navigable without breaking an existing client.
                  items:
                    type: object
                    required:
                    - id
                    - provider
                    - context_cap_tokens
                    - input_nanos_per_mtok
                    - cached_input_nanos_per_mtok
                    - output_nanos_per_mtok
                    properties:
                      id:
                        type: string
                        description: The model_id. Provider hosting is encoded in the id itself.
                      provider:
                        type: string
                      context_cap_tokens:
                        type: integer
                        format: int32
                      input_nanos_per_mtok:
                        type: integer
                        format: int64
                      cached_input_nanos_per_mtok:
                        type: integer
                        format: int64
                      output_nanos_per_mtok:
                        type: integer
                        format: int64
                total:
                  type: integer
                  nullable: true
                  description: >-
                    Always null. Counting a keyset page costs the scan this
                    pagination exists to avoid. The key is present rather than
                    omitted, so no client need special-case its absence.
                next_cursor:
                  type: string
                  nullable: true
                  description: Cursor for the next page, or null on the last.
      '304':
        description: >-
          The caller's `If-None-Match` matched the current tag. No body. Carries
          the same `ETag`, `Cache-Control` and `Vary` as the `200`. A `304` that
          omitted them would tell a cache to stop revalidating the very response
          it is holding.
        headers:
          ETag:
            description: Strong validator over the bytes the caller already holds.
            schema:
              type: string
          Cache-Control:
            description: Always `private, no-cache`.
            schema:
              type: string
          Vary:
            description: Always `Authorization`.
            schema:
              type: string
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '503':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
