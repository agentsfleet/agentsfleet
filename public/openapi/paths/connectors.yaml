/v1/workspaces/{workspace_id}/connectors/{provider}/connect:
  post:
    operationId: connector_connect
    summary: Get a provider connection URL
    description: |
      Returns a URL for connecting the workspace to the provider. Open the URL in a browser.

      An unknown provider returns 404 `UZ-CONN-004`. An unavailable provider returns 503 `UZ-CONN-001`.
    tags:
    - Connectors
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: Workspace identifier.
      schema:
        type: string
        format: uuid
    - name: provider
      in: path
      required: true
      description: Provider identifier, such as `slack` or `github`.
      schema:
        type: string
    responses:
      '200':
        description: Connection URL created.
        content:
          application/json:
            schema:
              type: object
              required:
              - install_url
              properties:
                install_url:
                  type: string
                  description: URL to open in the user's browser.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      '503':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/workspaces/{workspace_id}/connectors:
  get:
    operationId: connector_catalog
    summary: List connectors for a workspace
    description: |
      Returns the providers available to the workspace. Each item shows whether the provider is ready and connected.

      Requires the `connector:read` scope.
    tags:
    - Connectors
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: Workspace identifier.
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: Available connectors and their current state.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                - id
                - archetype
                - display_name
                - configured
                - connected
                properties:
                  id:
                    type: string
                    description: Provider identifier.
                  archetype:
                    type: string
                    description: Connection method used by the provider.
                    enum:
                    - oauth2
                    - app_install
                  display_name:
                    type: string
                  configured:
                    type: boolean
                    description: True when the provider is ready to connect.
                  connected:
                    type: boolean
                    description: True when the workspace is connected.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/workspaces/{workspace_id}/connectors/{provider}:
  get:
    operationId: connector_status
    summary: Read a connector status
    description: |
      Returns `connected` or `not_connected` for one provider. Requires the `connector:read` scope.

      An unknown provider returns 404 `UZ-CONN-004`.
    tags:
    - Connectors
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: Workspace identifier.
      schema:
        type: string
        format: uuid
    - name: provider
      in: path
      required: true
      description: Provider identifier, such as `slack` or `github`.
      schema:
        type: string
    responses:
      '200':
        description: Connector status.
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - connected
                  - not_connected
                team:
                  type:
                  - string
                  - 'null'
                  description: Connected Slack workspace name. Null for other providers.
                label:
                  type:
                  - string
                  - 'null'
                  description: Provider label when available.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
  delete:
    operationId: connector_disconnect
    summary: Disconnect a provider from a workspace
    description: |
      Removes the workspace's connector handle and event-routing records from `agentsfleet`. Provider authorization remains active outside `agentsfleet`.

      Repeating this request returns 204. Use Connect to authorize the provider again.
    tags:
    - Connectors
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: Workspace identifier.
      schema:
        type: string
        format: uuid
    - name: provider
      in: path
      required: true
      description: Provider identifier, such as `slack` or `github`.
      schema:
        type: string
    responses:
      '204':
        description: Connector disconnected or already absent.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/connectors/{provider}/callback:
  get:
    operationId: connector_callback
    summary: Relay a provider callback to the dashboard
    description: |
      Compatibility URL for provider registrations that still target the API host. It forwards the browser to the dashboard callback with a fixed legacy marker. The authenticated endpoint uses that marker only to echo the old redirect URL during token exchange. This endpoint never exchanges a provider code or changes connector data.

      New provider registrations use `https://<APP_HOST>/api/connectors/{provider}/callback` for the matching environment. The dashboard posts the current Bearer token to the authenticated callback completion method.
    tags:
    - Connectors
    parameters:
    - name: provider
      in: path
      required: true
      description: Provider identifier, such as `slack` or `github`.
      schema:
        type: string
    - name: state
      in: query
      required: true
      description: One-time value supplied through the connection URL.
      schema:
        type: string
    - name: code
      in: query
      required: false
      description: Authorization code supplied by the provider when required.
      schema:
        type: string
    - name: installation_id
      in: query
      required: false
      description: Installation identifier supplied by providers such as GitHub.
      schema:
        type: string
    - name: location
      in: query
      required: false
      description: Provider data-center location supplied by multi-region providers such as Zoho.
      schema:
        type: string
    responses:
      '302':
        description: Browser redirected to the dashboard callback.
        headers:
          Location:
            description: Dashboard connectors page.
            schema:
              type: string
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
    security: []
  post:
    operationId: connector_callback_complete
    summary: Complete a provider connection
    description: |
      The dashboard calls this endpoint after the provider returns to the browser. The caller needs `connector:write` and must be the same person who started the signed connection state.

      The signed state binds the workspace, a keyed tag of the starter identity, a nonce, and expiry. The endpoint verifies identity and workspace access before consuming the nonce or exchanging a provider code.
    tags:
    - Connectors
    parameters:
    - name: provider
      in: path
      required: true
      description: Provider identifier, such as `slack` or `github`.
      schema:
        type: string
    - name: state
      in: query
      required: true
      description: Signed one-time value from the connection URL.
      schema:
        type: string
    - name: code
      in: query
      required: false
      description: Authorization code supplied by the provider when required.
      schema:
        type: string
    - name: installation_id
      in: query
      required: false
      description: Installation identifier supplied by providers such as GitHub.
      schema:
        type: string
    - name: location
      in: query
      required: false
      description: Provider data-center location supplied by multi-region providers such as Zoho.
      schema:
        type: string
    - name: callback_source
      in: query
      required: false
      description: Fixed compatibility marker added by the legacy API relay. Browser callers omit it.
      schema:
        type: string
        enum:
        - legacy_api
    responses:
      '302':
        description: The provider flow advances to its next authorization step or returns to dashboard Integrations after connection.
        headers:
          Location:
            description: Provider continuation URL or dashboard Integrations page.
            schema:
              type: string
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      '502':
        $ref: ../components/responses.yaml#/components/responses/Error
      '503':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
    security:
    - BearerAuth: []
/v1/connectors/slack/events:
  post:
    operationId: slack_events
    summary: Receive Slack events
    description: |
      Slack sends signed events to this route. Users do not call this route.

      An invalid signature returns 401 `UZ-SLK-010`. A timestamp outside 5 minutes returns 401 `UZ-SLK-011`.
    tags:
    - Connectors
    parameters:
    - name: X-Slack-Signature
      in: header
      required: true
      description: Slack request signature. Slack supplies this value.
      schema:
        type: string
    - name: X-Slack-Request-Timestamp
      in: header
      required: true
      description: Delivery time in Unix seconds. Values outside 5 minutes are rejected.
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Slack event or URL verification request.
            additionalProperties: true
    responses:
      '200':
        description: Accepted, duplicate, verification, or ignored response.
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                additionalProperties: false
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - accepted
                    - duplicate
              - type: object
                additionalProperties: false
                required:
                - challenge
                properties:
                  challenge:
                    type: string
                    description: Value returned for Slack URL verification.
              - type: object
                additionalProperties: false
                required:
                - ignored
                properties:
                  ignored:
                    type: string
                    const: UZ-SLK-020
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '413':
        $ref: ../components/responses.yaml#/components/responses/Error
      '503':
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
    security: []
