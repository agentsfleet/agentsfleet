/v1/workspaces/{workspace_id}/secrets:
  get:
    operationId: list_workspace_secrets
    summary: List secrets stored for a workspace
    description: Returns secret names and non-secret details. Secret values are never returned.
    tags:
    - Secrets
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                secrets:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/components/schemas/SecretSummary
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
  post:
    operationId: store_workspace_secret
    summary: Store a workspace secret
    description: |
      Stores an encrypted JSON object. Secret values are never returned.

      `data` must be a non-empty object no larger than 4 KiB. Larger values return `UZ-VAULT-002`.

      Strings, arrays, scalars, and empty objects return `UZ-VAULT-001`.

      Creating claims a name that is free. A name already held in this workspace
      returns `UZ-VAULT-005` and nothing is written — rotate the existing secret
      with `PATCH /v1/workspaces/{workspace_id}/secrets/{secret_name}` instead.
      The database decides the winner, so two concurrent creates on one name
      resolve to one `201` and one `409`.
    tags:
    - Secrets
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            - data
            properties:
              name:
                type: string
                maxLength: 64
                description: Secret identifier a Fleet interpolates as `${secrets.<name>.<field>}`.
              data:
                type: object
                minProperties: 1
                additionalProperties: true
                description: |
                  JSON object whose top-level keys are the field names a skill
                  references via `${secrets.<name>.<field>}`. The runtime never
                  inspects the schema — this is opaque to the platform.
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
      '409':
        description: A secret with this name already exists in the workspace (`UZ-VAULT-005`).
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/workspaces/{workspace_id}/secrets/{secret_name}:
  put:
    operationId: replace_workspace_secret
    summary: Replace a secret's stored body
    description: |
      Replaces the stored object in full. Send the secret you want stored, in the
      same `data` shape `create` takes — a field you omit is absent from the
      secret afterwards.

      Replacement is total by design. A stored secret is never readable, so a
      partial write cannot be reasoned about by the caller. Every field needed to
      rebuild the body is already returned by
      `GET /v1/workspaces/{workspace_id}/secrets`. The secret itself is the one
      exception, and this call supplies it.

      The name must already be held. A name this workspace does not have returns
      `UZ-VAULT-003` and nothing is created — claiming a name is `create`'s job.
    tags:
    - Secrets
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    - name: secret_name
      in: path
      required: true
      description: Secret name.
      schema:
        type: string
        maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - data
            properties:
              data:
                type: object
                additionalProperties: true
                description: The complete replacement body. Must be a non-empty JSON object (`UZ-VAULT-001`) no larger than 4 KiB stringified (`UZ-VAULT-002`). Never echoed back or logged.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
  delete:
    operationId: delete_workspace_secret
    summary: Delete a secret from the workspace vault
    description: |
      Idempotent — returns 204 whether or not the secret existed.
    tags:
    - Secrets
    parameters:
    - name: workspace_id
      in: path
      required: true
      description: UUIDv7 of the workspace.
      schema:
        type: string
        format: uuid
    - name: secret_name
      in: path
      required: true
      description: Secret name.
      schema:
        type: string
        maxLength: 64
    responses:
      '204':
        description: Secret deleted (or already absent)
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        $ref: ../components/responses.yaml#/components/responses/Error
