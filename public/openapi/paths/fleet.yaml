/v1/runners:
  post:
    operationId: register_runner
    summary: Register a runner
    description: Enrolls a runner into the fleet and assigns its policy. Requires an existing operator credential (Clerk JWT or `agt_t` API key with admin role); there is no enrollment token. Mints a durable `agt_r` runner token, returned once, and stores only its SHA-256 hash. The host applies the policy assigned here and never declares its own.
    tags:
    - Fleet
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/components/schemas/RunnerRegisterRequest
    responses:
      '201':
        description: Runner registered; the bearer token is returned exactly once.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/RunnerRegisterResponse
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/fleets/runners:
  get:
    operationId: list_fleet_runners
    summary: List fleet runners
    description: Platform-admin operator-plane read of the whole fleet, newest first over the composite (created_at, id) key. Under keyset pagination a runner enrolled mid-traversal never repeats or hides a row. The retired page, page_size and sort parameters are refused. Each row carries a derived `liveness` — never the stored auth state, never the token hash.
    tags:
    - Fleet
    parameters:
    - name: starting_after
      in: query
      required: false
      description: An opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Rows per page (1-100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    responses:
      '200':
        description: A page of fleet runners.
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - total
              - next_cursor
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/components/schemas/RunnerSummary
                total:
                  type: integer
                  format: int64
                  nullable: true
                  description: The full runner count; stable across pages.
                next_cursor:
                  type: string
                  nullable: true
                  description: Cursor for the next page; null on the final page.
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/fleets/runners/{id}:
  get:
    operationId: get_fleet_runner
    summary: Get a fleet runner
    description: Platform-admin read of a single runner. Carries the summary fields, a live-work snapshot, and lifetime counters from durable lease and event rows — never from in-memory metrics. The runner detail page loads from this read.
    tags:
    - Fleet
    parameters:
    - name: id
      in: path
      required: true
      description: Runner id (UUIDv7).
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: The runner.
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/RunnerDetail
      '404':
        description: No runner with this id (`UZ-RUN-014`).
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
  patch:
    operationId: patch_fleet_runner
    summary: Administer a fleet runner
    description: 'Platform-admin mutation on a single runner. The body carries exactly one of `action` or `assigned_policy`. `action` moves the admin state: `cordon` to cordoned, `drain` to draining, `revoke` to revoked. Revoked is terminal; a revoked runner cannot transition back. `self_test` moves no state. It records a request for the runner to test its own sandbox. The host picks the request up on its next heartbeat and answers on a later one. The reply is the recorded request, never a verdict. A revoked runner refuses it with 409 `UZ-RUN-018`, since it will never heartbeat again. `assigned_policy` re-assigns the runner''s policy, and the host picks it up on its next heartbeat. Sending the same policy again changes nothing and records no event.'
    tags:
    - Fleet
    parameters:
    - name: id
      in: path
      required: true
      description: Runner id (UUIDv7).
      schema:
        type: string
        format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: Exactly one of `action` or `assigned_policy` must be present; both or neither is a 400.
            properties:
              action:
                type: string
                description: The operator action to apply. The first three move the admin state; `self_test` records a sandbox self-test request and leaves the state alone.
                enum:
                - cordon
                - drain
                - revoke
                - self_test
              assigned_policy:
                $ref: ../components/schemas.yaml#/components/schemas/RunnerAssignedPolicy
    responses:
      '200':
        description: The runner's admin state, plus the stored assignment on the policy-update path.
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - admin_state
              properties:
                id:
                  type: string
                  format: uuid
                admin_state:
                  type: string
                  enum:
                  - active
                  - cordoned
                  - draining
                  - drained
                  - revoked
                assigned_policy:
                  $ref: ../components/schemas.yaml#/components/schemas/RunnerAssignedPolicy
                  x-stability: stable
                selftest_requested_at:
                  type: integer
                  format: int64
                  nullable: true
                  description: Present on the `self_test` path only — epoch milliseconds the request was recorded. Age the pending state from this; the verdict itself arrives on a later heartbeat and is read from the runner, not from this reply.
                  x-stability: stable
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
  delete:
    operationId: delete_fleet_runner
    summary: Delete a revoked runner
    description: Removes a revoked runner's record, along with its lease and event history (cascade). A runner that is not revoked returns 409 `UZ-RUN-016` — revoke is the destructive step; delete only retires the already-dead record.
    tags:
    - Fleet
    parameters:
    - name: id
      in: path
      required: true
      description: Runner id (UUIDv7).
      schema:
        type: string
        format: uuid
    responses:
      '204':
        description: No Content
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        description: No runner with this id (`UZ-RUN-014`).
        $ref: ../components/responses.yaml#/components/responses/Error
      '409':
        description: Active runner must be revoked before deletion (`UZ-RUN-016`).
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/fleets/runners/{id}/leases:
  get:
    operationId: list_fleet_runner_leases
    summary: List a runner's leases
    description: |
      Platform-admin read of a single runner's lease history, newest first. Each lease is joined to its Fleet event, so outcome and failure cause arrive in one round trip. Stripe-style keyset pagination — `starting_after` is a lease id from a previous page's `next_cursor`.

      Settled leases are retained for 30 days. The window is measured from settlement, not from acquisition. A lease acquired long ago and settled yesterday keeps its full window. A background sweep deletes them past that window. A lease still running or renewing is never swept.

      The per-lease activity records (`lease_acquired`, `lease_released`) are swept on the same 30-day window. Each record ages from when it occurred, not from its lease's settlement. A long run's opening record can therefore be pruned shortly before its lease row. The runner's lifecycle activity is kept at any age, so a long-lived runner's feed never empties.

      A lease whose runner died without reporting is marked expired once it passes the same window. It then keeps its own window, like any settled lease. The lifetime totals on `GET /v1/fleets/runners/{id}` are unaffected by any of this. They count transitions as they happen, not surviving rows. A long-lived runner's `leases_acquired` will therefore exceed what this endpoint returns.
    tags:
    - Fleet
    parameters:
    - name: id
      in: path
      required: true
      description: Runner id (UUIDv7).
      schema:
        type: string
        format: uuid
    - name: starting_after
      in: query
      required: false
      description: A lease id this runner holds; the page starts strictly after it. A lease id the runner does not hold is refused. So is one outside the `workspace_id` or `fleet` filters when those filters are set. The cursor names a position in the filtered stream, so it must belong to it. A cursor whose lease the retention sweep has since deleted is refused for the same reason — start again from the first page.
      schema:
        type: string
        format: uuid
    - name: workspace_id
      in: query
      required: false
      description: Narrow the page and total to leases owned by one workspace. A malformed id is refused; an unknown one matches nothing.
      schema:
        type: string
        format: uuid
    - name: fleet
      in: query
      required: false
      description: Narrow the page and total to leases run for one fleet, named by its id or its exact name (case-insensitive). Combines with `workspace_id`; the two filters intersect. An empty or over-long value is refused; a value no fleet matches returns nothing.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    - name: limit
      in: query
      required: false
      description: Rows per page (1-100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    responses:
      '200':
        description: A page of leases.
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - total
              - next_cursor
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/components/schemas/RunnerLease
                total:
                  type: integer
                  format: int64
                  nullable: true
                  description: The filtered history's retained lease count; stable across pages. Narrowed by `workspace_id` and `fleet` when set. Counts only leases still inside the retention window, not the runner's lifetime total. `GET /v1/fleets/runners/{id}` reports that.
                next_cursor:
                  type: string
                  nullable: true
                  description: The last lease id of a full page; null on the final page.
      '404':
        description: No runner with this id (`UZ-RUN-014`).
        $ref: ../components/responses.yaml#/components/responses/Error
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/fleets/runners/{id}/events:
  get:
    operationId: list_fleet_runner_events
    summary: List fleet runner events
    description: Platform-admin read of a single runner's append-only history, newest first over the composite (occurred_at, id) key. The retired page and page_size parameters are refused. Optionally filtered by event type and an occurred-at millisecond window.
    tags:
    - Fleet
    parameters:
    - name: id
      in: path
      required: true
      description: Runner id (UUIDv7).
      schema:
        type: string
        format: uuid
    - name: starting_after
      in: query
      required: false
      description: An opaque cursor from a previous page's `next_cursor`.
      schema:
        type: string
    - name: limit
      in: query
      required: false
      description: Rows per page (1-100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    - name: event_type
      in: query
      required: false
      description: 'Filter to one runner event type, or a comma-separated set returning the union (multi-value equality). Allowed tags: runner_registered, runner_online, runner_offline, lease_acquired, lease_released, runner_cordoned, runner_draining, runner_drained, runner_revoked. An unrecognised tag or an empty value refuses the whole request.'
      schema:
        type: string
    - name: since
      in: query
      required: false
      description: Lower bound on occurred_at, epoch milliseconds (inclusive).
      schema:
        type: integer
        format: int64
    - name: until
      in: query
      required: false
      description: Upper bound on occurred_at, epoch milliseconds (inclusive). Must be >= since.
      schema:
        type: integer
        format: int64
    responses:
      '200':
        description: A page of runner events.
        content:
          application/json:
            schema:
              type: object
              required:
              - items
              - total
              - next_cursor
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas.yaml#/components/schemas/RunnerEvent
                total:
                  type: integer
                  format: int64
                  nullable: true
                  description: The filtered history's full count; stable across pages.
                next_cursor:
                  type: string
                  nullable: true
                  description: Cursor for the next page; null on the final page.
      default:
        $ref: ../components/responses.yaml#/components/responses/Error
