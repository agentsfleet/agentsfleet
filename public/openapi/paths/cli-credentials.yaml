/v1/cli-credentials:
  post:
    operationId: create_cli_credential
    summary: Mint a command-line credential
    description: >-
      Creates a durable credential for one machine, with the `afc_` prefix. The
      raw credential is returned once. Only its SHA-256 hash is saved, so it
      cannot be read back later.


      A credential belongs to a person, not to a team. Call this with a browser
      session token or with an existing command-line credential. A tenant API
      key is refused.


      Minting revokes whatever credential the same machine name already held.
      One machine holds one live credential at a time.
    tags:
    - CLI Credentials
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - machine_name
            properties:
              machine_name:
                type: string
                minLength: 1
                maxLength: 64
                description: >-
                  Your label for this machine, usually its hostname. Letters,
                  digits, hyphens, underscores, and dots only.
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - credential
              - machine_name
              - deployment
              properties:
                id:
                  type: string
                  format: uuid
                credential:
                  type: string
                  description: >-
                    The raw `afc_` credential. Shown once. Save it now; you
                    cannot fetch it again.
                machine_name:
                  type: string
                deployment:
                  type: string
                  description: >-
                    The deployment that minted this credential. Send it only to
                    this host.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        description: >-
          The caller is not a person. A tenant API key cannot manage a
          command-line credential (`UZ-AUTH-001`).
        $ref: ../components/responses.yaml#/components/responses/Error
  get:
    operationId: list_cli_credentials
    summary: List your live command-line credentials
    description: >-
      Returns the credentials you hold that are still live, newest first. No
      response field can authenticate a request. `prefix` is a short display
      fragment, enough to tell two credentials apart and nothing more.


      A credential you shared with someone appears here under the machine name
      it was minted on. That is how sharing stays visible.
    tags:
    - CLI Credentials
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required:
              - credentials
              properties:
                credentials:
                  type: array
                  items:
                    type: object
                    required:
                    - id
                    - machine_name
                    - prefix
                    - deployment
                    - created_at
                    properties:
                      id:
                        type: string
                        format: uuid
                      machine_name:
                        type: string
                      prefix:
                        type: string
                        description: Display fragment, such as `afc_a1b2c3d4`.
                      deployment:
                        type: string
                      created_from_address:
                        type: string
                        description: The address this credential was minted from.
                      created_at:
                        type: integer
                        format: int64
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
/v1/cli-credentials/{id}:
  delete:
    operationId: revoke_cli_credential
    summary: Revoke a command-line credential
    description: >-
      Retires one of your credentials. The terminal holding it is refused on its
      next call, with the code `UZ-AUTH-023`.


      Running `agentsfleet logout` calls this for the credential on that
      machine. Browser sessions are untouched, so signing out of a terminal does
      not sign you out of the dashboard.
    tags:
    - CLI Credentials
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The credential identifier returned by mint or list.
    responses:
      '204':
        description: Revoked. No content.
      '400':
        $ref: ../components/responses.yaml#/components/responses/Error
      '401':
        $ref: ../components/responses.yaml#/components/responses/Error
      '403':
        $ref: ../components/responses.yaml#/components/responses/Error
      '404':
        description: >-
          No live credential of yours has that identifier (`UZ-AUTH-024`). A
          credential that is already revoked and one that belongs to someone
          else answer alike, so an identifier cannot be tested for whose it is.
        $ref: ../components/responses.yaml#/components/responses/Error
