# One infrastructure project per repository. local-dev.sh owns its snapshot.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:19rc1-alpine
    environment:
      POSTGRES_USER: agentsfleet
      POSTGRES_PASSWORD: agentsfleet
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${AGENTSFLEET_PG_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsfleet -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${AGENTSFLEET_MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${AGENTSFLEET_MAILPIT_UI_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  qstash:
    image: mirror.gcr.io/oven/bun:1.4.4
    command:
      - sh
      - -c
      - |
        cd /tmp
        bun add @upstash/qstash-cli@2.37.18
        bun node_modules/@upstash/qstash-cli/install.js
        exec node_modules/@upstash/qstash-cli/bin/qstash dev -port 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AGENTSFLEET_QSTASH_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # The event bus: three core NATS nodes routed as one cluster, no JetStream
  # and no volume, as in the test lane's compose. Host clients take every node
  # as a seed because `--no_advertise` keeps the bridge addresses to the nodes.
  nats-1: &nats
    image: nats:2.15.2-alpine
    command:
      - --name=nats-1
      - --port=4222
      - --http_port=8222
      - --user=agentsfleet
      - --pass=agentsfleet
      - --cluster_name=agentsfleet
      - --cluster=nats://0.0.0.0:6222
      - --routes=nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222
      - --no_advertise=true
    ports:
      - "127.0.0.1:${AGENTSFLEET_NATS_BASE_PORT}:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30

  nats-2:
    <<: *nats
    command:
      - --name=nats-2
      - --port=4222
      - --http_port=8222
      - --user=agentsfleet
      - --pass=agentsfleet
      - --cluster_name=agentsfleet
      - --cluster=nats://0.0.0.0:6222
      - --routes=nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222
      - --no_advertise=true
    ports:
      - "127.0.0.1:${AGENTSFLEET_NATS_PORT_2}:4222"

  nats-3:
    <<: *nats
    command:
      - --name=nats-3
      - --port=4222
      - --http_port=8222
      - --user=agentsfleet
      - --pass=agentsfleet
      - --cluster_name=agentsfleet
      - --cluster=nats://0.0.0.0:6222
      - --routes=nats://nats-1:6222,nats://nats-2:6222,nats://nats-3:6222
      - --no_advertise=true
    ports:
      - "127.0.0.1:${AGENTSFLEET_NATS_PORT_3}:4222"

volumes:
  postgres-data:
