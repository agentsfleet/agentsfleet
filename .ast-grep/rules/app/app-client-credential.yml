# A client component ships to the browser, so a bearer it reads, sends or is
# handed is a dashboard credential in the browser. Server code holds them.
id: app-client-credential
language: Tsx
severity: error
message: a getToken() call, an Authorization Bearer header or a token-typed prop in a client component would ship a bearer to the browser
files:
  - ui/packages/app/**/*.ts
  - ui/packages/app/**/*.tsx
ignores:
  - ui/packages/app/tests/**
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/*_test.*"
  - ui/packages/app/app/cli-auth/\[session_id\]/page.tsx
utils:
  named-token:
    regex: ^token$
    any:
      - kind: identifier
      - kind: property_identifier
      - kind: shorthand_property_identifier_pattern
rule:
  inside:
    stopBy: end
    kind: program
    has:
      kind: expression_statement
      regex: '^["'']use client["'']'
  any:
    # A getToken() call, bare or on a session object.
    - kind: call_expression
      has: { field: function, regex: '(^|\.)getToken$' }
    # An Authorization header whose value is a bearer.
    - kind: pair
      all:
        - has: { field: key, regex: '^["'']?Authorization["'']?$' }
        - has: { field: value, regex: '^.?Bearer' }
    # A value named `token`: declared, typed, passed, assigned or tested.
    - kind: property_signature
      has: { field: name, matches: named-token }
    - kind: public_field_definition
      has: { field: name, matches: named-token }
    - kind: pair
      has: { field: key, matches: named-token }
    - kind: pair_pattern
      has: { field: key, matches: named-token }
    - kind: variable_declarator
      has: { field: name, matches: named-token }
    - kind: required_parameter
      has: { field: pattern, matches: named-token }
    - kind: optional_parameter
      has: { field: pattern, matches: named-token }
    - kind: assignment_pattern
      has: { field: left, matches: named-token }
    - kind: object_assignment_pattern
      has: { field: left, matches: named-token }
    - kind: assignment_expression
      has: { field: left, matches: named-token }
    - kind: augmented_assignment_expression
      has: { field: left, matches: named-token }
    - kind: arrow_function
      has: { field: parameter, matches: named-token }
    - kind: ternary_expression
      any:
        - has: { field: condition, matches: named-token }
        - has: { field: consequence, matches: named-token }
    - kind: binary_expression
      all:
        - has: { field: left, matches: named-token }
        - has: { field: operator, regex: '^\?\?$' }
    - kind: member_expression
      regex: ^token\s*\?\.
      has: { field: object, matches: named-token }
    - kind: jsx_attribute
      has: { nthChild: 1, matches: named-token }
