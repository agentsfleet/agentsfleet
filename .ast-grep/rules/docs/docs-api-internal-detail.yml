# DOC-22: prose states customer behaviour, never a table, a store, a source
# path, a rule id or a milestone.
# Published API prose lives in the generated document, so the fix lands in the
# Rust annotation that emits it. Only `summary` and `description` values count.
id: docs-api-internal-detail
language: Json
severity: error
message: published API prose names an implementation detail (DOC-22)
files:
  - public/openapi.json
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: '^"(summary|description)"$'
    - has:
        field: value
        kind: string
        regex: '(?:\b|\\n)(core|identity|authoring|fleet|runner|connector|model|billing|vault|memory|audit)\.[A-Za-z_]|(?:\b|\\n)fleet_execution_telemetry\b|(?i:(?:\b|\\n)(PostgreSQL|Redis|JSONB|XADD|Lua-EVAL)\b)|(?i:(?:\b|\\n)(middleware|row-level|implementation detail|allocation failure|worker thread|runner plane|data plane|control plane)\b)|(?:\b|\\n)(src|docs)/[A-Za-z0-9_./-]+|(?:\b|\\n)RULE [A-Z0-9-]+\b|(?:\b|\\n)M[0-9]+([_-][0-9]+)?\b'
