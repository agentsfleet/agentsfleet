# DOC-09: a removed command is never spelled where a customer reads it.
# The same rule in three grammars, because one rule id has one language.
id: docs-removed-command-json
language: Json
severity: error
message: names a removed command (DOC-09)
note: 'Replacements: install -> agentsfleet chat --library <LIBRARY_ID> --revision <REVISION_ID>; library create -> agentsfleet chat --publish <LABEL>; fleet update -> agentsfleet chat --fleet <FLEET_ID> --setup-revision <N>; workspace, fleet-key, secret and tenant provider add -> the same command with create. Root verbs moved under their resource: list, status, stop, resume, kill, delete, steer, logs, events, approvals, schedule, memory -> agentsfleet fleet <verb>; grant -> agentsfleet fleet grants; tenant provider -> agentsfleet models current|use|reset; billing -> agentsfleet usage; secret -> agentsfleet secrets; workspace secrets -> agentsfleet secrets; connector -> agentsfleet connections; api-key -> agentsfleet api-keys. library -> agentsfleet plugins; chat --library -> chat --plugin; secrets open is removed; platform keys set -> platform keys use. fleet stop, resume and kill are removed: agentsfleet fleet archive <FLEET_ID> or agentsfleet fleet delete <FLEET_ID>.'
files:
  - public/openapi.json
rule:
  kind: string
  regex: 'agentsfleet (install|library create|fleet update|workspace add|fleet-key add|secret add|tenant provider add|(list|status|stop|resume|kill|delete|steer|logs|events|approvals|schedule|memory|grant|tenant|billing|secret|connector|api-key)\b|workspace secrets|fleet (stop|resume|kill)\b|library\b|chat --library\b|secrets open\b|platform keys set\b)'
