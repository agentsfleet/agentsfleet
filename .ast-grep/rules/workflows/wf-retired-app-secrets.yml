# Retired boot secrets: the daemon reads the GitHub App, the approval key and
# the scheduler's credentials from the admin vault, and nothing reads the
# others. A workflow still loading one keeps a dead credential in reach, or
# brings back an environment path the daemon no longer has.
id: wf-retired-app-secrets
language: Yaml
severity: error
message: a retired boot secret is still loaded; the daemon reads it from the vault or not at all
files:
  - .github/workflows/deploy-dev*.yml
  - .github/workflows/release*.yml
rule:
  regex: 'GITHUB_APP_ID|GITHUB_APP_PRIVATE_KEY|APPROVAL_SIGNING_SECRET|OIDC_PROVIDER|QSTASH_(TOKEN|URL|CURRENT_SIGNING_KEY|NEXT_SIGNING_KEY)|DRAGONFLY_URL|R2_(ACCESS_KEY_ID|ACCOUNT_ID|BUCKET|SECRET_ACCESS_KEY)'
  any:
    - kind: string_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
    - kind: block_scalar
