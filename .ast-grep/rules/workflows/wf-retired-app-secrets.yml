# The GitHub App boot secrets were retired: the daemon reads the app from the
# vault. A workflow still loading them keeps a dead credential in reach.
id: wf-retired-app-secrets
language: Yaml
severity: error
message: the retired GitHub app boot secrets are still loaded
files:
  - .github/workflows/deploy-dev*.yml
  - .github/workflows/release*.yml
rule:
  regex: 'GITHUB_APP_ID|GITHUB_APP_PRIVATE_KEY'
  any:
    - kind: string_scalar
    - kind: double_quote_scalar
    - kind: single_quote_scalar
    - kind: block_scalar
