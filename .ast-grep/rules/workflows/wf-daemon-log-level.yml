# Deployment log levels come from the validated application TOML.
# Reject the bare LOG_LEVEL name, which the daemon does not read.
id: wf-daemon-log-level
language: Yaml
severity: error
message: use telemetry.log_level in the application TOML; the daemon does not read LOG_LEVEL
files:
  - .github/workflows/deploy-dev-fly.yml
rule:
  kind: block_mapping_pair
  all:
    - has:
        field: key
        regex: '^run$'
    - has:
        field: value
        regex: '(?m)^\s*LOG_LEVEL='
