id: app-client-credential
valid:
  # A client component with no credential in it.
  - |
    "use client";
    export function Panel({ label }: { label: string }) {
      const tokenCount = 3;
      return <p>{label}{tokenCount}</p>;
    }
  # Server code may read and send a bearer.
  - |
    const bearer = await getToken();
    export const headers = { Authorization: `Bearer ${bearer}` };
  # A comparison and a property read are not a token-typed value.
  - |
    "use client";
    // getToken() and Authorization: Bearer stay on the server.
    export const same = (a: string) => a === session.token;
invalid:
  - |
    "use client";
    export function Panel({ token }: { token: string }) {
      const tokenCount = 3;
      return <p>{label}{tokenCount}</p>;
    }
  - |
    "use client";
    const bearer = await getToken();
  - |
    'use client';
    const bearer = await session.getToken();
  - |
    "use client";
    export const headers = { Authorization: `Bearer ${bearer}` };
  - |
    "use client";
    const token = read();
  - |
    "use client";
    export const P = () => <Panel token={bearer} />;
  - |
    "use client";
    export const P = (token?: string) => token ?? "";
  - |
    "use client";
    export const read = () => withToken(token => list(token));
  - |
    "use client";
    export const pick = (options?: object) => options ? token : sessionToken;
