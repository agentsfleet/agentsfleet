id: wf-retired-app-secrets
valid:
  - |
    jobs:
      d:
        env:
          CLERK_SECRET_KEY: op://${{ vars.VAULT_DEV }}/clerk-dev/secret-key
  - |
    jobs:
      d:
        steps:
          - run: |
              ENV=dev ./playbooks/lib/platform_secret_sync.sh qstash
invalid:
  - |
    jobs:
      d:
        env:
          APP: op://${{ vars.VAULT_DEV }}/GITHUB_APP_ID/credential
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set GITHUB_APP_PRIVATE_KEY="$KEY"
  - |
    jobs:
      d:
        env:
          APPROVAL_SIGNING_SECRET: op://${{ vars.VAULT_DEV }}/approval-signing-secret/credential
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set OIDC_PROVIDER="clerk" QSTASH_TOKEN="$TOKEN"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set R2_BUCKET="$BUCKET" DRAGONFLY_URL="$URL"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set QSTASH_URL="$URL"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set QSTASH_CURRENT_SIGNING_KEY="$KEY"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set QSTASH_NEXT_SIGNING_KEY="$KEY"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set R2_ACCESS_KEY_ID="$ID"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set R2_ACCOUNT_ID="$ID"
  - |
    jobs:
      d:
        steps:
          - run: |
              flyctl secrets set R2_SECRET_ACCESS_KEY="$KEY"
