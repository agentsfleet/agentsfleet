# agentsfleet datastores: Postgres, Mailpit, the QStash emulator and three NATS
# nodes. One definition serves both users: the integration lane runs it from
# this checkout (make/test-infra.mk), and `make up` copies it once into the
# shared development stack (scripts/local-dev-state.sh), which keeps that copy.
#
# The services carry NO `container_name`, so several git worktrees can run
# `make test-integration` at once. Compose namespaces containers and volumes by
# project, and the project name defaults to the directory basename — already
# unique per worktree. Pinning the name collapses every worktree onto one
# container: whichever ran last owned the database, and the integration lane
# starts by dropping every schema, so concurrent agents silently destroyed each
# other's runs.
#
# Their host ports are FIXED, and `make` exports the values —
# scripts/test-infra-ports.sh decides them. Letting Docker assign an ephemeral
# port instead — the obvious way to keep worktrees apart — is what that script's
# header documents as broken: an ephemeral published port moves on every
# container restart, and the Makefile resolves it into a URL exactly once, so a
# restart mid-run points the whole suite at a dead port.
#
# Only a LINKED git worktree gets pinned per-project ports. The `:-` defaults
# below are what a primary checkout uses, which is what CI always has, and CI
# hardcodes localhost:5432 into its connection strings — so these defaults are
# load-bearing, not decorative. Every port binds to loopback only: the fixture
# passwords below never listen on another interface.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:19rc2-alpine
    # pg_stat_statements is preloaded so the bench lanes can count the
    # statements a path executes from the SERVER's side (afd_bench's statement
    # counter). It only loads at server start, which is why it lives here and
    # not in a lane's setup. `track=all` counts statements run inside functions
    # and triggers too; the entry ceiling is raised so no statement a lane
    # counts is evicted mid-window, which would make a delta go backwards.
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh postgres \
          -c shared_preload_libraries=pg_stat_statements \
          -c pg_stat_statements.track=all \
          -c pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: agentsfleet
      POSTGRES_PASSWORD: agentsfleet
      POSTGRES_DB: agentsfleetdb
      # Postgres 18+ refuses to run when the data directory equals the mount
      # root. Pointing PGDATA at a subdirectory satisfies the new layout
      # requirement without restructuring the volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Per-worktree but fixed — see the header. scripts/test-infra-ports.sh
      # writes the value, and make/test-infra.mk builds the URLs from the same
      # declared AGENTSFLEET_*_HOST_PORT values, which compose publishes verbatim.
      - "127.0.0.1:${AGENTSFLEET_PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsfleet -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # The SMTP sink the invite email lands in, locally and in the integration
    # lane. It accepts any credentials and keeps every message for reading at
    # its web page or its API, so a test asserts on the real SMTP exchange and
    # a person can open the rendered email in a browser.
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:${AGENTSFLEET_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${AGENTSFLEET_MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  qstash:
    # Upstash's official QStash local dev server, run via Bun. Ships deterministic
    # credentials (fixed token + signing keys), so integration tests point at it
    # with a committed fixture token — no per-run secret. Used by the opt-in live
    # QStash tests (AGENTSFLEET_QSTASH_LIVE_URL/TOKEN); self-skip when it is down.
    # Debian (glibc), not Alpine: the CLI fetches a glibc-linked Go binary that
    # cannot exec under musl.
    image: mirror.gcr.io/oven/bun:1.4.4
    command:
      - sh
      - -c
      - |
        cd /tmp
        bun add @upstash/qstash-cli@2.44.2
        # Bun blocks postinstall scripts, so the Go binary the CLI wraps is not
        # fetched by `bun add` — run its installer explicitly before launching.
        bun node_modules/@upstash/qstash-cli/install.js
        exec node_modules/@upstash/qstash-cli/bin/qstash dev -port 8080
    ports:
      # Per-worktree but fixed -- see the postgres service above.
      - "127.0.0.1:${AGENTSFLEET_QSTASH_HOST_PORT:-8080}:8080"
    # The emulator delivers a fire to a listener on the host; Docker Desktop
    # resolves this name itself and a Linux engine needs the mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Unauthenticated requests 401, which still proves the server is accepting
      # connections; fetch resolves on any HTTP response and rejects only on a
      # connection error, so a resolved fetch means healthy.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      # Generous: the container installs the CLI and downloads its Go binary on
      # first boot, so a cold or slow network needs well past the usual budget —
      # a premature unhealthy verdict fails the whole integration lane.
      retries: 60
      start_period: 30s

  # Three core NATS nodes routed as one cluster: no JetStream, no volume, so a
  # restarted node rejoins empty. `--no_advertise` keeps the nodes' bridge
  # addresses away from clients, which dial their seed list from the host.
  # The fixed local password is a lane fixture; nothing deployed uses it. The alpine build of the pinned release carries wget for the check.
  ant: &nats
    image: nats:2.15.3-alpine
    command:
      - --name=ant
      - --port=4222
      - --http_port=8222
      - --user=agentsfleet
      - --pass=agentsfleet
      - --cluster_name=agentsfleet
      - --cluster=nats://0.0.0.0:6222
      - --routes=nats://ant:6222,nats://bee:6222,nats://elk:6222
      - --no_advertise=true
    ports:
      - "127.0.0.1:${AGENTSFLEET_NATS_BASE_PORT:-4222}:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
  bee:
    <<: *nats
    command:
      - --name=bee
      - --port=4222
      - --http_port=8222
      - --user=agentsfleet
      - --pass=agentsfleet
      - --cluster_name=agentsfleet
      - --cluster=nats://0.0.0.0:6222
      - --routes=nats://ant:6222,nats://bee:6222,nats://elk:6222
      - --no_advertise=true
    ports:
      - "127.0.0.1:${AGENTSFLEET_NATS_PORT_2:-4223}:4222"
  elk:
    <<: *nats
    command:
      - --name=elk
      - --port=4222
      - --http_port=8222
      - --user=agentsfleet
      - --pass=agentsfleet
      - --cluster_name=agentsfleet
      - --cluster=nats://0.0.0.0:6222
      - --routes=nats://ant:6222,nats://bee:6222,nats://elk:6222
      - --no_advertise=true
    ports:
      - "127.0.0.1:${AGENTSFLEET_NATS_PORT_3:-4224}:4222"

volumes:
  postgres-data:
