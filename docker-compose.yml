# agentsfleet local dev — Postgres + Redis + agentsfleetd API
# `make up` prepares the matching local linux binary in `dist/` and passes
# `TARGETARCH` to docker compose. CI does not use this path.
#
# The three test-infra services (postgres, redis, qstash) carry NO
# `container_name`, so several git worktrees can run `make test-integration` at
# once. Compose namespaces containers and volumes by project, and the project
# name defaults to the directory basename — already unique per worktree. Pinning
# the name collapses every worktree onto one container: whichever ran last owned
# the database, and the integration lane starts by dropping every schema, so
# concurrent agents silently destroyed each other's runs.
#
# Their host ports are FIXED, and `make` exports the values —
# scripts/test-infra-ports.sh decides them. Letting Docker assign an ephemeral
# port instead — the obvious way to keep worktrees apart — is what that script's
# header documents as broken: an ephemeral published port moves on every
# container restart, and the Makefile resolves it into a URL exactly once, so a
# restart mid-run points the whole suite at a dead port.
#
# Only a LINKED git worktree gets pinned per-project ports. The `:-` defaults
# below are what a primary checkout uses, which is what CI always has, and CI
# hardcodes localhost:5432/6379 into the connection strings it hands the test
# container — so these defaults are load-bearing, not decorative. They also mean
# a bare `docker compose up` in a fresh clone behaves exactly as it always did.
#
# `agentsfleetd` deliberately KEEPS its fixed name and port 3000: it is the
# `make up` dev stack, not test infra, and `localhost:3000` is a documented
# entry point. Two worktrees running `make up` at once still collide — that is
# a real but separate concern, and it is not what the test lane needs.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: agentsfleet
      POSTGRES_PASSWORD: agentsfleet
      POSTGRES_DB: agentsfleetdb
      # Postgres 18+ refuses to run when the data directory equals the mount
      # root. Pointing PGDATA at a subdirectory satisfies the new layout
      # requirement without restructuring the volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Per-worktree but fixed — see the header. scripts/test-infra-ports.sh
      # writes the value; make/test-integration.mk still discovers the live port
      # via `docker compose port`, which now cannot disagree with the container.
      - "${AGENTSFLEET_PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsfleet -d agentsfleetdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    command:
      - sh
      - -c
      - |
        mkdir -p /tls &&
        if [ ! -s /tls/ca.crt ] || [ ! -s /tls/server.crt ] || [ ! -s /tls/server.key ]; then
          # `apk add` lives INSIDE the branch on purpose: the material persists
          # in the redis-tls volume, so it is generated once, but this ran on
          # every container start — an Alpine CDN fetch in front of every
          # integration run, and a hard dependency on the network for files that
          # already existed.
          #
          # A CA and a LEAF, not one self-signed certificate doing both jobs.
          # The old fixture handed clients the server's own leaf as their trust
          # anchor, which OpenSSL-based clients tolerate and rustls refuses —
          # correctly, and in both directions: a trust anchor must carry
          # `CA:TRUE`, an end-entity certificate must not. One certificate
          # cannot satisfy both, so the Rust client could not connect at all
          # while every other client could. A real chain is also what a hosted
          # Redis actually presents, so the fixture now rehearses production
          # rather than a shape only this file has.
          apk add --no-cache openssl &&
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tls/ca.key -out /tls/ca.crt -days 3650 -subj "/CN=agentsfleet-local-ca" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null &&
          openssl req -newkey rsa:2048 -nodes -keyout /tls/server.key -out /tls/server.csr -subj "/CN=localhost" 2>/dev/null &&
          printf 'subjectAltName=DNS:localhost,DNS:redis,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\nextendedKeyUsage=serverAuth\n' > /tls/server.ext &&
          openssl x509 -req -in /tls/server.csr -CA /tls/ca.crt -CAkey /tls/ca.key -CAcreateserial -out /tls/server.crt -days 3650 -extfile /tls/server.ext 2>/dev/null &&
          # A SECOND authority, well-formed and valid, that signs nothing here.
          # `integration_tls_trust.rs` offers it as a trust anchor and requires
          # the connection to be refused. Without it the lane can only show that
          # a correct certificate is accepted, which a client that had stopped
          # verifying would also show.
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tls/foreign-ca.key -out /tls/foreign-ca.crt -days 3650 -subj "/CN=agentsfleet-foreign-ca" -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
        fi &&
        redis-server --tls-port 6379 --port 6380 --tls-cert-file /tls/server.crt --tls-key-file /tls/server.key --tls-ca-cert-file /tls/ca.crt --tls-auth-clients no --requirepass agentsfleet
    ports:
      # Per-worktree but fixed -- see the postgres service above.
      #
      # TWO ports, one server. `--port 6380` beside `--tls-port 6379` is not a
      # weakening of the lane: it is what stops the lane paying for the same
      # proof two hundred times. A TLS connect to this server measures a 232 ms
      # median where plain TCP to the same port measures 0.1 ms, and that cost
      # is a handshake re-proving a certificate authority that does not change
      # between tests. Two hundred live connects spend forty-plus seconds
      # re-establishing trust, and because a connect budget starts before a
      # connection is admitted, the queue that builds is what turns a healthy
      # Redis into `ConnectTimeout`.
      #
      # So ordinary suites take 6380 and TLS is proven where proving it means
      # something: `integration_tls_trust.rs` connects over 6379 and asserts
      # BOTH directions -- the lane's own authority verifies, and a foreign one
      # is refused. That is stronger than what the all-TLS lane had, which only
      # ever showed that a correct certificate works.
      - "${AGENTSFLEET_REDIS_HOST_PORT:-6379}:6379"
      - "${AGENTSFLEET_REDIS_PLAIN_HOST_PORT:-6380}:6380"
    volumes:
      - redis-tls:/tls
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --insecure -a agentsfleet --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  qstash:
    # Upstash's official QStash local dev server, run via Bun. Ships deterministic
    # credentials (fixed token + signing keys), so integration tests point at it
    # with a committed fixture token — no per-run secret. Used by the opt-in live
    # QStash tests (AGENTSFLEET_QSTASH_LIVE_URL/TOKEN); self-skip when it is down.
    # Debian (glibc), not Alpine: the CLI fetches a glibc-linked Go binary that
    # cannot exec under musl.
    image: mirror.gcr.io/oven/bun:1
    command:
      - sh
      - -c
      - |
        cd /tmp
        bun add @upstash/qstash-cli@2.37.18
        # Bun blocks postinstall scripts, so the Go binary the CLI wraps is not
        # fetched by `bun add` — run its installer explicitly before launching.
        bun node_modules/@upstash/qstash-cli/install.js
        exec node_modules/@upstash/qstash-cli/bin/qstash dev -port 8080
    ports:
      # Per-worktree but fixed -- see the postgres service above.
      - "${AGENTSFLEET_QSTASH_HOST_PORT:-8080}:8080"
    healthcheck:
      # Unauthenticated requests 401, which still proves the server is accepting
      # connections; fetch resolves on any HTTP response and rejects only on a
      # connection error, so a resolved fetch means healthy.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      # Generous: the container installs the CLI and downloads its Go binary on
      # first boot, so a cold or slow network needs well past the usual budget —
      # a premature unhealthy verdict fails the whole integration lane.
      retries: 60
      start_period: 30s

  agentsfleetd:
    container_name: agentsfleetd-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "3000:3000"
    env_file:
      # agentsfleetd's local override file (disambiguated from the app's .env.local and
      # the runner's .env.runner.local). Optional — the inline `environment:` block
      # below already satisfies a from-scratch `make up`.
      - path: .env.agentsfleetd.local
        required: false
    environment:
      # Local dev defaults: satisfy role-separated startup checks without
      # requiring a checked-in .env file.
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow
      GITHUB_APP_ID: "12345"
      GITHUB_APP_PRIVATE_KEY: local-dev-private-key
      # Override DB/Redis to use compose service names instead of localhost.
      DATABASE_URL_API: postgresql://agentsfleet:agentsfleet@postgres:5432/agentsfleetdb?application_name=api&sslmode=disable
      REDIS_URL_API: rediss://:agentsfleet@redis:6379/api
      REDIS_TLS_CA_CERT_FILE: /tls/ca.crt
      MIGRATE_ON_START: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - redis-tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  redis-tls:
