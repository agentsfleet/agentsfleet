# agentsfleet local dev — Postgres + Redis + agentsfleetd API
# `make up` prepares the matching local linux binary in `dist/` and passes
# `TARGETARCH` to docker compose. CI does not use this path.
#
# The four test-infra services (postgres, redis, dragonfly, qstash) carry NO
# `container_name`, so several git worktrees can run `make test-integration` at
# once. Compose namespaces containers and volumes by project, and the project
# name defaults to the directory basename — already unique per worktree. Pinning
# the name collapses every worktree onto one container: whichever ran last owned
# the database, and the integration lane starts by dropping every schema, so
# concurrent agents silently destroyed each other's runs.
#
# Their host ports are FIXED, and `make` exports the values —
# scripts/test-infra-ports.sh decides them. Letting Docker assign an ephemeral
# port instead — the obvious way to keep worktrees apart — is what that script's
# header documents as broken: an ephemeral published port moves on every
# container restart, and the Makefile resolves it into a URL exactly once, so a
# restart mid-run points the whole suite at a dead port.
#
# Only a LINKED git worktree gets pinned per-project ports. The `:-` defaults
# below are what a primary checkout uses, which is what CI always has, and CI
# hardcodes localhost:5432/6379 into the connection strings it hands the test
# container — so these defaults are load-bearing, not decorative. They also mean
# a bare `docker compose up` in a fresh clone behaves exactly as it always did.
#
# `agentsfleetd` deliberately KEEPS its fixed name, and `localhost:3000` stays
# the documented entry point of the `make up` dev stack. Its port rides the
# dragonfly service (the two share a network namespace) under
# AGENTSFLEET_API_HOST_PORT, which the test lane sets per worktree so parallel
# lanes do not collide on 3000 the way two `make up` stacks still would.
services:
  postgres:
    image: mirror.gcr.io/library/postgres:18-alpine
    command:
      - sh
      - -c
      - |
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: agentsfleet
      POSTGRES_PASSWORD: agentsfleet
      POSTGRES_DB: agentsfleetdb
      # Postgres 18+ refuses to run when the data directory equals the mount
      # root. Pointing PGDATA at a subdirectory satisfies the new layout
      # requirement without restructuring the volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Per-worktree but fixed — see the header. scripts/test-infra-ports.sh
      # writes the value; make/test-integration.mk still discovers the live port
      # via `docker compose port`, which now cannot disagree with the container.
      - "${AGENTSFLEET_PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsfleet -d agentsfleetdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  dragonfly:
    # A real cluster, not `--cluster_mode=emulated`: two primaries and one
    # replica each, four processes in this one container, bootstrapped and
    # health-checked by scripts/dragonfly-cluster.sh. The nodes announce
    # 127.0.0.1 and the port they bind, and the eight published host ports
    # carry the same numbers, so a MOVED reply resolves from the host, from
    # inside the container and from CI. A multi-container cluster cannot do
    # that: a node announcing its bridge address is unreachable from macOS.
    #
    # Pinned to the release the probe and the prototype proofs ran against.
    # Bumping it is a deliberate act that re-runs `make test-integration-rustd`
    # on both backends, not a drive-by.
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    entrypoint: ["bash", "/scripts/dragonfly-cluster.sh"]
    command: ["serve"]
    environment:
      # The first of the eight ports; the script derives the other seven. The
      # value must equal the published range below for redirects to resolve.
      DRAGONFLY_BASE_PORT: ${AGENTSFLEET_DRAGONFLY_BASE_PORT:-7001}
    ports:
      # Per-worktree but fixed -- see the postgres service above. The four DATA
      # ports as one range; the admin ports (base + 4 .. base + 7) stay inside
      # the container on loopback, unauthenticated, reached only through
      # `docker compose exec`. Both ends come from make/test-infra.mk because
      # compose cannot add 3 to a variable.
      # Five processes: four cluster nodes and, last, the TLS node the trust
      # suite dials (see scripts/dragonfly-cluster.sh). The daemon service
      # below shares this network namespace, so its API port is published here.
      - "${AGENTSFLEET_DRAGONFLY_BASE_PORT:-7001}-${AGENTSFLEET_DRAGONFLY_LAST_PORT:-7005}:${AGENTSFLEET_DRAGONFLY_BASE_PORT:-7001}-${AGENTSFLEET_DRAGONFLY_LAST_PORT:-7005}"
      - "${AGENTSFLEET_API_HOST_PORT:-3000}:3000"
    volumes:
      - ./scripts/dragonfly-cluster.sh:/scripts/dragonfly-cluster.sh:ro
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "bash", "/scripts/dragonfly-cluster.sh", "healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  qstash:
    # Upstash's official QStash local dev server, run via Bun. Ships deterministic
    # credentials (fixed token + signing keys), so integration tests point at it
    # with a committed fixture token — no per-run secret. Used by the opt-in live
    # QStash tests (AGENTSFLEET_QSTASH_LIVE_URL/TOKEN); self-skip when it is down.
    # Debian (glibc), not Alpine: the CLI fetches a glibc-linked Go binary that
    # cannot exec under musl.
    image: mirror.gcr.io/oven/bun:1
    command:
      - sh
      - -c
      - |
        cd /tmp
        bun add @upstash/qstash-cli@2.37.18
        # Bun blocks postinstall scripts, so the Go binary the CLI wraps is not
        # fetched by `bun add` — run its installer explicitly before launching.
        bun node_modules/@upstash/qstash-cli/install.js
        exec node_modules/@upstash/qstash-cli/bin/qstash dev -port 8080
    ports:
      # Per-worktree but fixed -- see the postgres service above.
      - "${AGENTSFLEET_QSTASH_HOST_PORT:-8080}:8080"
    healthcheck:
      # Unauthenticated requests 401, which still proves the server is accepting
      # connections; fetch resolves on any HTTP response and rejects only on a
      # connection error, so a resolved fetch means healthy.
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      # Generous: the container installs the CLI and downloads its Go binary on
      # first boot, so a cold or slow network needs well past the usual budget —
      # a premature unhealthy verdict fails the whole integration lane.
      retries: 60
      start_period: 30s

  agentsfleetd:
    container_name: agentsfleetd-api
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    # The cluster nodes announce 127.0.0.1 — the property that makes a MOVED
    # reply resolve from the host and from CI — so a peer container can only
    # reach them from inside the same network namespace. That is what this
    # is: the daemon's loopback IS the cluster's. Its API port is published on
    # the dragonfly service above, because a container sharing a namespace
    # cannot publish its own.
    network_mode: "service:dragonfly"
    env_file:
      # agentsfleetd's local override file (disambiguated from the app's .env.local and
      # the runner's .env.runner.local). Optional — the inline `environment:` block
      # below already satisfies a from-scratch `make up`.
      - path: .env.agentsfleetd.local
        required: false
    environment:
      # Local dev defaults: satisfy role-separated startup checks without
      # requiring a checked-in .env file.
      ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow
      GITHUB_APP_ID: "12345"
      GITHUB_APP_PRIVATE_KEY: local-dev-private-key
      # Override DB/Redis to use compose service names instead of localhost.
      DATABASE_URL_API: postgresql://agentsfleet:agentsfleet@postgres:5432/agentsfleetdb?application_name=api&sslmode=disable
      # No path segment. `redis_config.zig:109` takes `hostpath[0..slash_pos]`
      # and never reads what follows, so the `/api` this line carried since
      # M92 selected nothing — the Zig daemon has always used db 0. redis-rs
      # parses that same segment as a database INDEX and refuses `api` with
      # `Invalid database number`, so the suffix booted one daemon by being
      # ignored and blocked the other by being read. Dropped rather than
      # spelled `/0`: db 0 is the default, and a segment nothing selects is
      # the thing that made this ambiguous.
      # The cluster seed. Plaintext on purpose: the socket never leaves this
      # container's loopback, and TLS is proven by the trust suite.
      DRAGONFLY_URL: redis://:agentsfleet@127.0.0.1:${AGENTSFLEET_DRAGONFLY_BASE_PORT:-7001}
      MIGRATE_ON_START: "1"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    # No healthcheck. The image is distroless — no shell, no wget, no HTTP
    # client — so a compose healthcheck has nothing to run and the container
    # would sit unhealthy forever. Readiness is declared where it is acted on:
    # deploy/fly/agentsfleetd-{dev,prod}/fly.toml's `[checks.readiness]` polls
    # /readyz. Nothing here depends on this service being healthy.

volumes:
  postgres-data:
  dragonfly-data:
