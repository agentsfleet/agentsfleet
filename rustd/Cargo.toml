# Workspace root for the Rust daemon port.
#
# Every crate sits in one layer folder under `crates/`, with the directory name
# equal to the crate name, except a layer's binary, whose folder is `main`
# (Indy, Nov 07, 2026, superseding the flat M-CRATES-FLAT-FOLDER layout of
# Aug 23, 2026):
#
#   foundation/  no product knowledge: errors, validation, crypto
#   protocol/    the types both binaries speak
#   harness/     the model, secret and egress seams the agent harness drives
#   runner/      `agentsfleet-runner` (`runner/main`) and the crates only it links
#   daemon/      `agentsfleetd` (`daemon/main`) and the crates only it links
#   e2e/         test-only crates that may depend on every layer; nothing
#                depends on them
#
# A crate depends on its own layer or a lower one, `runner/` and `daemon/`
# never on each other, and nothing on `e2e/`, in every dependency table: normal,
# build and dev. `af_e2e`'s `tests/layers.rs` enforces it. The agent harness,
# `guffbolt/`, sits beside `crates/` rather than in a layer: it is a standalone
# harness, publishable on its own, that depends on no crate of this workspace,
# so any layer may depend on it.
# This root is a VIRTUAL manifest: no `[package]`, so it builds no library or
# binary of its own. The workspace mechanics (virtual root, explicit member
# list, the lint rationale below) come from ~/Projects/oss/bun.
#
# Every setting a member could restate lives here instead (M-CARGO-WORKSPACE):
# members inherit package metadata via `.workspace = true`, dependency versions
# from `[workspace.dependencies]`, and the whole lint policy from
# `[workspace.lints]`.

[workspace]
resolver = "3"
members = [
    # foundation: no product knowledge
    "crates/foundation/af_config",
    "crates/foundation/af_core",
    "crates/foundation/af_crypto",
    "crates/foundation/af_validate",
    # protocol: the types both binaries speak
    "crates/protocol/af_context",
    "crates/protocol/af_fleet_runtime",
    "crates/protocol/af_observability",
    "crates/protocol/af_otlp",
    "crates/protocol/af_stream",
    "crates/protocol/af_webhook",
    "crates/protocol/af_wire",
    # harness: the model, secret and egress seams the agent harness drives
    "crates/harness/af_egress",
    "crates/harness/af_inference",
    "crates/harness/af_providers",
    "crates/harness/af_secrets",
    # runner: `agentsfleet-runner` and the crates only it links
    "crates/runner/afr_agent",
    "crates/runner/afr_executor",
    "crates/runner/afr_memory",
    "crates/runner/afr_sandbox",
    "crates/runner/afr_supervisor",
    "crates/runner/afr_telemetry",
    "crates/runner/afr_tools",
    # `agentsfleet_runner`, the runner binary; nothing depends on it.
    "crates/runner/main",
    # daemon: `agentsfleetd` and the crates only it links
    "crates/daemon/afd_admin",
    "crates/daemon/afd_api",
    "crates/daemon/afd_api_ingress",
    "crates/daemon/afd_api_operator",
    "crates/daemon/afd_api_runner",
    "crates/daemon/afd_api_tenant",
    "crates/daemon/afd_api_wire",
    "crates/daemon/afd_approval",
    "crates/daemon/afd_auth",
    # `afd_bench`, the measurement lanes; nothing depends on it.
    "crates/daemon/afd_bench",
    "crates/daemon/afd_billing",
    "crates/daemon/afd_bus",
    "crates/daemon/afd_connector",
    "crates/daemon/afd_credential",
    "crates/daemon/afd_cron",
    "crates/daemon/afd_db",
    "crates/daemon/afd_fleet",
    "crates/daemon/afd_fleet_lifecycle",
    "crates/daemon/afd_fleet_ops",
    "crates/daemon/afd_gate",
    "crates/daemon/afd_gateway",
    "crates/daemon/afd_http",
    "crates/daemon/afd_identity",
    "crates/daemon/afd_ingress",
    "crates/daemon/afd_mail",
    "crates/daemon/afd_memory",
    "crates/daemon/afd_outbound",
    "crates/daemon/afd_runner",
    "crates/daemon/afd_setup",
    "crates/daemon/afd_sse",
    "crates/daemon/afd_state",
    "crates/daemon/afd_tenant",
    "crates/daemon/afd_turns",
    "crates/daemon/afd_vault",
    "crates/daemon/main",
    # e2e: test-only crates over every layer; nothing depends on them
    # `af_e2e`: the daemon-and-runner suites, the recovery bench and the layer
    # test; nothing depends on it.
    "crates/e2e/af_e2e",
    # standalone: the agent harness, beside `crates/`
    "guffbolt",
]
# Vendored upstream crates patched below: not ours to lint, test or grade.
exclude = ["patches/datagram-socket"]

[workspace.package]
version = "0.78.0"
edition = "2024"
# Equal to the pinned toolchain rather than trailing it (M-MSRV allows a lag for
# published libraries; these crates have no external consumers and are built
# only by rust-toolchain.toml's pin, so a lower floor would be an untested claim).
rust-version = "1.100.0"
# MIT, matching the repository's own `LICENSE` and `cli/package.json`. The
# manifest said Apache-2.0 from its first commit, which made this workspace the
# only part of the product claiming a licence the project does not ship under —
# a claim a downstream reader would have taken at face value.
license = "MIT"
authors = ["Kishore Kumar (indykish) <nkishore@megam.io>"]
repository = "https://github.com/agentsfleet/agentsfleet"
readme = "../../README.md"
keywords = ["agentsfleet", "daemon", "runner"]
categories = ["network-programming"]

[workspace.dependencies]
# Intra-workspace members resolve through the workspace, never by direct sibling
# path (M-CRATES-IN-WORKSPACE). By layer, as `members` is; each line says what
# the crate holds. The two binaries' crates are named only where a crate needs
# them; `afd_bench` and `af_e2e` have no entry: nothing depends on them.

# --- foundation: no product knowledge
# Layered TOML loading into the caller's validated settings type.
af_config = { path = "crates/foundation/af_config" }
# No-I/O primitives: ids, error codes and the error shell, limits, money, paging, clock.
af_core = { path = "crates/foundation/af_core" }
# Envelope encryption, message authentication, entropy and secret types.
af_crypto = { path = "crates/foundation/af_crypto" }
# Bounds on untrusted input garde lacks: custom rules, a route-ceilinged `?limit`,
# and the report-to-sentence table.
af_validate = { path = "crates/foundation/af_validate" }

# --- protocol: the types both binaries speak
# Model-window planning, compaction and checkpoints, over a store trait its
# embedders implement; it holds no store.
af_context = { path = "crates/protocol/af_context" }
# The fleet Definition: configuration parsed once into the typed policy every
# gate reads, and the setup proposal rules.
af_fleet_runtime = { path = "crates/protocol/af_fleet_runtime" }
# The telemetry vocabulary, metric families and export machinery.
af_observability = { path = "crates/protocol/af_observability" }
# The OTLP transport both binaries build their pipelines through: the knobs,
# the exporters inside `af_observability`'s counting wrappers, the globals.
af_otlp = { path = "crates/protocol/af_otlp" }
# Bounded framing and the HTTP/2 and HTTP/3 duplex transports of a runner session.
af_stream = { path = "crates/protocol/af_stream" }
# The signature wall: what an unauthenticated delivery must prove before
# anything reads its body.
af_webhook = { path = "crates/protocol/af_webhook" }
# The `/v1/runners` protocol types the daemon and runner exchange.
af_wire = { path = "crates/protocol/af_wire" }

# --- harness: the model, secret and egress seams the agent harness drives
# The runner's outbound guard: a request admitted against the run's network
# policy, its credentials placed at send time, no private address reached.
af_egress = { path = "crates/harness/af_egress" }
# Model API codecs, transport and stream over rig, and the persisted inference
# settings they validate.
af_inference = { path = "crates/harness/af_inference" }
# guffbolt's `Model` over every provider wire.
af_providers = { path = "crates/harness/af_providers" }
# The runner's secrets and the one masker every outbound text passes.
af_secrets = { path = "crates/harness/af_secrets" }

# --- runner: `agentsfleet-runner` and the crates only it links
# The agent engine: one run's turn over guffbolt.
afr_agent = { path = "crates/runner/afr_agent" }
# The in-sandbox process and file executor and its socket protocol.
afr_executor = { path = "crates/runner/afr_executor" }
# One run's memory, loaded and pushed through agentsfleetd.
afr_memory = { path = "crates/runner/afr_memory" }
# The sandbox engines: the interface every engine meets, and bubblewrap.
afr_sandbox = { path = "crates/runner/afr_sandbox" }
# The trusted runner half: pool, renew, report, recovery, verbs, downlink.
afr_supervisor = { path = "crates/runner/afr_supervisor" }
# The runner's telemetry: the credential-free endpoint, the span budget and
# the runner's own metric families. Every runner crate that measures records
# through it; it depends on none of them but the tool catalog.
afr_telemetry = { path = "crates/runner/afr_telemetry" }
# The tool catalog and the handlers adapting guffbolt's tools.
afr_tools = { path = "crates/runner/afr_tools" }

# --- daemon: `agentsfleetd` and the crates only it links
# The priced-model catalogue and platform-default metadata.
afd_admin = { path = "crates/daemon/afd_admin" }
# The HTTP shell: the route table, admission and the refusal shape.
afd_api = { path = "crates/daemon/afd_api" }
# Signed-delivery HTTP handlers.
afd_api_ingress = { path = "crates/daemon/afd_api_ingress" }
# Operator HTTP handlers.
afd_api_operator = { path = "crates/daemon/afd_api_operator" }
# Runner-control HTTP handlers.
afd_api_runner = { path = "crates/daemon/afd_api_runner" }
# Tenant HTTP handlers.
afd_api_tenant = { path = "crates/daemon/afd_api_tenant" }
# The daemon's own API types: every admin, tenant, operator and ingress shape
# no runner speaks. Split from `af_wire` so an edit here rebuilds no runner
# crate.
afd_api_wire = { path = "crates/daemon/afd_api_wire" }
# Approval gates: the queue, the one decision Postgres admits, and the
# continuation an approval lands.
afd_approval = { path = "crates/daemon/afd_approval" }
# Credential proof and capability decisions, with no datastore.
afd_auth = { path = "crates/daemon/afd_auth" }
# What a run costs and what a tenant has. Split out of `afd_fleet` because it
# reads the `billing.*` schema rather than `core.*`, and only the admission gate
# calls it: the run plane's other lines never ask about money.
afd_billing = { path = "crates/daemon/afd_billing" }
# Signals over the NATS message bus: subjects, wakes, subscriptions.
afd_bus = { path = "crates/daemon/afd_bus" }
# Connecting a workspace to a third party: the signed install state, the
# code-for-token exchange, and the grant that lands in the vault. Its own crate
# rather than a module in `afd_api` for the reason `afd_ingress` is one — the
# state machine and the vendor conversation are decided with no router in
# sight, and `afd_api` is already the workspace's largest crate.
afd_connector = { path = "crates/daemon/afd_connector" }
# What a run may USE: the declared secret, the vault that opens it, the provider
# it dials, the token a broker mints. Split from afd_fleet once the one misfiled
# file (an `impl Plane` living under credential/) stopped tying it to the run.
afd_credential = { path = "crates/daemon/afd_credential" }
# Fleet schedules: the stored intent, the external scheduler it is reconciled
# against, and the signed fire that wakes a fleet.
afd_cron = { path = "crates/daemon/afd_cron" }
# Pools per role, the migrator, the schema files and the test seeds.
afd_db = { path = "crates/daemon/afd_db" }
# The run plane: assigning, renewing and settling a fleet's runs, the turn
# checkpoints they write, and durable tasks. One crate: a report settles its
# task inside the run's transaction.
afd_fleet = { path = "crates/daemon/afd_fleet" }
# Deliberately NOT folded into `afd_fleet`, which is the run plane and is
# already 25,500 lines — 3.5 times its nearest sibling, and the exact condition
# that forced `afd_tenant` out of it. Nor into `afd_tenant`, whose api-key and
# login modules would then rebuild behind a configuration parser and a bus
# client they never call.
afd_fleet_lifecycle = { path = "crates/daemon/afd_fleet_lifecycle" }
# The operator's READ plane: cross-table projections a dashboard asks for, over
# a pool and the wire types and nothing else. Separate from `afd_runner`, which
# is the host's own plane and WRITES it — a run-history join reaching for
# `fleet.fleets` and `thread.turns` would put both on the heartbeat path.
afd_fleet_ops = { path = "crates/daemon/afd_fleet_ops" }
# What a fleet is ALLOWED to do, and the gate a run stops at when the answer
# needs a person. The run plane calls down into it at two moments and it
# calls back at none, which is what let it out.
afd_gate = { path = "crates/daemon/afd_gate" }
# The runner connection owner: one authenticated native session per host.
afd_gateway = { path = "crates/daemon/afd_gateway" }
# Transport policy the handler crates share: admission, authentication,
# the envelope and the route metadata.
afd_http = { path = "crates/daemon/afd_http" }
# The identity provider's side: JSON Web Token verification and users.
afd_identity = { path = "crates/daemon/afd_identity" }
# What a signed delivery is resolved against: the fleet's binding, its signing
# secret, and the at-most-once append. Not folded into `afd_turns`, which owns
# the same table's reads: this needs the vault and the config parser, and
# adding them there would put AES-GCM and a configuration document reader
# behind every history page the dashboard asks for.
afd_ingress = { path = "crates/daemon/afd_ingress" }
# Product email: the invite rendered from templates kept in this repository and
# sent over SMTP through the relay the `smtp-relay` platform bag names. Its own
# crate so the transport, its TLS posture and the templates have one owner, and
# the tenant store never links a mail client.
afd_mail = { path = "crates/daemon/afd_mail" }
# Fleet memory behind one store trait. Its own crate so the run plane and both
# route families reach memory through the trait, and a store for another vendor
# is a new implementation rather than an edit to the run plane.
afd_memory = { path = "crates/daemon/afd_memory" }
# Delivering answers back to connectors.
afd_outbound = { path = "crates/daemon/afd_outbound" }
# The HOST's plane, split from `afd_fleet` (the RUN's plane): enrolment,
# liveness, the assertion verdict, and the liveness and census sweepers. The two
# meet at exactly one audit row, and that meeting is a vocabulary import.
afd_runner = { path = "crates/daemon/afd_runner" }
# Setup drafts and candidates, the daemon half of a setup run, and the draft's
# context checkpoint store.
afd_setup = { path = "crates/daemon/afd_setup" }
# One SSE connection's frames and the fan-in behind a workspace stream. Its own
# crate rather than a module in `afd_api`: the frame shapes, the sequence
# discipline and the concurrent-stream ceiling are decided with no router in
# sight, and `afd_api` is already the workspace's largest crate.
afd_sse = { path = "crates/daemon/afd_sse" }
# The credential-directory reads authentication starts from, and the run,
# fleet and runner status spellings.
afd_state = { path = "crates/daemon/afd_state" }
# API keys, command-line credentials, device login and workspace ownership.
afd_tenant = { path = "crates/daemon/afd_tenant" }
# `thread.turns` and its live items: durable intake, one turn per producer key,
# ordering, backlog and wake. A crate of its own because the table had no
# owner: its statements sat in `afd_fleet::sql` behind the whole run plane, so
# `afd_approval` copied the insert rather than depend on runs, money, policy
# and four sweepers to reuse ten lines of SQL.
afd_turns = { path = "crates/daemon/afd_turns" }
# The one reader and writer of `vault.secrets`: the workspace secret surface,
# the runner plane's by-name and locked reads, and the typed bag reader.
# Deliberately NOT folded into `afd_fleet`, which is thirty thousand lines, nor
# into `afd_state`, which is the credential directory the authentication path
# cannot start without and would then rebuild every login when a projection
# column moved.
afd_vault = { path = "crates/daemon/afd_vault" }
# The daemon binary, `daemon/main`; its library is what the suites boot.
agentsfleetd = { path = "crates/daemon/main" }

# --- standalone: the agent harness, beside `crates/`
# The agent harness: one loop's order of turns over the embedder's
# conversation, what a run of one kind adds as an extension, and the tools a
# loop is offered. Outside the layer folders: it depends on no crate here.
guffbolt = { path = "guffbolt" }

# Input token counts that bound each model call against its context window
# (`af_inference`): exact for a model `tiktoken-rs` knows, estimated otherwise.
tiktoken-rs = { version = "0.12.1", default-features = false }
percent-encoding = "2.3.2"
# Every known secret value replaced in one pass over a tool's output, a frame
# or a reply: leftmost-longest multi-pattern matching, rather than one scan per
# secret. Already in the graph through `regex`.
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] }
# Anonymous sparse mappings exercise matcher size refusals without allocating their contents.
memmap2 = { version = "0.9.12", default-features = false }

# `default-features = false` throughout, features named explicitly, so a member
# cannot silently acquire a feature a sibling enabled (M-CARGO-WORKSPACE).
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
serde_path_to_error = { version = "0.1.20", default-features = false }
# Tagged answer enums retain numeric JSON map keys through Serde's buffered data.
serde_with = { version = "3.25.0", default-features = false, features = ["std"] }
# The metric census is a tab-separated contract, and this is the crate that
# reads one: delimiter, `#` comment lines, header-to-field mapping, unequal-row
# detection and serde-typed deserialization are all its job rather than ours,
# and every error it raises already carries the record and line it failed on.
csv = "1.4.0"
serde_json = { version = "1.0.154", default-features = false, features = ["std", "preserve_order", "raw_value"] }
# Test-only Rust tokenization and literal decoding for the compiled-prompt guard.
proc-macro2 = "=1.0.107"
syn = { version = "=3.0.10", default-features = false, features = ["parsing"] }
# A tool's parameters are the JSON Schema of the type its arguments parse into,
# derived from that type so the two cannot drift. rig-core already builds it.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
# `raw_value` carries `RawValue`, which is how the activity verb splices a
# runner's already-JSON tool arguments into a published frame WITHOUT parsing
# them into a tree and re-encoding it, which would build and drop a whole
# `serde_json::Value` per tool call. A feature on a dependency
# already resolved in the lock, not a new crate.
# The OpenAPI document generator, and the reason it is `optional` at every
# member that names it. `af_wire` carries serde and serde_json deliberately
# and nothing else; a schema compiler is a BUILD-time tool, so it is reachable
# only under the non-default `openapi` feature and the shipped daemon resolves
# a graph without it. The pattern is the one `json-patch`, `compact_str`,
# `mistralrs-mcp` and the generated `google-apis-rs` crates already use.
#
# `macros` is the only feature taken: it carries `ToSchema`, `IntoParams` and
# `OpenApi`, which is the whole of what the derives and the collectors need.
# `jiff_0_2` publishes every `jiff::Timestamp` field as `type: string, format:
# date-time`, so no `_at` field carries a hand-written schema attribute.
utoipa = { version = "6.0.0", default-features = false, features = ["macros", "jiff_0_2"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }
async-trait = { version = "0.1.92", default-features = false }

# Field bounds as annotations on the schema rather than as a hand-written
# checker. `derive` only: `regex`, `email`, `phone-number` and `credit-card`
# each pull their own dependency and none of them is a shape this product
# authors. Its `garde_derive` rides the syn 2.0.119 already in the lock.
garde = { version = "0.23.0", default-features = false, features = ["derive", "pattern"] }
# A refusal sentence built from the bound it names, at compile time.
# `Sentences` tables are `const` and std cannot format a number in a `const`,
# so without it every sentence would spell the bound a second time.
const_format = { version = "0.2.37", default-features = false }

# The command line, derived rather than hand-rolled.
#
# A hand-parsed `--port` loop over argv is how a daemon ends up reading
# argv[1] and NOTHING else: no `--help`, no `--version`, and a port that could only arrive through
# the environment. Every one of those is a line item clap already owns, and a
# hand-rolled parser is precisely the invented code a Rust port exists to
# delete.
#
# Features named rather than defaulted, per the rule above. `env` is the
# load-bearing one: it makes `PORT` a documented FALLBACK for `--port` in the
# generated help, rather than a second undocumented input path. `color` and
# `wrap_help` are left off — the daemon's usage output is read out of a
# container log, where escape sequences and terminal-width reflow are noise.
clap = { version = "4.6.9", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }

# RustCrypto. Pure Rust with no C linkage, the workspace's posture, and the
# AES-256-GCM construction every stored vault row was sealed with.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
# Lower-case hex, for the credential digests and minted token bodies every
# stored class is built from. Already in the lock via sqlx; taken directly
# because a hand-written `write!("{:02x}")` loop is a place for a leading zero
# to go missing, and this workspace prefers a crate to a re-derivation.
hex = { version = "0.4.3", default-features = false, features = ["std"] }

# Constant-time comparison. RULE CTM: a byte-by-byte `==` over a secret leaks how
# much of a guess was right through how long it took to reject.
subtle = { version = "2.6.1", default-features = false }
# No `derive`: `zeroize_derive` is the only crate in this graph still on syn 2,
# and a duplicate syn fails `clippy::multiple_crate_versions`. Three hand-written
# `Drop` impls are cheaper than a second proc-macro inside a crypto crate anyway.
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }
# The only system call this workspace's crypto makes.
getrandom = { version = "0.4.3", default-features = false }

# Version-7 identifier construction. ALREADY in the lock at this version via
# moka, so this is a feature flag on a compiled crate rather than a new
# dependency — and it is not on `af_core`'s FORBIDDEN list, which polices
# runtimes, datastores and transports.
#
# Only `Builder::from_unix_timestamp_millis` is used: it takes the 48-bit
# millisecond field and ten caller-supplied entropy bytes and sets the version
# and variant nibbles. The entropy is still drawn by `af_crypto`, so the "one
# system call" claim holds — nothing here asks uuid for randomness.
#
# The PARSE side stays hand-written in `af_core::id`, and that is not
# duplication: `Uuid::parse_str` is case-INSENSITIVE and normalises, while this
# product rejects uppercase outright so one entity cannot have two spellings.
# A crate that cannot express the invariant is not a shortcut to it.
# WHATWG URL parsing, for the tenant-supplied endpoint guard. ALREADY in the
# lock at this version, so this is a feature flag on a compiled crate rather
# than a new dependency.
url = { version = "2.5.9", default-features = false }

# Return completed SQL sessions to the pool; detach cancelled task transactions.
scopeguard = "1.2.0"

uuid = { version = "1.29.3", default-features = false, features = ["v7", "std"] }

# Civil-calendar arithmetic, for the monthly budget window.
#
# The monthly ceiling opens at the first instant of the UTC month, and
# `clock.startOfUtcMonthMillis` computes that by hand: epoch-day → year-day →
# month-day, then subtracting the 0-based day index. It is correct, and it
# carries its own leap-February test to prove it — which is the tell. Calendar
# arithmetic is a solved problem with a long tail of wrong answers, and a spend
# ceiling that opens on the wrong day is one nobody can reconcile against an
# invoice.
#
# jiff rather than chrono or time, AGAINST the download numbers and recorded as
# a trade rather than presented as a free win — the same shape as this
# workspace's `garde` pick. Measured Aug 25 2026: time 161.8M recent downloads,
# chrono 161.3M, jiff 56.6M. All three are actively maintained (last publishes
# Aug 1, Jun 4, Jul 25) and NONE is already in the lock, so there is no
# incumbent to prefer and no free option.
#
# What jiff has that the other two do not is the distinction this window turns
# on: a CIVIL DATE is a separate type from an instant, so "the first of the
# month" is `Date::first_of_month` — a value of the right kind — rather than an
# instant with its time fields overwritten. chrono and time can both compute the
# same answer; they express it as mutation of a timestamp, which is the shape
# that lets a time-of-day component survive a refactor and move a tenant's
# billing month by a few hours. Per the `uuid` note above: a crate that cannot
# express the invariant is not a shortcut to it.
#
# The cost of the trade, stated: fewer eyes on it than chrono or time, and a
# 0.2 series that may still break API. Confined to ONE function
# (`money::window::month_floor`), so a breaking change is a one-site fix and a
# swap to `time` stays cheap if the maintenance signal ever turns.
#
# No `tz-system`: every window here is UTC by definition, so reading the host's
# zone database would be a way for two replicas to disagree about when a
# tenant's month started. `std` only — the alloc-free and serde halves are for
# consumers this workspace does not have.
#
# The rolling DAY window is NOT a calendar question and does not use this:
# `setup.mdx` documents it as "rolling 24-hour", not "since midnight", so it
# stays plain millisecond subtraction in `money::window` where that is legible.
# `tzdb-zoneinfo` reads the system timezone database rather than bundling one:
# zero extra crates, zero binary growth, and the deploy image already ships
# `/usr/share/zoneinfo` (gcr.io/distroless/static-debian13:nonroot, verified).
# It lets a zone name be VALIDATED against the real database instead of
# pattern-matched — see `afd_cron::validate::timezone`.
jiff = { version = "1.0.1", default-features = false, features = [
  "std",
  "tzdb-zoneinfo",
  # Every instant on the wire is a `jiff::Timestamp` serialized as RFC 3339 in
  # UTC (HTTP-TIME, `.orly/standards/domains/http-responses.md`), with no hand adapter.
  "serde",
] }
# The sqlx bridge for `jiff::Timestamp` <-> `TIMESTAMPTZ`. The orphan rule keeps
# every crate here from implementing sqlx's traits for jiff's type, so row
# fields decode through `#[sqlx(try_from = "jiff_sqlx::Timestamp")]` and binds go
# through `ToSqlx`. Postgres only; its sqlite half stays off.
jiff-sqlx = { version = "1.0.0", default-features = false, features = ["postgres"] }

# Base64url, for JSON Web Key components and the three segments of a session
# token. `default-features = false` is load-bearing here rather than habitual:
# 0.23's default set includes `simd-unsafe`, which reaches for SIMD through
# unsafe code. This workspace denies `unsafe_op_in_unsafe_fn` and links no
# hand-written unsafe of its own, and a JWKS document is three kilobytes read
# twice a day — there is no throughput here to trade the posture for.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
# Bounded YAML decoding for native GitHub validation-workflow inspection.
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }
# Immutable private checkpoint objects and native SigV4 transfer authorizations.
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
aws-sigv4 = "=1.6.6"
aws-credential-types = "=1.3.1"

# The ONE cryptographic backend this workspace links.
#
# Was `ring`, chosen because a JWKS publishes raw big-endian `n` and `e` and
# `ring::signature::RsaPublicKeyComponents` accepts exactly that, where rustls's
# own verifier wants a DER `SubjectPublicKeyInfo`. That reasoning is unchanged —
# `aws_lc_rs::signature::RsaPublicKeyComponents` has the same shape, which is
# deliberate: AWS-LC-RS is published as a ring-compatible library.
#
# What changed is that the choice stopped being free. reqwest 0.13 collapsed
# its TLS features so plain `rustls` forces `aws-lc-rs`. Keeping ring
# alongside would put TWO `CryptoProvider`s in one binary — the failure the
# previous pin existed to avoid — so the resolution is one provider, not a
# pin that can no longer hold.
#
# `aws-lc-sys` compiles C (a BoringSSL fork), which ends this workspace's
# no-C-linkage posture. Verified to build here without cmake, on Apple clang
# alone; the musl cross-compile is unproven and is a cutover (M181) concern,
# since CI ships no Rust binary today.
#
# NO ring-compatibility features here, and that was measured rather than
# assumed. `ring-sig-verify` only preserves ring's `VerificationAlgorithm::verify`
# signature (which takes `untrusted::Input`) — the verifier this workspace
# actually calls, `RsaPublicKeyComponents::verify`, is ungated and already takes
# `&[u8]`, so the feature bought nothing but a dependency. `ring-io` is needed by
# ONE signing test and is declared on that crate's dev-dependency instead, where
# it says who needs it.
#
# Both are aws-lc-rs DEFAULTS, so `default-features = false` is what makes the
# question askable at all. Enabling them because a build failed — rather than
# reading which call site failed and why — is how a compatibility shim becomes
# permanent.
aws-lc-rs = { version = "1.19.0", default-features = false, features = [
    "aws-lc-sys",
    "alloc",
] }
# The PEM `PUBLIC KEY` a toolbox release is signed against, as `cosign` writes
# it, read into the SubjectPublicKeyInfo `aws-lc-rs` verifies with. Already in
# the build through rustls; declared so the runner's sandbox crate names it.
rustls-pki-types = { version = "1.16.0", default-features = false, features = ["std"] }

# Product analytics: the async client only. It still compiles reqwest's
# blocking client and chrono, which nothing here calls.
posthog-rs = { version = "0.33.1", default-features = false, features = ["async-client"] }
# The workspace's first-run naming. Declared here like every other dependency:
# a version in a member manifest is the one place drift can start.
petname = { version = "3.2.0", default-features = false, features = ["default-words"] }
# The subject to capability-claim cache. `future` rather than `sync`: the
# request path is asynchronous, and `try_get_with` coalesces concurrent loads
# for the same key, so no hand-rolled sequence counter has to stop an
# out-of-order response resurrecting a pre-revocation claim. With one flight
# per subject there is no second response to be out of order with.
moka = { version = "0.12.16", default-features = false, features = ["future"] }

# The JWKS fetch and the provider capability call.
#
# WAS PINNED TO 0.12 DELIBERATELY, and that pin is now released rather than
# forgotten. Its reason was exact: 0.13 collapsed the TLS features so plain
# `rustls` forces `aws-lc-rs`, which would have put a SECOND rustls provider
# beside ring. The JWKS verifier above and sqlx below now run on `aws-lc-rs`
# too, so 0.12's ring path would itself be the second provider, and the
# workspace resolves to one provider instead.
#
# Two properties the 0.12 features bought are GONE, and both are behaviour:
#
#   - In-binary trust anchors. 0.13 removed `webpki-roots` entirely and uses
#     `rustls-platform-verifier`, so verification now depends on the system
#     trust store. A slim container without `ca-certificates` would fail to
#     verify where 0.12 succeeded; `Dockerfile` installs it, which is what
#     makes this safe rather than merely survivable.
#   - Nothing else: `gzip` stays absent for the reason it always was, so wire
#     bytes equal decoded bytes and `JWKS_MAX_RESPONSE_BYTES` is a correct
#     bound with no streaming decompressor to size.
#
# `form` is the credential broker's, so no hand-written RFC 3986 encoder
# builds one here. `serde_urlencoded` encodes a refresh grant whose values are
# provider-issued opaque bytes, where a `+` or an `&` that escapes its field
# changes the SHAPE of the form at the token endpoint. That is not a place to
# carry our own encoder.
reqwest = { version = "0.13.5", default-features = false, features = ["form", "rustls", "stream"] }
# Git on the runner host: the supervisor fetches a fleet's repository into a
# per-workspace mirror and checks it out into the run's workspace, so the
# token never enters the sandbox. A native library, not a spawned `git`,
# per the operating model's native-SDK rule; Codex reads repositories with it
# too. Network and checkout features are chosen by the crate that uses them.
#
# Keep checkout features narrow: `worktree-mutation` also pulls `status`,
# `dirwalk` and removal support that this checkout does not call.
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
# The credential placeholder grammar, `${secrets.NAME.FIELD}`, matched and
# substituted in one pass by the egress guard (Indy, Oct 03: "Use regex").
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Overlapping private spellings need every accepting pattern, not one alternative.
regex-automata = { version = "0.4.19", default-features = false, features = ["std", "syntax", "dfa-build", "dfa-search"] }
# `web_fetch` reads a page's text, never its markup: scripts, styles and tags
# go, links keep their target. A real HTML parser rather than a hand-written
# tag scanner.
html2text = { version = "0.17.4", default-features = false }
# `guffbolt`'s `image` tool decodes a picture and scales one longer than
# 2,048 px on a side down to fit, as Codex's `codex-utils-image` does. Only the
# four codecs the provider wires take.
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# The Model Context Protocol client `guffbolt`'s tools reach a server through:
# the official SDK, Codex's and pi's choice. Client side only; a stdio server
# runs through the harness's own `Env`, so the SDK's child-process transport is
# left out, and a remote one speaks streamable HTTP over the `reqwest` above.
rmcp = { version = "3.11.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

# The model providers' wire: Anthropic Messages, OpenAI Responses and every
# OpenAI-compatible chat dialect, streamed, with tool calls assembled, usage
# split and reasoning carried across turns. IronClaw builds its provider layer
# on the same library; the runner owns what rig does not: which providers a
# run may reach, the transport (one client, no redirect, `backon` retry), the
# key's one header and the secret scrub. Pinned exactly: rig's minors break
# their API (0.43 listed 40 breaking entries), so an upgrade is a reviewed
# change. No default features: the transport is ours, so no HTTP stack, async
# runtime or TLS comes with it.
rig-core = { version = "=0.46.0", default-features = false }

# A provider's `Retry-After` in its HTTP-date form (RFC 9110, `Retry-After`). Already in
# the lock through hyper, which parses the same header family with it.
httpdate = { version = "1.0.3", default-features = false }

# Postgres. `migrate` is on: SQLx's `Migrator` applies the schema slots from the
# explicit list in `afd_db`, under `afd_db`'s own bounded advisory lock (SQLx's
# lock is switched off). `macros` stays off: queries are static `.sql` files
# checked by one `PREPARE`-every-file integration test, not compile-time macros.
#
# `tls-rustls-aws-lc-rs` rather than native roots: sqlx still enables
# `webpki-roots`, so the trust anchors ship in the binary. An explicit
# `sslrootcert` connection parameter remains an operator override whose file
# sqlx reads at handshake time.
sqlx = { version = "0.9.1", default-features = false, features = [
    "runtime-tokio",
    # aws-lc-rs, not ring: reqwest 0.13 forces that provider, and two
    # providers in one binary is the state this feature was originally pinned
    # to prevent.
    "tls-rustls-aws-lc-rs",
    "postgres",
    "migrate",
] }
# The runtime sqlx drives. `rt-multi-thread` is a dev-dependency concern (the
# contention tests need real parallelism); the library asks only for what it
# uses at a call site.
# `sync` carries `Semaphore`, which IS the admission ceiling: `try_acquire_owned`
# refuses instantly when the instance is full and hands back a permit that
# releases on drop, so a shed needs no counter arithmetic and a completed
# request needs no release path to forget. It was already reaching these crates
# through sqlx's own feature set — naming it here makes three
# existing call sites (`hub.rs`, `jwks/cache.rs`) depend on a stated feature
# rather than on unification holding.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time", "macros"] }
# Latency percentiles for the measurement lanes, and only for them.
#
# The lanes report a p95 and a p99 over every operation they issued, which is a
# quantity nothing else in this workspace computes: the operator metrics are
# counters, and the three `INVOKE_AGENT_*` instruments are OpenTelemetry
# histograms whose buckets the collector owns. HdrHistogram is what latency
# tooling standardised on for this — recording is constant-time into log-linear
# buckets, so a run holding a million samples costs the same memory as one
# holding a thousand and cannot be the reason a lane runs out of it.
#
# `default-features = false` drops `serialization` (the V2 wire codec, which
# pulls flate2) and `sync`: a lane writes its OWN result shape as JSON, and each
# lane records on one task. What is left is the recorder and the quantile query.
#
# The alternative considered was sorting a Vec of samples and indexing it, which
# is exact rather than accurate-to-3-significant-figures. Rejected on Indy's
# call: arithmetic we own is still arithmetic we maintain, and 0.1% on a p95
# changes no decision this lane exists to inform.
hdrhistogram = { version = "7.6.0", default-features = false }
# The HTTP shell. axum is the router that matches paths and extracts
# parameters for us — matching logic that is not ours to keep correct.
#
# `default-features = false` drops `form`, `multipart` and the macros: this API
# speaks JSON, and a body format the daemon never accepts is a parser it should
# not link. `tokio` for the listener, `json` for the envelope.
#
# `http2` is ON, reversing the earlier call here that `http1` was enough because
# the tunnel speaks HTTP/1 upstream. That reasoning still describes today
# accurately — `deploy/fly/cloudflared-*/config.yml` points at
# `http://agentsfleetd-*.internal:3000`, and cloudflared speaks h1 to an origin
# unless told otherwise — so this feature changes nothing on its own.
#
# It is on for §5's event streams. A browser caps concurrent HTTP/1.1
# connections per origin at six, and every open SSE stream holds one, so a few
# dashboard tabs starve everything else on that origin. HTTP/2 multiplexes them
# and the cap stops mattering. The browser ALREADY gets that from the Cloudflare
# edge, which is why this is not urgent; what it buys is the origin hop, so the
# daemon is not the reason the tunnel cannot be switched to `http2Origin` later.
# The other half of that change lives in `deploy/`, not here.
#
# NOTE for §5's route table: axum's `get()` handler ALSO answers HEAD by
# default. agentsfleetd has never served HEAD — its matchers switch on GET,
# POST and DELETE only, and httpz keeps a separate `_head` table the daemon
# registers nothing into — so the router turns that off explicitly rather than
# inheriting a method the scope table has no rung for.
# Features are added by the code that uses them, like the dependencies
# themselves. `query` pulls serde_urlencoded and `matched-path` is §6's, so
# neither is here yet; `json` is absent because the problem+json envelope
# writes its own body and content type.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    # HTTP/2 for the SSE surface. A browser caps concurrent HTTP/1.1 connections
    # per origin at six, and every open event stream holds one — a dashboard
    # with a few tabs starves everything else on the origin. HTTP/2 multiplexes
    # them onto one connection and the cap stops mattering. The Cloudflare
    # tunnel already gives the browser h2 today; this is the origin hop, which
    # is what a baremetal deployment without a proxy in front actually serves.
    "http2",
    "tokio",
] }
# The retry loop and its delays. The counter and the terminal rule are where a
# hand-rolled loop goes wrong, leaving the last delay unreachable. 26.9M recent
# downloads against tokio-retry's 10.1M, and on 1.x where tokio-retry is still
# 0.3.
#
# `std` is NOT optional here, however much it looks like a default worth
# dropping. `std = ["fastrand/std"]`, and without it `ExponentialBackoff` takes
# its `#[cfg(not(feature = "std"))]` branch — `Rng::with_seed(RANDOM_SEED)`,
# where `RANDOM_SEED` is the compile-time constant `0x6261636b6f6e`
# (`backon-1.6.0/src/backoff/mod.rs:18`). Every process then draws the SAME
# "jittered" sequence, which is the reconnect storm the jitter exists to
# prevent, silently. `keys_and_config/mod.rs`'s spread assertion is what catches a
# future edit that drops it again.
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
# Tower is the middleware algebra axum composes. The admission ceiling is ours:
# it counts in-flight requests per route CLASS, which no off-the-shelf layer
# knows about.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# The HTTP/1 connection underneath axum, taken DIRECTLY rather than through
# `axum::serve`, for one reason: `axum::serve` exposes no way to bound the
# header buffer, and §5's Dimension 5.3 is precisely a bound on the header
# buffer. `server` + `http1` only — no client, and no h2 for a hop the
# dashboard proxy already terminates.
# `client` for the dev-only side of one suite: the protocol-negotiation test
# drives the same listener with an HTTP/1.1 client and an HTTP/2 one, and there
# is no other way to prove the auto builder serves both.
h2 = { version = "0.4.20", default-features = false }
# Both runner carriers use the same BoringSSL implementation and verified identity.
boring = { version = "5.6.0", default-features = false }
tokio-boring = { version = "5.6.0", default-features = false }
tokio-quiche = { version = "=0.23.0", default-features = false }
# Core NATS only: default features off keeps JetStream, KV and the object store
# out of the build, so no signal can come to depend on broker-side state.
async-nats = { version = "=0.52.0", default-features = false }
http-body = { version = "1.1.0", default-features = false }
http-body-util = { version = "0.1.5", default-features = false }
hyper = { version = "1.12.0", default-features = false, features = ["server", "client", "http1", "http2"] }
# The tokio adapter for hyper's own I/O traits, and nothing else: `TokioIo` is
# what lets a `tokio::net::TcpStream` be served by a hyper connection.
hyper-util = { version = "0.1.21", default-features = false, features = [
    "tokio",
    # The version-detecting connection builder. A browser caps concurrent
    # HTTP/1.1 connections per origin at six and every open event stream holds
    # one, so a dashboard with a few tabs starves the rest of the origin. The
    # `http2` feature on axum was enabled for exactly this and the accept loop
    # never used it — this is the half that was missing.
    "server-auto",
    "http1",
    "http2",
] }
# The integration lane's HTTPS fakes, dev-only: rcgen issues a test CA and a
# leaf for the upstream hosts a fleet setup names, and rustls serves them through
# tokio-rustls. All three on aws-lc-rs, the provider rustls already builds
# with here, so no second crypto backend arrives.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# `prefer-post-quantum` is a rustls default that `default-features = false`
# drops: without it every client offers classical X25519 first and the hybrid
# X25519MLKEM768 last. With it, every rustls connection (sqlx, reqwest,
# async-nats, lettre, object_store) offers the hybrid first, as `af_stream`
# does on BoringSSL, so no client of ours is the classical-only one.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
# The HTTP vocabulary types, shared with axum rather than re-exported through
# it: `route_meta` names methods and statuses and has no business depending on
# a web framework to do it.
http = { version = "1.5.0", default-features = false, features = ["std"] }

# The byte buffer hyper and axum carry a body in, named directly by the runner
# crates whose own types hold one, and by `afd_api`'s live tests.
#
# Not new surface: axum and hyper already resolve it, so a direct entry pins the
# version the lockfile carries rather than adding a dependency. It is listed
# because `unused_crate_dependencies` makes a crate's manifest a statement about
# what that crate actually names in its own types.
bytes = { version = "1.12.2", default-features = false, features = ["std"] }
# A sharded concurrent map: a lookup or a retire locks one shard, not the
# whole map, and the entry API holds that shard for exactly the check-then-
# act a per-key race needs. Where a map is keyed by something many tasks
# touch at once, this is the shape, not `Mutex<HashMap>`.
dashmap = { version = "6.2.1", default-features = false }
parking_lot = { version = "0.12.5", default-features = false }

# JWT semantics for the GitHub App mint: header and claims JSON, base64url
# segments, and expiry validation. NOT a crypto backend — it sits on one, and
# `aws_lc_rs` points it at the same provider everything else here uses, so the
# binary carries one implementation of RS256 rather than two.
#
# Writing this by hand on top of `aws-lc-rs` would be possible and is exactly
# the plumbing not to hand-roll.
#
# `use_pem` reads the App's PEM private key. The GitHub App calls themselves —
# the installation read and the scoped token mint — are two `reqwest` requests
# in `afd_credential`, and the webhook payloads are read by `afd_api_ingress`'s
# own `serde` types, so no GitHub SDK sits between this crate and its caller.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# OpenTelemetry, for the push-only export `af_otlp` builds. The SDK alone:
# it re-exports the API types the
# exporter names, and the OTLP TRANSPORT is added by boot, which is what knows
# an endpoint — a transport built here for nobody would be a dependency with no
# caller.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }

# The transport. A NEW dependency and not a feature flag on one already in the
# lock: nothing here spoke OTLP before, and this is the encoder and the client
# that make a signal leave the process.
#
# `http-proto` and NOT `grpc-tonic`, deliberately. The daemon and the runner
# post to the same OTLP/HTTP path, so one collector configuration accepts
# both unchanged; taking gRPC would pull tonic, prost's
# transport half and a second HTTP stack in for a protocol nothing downstream
# asks for. `http-proto` still brings prost for the protobuf ENCODING, which is
# the part that is actually needed.
#
# `reqwest-blocking-client` is the default and it is kept for a reason that is
# not laziness. The SDK's periodic metric reader collects on a plain thread
# with no tokio reactor on it — `otlp_outage_metrics.rs` documents that, having
# been bitten by it — so an async client awaited there has no driver. The
# blocking client owns its own, which is what makes one exporter safe on both
# the span pipeline's tokio task and the reader's bare thread.
#
# The version resolves the SAME `reqwest` line this workspace already pins, so
# the binary carries one HTTP client rather than two.
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "http-proto",
    # Both encodings, because the knob accepts both: a deployment that asked
    # for `http/json` and got protobuf would be told it was configured and be
    # wrong, and refusing the value outright would make the specification's own
    # vocabulary half-supported for the sake of one small dependency.
    "http-json",
    "reqwest-blocking-client",
    "trace",
    "metrics",
    "logs",
    # `internal-logs` is deliberately NOT taken: it makes the SDK log the
    # endpoint URL and the collector's response body at debug level, and the
    # endpoint is read from the same place as the credential beside it. The
    # same reason `OtlpConfig` has a hand-written `Debug` and preflight faults
    # by knob name — a value that must not reach stderr must not reach it by
    # way of a dependency's own diagnostics either.
] }

# The bridge that turns this daemon's 97 `tracing` spans into OTLP spans.
# `default-features = false` drops its `tracing-log` bridge and its own metrics
# layer: the first would ingest the `log` crate's records, which nothing here
# emits, and the second is a second metrics pipeline beside the census-built
# one.
tracing-opentelemetry = { version = "0.34.0", default-features = false }

# The same bridge for log RECORDS. Its own crate rather than a feature of the
# one above, upstream's split: a span and an event become different signals and
# only one of them is a trace.
opentelemetry-appender-tracing = { version = "0.33.1", default-features = false }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
    "trace",
    "rt-tokio",
    "metrics",
    # Bound instruments resolve a family's attributes ONCE at bind time, so a
    # hot recording call does no per-call attribute lookup. Experimental on a
    # pinned SDK, taken deliberately: the alternative is an attribute hash on
    # every request. Bound gauges do not exist in 0.32 and nothing is designed
    # against them. Checked before adopting: `with_cardinality_limit` is NOT
    # behind this or any feature, while `with_allowed_attribute_keys` IS
    # (`spec_unstable_metrics_views`) — which is why the typed layer, not a
    # View, is what constrains attribute keys here.
    "experimental_metrics_bound_instruments",
    # Declared rather than inherited. `SdkLoggerProvider` and the `LogExporter`
    # trait live behind it, and both were reaching this workspace only because
    # `opentelemetry-otlp`'s own `logs` feature happened to turn it on — so
    # `cargo` unified it into the binary's graph and NOT into a crate built on
    # its own. `cargo test -p af_observability` is where that showed up.
    "logs",
] }

# `CancellationToken`, which is what a supervised task is cancelled BY. Chosen
# over a shared `AtomicBool` for one reason that matters: a token is
# edge-triggered — `cancelled().await` wakes the instant it fires — where a
# polled flag pays its polling interval on every shutdown.
tokio-util = { version = "0.7.20", default-features = false }

# Stream combinators for the pub/sub pump. `std` only — no executor, no
# thread pool; the runtime is tokio's.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# The logging facade. §6 attaches the OTLP subscriber; until then these events
# go nowhere by default, which is the correct behaviour for a library.
#
# NOTE, and it is a measurement note rather than a style one: `tracing`'s `log`
# feature is NOT requested here, but sqlx-core and sqlx-postgres request it and
# Cargo unifies features across the workspace, so it is on for every crate —
# afd_bus included, which never asked for it. With `log` enabled the event
# macros compile each field expression TWICE, once for the event and once for a
# `log` record that never runs when a subscriber is installed, and llvm-cov maps
# both copies to the same source line and reports the DEAD one. The consequence
# is that `warn!(x = y.z(), ...)` reads as uncovered however many times it runs.
# Rust 1.100 also maps named bare values and literals to that dead copy. Bind
# those values and use tracing's field shorthand at affected emit sites. Keep
# aliases borrowed and scoped to the emit; a literal message stays format_args!
# so its value type and position in the field set remain unchanged. Computed
# fields are hoisted as before. No logging feature or coverage filter changes.
# The structured reproduction and native measurements are recorded in
# docs/v2/evidence/M249_RUST_COVERAGE_VALIDATION.md.
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
# The email templates. Variables are checked against a Rust struct at compile
# time, and HTML escaping is on by default for `.html` templates, so a display
# name carrying markup renders as text. Only `derive` and `std`: no runtime
# template loading, no filters this workspace does not call.
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
# The SMTP client. Defaults are off because they pull `native-tls` and a
# connection pool: TLS here is rustls on `aws-lc-rs`, the one provider this
# workspace links (see the crypto backend note above), and trust anchors come
# from `rustls-platform-verifier`, as reqwest's do, which is why `Dockerfile`
# installs `ca-certificates`. One message per invite needs no pool.
lettre = { version = "0.11.24", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1",
    "tokio1-rustls",
    "aws-lc-rs",
    "rustls-platform-verifier",
] }
# Reviewed snapshots of the rendered email, so a template change shows up as a
# diff in review rather than as a surprise in an inbox.
insta = { version = "1.49.0", default-features = false }
# The subscriber, which §6 wires to OTLP. It is a dev-dependency until then for
# a reason worth stating: `tracing::warn!` checks whether its callsite is
# ENABLED before it evaluates its arguments, so with no subscriber installed a
# test never executes the fields inside an event macro. Every diagnostic line in
# this workspace would read as dead code that nothing can reach — and the fix is
# to install a subscriber in tests, not to stop logging.
#
# `ansi` is asked for because the daemon's subscriber already asks for it:
# `agentsfleetd/src/logs.rs` calls `.with_ansi(true)` whenever standard error is
# a terminal, and without this feature that call PANICS — "the `ansi` crate
# feature is required to enable ANSI terminal colors" — taking the daemon down
# on every interactive start. It survived because the panic needs a terminal on
# standard error, which is exactly what a service manager and a container never
# give it, so the deployed paths were the ones that could not reach it.
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "ansi",
    "fmt",
    "std",
    # The span store the OpenTelemetry bridges read through: a span's fields
    # are recorded when it opens and read when it closes, and only a registry
    # keeps them in between.
    "registry",
    # NOTE: `reload` — the slot boot fills — needs no feature of its own. It
    # rides `std`, which is already here, and asking for it by name fails
    # resolution rather than doing nothing.
] }

# The keys a derive skipped, with their dotted path: the strict reader a
# person-written request goes through when it embeds a lenient runner-bound
# type (`af_core::json::strict_object_from_slice`).
serde_ignored = { version = "0.1.14", default-features = false }
# The runner's kernel surface, Linux only, each the crate Codex's own sandbox
# uses (`codex-rs/linux-sandbox/Cargo.toml`): safe system calls for process
# groups, signals, `no_new_privs` and mounts; Landlock rulesets; a seccomp
# program compiled to classic BPF in Rust, the library Firecracker ships.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "mount", "process", "thread"] }
landlock = { version = "0.4.8", default-features = false }
seccompiler = { version = "0.5.0", default-features = false }
# The JSON-RPC 2.0 envelope the executor protocol rides — request, response,
# notification and error object — rather than a hand-written copy of the spec.
jsonrpsee-types = { version = "0.26.2", default-features = false }
# Scratch directories and atomically persisted files: the report spool and
# every test that needs a real filesystem.
tempfile = { version = "3.27.0", default-features = false }
# The system-call numbers the sandbox's seccomp program refuses; rustix exposes
# the calls, not their numbers. Codex's `linux-sandbox` reads them from here too.
# tokio-quiche 0.23.0 and quiche 0.30.1 still cap this below 0.2.190; retain the published
# transport. parking_lot 0.13 waits on the same cap: its parking_lot_core 0.10 needs 0.2.191.
libc = { version = "=0.2.189", default-features = false }
# The sandbox's egress scope speaks netlink itself: route netlink for the veth
# pair, its addresses and its route, nf_tables for the host-side rules. Pure
# Rust over the kernel's own protocol, so the static runner links no C library
# and starts no `ip` or `nft` program. MIT, the rust-netlink project; the route
# and netfilter packet crates share one `netlink-packet-core`.
netlink-sys = { version = "0.9.0", default-features = false }
netlink-packet-core = { version = "0.9.0", default-features = false }
netlink-packet-route = { version = "0.34.0", default-features = false }
netlink-packet-netfilter = { version = "0.4.0", default-features = false }
# The sandbox's kernel lane is an example with its own `main`, so a test
# binary cannot run it by accident; this gives it libtest's reporting and
# filters anyway.
libtest-mimic = { version = "0.8.2", default-features = false }
# `std::io` adapters for the RustCrypto hashers, which dropped their own
# `io::Write` in 0.11: the toolbox image is streamed through SHA-256 with
# `io::copy` rather than a hand-written read loop.
digest-io = { version = "0.1.0", default-features = false }
# `/proc/<pid>/status`, parsed: the thread count and capability sets a sandbox
# checks before it serves, without a hand-written field reader.
procfs-core = { version = "0.18.0", default-features = false }
# The executor's file calls: a directory handle that refuses any path leaving
# it, through `..` or a symbolic link, on every platform — capability-based
# confinement from the Bytecode Alliance rather than a hand-written resolver.
cap-std = { version = "4.0.3", default-features = false }

[workspace.lints.rust]
# Every rustc warning is an error; individual lints below raise their own level
# (priority 0 beats the group's -1) where a different level is intentional.
warnings = { level = "deny", priority = -1 }
# NOTE: `unused_crate_dependencies` is deliberately NOT here. Cargo lints apply
# to every target, and each integration test is its own crate, so a workspace
# setting fires on the lib's own dependencies from inside `tests/` and on
# dev-dependencies from inside the lib. ~/Projects/oss/core_api-develop carries
# it as a `#![deny(...)]` crate attribute in all 59 of its lib.rs files for the
# same reason, and each afd_* lib.rs does likewise — which is where it has to
# bite anyway, since Invariant 2 is a claim about the LIBRARY's dependency graph.
# The M-STATIC-VERIFICATION compiler set.
ambiguous_negative_literals = "deny"
missing_debug_implementations = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
# M-MODULE-DOCS and M-CANONICAL-DOCS, enforced rather than reviewed.
missing_docs = "deny"
# `pub` is a claim that another crate imports the item. If none does, write
# `pub(crate)` and keep it under dead-code analysis instead of exempting it as
# an external API root (bun's rationale, Cargo.toml:~350).
unreachable_pub = "deny"

# Every stable allow-by-default lint that finds nothing here today, and the
# ones that catch real bugs, so new code cannot bring them back. `linker_info`
