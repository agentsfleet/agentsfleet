# Workspace root for the Rust daemon port.
#
# Layout follows Microsoft's M-CRATES-FLAT-FOLDER: every crate is a sibling in
# one direct subdirectory, `crates/`, with the directory name equal to the crate
# name. This root is a VIRTUAL manifest — no `[package]`, so it builds no library
# or binary of its own and no crate is nested inside another crate's source tree.
# The workspace mechanics (virtual root, explicit member list, the lint
# rationale below) come from ~/Projects/oss/bun; its `src/<name>/` crate
# directory does not, by Indy's call on Aug 23, 2026.
#
# Every setting a member could restate lives here instead (M-CARGO-WORKSPACE):
# members inherit package metadata via `.workspace = true`, dependency versions
# from `[workspace.dependencies]`, and the whole lint policy from
# `[workspace.lints]`.

[workspace]
resolver = "3"
members = ["crates/afd_admin", "crates/afd_api", "crates/afd_api_ingress", "crates/afd_api_operator", "crates/afd_api_runner", "crates/afd_api_tenant", "crates/afd_approval", "crates/afd_auth", "crates/afd_billing", "crates/afd_connector", "crates/afd_core", "crates/afd_credential", "crates/afd_cron", "crates/afd_crypto", "crates/afd_db", "crates/afd_events", "crates/afd_fleet", "crates/afd_fleet_lifecycle", "crates/afd_fleet_ops", "crates/afd_fleet_runtime", "crates/afd_gate", "crates/afd_http", "crates/afd_identity", "crates/afd_ingress", "crates/afd_library", "crates/afd_observability", "crates/afd_outbound", "crates/afd_redis", "crates/afd_runner", "crates/afd_sse", "crates/afd_state", "crates/afd_tenant", "crates/afd_vault", "crates/afd_webhook", "crates/afd_wire", "crates/agentsfleetd"]

[workspace.package]
version = "0.27.1"
edition = "2024"
# Equal to the pinned toolchain rather than trailing it (M-MSRV allows a lag for
# published libraries; these crates have no external consumers and are built
# only by rust-toolchain.toml's pin, so a lower floor would be an untested claim).
rust-version = "1.98"
# MIT, matching the repository's own `LICENSE` and `cli/package.json`. The
# manifest said Apache-2.0 from its first commit, which made this workspace the
# only part of the product claiming a licence the project does not ship under —
# a claim a downstream reader would have taken at face value.
license = "MIT"
authors = ["Kishore Kumar (indykish) <nkishore@megam.io>"]
repository = "https://github.com/agentsfleet/agentsfleet"
readme = "../../README.md"
keywords = ["agentsfleet", "daemon", "runner"]
categories = ["network-programming"]

[workspace.dependencies]
# Intra-workspace members resolve through the workspace, never by direct sibling
# path (M-CRATES-IN-WORKSPACE).
afd_admin = { path = "crates/afd_admin" }
afd_api = { path = "crates/afd_api" }
afd_api_ingress = { path = "crates/afd_api_ingress" }
afd_api_operator = { path = "crates/afd_api_operator" }
afd_api_runner = { path = "crates/afd_api_runner" }
afd_api_tenant = { path = "crates/afd_api_tenant" }
afd_approval = { path = "crates/afd_approval" }
afd_auth = { path = "crates/afd_auth" }
# What a lease costs and what a tenant has. Split out of `afd_fleet` because it
# reads the `billing.*` schema rather than `core.*`, and only the admission gate
# calls it — the runner plane's other 23,000 lines never ask about money.
afd_billing = { path = "crates/afd_billing" }
# Connecting a workspace to a third party: the signed install state, the
# code-for-token exchange, and the grant that lands in the vault. Its own crate
# rather than a module in `afd_api` for the reason `afd_ingress` is one — the
# state machine and the vendor conversation are decided with no router in
# sight, and `afd_api` is already the workspace's largest crate.
afd_connector = { path = "crates/afd_connector" }
afd_core = { path = "crates/afd_core" }
# What a run may USE: the declared secret, the vault that opens it, the provider
# it dials, the token a broker mints. Split from afd_fleet once the one misfiled
# file (an `impl Plane` living under credential/) stopped tying it to the lease.
afd_credential = { path = "crates/afd_credential" }
afd_crypto = { path = "crates/afd_crypto" }
afd_db = { path = "crates/afd_db" }
# `core.fleet_events` and its live tail. A crate of its own because the table
# had no owner: its statements sat in `afd_fleet::sql` behind the whole runner
# plane, so `afd_approval` copied the insert rather than depend on leases,
# money, policy and four sweepers to reuse ten lines of SQL.
afd_events = { path = "crates/afd_events" }
afd_fleet = { path = "crates/afd_fleet" }
# What a fleet is ALLOWED to do, and the gate a run stops at when the answer
# needs a person. The lease plane calls down into it at two moments and it
# calls back at none, which is what let it out.
afd_gate = { path = "crates/afd_gate" }
afd_http = { path = "crates/afd_http" }
# Deliberately NOT folded into `afd_fleet`, which is the runner plane and is
# already 25,500 lines — 3.5 times its nearest sibling, and the exact condition
# that forced `afd_tenant` out of it. Nor into `afd_tenant`, whose api-key and
# login modules would then rebuild behind a YAML parser and a Redis stream
# client they never call.
afd_fleet_lifecycle = { path = "crates/afd_fleet_lifecycle" }
# The operator's READ plane: cross-table projections a dashboard asks for, over
# a pool and the wire types and nothing else. Separate from `afd_runner`, which
# is the host's own plane and WRITES it — a lease-history join reaching for
# `core.fleets` and `core.fleet_events` would put both on the heartbeat path.
afd_fleet_ops = { path = "crates/afd_fleet_ops" }
afd_fleet_runtime = { path = "crates/afd_fleet_runtime" }
afd_identity = { path = "crates/afd_identity" }
# What a signed delivery is resolved against. Not folded into `afd_events`,
# which owns the same table's reads: this needs the vault and the config
# parser, and adding them there would put AES-GCM and a YAML-shaped document
# reader behind every history page the dashboard asks for. The same argument
# `afd_vault` makes for not living in `afd_fleet`.
afd_cron = { path = "crates/afd_cron" }
afd_ingress = { path = "crates/afd_ingress" }
afd_library = { path = "crates/afd_library" }
afd_observability = { path = "crates/afd_observability" }
afd_outbound = { path = "crates/afd_outbound" }
afd_redis = { path = "crates/afd_redis" }
# The HOST's plane, split from `afd_fleet` (the RUN's plane): enrolment,
# liveness, the assertion verdict, and the offline/retention sweepers. The two
# meet at exactly one audit row, and that meeting is a vocabulary import.
afd_runner = { path = "crates/afd_runner" }
# One SSE connection's frames and the fan-in behind a workspace stream. Its own
# crate rather than a module in `afd_api`: the frame shapes, the sequence
# discipline and the concurrent-stream ceiling are decided with no router in
# sight, and `afd_api` is already the workspace's largest crate.
afd_sse = { path = "crates/afd_sse" }
afd_state = { path = "crates/afd_state" }
afd_tenant = { path = "crates/afd_tenant" }
# The workspace secret surface. Deliberately NOT folded into `afd_fleet`, whose
# `vault` module is the RUNNER plane's reader — it opens a declared credential
# for a lease, refuses to degrade a row, and never lists — nor into `afd_state`,
# which is the credential directory the authentication path cannot start
# without and would then rebuild every login when a projection column moved.
afd_vault = { path = "crates/afd_vault" }
# The signature wall: what an unauthenticated delivery must prove before
# anything reads its body. Its own crate rather than a module in `afd_auth`,
# which answers a different question — who a CALLER is and what they may do.
# A signed delivery has no principal, and the wall must be provable with no
# datastore, no runtime and no router.
afd_webhook = { path = "crates/afd_webhook" }
afd_wire = { path = "crates/afd_wire" }

# `default-features = false` throughout, features named explicitly, so a member
# cannot silently acquire a feature a sibling enabled (M-CARGO-WORKSPACE).
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
# The metric census is a tab-separated contract, and this is the crate that
# reads one: delimiter, `#` comment lines, header-to-field mapping, unequal-row
# detection and serde-typed deserialization are all its job rather than ours,
# and every error it raises already carries the record and line it failed on.
csv = "1.4.0"
serde_json = { version = "1.0.151", default-features = false, features = ["std", "preserve_order", "raw_value"] }
# `raw_value` carries `RawValue`, which is how the activity verb splices a
# runner's already-JSON tool arguments into a published frame WITHOUT parsing
# them into a tree and re-encoding it. The Zig builds and drops a whole
# `std.json.Value` per tool call for want of this. A feature on a dependency
# already resolved in the lock, not a new crate.
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
async-trait = { version = "0.1.92", default-features = false }

# Field bounds as annotations on the schema rather than as a hand-written
# checker. `derive` only: `regex`, `email`, `phone-number` and `credit-card`
# each pull their own dependency and none of them is a shape this product
# authors. Its `garde_derive` rides the syn 2.0.119 already in the lock.
garde = { version = "0.23.0", default-features = false, features = ["derive"] }

# The YAML frontmatter of an authored `TRIGGER.md`.
#
# The spec's default was a maintained `serde_yaml` fork, and the first EXECUTE
# pass rejected every one of them — `serde_norway` last published Dec 2024,
# `serde_yml` self-deprecated — and fell back to `saphyr-parser`, a bare
# tokeniser, on the reasoning that any resolving crate would type scalars wrong
# for a parity port.
#
# That reasoning was tested against the wrong crate and is retracted. `yaml_serde`
# is the maintained `serde_yaml` fork under the YAML organisation itself
# (github.com/yaml/yaml-serde), and probed against the cases the hand-rolled
# coercion table existed to defend it agrees on all of them: `01` stays "01",
# `0123456` stays a string, `NO` does not become false, `NaN` stays text. It
# also gets RIGHT the one case the table got wrong — a quoted `"true"` is the
# string, where a bare tokeniser cannot see quote style and collapsed it to a
# boolean.
#
# What it costs: three spellings resolve where the table stringified them
# (`1e5`, `0x1F`, `+1`). No document in `tests/fixtures/` uses any of them, and
# `config_json` is written at install/patch rather than re-parsed on read, so
# no stored configuration changes meaning. Recorded as a declared divergence.
yaml_serde = { version = "0.10.7", default-features = false }

# The command line, derived rather than hand-rolled.
#
# `serve_args.zig` hand-parsed `--port` out of argv and ported across as the
# same loop, which is how the Rust daemon ended up reading argv[1] and NOTHING
# else: no `--help`, no `--version`, and a port that could only arrive through
# the environment. Every one of those is a line item clap already owns, and a
# hand-rolled parser is precisely the invented code a Rust port exists to
# delete.
#
# Features named rather than defaulted, per the rule above. `env` is the
# load-bearing one: it makes `PORT` a documented FALLBACK for `--port` in the
# generated help, rather than a second undocumented input path. `color` and
# `wrap_help` are left off — the daemon's usage output is read out of a
# container log, where escape sequences and terminal-width reflow are noise.
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }

# RustCrypto. Pure Rust with no C linkage, matching the Zig daemon's posture, and
# the same AES-256-GCM construction `std.crypto.aead.aes_gcm.Aes256Gcm` implements.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
# RFC entity-tag and conditional-request parsing. The grammar includes quoted
# commas and strong/weak comparison rules that should not be reimplemented.
headers = { version = "0.4.1", default-features = false }
# Lower-case hex, for the credential digests and minted token bodies every
# stored class is built from. Already in the lock via sqlx; taken directly
# because a hand-written `write!("{:02x}")` loop is a place for a leading zero
# to go missing, and this workspace prefers a crate to a re-derivation.
hex = { version = "0.4.3", default-features = false, features = ["std"] }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde_yaml_ng = { version = "0.10.0", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

# Constant-time comparison. RULE CTM: a byte-by-byte `==` over a secret leaks how
# much of a guess was right through how long it took to reject.
subtle = { version = "2.6.1", default-features = false }
# No `derive`: `zeroize_derive` is the only crate in this graph still on syn 2,
# and a duplicate syn fails `clippy::multiple_crate_versions`. Three hand-written
# `Drop` impls are cheaper than a second proc-macro inside a crypto crate anyway.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
# The only system call this workspace's crypto makes.
getrandom = { version = "0.4.3", default-features = false }

# Version-7 identifier construction. ALREADY in the lock at this version via
# moka, so this is a feature flag on a compiled crate rather than a new
# dependency — and it is not on `afd_core`'s FORBIDDEN list, which polices
# runtimes, datastores and transports.
#
# Only `Builder::from_unix_timestamp_millis` is used: it takes the 48-bit
# millisecond field and ten caller-supplied entropy bytes and sets the version
# and variant nibbles. The entropy is still drawn by `afd_crypto`, so the "one
# system call" claim holds — nothing here asks uuid for randomness.
#
# The PARSE side stays hand-written in `afd_core::id`, and that is not
# duplication: `Uuid::parse_str` is case-INSENSITIVE and normalises, while this
# product rejects uppercase outright so one entity cannot have two spellings.
# A crate that cannot express the invariant is not a shortcut to it.
# WHATWG URL parsing, for the tenant-supplied endpoint guard. ALREADY in the
# lock at this version, so this is a feature flag on a compiled crate rather
# than a new dependency.
url = { version = "2.5.8", default-features = false }

uuid = { version = "1.26.0", default-features = false, features = ["v7", "std"] }

# Civil-calendar arithmetic, for the monthly budget window.
#
# The monthly ceiling opens at the first instant of the UTC month, and
# `clock.startOfUtcMonthMillis` computes that by hand: epoch-day → year-day →
# month-day, then subtracting the 0-based day index. It is correct, and it
# carries its own leap-February test to prove it — which is the tell. Calendar
# arithmetic is a solved problem with a long tail of wrong answers, and a spend
# ceiling that opens on the wrong day is one nobody can reconcile against an
# invoice.
#
# jiff rather than chrono or time, AGAINST the download numbers and recorded as
# a trade rather than presented as a free win — the same shape as this
# workspace's `garde` pick. Measured Aug 25 2026: time 161.8M recent downloads,
# chrono 161.3M, jiff 56.6M. All three are actively maintained (last publishes
# Aug 1, Jun 4, Jul 25) and NONE is already in the lock, so there is no
# incumbent to prefer and no free option.
#
# What jiff has that the other two do not is the distinction this window turns
# on: a CIVIL DATE is a separate type from an instant, so "the first of the
# month" is `Date::first_of_month` — a value of the right kind — rather than an
# instant with its time fields overwritten. chrono and time can both compute the
# same answer; they express it as mutation of a timestamp, which is the shape
# that lets a time-of-day component survive a refactor and move a tenant's
# billing month by a few hours. Per the `uuid` note above: a crate that cannot
# express the invariant is not a shortcut to it.
#
# The cost of the trade, stated: fewer eyes on it than chrono or time, and a
# 0.2 series that may still break API. Confined to ONE function
# (`money::window::month_floor`), so a breaking change is a one-site fix and a
# swap to `time` stays cheap if the maintenance signal ever turns.
#
# No `tz-system`: every window here is UTC by definition, so reading the host's
# zone database would be a way for two replicas to disagree about when a
# tenant's month started. `std` only — the alloc-free and serde halves are for
# consumers this workspace does not have.
#
# The rolling DAY window is NOT a calendar question and does not use this:
# `authoring.mdx` documents it as "rolling 24-hour", not "since midnight", so it
# stays plain millisecond subtraction in `money::window` where that is legible.
# `tzdb-zoneinfo` reads the system timezone database rather than bundling one:
# zero extra crates, zero binary growth, and the deploy image already ships
# `/usr/share/zoneinfo` (debian:bookworm-slim, verified). It is what lets a zone
# name be VALIDATED against the real database instead of pattern-matched — see
# `afd_cron::validate::timezone`.
jiff = { version = "0.2.35", default-features = false, features = [
  "std",
  "tzdb-zoneinfo",
] }

# Base64url, for JSON Web Key components and the three segments of a session
# token. `default-features = false` is load-bearing here rather than habitual:
# 0.23's default set includes `simd-unsafe`, which reaches for SIMD through
# unsafe code. This workspace denies `unsafe_op_in_unsafe_fn` and links no
# hand-written unsafe of its own, and a JWKS document is three kilobytes read
# twice a day — there is no throughput here to trade the posture for.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

# The ONE cryptographic backend this workspace links.
#
# Was `ring`, chosen because a JWKS publishes raw big-endian `n` and `e` and
# `ring::signature::RsaPublicKeyComponents` accepts exactly that, where rustls's
# own verifier wants a DER `SubjectPublicKeyInfo`. That reasoning is unchanged —
# `aws_lc_rs::signature::RsaPublicKeyComponents` has the same shape, which is
# deliberate: AWS-LC-RS is published as a ring-compatible library.
#
# What changed is that the choice stopped being free. `object_store` enables
# `aws-lc-rs` as a DEFAULT feature with no ring alternative, and reqwest 0.13
# collapsed its TLS features so plain `rustls` forces it too. Keeping ring
# alongside would put TWO `CryptoProvider`s in one binary — the failure the
# previous pin existed to avoid — so the resolution is one provider, not a
# pin that can no longer hold.
#
# `aws-lc-sys` compiles C (a BoringSSL fork), which ends this workspace's
# no-C-linkage posture. Verified to build here without cmake, on Apple clang
# alone; the musl cross-compile is unproven and is a cutover (M181) concern,
# since CI ships no Rust binary today.
#
# NO ring-compatibility features here, and that was measured rather than
# assumed. `ring-sig-verify` only preserves ring's `VerificationAlgorithm::verify`
# signature (which takes `untrusted::Input`) — the verifier this workspace
# actually calls, `RsaPublicKeyComponents::verify`, is ungated and already takes
# `&[u8]`, so the feature bought nothing but a dependency. `ring-io` is needed by
# ONE signing test and is declared on that crate's dev-dependency instead, where
# it says who needs it.
#
# Both are aws-lc-rs DEFAULTS, so `default-features = false` is what makes the
# question askable at all. Enabling them because a build failed — rather than
# reading which call site failed and why — is how a compatibility shim becomes
# permanent.
aws-lc-rs = { version = "1.18.0", default-features = false, features = [
    "aws-lc-sys",
    "alloc",
] }

# The subject to capability-claim cache. `future` rather than `sync`: the
# request path is asynchronous, and `try_get_with` coalesces concurrent loads
# for the same key — which closes the caveat `clerk_scope_resolver.zig:19-22`
# writes down and leaves open, and retires the hand-rolled `seq` counter that
# existed only to stop an out-of-order response resurrecting a pre-revocation
# claim. With one flight per subject there is no second response to be out of
# order with.
posthog-rs = { version = "0.25.3", default-features = false, features = ["async-client"] }
# The workspace's first-run naming. Declared here like every other dependency:
# a version in a member manifest is the one place drift can start.
petname = { version = "3.2.0", default-features = false, features = ["default-words"] }
moka = { version = "0.12.16", default-features = false, features = ["future"] }

# The JWKS fetch, the provider capability call, and the object-store transport.
#
# WAS PINNED TO 0.12 DELIBERATELY, and that pin is now released rather than
# forgotten. Its reason was exact: 0.13 collapsed the TLS features so plain
# `rustls` forces `aws-lc-rs`, which would have put a SECOND rustls provider
# beside ring. `object_store` forces `aws-lc-rs` regardless — it is a default
# feature there with no ring alternative — so the pin could no longer deliver
# what it was for, and the workspace resolves to one provider instead.
#
# Two properties the 0.12 features bought are GONE, and both are behaviour:
#
#   - In-binary trust anchors. 0.13 removed `webpki-roots` entirely and uses
#     `rustls-platform-verifier`, so verification now depends on the system
#     trust store. A slim container without `ca-certificates` would fail to
#     verify where 0.12 succeeded; `Dockerfile` installs it, which is what
#     makes this safe rather than merely survivable.
#   - Nothing else: `gzip` stays absent for the reason it always was, so wire
#     bytes equal decoded bytes and `JWKS_MAX_RESPONSE_BYTES` is a correct
#     bound with no streaming decompressor to size.
#
# `form` is the credential broker's, and it is the whole reason
# `integration_oauth_refresh.zig`'s `percentEncode` + `buildForm` — a
# hand-written RFC 3986 unreserved-set encoder and a `allocPrint` template — do
# not exist here. `serde_urlencoded` encodes a refresh grant whose values are
# provider-issued opaque bytes, where a `+` or an `&` that escapes its field
# changes the SHAPE of the form at the token endpoint. That is not a place to
# carry our own encoder.
reqwest = { version = "0.13.4", default-features = false, features = ["form", "rustls", "stream"] }

# Postgres. sqlx is the DRIVER here and nothing more: `migrate` and `macros` are
# both off, because this workspace runs the Zig daemon's own ledger
# (`audit.schema_migrations`, versions equal to the schema slot numbers, one
# advisory key) against databases the Zig daemon already migrated. sqlx's
# built-in migrator keeps a different ledger under a different lock, so enabling
# it would mean two migrators disagreeing about the same database.
#
# `tls-rustls-aws-lc-rs` rather than native roots: sqlx still enables
# `webpki-roots`, so the trust anchors ship in the binary. An explicit
# `sslrootcert` connection parameter remains an operator override whose file
# sqlx reads at handshake time.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    # aws-lc-rs, not ring: `object_store` and reqwest 0.13 both force that
    # provider, and two providers in one binary is the state this feature was
    # originally pinned to prevent.
    "tls-rustls-aws-lc-rs",
    "postgres",
] }
# The runtime sqlx drives. `rt-multi-thread` is a dev-dependency concern (the
# contention tests need real parallelism); the library asks only for what it
# uses at a call site.
# `sync` carries `Semaphore`, which IS the admission ceiling: `try_acquire_owned`
# refuses instantly when the instance is full and hands back a permit that
# releases on drop, so a shed needs no counter arithmetic and a completed
# request needs no release path to forget. It was already reaching these crates
# through redis and sqlx's own feature sets — naming it here makes three
# existing call sites (`hub.rs`, `jwks/cache.rs`) depend on a stated feature
# rather than on unification holding.
tokio = { version = "1.53.1", default-features = false, features = ["rt", "sync", "time", "macros"] }
# Redis. The crate replaces roughly three thousand lines of hand-rolled RESP
# parsing, connection pooling and pub/sub plumbing under `src/agentsfleetd/
# queue/`. `connection-manager` is the piece that earns it: one multiplexed
# connection that reconnects itself, where the Zig side maintained a pool of
# request/reply sockets behind a mutex.
#
# `tokio-rustls-comp` for the same no-C posture as everything else here. The
# local compose Redis serves a self-signed certificate, so the CA arrives by
# path (`REDIS_TLS_CA_CERT_FILE`) rather than from a trust store.
redis = { version = "1.6.0", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
    "streams",
    "script",
] }
# The HTTP shell. axum replaces `src/agentsfleetd/http/router.zig` and the ten
# hand-rolled `route_matchers_*.zig` files with a router that matches paths and
# extracts parameters for us — roughly a thousand lines of matching logic that
# stops being ours to keep correct.
#
# `default-features = false` drops `form`, `multipart` and the macros: this API
# speaks JSON, and a body format the daemon never accepts is a parser it should
# not link. `tokio` for the listener, `json` for the envelope.
#
# `http2` is ON, reversing the earlier call here that `http1` was enough because
# the tunnel speaks HTTP/1 upstream. That reasoning still describes today
# accurately — `deploy/fly/cloudflared-*/config.yml` points at
# `http://agentsfleetd-*.internal:3000`, and cloudflared speaks h1 to an origin
# unless told otherwise — so this feature changes nothing on its own.
#
# It is on for §5's event streams. A browser caps concurrent HTTP/1.1
# connections per origin at six, and every open SSE stream holds one, so a few
# dashboard tabs starve everything else on that origin. HTTP/2 multiplexes them
# and the cap stops mattering. The browser ALREADY gets that from the Cloudflare
# edge, which is why this is not urgent; what it buys is the origin hop, so the
# daemon is not the reason the tunnel cannot be switched to `http2Origin` later.
# The other half of that change lives in `deploy/`, not here.
#
# NOTE for §5's route table: axum's `get()` handler ALSO answers HEAD by
# default. agentsfleetd has never served HEAD — its matchers switch on GET,
# POST and DELETE only, and httpz keeps a separate `_head` table the daemon
# registers nothing into — so the router turns that off explicitly rather than
# inheriting a method the scope table has no rung for.
# Features are added by the code that uses them, like the dependencies
# themselves. `query` pulls serde_urlencoded and `matched-path` is §6's, so
# neither is here yet; `json` is absent because the problem+json envelope
# writes its own body and content type.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    # HTTP/2 for the SSE surface. A browser caps concurrent HTTP/1.1 connections
    # per origin at six, and every open event stream holds one — a dashboard
    # with a few tabs starves everything else on the origin. HTTP/2 multiplexes
    # them onto one connection and the cap stops mattering. The Cloudflare
    # tunnel already gives the browser h2 today; this is the origin hop, which
    # is what a baremetal deployment without a proxy in front actually serves.
    "http2",
    "tokio",
] }
# The retry LOOP, rather than the schedule. `afd_redis::Backoff` computes the
# delays and is proven on the subscription hub's reconnect; what was hand-rolled
# beside it was the counter and the terminal rule — and the loop guard is
# precisely where the Zig install shipped its bug, leaving the last delay
# unreachable. 26.9M recent downloads against tokio-retry's 10.1M, and on 1.x
# where tokio-retry is still 0.3.
#
# `std` is NOT optional here, however much it looks like a default worth
# dropping. `std = ["fastrand/std"]`, and without it `ExponentialBackoff` takes
# its `#[cfg(not(feature = "std"))]` branch — `Rng::with_seed(RANDOM_SEED)`,
# where `RANDOM_SEED` is the compile-time constant `0x6261636b6f6e`
# (`backon-1.6.0/src/backoff/mod.rs:18`). Every process then draws the SAME
# "jittered" sequence, which is the reconnect storm the jitter exists to
# prevent, silently. `keys_and_config.rs`'s spread assertion is what catches a
# future edit that drops it again.
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
# Tower is the middleware algebra axum composes; `tower-http` carries the
# ready-made layers. The admission ceiling is ours (it counts in-flight
# requests per route CLASS, which no off-the-shelf layer knows about), but the
# request-id, timeout and body-limit layers are not worth rewriting.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.0", default-features = false, features = [
    "limit",
    "trace",
] }
# The HTTP/1 connection underneath axum, taken DIRECTLY rather than through
# `axum::serve`, for one reason: `axum::serve` exposes no way to bound the
# header buffer, and §5's Dimension 5.3 is precisely a bound on the header
# buffer. `server` + `http1` only — no client, and no h2 for a hop the
# dashboard proxy already terminates.
# `client` for the dev-only side of one suite: the protocol-negotiation test
# drives the same listener with an HTTP/1.1 client and an HTTP/2 one, and there
# is no other way to prove the auto builder serves both.
hyper = { version = "1.11.1", default-features = false, features = ["server", "client", "http1", "http2"] }
# The tokio adapter for hyper's own I/O traits, and nothing else: `TokioIo` is
# what lets a `tokio::net::TcpStream` be served by a hyper connection.
hyper-util = { version = "0.1.20", default-features = false, features = [
    "tokio",
    # The version-detecting connection builder. A browser caps concurrent
    # HTTP/1.1 connections per origin at six and every open event stream holds
    # one, so a dashboard with a few tabs starves the rest of the origin. The
    # `http2` feature on axum was enabled for exactly this and the accept loop
    # never used it — this is the half that was missing.
    "server-auto",
    "http1",
    "http2",
] }
# The HTTP vocabulary types, shared with axum rather than re-exported through
# it: `route_meta` names methods and statuses and has no business depending on
# a web framework to do it.
http = { version = "1.5.0", default-features = false, features = ["std"] }

# The Fleet Bundle store. R2 is S3-compatible, and this is the Apache Arrow
# project's own object-store crate rather than a hand-rolled signer: one
# authenticated GET by content hash is still SigV4, and a hand-written SigV4 is
# the kind of security plumbing that earns a CVE for saving a dependency.
#
# It also ships an in-memory backend, which is what the bundle-fetch tests run
# against — no network, the same reason `afd_auth`'s directory is a trait.
#
# `aws` is the only cloud feature enabled; the others would link signers for
# stores this product does not use.
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }

# The byte buffer `object_store` answers a GET with, named here so the Fleet
# Bundle store can hand one back without copying it into a `Vec` first.
#
# Not new surface: axum, hyper and `object_store` all already resolve it, so a
# direct entry pins the version the lockfile carries rather than adding a
# dependency. It is listed because `unused_crate_dependencies` makes a crate's
# manifest a statement about what that crate actually names in its own types,
# and `afd_fleet::bundle::Snapshot` names this one.
bytes = { version = "1.12.1", default-features = false, features = ["std"] }

# JWT semantics for the GitHub App mint: header and claims JSON, base64url
# segments, and expiry validation. NOT a crypto backend — it sits on one, and
# `aws_lc_rs` points it at the same provider everything else here uses, so the
# binary carries one implementation of RS256 rather than two.
#
# Writing this by hand on top of `aws-lc-rs` would be possible and is exactly
# the plumbing not to hand-roll.
#
# PINNED TO 10.x BY `octocrab`, AND IT MUST STAY THAT WAY (M177 §4). This is not
# a preference for an older release: `octocrab` requires `jsonwebtoken ^10` and
# its `Octocrab::builder().app()` takes an `EncodingKey` BY TYPE. A crate
# building that key against 11.x would not merely duplicate RS256 — the two
# `EncodingKey` types are unrelated and the call would not compile. An earlier
# 11.0.0 pin here was unreachable for exactly that reason.
#
# `use_pem` reads the App's PEM private key; `aws_lc_rs` is the backend, which
# is also what `octocrab`'s own `jwt-aws-lc-rs` feature selects — the two agree
# deliberately, so the binary carries one implementation of RS256 rather than
# two. Raising this to 11 means raising `octocrab` first.
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }

# The GitHub client behind the App-installation half of the mint broker.
#
# `default-features = false` is load-bearing twice over. Its defaults enable
# `rustls-ring`, which would put a SECOND rustls provider beside the aws-lc-rs
# this workspace resolves to, and `jwt-rust-crypto`, which would point
# `jsonwebtoken` at a different backend than the line above pins. `jwt-aws-lc-rs`
# swaps the second back; omitting `rustls-ring` settles the first.
#
# Taken for App JWT minting, the transport and the typed `InstallationToken`,
# NOT for its `installation_and_token()`: that method posts a hardcoded `{}`
# body and so always mints the installation's FULL scope. The repository and
# permission narrowing this milestone's write gate rests on is sent through the
# generic `post`, with a body of ours.
octocrab = { version = "0.54.1", default-features = false, features = [
    "rustls",
    "rustls-aws-lc-rs",
    "jwt-aws-lc-rs",
    "default-client",
    "timeout",
    "retry",
    "tracing",
] }

# OpenTelemetry, for the push-only export the Zig daemon already does by hand
# (`observability/otlp/`). The SDK alone: it re-exports the API types the
# exporter names, and the OTLP TRANSPORT is added by boot, which is what knows
# an endpoint — a transport built here for nobody would be a dependency with no
# caller.
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = [
    "trace",
    "rt-tokio",
    "metrics",
    # Bound instruments resolve a family's attributes ONCE at bind time, so a
    # hot recording call does no per-call attribute lookup. Experimental on a
    # pinned SDK, taken deliberately: the alternative is an attribute hash on
    # every request. Bound gauges do not exist in 0.32 and nothing is designed
    # against them. Checked before adopting: `with_cardinality_limit` is NOT
    # behind this or any feature, while `with_allowed_attribute_keys` IS
    # (`spec_unstable_metrics_views`) — which is why the typed layer, not a
    # View, is what constrains attribute keys here.
    "experimental_metrics_bound_instruments",
] }

# `CancellationToken`, which is what a supervised task is cancelled BY. Chosen
# over a shared `AtomicBool` for one reason that matters: a token is
# edge-triggered — `cancelled().await` wakes the instant it fires — where the
# Zig watcher polls a flag every 100ms and pays that latency on every shutdown.
tokio-util = { version = "0.7.19", default-features = false }


# `gethostname`, which `std` does not expose. The outbound worker's consumer
# name must be the same string across restarts of one instance, or every
# unacknowledged answer strands in a pending list nothing reads again — and
# `HOSTNAME` is a shell variable, not an exported one, so a systemd unit sees
# no value at all. `redis_client.zig` calls the syscall for the same reason.
# A safe wrapper over the one call, rather than `libc` and an `unsafe` block
# of our own.
hostname = { version = "0.4.1", default-features = false }

# Stream combinators for the pub/sub pump. `std` only — no executor, no
# thread pool; the runtime is tokio's.
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# The logging facade. §6 attaches the OTLP subscriber; until then these events
# go nowhere by default, which is the correct behaviour for a library.
#
# NOTE, and it is a measurement note rather than a style one: `tracing`'s `log`
# feature is NOT requested here, but sqlx-core and sqlx-postgres request it and
# Cargo unifies features across the workspace, so it is on for every crate —
# afd_redis included, which never asked for it. With `log` enabled the event
# macros compile each field expression TWICE, once for the event and once for a
# `log` record that never runs when a subscriber is installed, and llvm-cov maps
# both copies to the same source line and reports the DEAD one. The consequence
# is that `warn!(x = y.z(), ...)` reads as uncovered however many times it runs.
# Field expressions containing a call are therefore hoisted to a `let` above the
# macro across this workspace; bare identifiers need no such treatment because
# they get no coverage region of their own. Isolated in a standalone crate: same
# code and same versions report 5, adding `features = ["log"]` reports 0.
# M176 §Coverage decision carries the full measurement.
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
# The subscriber, which §6 wires to OTLP. It is a dev-dependency until then for
# a reason worth stating: `tracing::warn!` checks whether its callsite is
# ENABLED before it evaluates its arguments, so with no subscriber installed a
# test never executes the fields inside an event macro. Every diagnostic line in
# this workspace would read as dead code that nothing can reach — and the fix is
# to install a subscriber in tests, not to stop logging.
#
# `ansi` is asked for because the daemon's subscriber already asks for it:
# `agentsfleetd/src/logs.rs` calls `.with_ansi(true)` whenever standard error is
# a terminal, and without this feature that call PANICS — "the `ansi` crate
# feature is required to enable ANSI terminal colors" — taking the daemon down
# on every interactive start. It survived because the panic needs a terminal on
# standard error, which is exactly what a service manager and a container never
# give it, so the deployed paths were the ones that could not reach it.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }

[workspace.lints.rust]
# Every rustc warning is an error; individual lints below raise their own level
# (priority 0 beats the group's -1) where a different level is intentional.
warnings = { level = "deny", priority = -1 }
# NOTE: `unused_crate_dependencies` is deliberately NOT here. Cargo lints apply
# to every target, and each integration test is its own crate, so a workspace
# setting fires on the lib's own dependencies from inside `tests/` and on
# dev-dependencies from inside the lib. ~/Projects/oss/core_api-develop carries
# it as a `#![deny(...)]` crate attribute in all 59 of its lib.rs files for the
# same reason, and each afd_* lib.rs does likewise — which is where it has to
# bite anyway, since Invariant 2 is a claim about the LIBRARY's dependency graph.
# The M-STATIC-VERIFICATION compiler set.
ambiguous_negative_literals = "deny"
missing_debug_implementations = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
# M-MODULE-DOCS and M-CANONICAL-DOCS, enforced rather than reviewed.
missing_docs = "deny"
# `pub` is a claim that another crate imports the item. If none does, write
# `pub(crate)` and keep it under dead-code analysis instead of exempting it as
# an external API root (bun's rationale, Cargo.toml:~350).
unreachable_pub = "deny"

[workspace.lints.clippy]
# All major categories (M-STATIC-VERIFICATION).
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

# The one `cargo` lint that is turned off, and why it cannot be satisfied.
#
# The workspace resolves TWO versions of `syn`, from two chains and neither is
# ours to remove:
#
#   syn 2 ← url → idna → icu_normalizer → icu_collections → yoke-derive, and
#           `url` arrives from redis AND reqwest AND sqlx-core independently
#   syn 3 ← serde_derive, thiserror-impl
#
# Dropping either means dropping Redis, HTTP or Postgres. The lint reads the
# whole workspace resolve and attaches its diagnostic to whichever crate is
# being compiled, so which member goes red is an artefact of build order rather
# than of anything that member did — `afd_api` fails it today with a graph that
# contains no syn 2 at all.
#
# This is NOT a general amnesty on duplicate dependencies. Where a duplicate IS
# ours to avoid we still avoid it: `zeroize` is taken without `derive` for
# exactly this reason (see its note above), and the problem+json envelope
# builds a `serde_json::Map` rather than deriving `Serialize`. What this allows
# is the case where the only remedy would be to delete a datastore.
multiple_crate_versions = "allow"

# The `restriction` picks that carry the port's own guarantees. `unwrap`,
# `expect` and `panic` are denied because these crates are linked into a daemon
# that must not abort on a malformed wire payload: a parse failure is a typed
# error the caller decides about, never a process exit. Test targets opt back
# out per-file with `#![expect(..., reason = ...)]`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

# The rest of the M-STATIC-VERIFICATION restriction set.
allow_attributes_without_reason = "deny"
as_pointer_underscore = "deny"
assertions_on_result_states = "deny"
clone_on_ref_ptr = "deny"
deref_by_slicing = "deny"
disallowed_script_idents = "deny"
empty_drop = "deny"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
fn_to_numeric_cast_any = "deny"
if_then_some_else_none = "deny"
map_err_ignore = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "deny"
semicolon_outside_block = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
too_long_first_doc_paragraph = "deny"

[profile.dev]
# Line tables only, not full DWARF. The default (debug = 2) at 357 locked
# crates grew target/debug to 57G — 39G deps/ (352k files, mostly stale
# fingerprints cargo never GCs), 18G incremental/ — and a 70M agentsfleetd.
# Backtraces and panics keep file:line; lldb keeps stepping but loses variable
# inspection. Flip to 2 locally when you need that.
debug = 1

[profile.release]
# opt-level 3, not 'z': this is a server binary whose cost is CPU per request,
# not bytes on disk.
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Kept ON in release. Billing arithmetic crosses these crates from M177 on, and
# a silent wraparound there is a money bug that no test would surface; the
# branch cost is noise next to a Postgres round-trip.
overflow-checks = true

[profile.bench]
# Debug symbols so a profiler can attribute samples (M-HOTPATH).
debug = 1

# The shipped artifact, and the only profile a reported number may come from.
#
# `release` is what a developer builds; this is what a deployment runs. The
# difference is the LTO tail: `fat` gives the whole-program view that lets
# inlining cross crate boundaries, which is worth real throughput on a daemon
# whose hot path threads through afd_api -> afd_fleet -> afd_db on every
# request. It is not the default because it costs link time on every build, and
# a developer pays that per iteration where a deployment pays it once.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
# Debug info goes; the symbol table stays. DWARF is most of the size on disk
# and none of the production value, while a panicking daemon's last backtrace
# still names its functions through the symbol table -- and that name is what
# an operator greps the runbook for. `symbols` would shrink further and turn
# that backtrace into bare addresses; the difference is kilobytes bought with
# the one artifact you need mid-incident.
strip = "debuginfo"

# Iterating on an OPTIMIZED build without paying the LTO tail each time.
#
# `bench` inherits release's `lto = "thin"` and `codegen-units = 1`, so every
# benchmark edit re-links the whole workspace through a serialized codegen —
# which is the right setting for the number and the wrong one for the loop that
# arrives at it. This profile drops both, and keeps symbols so a profiler can
# still attribute samples. Numbers reported from here are NOT comparable to
# `dist`: measure on `dist`, iterate here.
[profile.fast-profile]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug = 1
