[package]
name = "afd_fleet_runtime"
# One aggregated test binary; see tests/runtime_suite.rs for why.
autotests = false
description = "Fleet configuration: the native setup Definition, parsed once into the typed policy every gate reads."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# M-TEST-UTIL. Unlocks the direct `GatePolicy` constructor the sibling crate's
# gate evaluator drives its rule-matching cases through; the production door
# stays the validating `TryFrom`.
test-util = ["afd_core/test-util"]
# Publishes the Definition's shape to the OpenAPI document, derived from the
# same raw types the parser reads so a new key cannot be published apart from
# being accepted. The wire crates enable it under their own `openapi`.
openapi = ["dep:utoipa"]

[dependencies]
# The shared error hull (`error_shell!`/`error_lifts!`) and the registry code
# every failure here is read under. Referenced, never re-declared — see `error`.
afd_core.workspace = true
# The signature wall owns the provider scheme strings; this crate resolves a
# trigger's `source` to one rather than declaring a second copy (RULE UFS).
afd_webhook.workspace = true
# Shape and collection work, so this crate writes only the SEMANTIC half.
# Every field deserializes as `Option`, which is what keeps "you forgot a key"
# and "you got the shape wrong" two different answers — see `error`.
garde.workspace = true
# The shared garde rules a document bound needs and garde lacks: a channel
# identifier's charset, a budget's finiteness.
afd_validate.workspace = true
serde.workspace = true
# `preserve_order` is load-bearing here rather than incidental: an unknown key
# is reported in DOCUMENT order, so the same document always names the same key
# first. Without it the answer follows hash order and two runs can disagree.
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
serde_ignored.workspace = true
thiserror.workspace = true
# The schema compiler, off by default: only the OpenAPI document build turns it on.
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
# The stored fixture setup other suites seed through `FleetSeed::native_setup`,
# pinned here against the parser that owns its format.
afd_db = { workspace = true, features = ["test-util"] }
# The schema-parity suite matches a published `pattern` the way a client
# would; the crate itself never compiles a regular expression.
regex.workspace = true

[lints]
workspace = true

[[test]]
name = "runtime_suite"
path = "tests/runtime_suite.rs"
