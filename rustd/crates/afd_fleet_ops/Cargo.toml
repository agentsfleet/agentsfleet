[package]
name = "afd_fleet_ops"
description = "Small, read-only operator projections over agentsfleet fleet state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-util = ["afd_core/test-util", "afd_db/test-util"]

[dependencies]
afd_core.workspace = true
afd_db.workspace = true
afd_api_wire.workspace = true
# The usage lines' work-type spelling, which a lease's token sum filters on.
afd_billing.workspace = true
# The lease statuses a row is stored in, spelled once beside the statements
# that write them.
afd_state.workspace = true
# Lease instants, read through the `TIMESTAMPTZ(3)` bridge.
jiff.workspace = true
jiff-sqlx.workspace = true
sqlx = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
afd_db = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
