[package]
name = "afd_webhook"
description = "The signature wall: what an unauthenticated delivery must prove before anything reads its body."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# M-TEST-UTIL. Lets a test present a signature this crate would accept, without
# re-spelling how a scheme composes one. `SlackV0` binds `v0`, a separator and
# the timestamp into the signed bytes, and all three are private here — a test
# that rebuilt them beside the scheme would keep passing on the day the
# composition changed, which is the one day it must not.
test-util = []

[dependencies]
# The registry codes a rejection answers with.
afd_core.workspace = true
# The HMAC canon. This crate computes no tag of its own — RULE UFS/OWN.
afd_crypto.workspace = true
# Svix secrets and signatures are base64; the vendored verifier decodes both
# standard-padded and unpadded forms, which is upstream's behaviour and not a
# choice this crate gets to make.
base64.workspace = true
# Provider signature headers carry a lowercase hex digest.
hex.workspace = true

[dev-dependencies]
# The suites sign fixtures the way a provider would, so a passing test is a
# round trip rather than a restatement of the verifier's own output.
afd_crypto.workspace = true
base64.workspace = true
hex.workspace = true

[lints]
workspace = true
