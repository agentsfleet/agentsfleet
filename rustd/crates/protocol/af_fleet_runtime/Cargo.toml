[package]
name = "af_fleet_runtime"
# One aggregated test binary; see tests/runtime_suite.rs for why.
autotests = false
description = "Fleet configuration requests: trigger lists, GitHub scopes, fleet names and task completion statements, parsed once."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# M-TEST-UTIL. Unlocks the direct `RepositoryBinding` constructor the
# credential mint's suites drive their reach cases through, and the error
# sample the error-surface suite grades; the production door stays the
# validating parse.
test-util = ["af_core/test-util"]

[dependencies]
# The shared error hull (`error_shell!`/`error_lifts!`) and the registry code
# every failure here is read under. Referenced, never re-declared — see `error`.
af_core.workspace = true
# The signature wall owns the provider scheme strings; this crate resolves a
# trigger's `source` to one rather than declaring a second copy (RULE UFS).
af_webhook.workspace = true
# Shape and collection work, so this crate writes only the SEMANTIC half.
# Every field deserializes as `Option`, which is what keeps "you forgot a key"
# and "you got the shape wrong" two different answers — see `error`.
garde.workspace = true
# The shared garde rules a request bound needs and garde lacks: a channel
# identifier's charset, NUL-free text, the text ceiling.
af_validate.workspace = true
serde.workspace = true
# `preserve_order` is load-bearing here rather than incidental: an unknown key
# is reported in DOCUMENT order, so the same document always names the same key
# first. Without it the answer follows hash order and two runs can disagree.
serde_json.workspace = true
serde_ignored.workspace = true
thiserror.workspace = true
# The cron grammar. Zero dependencies, std-only. This crate PARSES a trigger's
# schedule with it; `config::check_schedule` adds only the three refusals for
# expressions it accepts and the external scheduler will not honour as
# written. The daemon's schedule routes call the same check, so this is the
# one parser in the workspace.
philiprehberger-cron-parser = "0.3.0"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "runtime_suite"
path = "tests/runtime_suite.rs"
