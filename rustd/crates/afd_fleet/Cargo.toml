[package]
name = "afd_fleet"
# One aggregated integration binary; see tests/fleet_suite.rs for why.
autotests = false
description = "The runner control plane: enrolment, liveness, lease assignment, report settlement, and the sweepers behind them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# M-TEST-UTIL. Unlocks the seams the suites drive through the crates that own
# them, so a test needs no datastore to reach a decision.
test-util = [
  "afd_auth/test-util",
  "afd_core/test-util",
  "afd_crypto/test-util",
  "afd_db/test-util",
  # The capturing metric reader the lease suite reads the runs-started
  # counter back through.
  "afd_observability/test-util",
  # The queue refusal a stubbed device-flow surface answers with.
  "afd_dragonfly/test-util",
  # The labelled billing refusal the fail-open posture suite absorbs. Taken
  # from that crate's own sample rather than named here, because the kind is
  # private to it.
  "afd_billing/test-util",
  # Admissions::for_tests seeds the real ledger in lease integration tests.
  "afd_admission/test-util",
  # The pointed admission a mixed-kind lease suite places its own queued turn
  # with, beside a runtime lease on the same host.
  "afd_authoring/test-util",
]

# Each dependency is added by the module that uses it, for the reason
# `afd_api`'s manifest states: `unused_crate_dependencies` is how the dependency
# graph stays a fact rustc checks rather than a claim.
[dependencies]
# The shared poll admits private setup through its production-domain owner.
afd_authoring.workspace = true
# The thread a chat lease reads its turns from is a trait object, so a read
# that fails is tested with a failing implementation.
async-trait.workspace = true
# The message-cap sentence spells the cap from its constant.
const_format.workspace = true
# The families this crate produces. The dependency points this way and not the
# other: telemetry knows nothing about leases or memory, and the counts below exist only
# where the work happens.
afd_observability.workspace = true
# Identifiers, the clock, the error-code registry, and the bounded primitives.
afd_billing.workspace = true
# The only writer of `connector.integration_grants`. A delivery that finds no grant
# asks for one through this crate rather than inserting a row the approval
# resolve would have to trust — the direction the `afd_events` split below made
# possible, taken the other way.
afd_approval.workspace = true
afd_credential.workspace = true
afd_gate.workspace = true
afd_core.workspace = true
# The pool every statement in `sql/` runs against.
afd_db.workspace = true
# `fleet.events`. The table's statements moved out of this crate's
# `sql::event` and into the crate named for it, so `afd_approval` could reach
# them without depending on leases, money, policy and four sweepers.
afd_events.workspace = true
# The live tail and best-effort pickup doorbell.
afd_dragonfly.workspace = true
# Owns `fleet.obligations`: the report path commits an obligation through
# it. The edge runs fleet -> outbound and never back.
afd_outbound.workspace = true
# The one masker the product carries: an interim message is scrubbed of the
# fleet's secret values with the same `Scrub` the runner applies, so the two
# can never disagree on what a masked value reads as.
afr_secrets.workspace = true
# The admission producer identity and stored reply destination.
afd_admission.workspace = true
# The connector a reply destination names, parsed from the admission row
# once, so an obligation carries the type and never a model provider's
# string. Already in this crate's graph through `afd_outbound`.
afd_connector.workspace = true
# The HOST's plane. The lease is issued TO a runner, so the lease statements
# bind runner rows through its `Bound`, and finalize writes the one
# `lease_released` audit row using its vocabulary — the single point the two
# planes meet.
afd_runner.workspace = true
# The runner-plane state reads, and the `admin_state` spelling the credential
# lookup already owns — imported rather than restated (RULE UFS).
afd_state.workspace = true
# The stored fleet config a lease resolves: the budget ceiling the gate reads,
# the credential names the secrets map is built from, and the network and
# repository policy the `ExecutionPolicy` carries. Resolved fresh per lease —
# a PATCH takes effect on the next one, never on a cached copy.
afd_fleet_runtime.workspace = true
# The UTC month a spend ceiling opens at. Confined to `money::window`; see the
# workspace manifest for why a calendar is a dependency and the rolling day is
# not.
# The entropy a runner token is minted from. Drawn through the workspace's one
# entropy surface, never through a second call to the operating system.
afd_crypto.workspace = true
# The wire shapes this plane answers with. Frozen by M175; consumed, never
# authored here.
afd_api_wire.workspace = true
afd_wire.workspace = true
# Fleet memory. The lease plane fences the runner's two memory verbs and then
# reaches memory only through the store trait this crate holds.
afd_memory.workspace = true
sqlx.workspace = true
jiff.workspace = true
jiff-sqlx.workspace = true
# The error derive every crate under `rustd/` shapes its `Error` with.
thiserror.workspace = true
# The `Deserialize` bound the stored-column decoders take, and the value
# deserializer that turns a stored enum spelling back into its wire variant —
# through `afd_wire`'s own serde renames, so a column and the wire cannot drift.
serde.workspace = true
# JSON columns: `labels`, `registry_allowlist`, `capability_report` and the
# `metadata` a runner event carries are all `jsonb`, built and read as values.
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
# The `tracing` capture the suites read their log lines back through
# (`afd_core::test_util::trace`). A dev-dependency feature only.
afd_core = { workspace = true, features = ["test-util"] }
# The thread row fixture the lease history's caps are proven against.
afd_events = { workspace = true, features = ["test-util"] }
# The credential plane moved out; its client and the zeroizing wrapper are
# still what the lease suite constructs a stub broker with.
reqwest.workspace = true
zeroize.workspace = true
afd_credential = { workspace = true, features = ["test-util"] }
afd_runner = { workspace = true, features = ["test-util"] }
# The suites need REAL parallelism: every contention proof in this crate — the
# affinity race, the reclaim fence, the mint single-flight — is worthless on a
# single-threaded runtime, because the interleaving it exists to force cannot
# happen (`dispatch/write_rust.md`: "Concurrency work needs a deterministic
# contention test, not only a happy-path asynchronous test").
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# Inspect Dragonfly directly to prove the absence of inbound queue keys.
redis.workspace = true
# Installs a subscriber so `tracing` event macros evaluate their fields at all;
# without one a diagnostic line reads as unreachable to llvm-cov.
tracing-subscriber.workspace = true
# The integration suite creates and drops its own database per test, which
# needs the migrator and the role-resolving pool config the library never asks
# for. A dev-dependency on the crate this one already depends on, for the
# `test-util` seams only the suite reaches.
afd_db = { workspace = true, features = ["test-util"] }
# The digest a suite proves is stored in place of the token.
afd_auth = { workspace = true, features = ["test-util"] }
# The direct `GatePolicy` constructor the gate evaluator's cases are built
# from. A dev-dependency on a crate this one already depends on, for the
# `test-util` seam only the tests reach.
afd_fleet_runtime = { workspace = true, features = ["test-util"] }
# `Redis::unreachable`, for the drop paths. The lane's Redis is shared by every
# test binary running in parallel, so an injection that takes the SERVER away
# fails unrelated suites; a lazy handle one test owns fails only its own
# commands. Same shape as the `afd_db` line above, for the same reason.
afd_dragonfly = { workspace = true, features = ["test-util"] }
# `afr_secrets::error::one_of_each_kind`, the matcher refusal a scrub raises
# only past gigabytes of secret values, for the lift suite's scrub case.
afr_secrets = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "fleet_suite"
path = "tests/fleet_suite.rs"
