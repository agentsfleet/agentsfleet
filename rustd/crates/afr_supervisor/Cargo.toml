[package]
name = "afr_supervisor"
description = "The runner's supervisor: the daemon-facing duties a lease relies on, outside every sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The span vocabulary every runner span is written in, beside the daemon's.
afd_observability.workspace = true
# Identifiers, the lease clock, worker-count clamps, the environment seam and
# the registry codes a failure is logged under.
afd_core.workspace = true
# The one wire: every verb's request and reply, spelled once.
afd_wire.workspace = true
afr_agent.workspace = true
afr_executor.workspace = true
# The memory seed a run starts from, and the recall seam past its window.
afr_memory.workspace = true
afr_sandbox.workspace = true
# The runner token and every minted credential are held as one `Secret`.
afr_secrets.workspace = true
# The mint seam a lease's egress guard mints through, which the supervisor
# implements over its control plane.
afr_egress.workspace = true
# `RunnerApi` is `dyn`: production holds the HTTP client, tests a fake.
async-trait.workspace = true
# Bounded exponential retry for the calls that may be retried, with a predicate
# that refuses to retry a 4xx.
backon.workspace = true
bytes.workspace = true
# A bundle's entries, read so `afd_core::bundle::BundleDigest` can name them.
tar.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# The report spool and the bundle cache write through a temporary file that is
# persisted only once complete, so a crash never leaves half a report.
tempfile.workspace = true
thiserror.workspace = true
# The daemon's address, parsed once at boot; every route joins under it.
url.workspace = true
# The runner token and minted credentials are wiped from memory when dropped.
zeroize.workspace = true
# `fs` for the report spool's one-step renames and removals; the executor
# links it already.
tokio = { workspace = true, features = ["fs", "rt", "sync", "time", "macros"] }
# The token that stops a run when its lease is refused, and stops the pool at
# shutdown.
tokio-util.workspace = true
tracing.workspace = true
# `catch_unwind` around an agent run, so a panicking engine still has its
# sandbox torn down.
futures-util.workspace = true

[dev-dependencies]
# The production connector the fake agent admits through, so a lease naming a
# provider no wire speaks is refused by the real check.
afr_providers.workspace = true
# Stub handlers, so the lease suites admit through a real catalog: a
# sandbox-side tool starts a sandbox, a supervisor-side one does not.
afr_tools = { workspace = true, features = ["test-util"] }
# The bundle tests' independent oracle for the digest.
hex.workspace = true
sha2.workspace = true
# The daemon side of `HttpRunnerApi`'s tests: a real listener, so a status code
# and a header are proven on the socket rather than assumed by a mock.
axum.workspace = true
afd_core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "test-util"] }
