[package]
name = "afd_observability"
# One test binary, declared rather than discovered. See
# `tests/observability_suite.rs` and `docs/architecture/testing.md`.
autotests = false
description = "The attribute vocabulary and export machinery for this daemon's push-only telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Dependencies are added by the module that uses them. The vocabulary is
# `&'static str` constants and needs nothing.
[dependencies]
# The runner-reported vocabulary the per-runner counters are keyed by. Consumed,
# never authored here: an outcome this crate spelled for itself would be a
# second vocabulary the wire does not know about.
afd_wire.workspace = true
# The span pipeline. The SDK builds and exports; the API crate beside it is
# what the delivery span is CONSTRUCTED through — a synthesized span sets its
# own start and end, which is a `SpanBuilder` and not a scope, so this crate
# names the API directly rather than reaching it through the SDK's re-exports.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
# The OFFICIAL PostHog Rust client. `default-features = false` drops its error
# tracking, which is `tracing`'s job here and would otherwise ship a second
# stack-trace path; `async-client` is the batching, background-flushing
# transport a request path must never wait on.
posthog-rs = { workspace = true, default-features = false, features = ["async-client"] }
# The event payloads, and the deduplication key a finished run reports under.
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true
# The error type's derive. The standard's shape is a `thiserror` enum with
# `#[source]`-carrying variants, so the crate that gains its first error type
# gains this with it.
thiserror.workspace = true
# The census reader. Tab delimiter, `#` comment lines, header-to-field
# mapping, unequal-row detection and serde deserialization are all its job;
# every error it raises already names the record and line that failed.
csv.workspace = true
# The column vocabularies are `#[serde(rename)]` on the enums that hold them,
# so the accepted spellings cannot drift from the type.
serde.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[[test]]
name = "observability_suite"
path = "tests/observability_suite.rs"
