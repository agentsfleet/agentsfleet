[package]
name = "afd_observability"
description = "The attribute vocabulary and export machinery for this daemon's push-only telemetry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Dependencies are added by the module that uses them. The vocabulary is
# `&'static str` constants and needs nothing.
[dependencies]
# The runner-reported vocabulary the per-runner counters are keyed by. Consumed,
# never authored here: an outcome this crate spelled for itself would be a
# second vocabulary the wire does not know about.
afd_wire.workspace = true
# The span pipeline. The SDK only — it re-exports the API types this crate
# names, and `unused_crate_dependencies` caught the API crate riding along
# unused. The OTLP transport is boot's, because an endpoint is configuration
# and this crate has none.
opentelemetry_sdk.workspace = true
tracing.workspace = true

[dev-dependencies]
# The tracer API the suites emit spans through. A dev-dependency because the
# library names only the SDK's own re-exports.
opentelemetry.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
