[package]
name = "afr_agent"
description = "The runner's agent-engine seam: what runs one lease's turn, and where its activity goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Native execution deadlines retain the daemon's timestamp type.
jiff.workspace = true
schemars.workspace = true
garde.workspace = true
zeroize.workspace = true
af_context.workspace = true
af_crypto.workspace = true
sha2.workspace = true
hex.workspace = true
# The runner's own families: a turn's and a tool call's duration.
afr_telemetry.workspace = true
af_core.workspace = true
# The span vocabulary the loop's turns and calls are traced in.
af_observability.workspace = true
af_wire.workspace = true
# A lease's outbound guard, and the mint seam the supervisor implements.
af_egress.workspace = true
afr_executor.workspace = true
# The fleet's memory a run's calls share, and the deltas it pushes.
afr_memory.workspace = true
# The model a run drives, behind one trait.
af_providers.workspace = true
# The loop's order of turns: this crate is its conversation, and a durable
# task is its extension.
guffbolt.workspace = true
# Every secret value masked in one pass over a frame, an output or a reply.
af_secrets.workspace = true
# The catalog a run is offered from, and the handlers the router calls.
afr_tools.workspace = true
async-trait.workspace = true
# A turn reads the provider's stream of chunks.
futures-util.workspace = true
serde.workspace = true
# A tool call's arguments.
serde_json.workspace = true
thiserror.workspace = true
# `select!` races each turn and each call against the lease's stop.
tokio = { workspace = true, features = ["macros", "time"] }
# The token that stops a run when its lease ends early.
tokio-util.workspace = true
tracing.workspace = true

[features]
# M-TEST-UTIL. The scripted engine the supervisor's lanes drive a lease with:
# a fixed turn whose every frame is known, so a sandbox or wire fault cannot
# hide behind a model's choices.
test-util = []

[dev-dependencies]
aho-corasick.workspace = true
memmap2.workspace = true
# The recorder a suite reads its own measurements back through.
afr_telemetry = { workspace = true, features = ["test-util"] }
# The `tracing` capture the suites read a failure arm's log line through.
af_core = { workspace = true, features = ["test-util"] }
afr_tools = { workspace = true, features = ["test-util"] }
# A mint that mints nothing, and a transport that records, for the loop suites.
af_egress = { workspace = true, features = ["test-util"] }
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "test-util"] }
# `tests/providers`: each wire against a fake provider on a real TLS socket,
# driven by this loop, so a turn is proven end to end: frames, trace, records
# and report included.
af_providers = { workspace = true, features = ["test-util"] }
af_inference.workspace = true
reqwest.workspace = true
axum.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true

[[test]]
name = "providers"
path = "tests/providers/main.rs"
# The suite drives the scripted discard sink this crate's `testing` exports.
required-features = ["test-util"]
