[package]
name = "agentsfleet_runner"
autotests = false
description = "The one runner binary: `run` supervises runs, `probe` reports what the host can enforce, `sandbox` serves the executor inside each sandbox."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The binary needs its production engine; the debug engine is optional.
[[bin]]
name = "agentsfleet-runner"
path = "src/main.rs"
required-features = ["bubblewrap"]

[[bin]]
name = "agentsfleet-recovery-fixture"
path = "tests/recovery_process/main.rs"
required-features = ["test-util", "bubblewrap"]

[features]
# Each engine this binary can build, one feature apiece and all on by default:
# only this binary and the e2e crate name an engine crate.
default = ["bubblewrap", "unsandboxed"]
# The hardened bubblewrap engine, a release's only engine, with the cgroup
# root and the toolbox it is booted over.
bubblewrap = ["dep:afr_engine_bubblewrap", "dep:afr_cgroup", "dep:afr_image"]
# The debug engine, which builds no sandbox and which a debug build alone
# constructs.
unsandboxed = ["dep:afr_engine_unsandboxed"]
# M-TEST-UTIL. The recovery fixture's scripted providers, the TLS client
# trusting its fake provider and its drill engine, and the kernel lane's
# supervisor fixtures.
test-util = [
    "af_providers/test-util",
    "dep:guffbolt-ai",
    "unsandboxed",
    "afr_engine_unsandboxed/test-util",
    "afr_supervisor/test-util",
    "afr_tools/test-util",
    "af_egress/test-util",
]

[dependencies]
af_config.workspace = true
garde.workspace = true
serde.workspace = true
# The log-level knob both binaries read, declared once, and the stop `run`
# waits on (`signal`).
af_core = { workspace = true, features = ["signal"] }
# The agent loop every run's turn runs on.
afr_agent.workspace = true
# Every tool the loop hosts, and the guarded network its egress tools send on.
afr_tools.workspace = true
af_egress.workspace = true
# The bounds the runner's `[tools]` section chooses for the built-in tools
# and a run's subagents, spelled as `guffbolt` takes them.
guffbolt.workspace = true
# `probe` answers with the supervisor's own mapping of the host onto the wire,
# so what the command prints is what a heartbeat would carry.
afr_supervisor.workspace = true
# The seam `run` serves runs through, whichever engine it built.
afr_engine.workspace = true
# `sandbox` hardens and serves inside every sandbox.
afr_guest.workspace = true
# The engines, each behind its feature; `probe` reads the host as bubblewrap
# admits it.
afr_engine_bubblewrap = { workspace = true, optional = true }
afr_engine_unsandboxed = { workspace = true, optional = true }
# The cgroup root the service manager delegated, and the toolbox a deploy
# staged: what bubblewrap is booted over.
afr_cgroup = { workspace = true, optional = true }
afr_image = { workspace = true, optional = true }
# The sizes the runner's `[tools]` and `[executor]` sections choose for every
# executor link, spelled as the executor takes them.
afr_executor.workspace = true
# The log filter that holds the model library's own lines to its warnings,
# the provider timeout and retry settings, and the providers the loop reaches
# models through.
af_providers.workspace = true
# The recovery fixture's client trusting the fake provider's TLS listener
# (`test-util`): a binary links no dev-dependency.
guffbolt-ai = { workspace = true, optional = true, features = ["test-util"] }
# `run`'s export: the credential-free endpoint, the span budget, the runner's
# own families and the layer its subscriber carries.
afr_telemetry.workspace = true
clap.workspace = true
serde_json.workspace = true
# `run`'s runtime, and the token every supervised task stops on.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The run entry's storage home.
tempfile.workspace = true
# `MapEnv`, so the log-level fallback is tested without the process environment.
af_core = { workspace = true, features = ["test-util"] }
# The `run` suite's fake daemon and collector: real listeners, so the binary
# runs and exports over the sockets it uses on a host; the kernel lane's fakes
# answer JSON.
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
# The routes the fake daemon answers, spelled once.
af_wire = { workspace = true, features = ["test-util"] }
# Run and credential expiries are jiff instants on the wire.
jiff.workspace = true
# The fake daemon answers as the supervisor's own suites' healthy daemon does,
# over the same fixture run.
afr_supervisor = { workspace = true, features = ["test-util"] }
# A fresh sandbox identifier for the host suite's built sandbox.
afr_engine = { workspace = true, features = ["test-util"] }
# The span, attribute and knob names the suite reads back, spelled once.
af_observability.workspace = true
af_otlp.workspace = true
# The kernel lane (`examples/kernel_lane`): the sandbox engines on a real
# kernel, driven with the supervisor's own checkout, the runner's real tools
# through their catalog and the agent loop, as this binary links them.
af_crypto.workspace = true
hyper.workspace = true
futures-util.workspace = true
libtest-mimic.workspace = true
# The kernel lane's own engine and release fixtures: a supervisor engine that
# wraps bubblewrap, a toolbox release signed and digested as the runner verifies
# one (ECDSA P-256 over SHA-256, the signature in base64), and the mount,
# ownership and process calls a trial makes directly.
async-trait.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
digest-io.workspace = true
hex.workspace = true
rustix.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The kernel calls the lane's confinement and delegation trials read back.
libc.workspace = true
# The egress far host, killed-run leftovers and host objects the kernel lane
# proves egress against.
afr_firewall = { workspace = true, features = ["test-util"] }

# The kernel lane drives bubblewrap and proves egress with the firewall's
# `test-util` far host; run without them, it refuses to build rather than skip
# those trials. Linux only: elsewhere its `main` reports the platform and exits.
[[example]]
name = "kernel_lane"
required-features = ["test-util", "bubblewrap"]

# Drives the binary with `run --unsandboxed`, which needs both engines.
[[test]]
name = "runner_suite"
path = "tests/runner_suite.rs"
required-features = ["bubblewrap", "unsandboxed"]
