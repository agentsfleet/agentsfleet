[package]
name = "agentsfleet_runner"
autotests = false
description = "The one runner binary: `run` supervises runs and `probe` reports what the host can enforce."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The binary always links its production engine, Firecracker; the debug
# engine is optional.
[[bin]]
name = "agentsfleet-runner"
path = "src/main.rs"

[[bin]]
name = "agentsfleet-recovery-fixture"
path = "tests/recovery_process/main.rs"
required-features = ["test-util"]

[features]
# The debug engine, on by default: only this binary and the e2e crate name an
# engine crate. The release build passes `--no-default-features`
# (`scripts/build-candidate.sh`), so the shipped runner carries neither the
# debug engine nor the guest agent it serves in-process; `af_e2e`'s layer
# test holds both.
default = ["unsandboxed"]
# The debug engine, which builds no sandbox and which a debug build alone
# constructs.
unsandboxed = ["dep:afr_engine_unsandboxed"]
# M-TEST-UTIL. The recovery fixture's scripted providers, the TLS client
# trusting its fake provider and its drill engine, and the kernel lane's
# supervisor fixtures.
test-util = [
    "af_providers/test-util",
    "dep:guffbolt-ai",
    "unsandboxed",
    "afr_engine_unsandboxed/test-util",
    "afr_supervisor/test-util",
    "afr_tools/test-util",
    "af_egress/test-util",
]

[dependencies]
af_config.workspace = true
# The KVM reading `probe` judges a host by.
af_wire.workspace = true
garde.workspace = true
serde.workspace = true
# The log-level knob both binaries read, declared once, and the stop `run`
# waits on (`signal`).
af_core = { workspace = true, features = ["signal"] }
# The agent loop every run's turn runs on.
afr_agent.workspace = true
# Every tool the loop hosts, and the guarded network its egress tools send on.
afr_tools.workspace = true
af_egress.workspace = true
# The bounds the runner's `[tools]` section chooses for the built-in tools
# and a run's subagents, spelled as `guffbolt` takes them.
guffbolt.workspace = true
# `probe` answers with the supervisor's own mapping of the host onto the wire,
# so what the command prints is what a heartbeat would carry.
afr_supervisor.workspace = true
# The seam `run` serves runs through, whichever engine it built.
afr_engine.workspace = true
# Our Firecracker microVM engine, which also reads the Landlock and seccomp
# facts `probe` reports; the debug engine behind its feature.
afr_engine_firecracker.workspace = true
afr_engine_unsandboxed = { workspace = true, optional = true }
# The cgroup root the service manager delegated, and the toolbox a deploy
# staged: what Firecracker is booted over. With the egress tables, the
# building blocks `probe` reads the host through.
afr_cgroup.workspace = true
af_cgroup.workspace = true
afr_image.workspace = true
afr_firewall.workspace = true
# The sizes the runner's `[tools]` and `[agent]` sections choose for every
# guest agent's link, spelled as the agent takes them.
af_guest_wire.workspace = true
# The log filter that holds the model library's own lines to its warnings,
# the provider timeout and retry settings, and the providers the loop reaches
# models through.
af_providers.workspace = true
# The recovery fixture's client trusting the fake provider's TLS listener
# (`test-util`): a binary links no dev-dependency.
guffbolt-ai = { workspace = true, optional = true, features = ["test-util"] }
# `run`'s export: the credential-free endpoint, the span budget, the runner's
# own families and the layer its subscriber carries.
afr_telemetry.workspace = true
clap.workspace = true
serde_json.workspace = true
# `run`'s runtime, and the token every supervised task stops on.
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The run entry's storage home.
tempfile.workspace = true
# A real guest agent served on a scratch socket, the client a run reaches it
# through, and the confinement the kernel lane reads back: dev-dependencies
# only, which the layer rule allows.
afg_agent.workspace = true
afg_confine.workspace = true
afr_guest_client.workspace = true
# `MapEnv`, so the log-level fallback is tested without the process environment.
af_core = { workspace = true, features = ["test-util"] }
# The `run` suite's fake daemon and collector: real listeners, so the binary
# runs and exports over the sockets it uses on a host; the kernel lane's fakes
# answer JSON.
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
# The routes the fake daemon answers, spelled once.
af_wire = { workspace = true, features = ["test-util"] }
# Run and credential expiries are jiff instants on the wire.
jiff.workspace = true
# The fake daemon answers as the supervisor's own suites' healthy daemon does,
# over the same fixture run.
afr_supervisor = { workspace = true, features = ["test-util"] }
# A fresh sandbox identifier for the host suite's built sandbox.
afr_engine = { workspace = true, features = ["test-util"] }
# The span, attribute and knob names the suite reads back, spelled once.
af_observability.workspace = true
af_otlp.workspace = true
# The kernel lane (`examples/kernel_lane`): Firecracker on a real kernel,
# held to the conformance suite with the supervisor's own checkout, and
# driven through the runner's real tools and agent loop: the checkpoint
# digests its fake service checks, the upstream request it reads back, and
# four starts joined at once. `test-util` for the lane's release key, which
# signs as the toolbox release does.
af_crypto = { workspace = true, features = ["test-util"] }
hyper.workspace = true
futures-util.workspace = true
libtest-mimic.workspace = true
# The kernel lane's fixtures: the checkout the conformance suite works, a
# toolbox release signed and digested as the runner verifies one (ECDSA P-256
# over SHA-256 through `af_crypto`, the signature in base64), and the process
# and file-system calls a trial makes directly.
async-trait.workspace = true
base64.workspace = true
hex.workspace = true
rustix.workspace = true
# The Firecracker lane writes a restored checkpoint's file through the
# guest agent, which takes its bytes as `Bytes`.
bytes.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The system-call numbers and errno values the lane's confinement and
# delegation trials read back.
libc.workspace = true
# The egress far host, killed-run leftovers and host objects the kernel lane
# proves egress against.
afr_firewall = { workspace = true, features = ["test-util"] }

# The kernel lane drives Firecracker and proves egress with the firewall's
# `test-util` far host. Linux only: elsewhere its `main` reports the platform
# and exits.
[[example]]
name = "kernel_lane"
required-features = ["test-util"]

# Drives the binary with `run --engine unsandboxed`, the debug engine.
[[test]]
name = "runner_suite"
path = "tests/runner_suite.rs"
required-features = ["unsandboxed"]
