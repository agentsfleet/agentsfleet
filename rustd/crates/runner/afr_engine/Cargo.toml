[package]
name = "afr_engine"
description = "The seam every sandbox engine meets: its traits, facts, egress plans, boot admission, warm slots and errors, with no operating-system code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# What a pinned workspace yields to the save that reads it.
af_chunk_store.workspace = true
af_core.workspace = true
# A warm slot's sandbox identifier, minted the one way identifiers are.
af_crypto.workspace = true
# The engine, isolation and KVM names the seam states and the heartbeat
# carries: one type in both places.
af_wire.workspace = true
# The conformance suite's file writes carry bytes (`test-util`).
bytes = { workspace = true, optional = true }
# The conformance suite's trials fail as the kernel lane's do (`test-util`).
libtest-mimic = { workspace = true, optional = true }
# A snapshot's pin is read, and its saved tree packed for an import, as the
# guest agent's tar stream.
tar.workspace = true
# A snapshot's pin and its restored tree wait in spools only the runner reads.
tempfile.workspace = true
# A chunk's plaintext is wiped when dropped.
zeroize.workspace = true
# Every sandbox serves the same guest agent, reached through one client, which
# is what makes a second engine an addition rather than a rewrite.
afr_guest_client.workspace = true
af_guest_wire.workspace = true
async-trait.workspace = true
# A pin's changes are read as a stream, and the warm-slot suite polls a
# claim once.
futures-util.workspace = true
# A warm slot's refill and an egress plan's read-back wait without a
# hand-written loop.
backon.workspace = true
# The park mode's log spelling, from one attribute rather than a match.
strum.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true

[features]
# M-TEST-UTIL. A fresh sandbox identifier, the build of unknown outcome a
# test's engine answers, and the conformance suite every engine passes.
# The conformance suite's snapshot trials run over the in-memory chunk store.
test-util = ["dep:bytes", "dep:libtest-mimic", "af_chunk_store/test-util"]

[dev-dependencies]
af_core = { workspace = true, features = ["test-util"] }
# The warm-slot suite's fake guest agent takes the bytes a write carries.
bytes.workspace = true
# The conformance suite, which its own tests run over fakes.
libtest-mimic.workspace = true
af_chunk_store = { workspace = true, features = ["test-util"] }
# `io-util`: the conformance fakes read an import and write an export.
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
