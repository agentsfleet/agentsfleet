[package]
name = "afr_engine_firecracker"
description = "Our Firecracker engine: one microVM per run behind the stock jailer, the toolbox and the workspace image as its drives, its egress on a tap the host table holds, its console logged line by line, and the vsock dial to its guest agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
af_core.workspace = true
# The engine, isolation and KVM names the engine states and its boot judges.
af_wire.workspace = true
# The seam it meets.
afr_engine.workspace = true
# Every guest serves the same agent; the host dials it over vsock through
# the client, and writes the agent's flags on the kernel's command line.
afr_guest_client.workspace = true
af_guest_wire.workspace = true
async-trait.workspace = true
# The monitor's `--config-file`: one JSON document per boot.
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The vsock handshake, retried while a guest boots, without a hand-written
# loop.
backon.workspace = true
# A guest's cgroup leaf under the delegated subtree, and the kernel's cgroup
# file names.
afr_cgroup.workspace = true
af_cgroup.workspace = true
# Its namespace, tap and host table.
afr_firewall.workspace = true
# The verified toolbox a guest's read-only drive is, and the workspace image
# formatted for its data drive.
afr_image.workspace = true
# The Landlock ruleset the host probe asks the kernel whether it can build.
landlock.workspace = true
# The monitor's process group, signalled when a sandbox ends.
libc.workspace = true
# The host's `MemAvailable`, parsed from `/proc/meminfo`, which the memory
# bound is made from.
procfs-core.workspace = true
# The mount, ownership, device-node and identity calls a jail and a guest
# are made with.
rustix.workspace = true

[dev-dependencies]
af_core = { workspace = true, features = ["test-util"] }
# A guest agent served over a socket pair, as a booted guest serves vsock: a
# dev-dependency only, which the layer rule allows.
afg_agent.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

# The kernel lane, which boots this engine's microVMs, is `agentsfleet_runner`'s
# example (`runner/main/examples`), so this crate dev-depends on no crate that
# depends on it.
