[package]
name = "afr_memory"
description = "One run's memory: what the fleet remembered at run start, and what the run stores, recalls and forgets before the push."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Recovery overlays are validated, serialized and scrubbed under current policy.
serde.workspace = true
af_secrets.workspace = true
# Recall's case-insensitive key match, with no copy of each key.
aho-corasick.workspace = true
# `Recall` is `dyn`: what a recall past the window asks is chosen per run.
async-trait.workspace = true
# `error_shell!` and the registry codes a refused store carries.
af_core.workspace = true
# The entry shape and its bounds, declared once for daemon and runner, and the frame a push rides.
af_wire.workspace = true
# An entry is checked against the bounds `af_wire` declares on it.
garde.workspace = true
# A store is charged its encoded size against the push's frame.
serde_json.workspace = true
thiserror.workspace = true
# The one line a recall past the window leaves when the daemon does not answer.
tracing.workspace = true

[dev-dependencies]
# The text ceiling a stored entry's content is held to.
af_validate.workspace = true
# The instant a shared entry was last written, in the fakes.
jiff.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
