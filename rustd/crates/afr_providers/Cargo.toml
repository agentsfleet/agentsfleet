[package]
name = "afr_providers"
description = "The runner's model providers: one trait, the turn it streams, and the wires behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The runner's own families: a provider send retried.
afr_telemetry.workspace = true
# `error_shell!` and the registry code a provider failure is logged under.
afd_core.workspace = true
# The stream text kinds the live tail carries, and the failure classes a
# report names.
afd_wire.workspace = true
# The guard every outbound client carries: the resolver that refuses a
# private address, no proxy, no redirect. A tenant's custom: endpoint meets it.
afr_egress.workspace = true
# The bounded retry of a turn's send, the crate the supervisor's daemon calls
# retry through.
backon.workspace = true
# A turn's request body, shared by every retry without a copy.
bytes.workspace = true
# A turn streams as a `futures` stream of chunks.
futures-util.workspace = true
# The request and response types rig's HTTP seam speaks.
http.workspace = true
# `Retry-After` in its HTTP-date form.
httpdate.workspace = true
# The one HTTP client every wire posts through, behind rig's HTTP seam.
reqwest.workspace = true
# Each wire: the request rig builds, the stream it decodes, the calls it
# assembles and the reasoning it carries back.
rig-core.workspace = true
# Each wire's request body and streamed events, narrowed at the parse.
serde.workspace = true
# A tool call's arguments.
serde_json.workspace = true
thiserror.workspace = true
# The provider table's base URLs, parsed once when the registry is built.
url.workspace = true
# The retry log line, and the level rig's own lines are held to.
tracing.workspace = true
# The filter that holds rig's lines to its warnings.
tracing-subscriber.workspace = true

[dev-dependencies]
# The recorder a suite reads its own measurements back through.
afr_telemetry = { workspace = true, features = ["test-util"] }
# The log capture the retry and key suites read their lines through.
afd_core = { workspace = true, features = ["test-util"] }
# The real loop drives each wire in `tests/`, so a turn is proven end to end:
# frames, trace, records and report included. A dev-dependency on a crate that
# depends on this one links the same library into the integration tests.
afr_agent = { workspace = true, features = ["test-util"] }
# The empty memory seed every driven run starts from.
afr_memory.workspace = true
# The stub plan tool the loop's catalog hosts.
afr_tools = { workspace = true, features = ["test-util"] }
# The mint a suite's run carries, which mints nothing.
afr_egress = { workspace = true, features = ["test-util"] }
# The fake provider: a real listener, so a status, a header and a streamed
# body are proven on the socket rather than assumed by a mock.
axum.workspace = true
# The connect-refused send the retry suite classifies, and the fake provider
# servers the wire suites stream from.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync"] }
# The stop every driven run is given.
tokio-util.workspace = true
