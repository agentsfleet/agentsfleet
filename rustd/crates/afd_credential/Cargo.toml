[package]
name = "afd_credential"
description = "What a run may use and how it reaches it: the declared secrets, the vault that opens them, the provider they dial, and the short-lived credential a broker mints."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Identifiers, the clock, the registry codes, and the stored credential field
# names two planes agree on.
# A provider's posture — which key pays for a call — is the billing plane's
# vocabulary, read here to decide which credential to dial with.
afd_billing.workspace = true
afd_core.workspace = true
afd_inference.workspace = true
# Opening a sealed handle.
afd_crypto.workspace = true
# The key-less half of the secret store. The registry page renders provider,
# kind, endpoint and key PRESENCE for a page of entries, and reads them through
# `Directory` — a type with no key field — so "a registry page decrypts nothing"
# is a property of the reader rather than of the path.
afd_vault.workspace = true
# The Postgres pool every statement here runs on.
afd_db.workspace = true
# A fleet's declared credentials and provider selection, as its config spells
# them.
afd_fleet_runtime.workspace = true
# Reuse the ingress parser for raw Svix signing secrets during setup review.
afd_webhook.workspace = true
# The minted-credential shape the runner is answered with.
afd_wire.workspace = true
# Every instant a mint, a cache entry or a stored row carries.
jiff.workspace = true
# The `TIMESTAMPTZ` bridge for those instants: row fields decode through it and
# a cursor boundary binds through it.
jiff-sqlx.workspace = true
# The GitHub App flow: the RS256 App JWT. Its two REST calls ride `reqwest`.
jsonwebtoken.workspace = true
# The broker's short-lived credential cache. A mint that already happened for
# this workspace and handle is not re-run inside its TTL.
moka = { workspace = true, features = ["future"] }
reqwest.workspace = true
sha2.workspace = true
# A credential's bytes are wiped when the value holding them is dropped.
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["json"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a caller's
# suite reaches this crate's seam with no datastore behind it.
test-util = [
    "afd_core/test-util",
    "afd_db/test-util",
    "afd_fleet_runtime/test-util",
]

[dev-dependencies]
# The tracing capture, so a discarded overreaching token is proven to log its
# reach and never the token itself.
afd_core = { workspace = true, features = ["test-util"] }
# The unreachable pool a platform row fails to open against.
afd_db = { workspace = true, features = ["test-util"] }
# `RepositoryBinding::from_parts`, so the GitHub mint's cases build a binding
# without a stored config document to parse.
afd_fleet_runtime = { workspace = true, features = ["test-util"] }
# A loopback GitHub for the mint's two calls, so the token request's body is
# read by a real HTTP server rather than searched for in socket bytes.
axum.workspace = true
# A fresh RSA App key per run for the signed mint, so no private key is
# committed.
rcgen.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true
