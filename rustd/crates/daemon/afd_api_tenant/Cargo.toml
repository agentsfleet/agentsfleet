[package]
name = "afd_api_tenant"
description = "Tenant-facing HTTP handlers over tenant-owned services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-util = [
  # `handler/fleet/message/tests.rs` builds its thread rows with
  # `EventDetailRow::fixture`, which is `#[cfg(feature = "test-util")]` on
  # afd_events. Without this forward the lib test does not COMPILE, which the
  # unit lane reads as a code fault rather than as a missing feature edge.
  "afd_events/test-util",
  "afd_fleet_lifecycle/test-util",
  "afd_tenant/test-util",
  "afd_vault/test-util",
]
# Generates this plane's half of the OpenAPI document. NOT default: the shipped
# daemon compiles no annotation, no schema string and no collector — the whole
# of it is a build-time tool, and CI is where its compile cost belongs.
openapi = ["dep:utoipa", "afd_http/openapi", "afd_api_wire/openapi", "af_wire/openapi"]

[dependencies]
afd_bus.workspace = true
jiff.workspace = true
af_crypto.workspace = true
afd_cron.workspace = true
afd_connector.workspace = true
afd_approval.workspace = true
afd_auth.workspace = true
afd_authoring.workspace = true
afd_billing.workspace = true
# The tenant's provider selection: the row the Models page reads and writes.
afd_credential.workspace = true
af_core.workspace = true
# A garde report answered with the route's own sentence (`Sentences`), and the
# shared `?limit` bound.
af_validate.workspace = true
const_format.workspace = true
garde.workspace = true
afd_events.workspace = true
# Native task ownership and keyset values used by fleet task reads.
afd_fleet.workspace = true
afd_fleet_lifecycle.workspace = true
af_fleet_runtime.workspace = true
afd_http.workspace = true
# The memory page's view, boundary and row, read by the memory routes.
afd_memory.workspace = true
# The invite email's types: what a send is given and what it comes to.
afd_mail.workspace = true
af_observability.workspace = true
afd_sse.workspace = true
# The published message a live-tail body borrows its payload bytes from; see
# `handler/stream/body.rs`.
afd_tenant.workspace = true
afd_vault.workspace = true
afd_api_wire.workspace = true
af_wire.workspace = true
# The document generator, reachable only under `openapi`. Optional at every
# member that names it, so the default resolve is unchanged.
utoipa = { workspace = true, optional = true }
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The trace capture a log line's fields are read back through.
af_core = { workspace = true, features = ["test-util"] }
# A real datastore refusal, the only failure the shared fleet store lifts.
afd_db.workspace = true

[lints]
workspace = true
