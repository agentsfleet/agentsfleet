[package]
name = "afd_identity"
# One aggregated test binary; see tests/identity_suite.rs for why.
autotests = false
description = "The identity provider's side of authentication: JWKS verification and live capability resolution."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# M-TEST-UTIL: a key-set source that answers from a fixture, so every branch of
# the verifier — including "a key-id miss triggers exactly one refresh" — is
# provable without a network.
test-util = ["afd_auth/test-util", "af_core/test-util"]

[dependencies]
# Instants are `jiff::Timestamp`, the type af_core's clock returns.
jiff.workspace = true
afd_auth.workspace = true
af_core.workspace = true
# The rule that a subject spliced into a path is not `.` or `..`.
af_validate.workspace = true
# The wiping owner of the provider's backend secret.
af_crypto.workspace = true
base64.workspace = true
moka.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
# `net` and `io-util` for the one-shot loopback server the HTTP source is read
# against; `rt-multi-thread` is NOT asked for, because nothing here is.
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "io-util", "time"] }
# Tests build the header variants the fixtures cannot carry — an unsupported
# `alg`, a header with no `kid` — and an over-floor modulus, rather than pasting
# precomputed base64 nobody can check by eye.
base64.workspace = true
# Tests SIGN tokens, so a claim shape the fixtures do not carry — an array
# audience, a tenant nested under `metadata` — can be verified rather than
# asserted about. `af_crypto`'s RS256 signer signs through the AWS-LC the
# library already links; the key is a throwaway fixture
# (`tests/support/signing.rs`). The signer and the modulus and exponent it
# publishes as a key set are behind `test-util`, so the library signs nothing.
af_crypto = { workspace = true, features = ["test-util"] }
# Tracing macros do not evaluate their fields without a subscriber installed,
# so every diagnostic line here would read as unreachable without one
# (`af_core::test_util::trace::install_subscriber`). The note beside `tracing`
# in the workspace manifest carries the measurement.
af_core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "identity_suite"
path = "tests/identity_suite.rs"

# Its own binary: the one test that writes the process environment.
[[test]]
name = "direct_client"
path = "tests/direct_client.rs"
