[package]
name = "afd_sse"
description = "One Server-Sent Events connection: the frames it carries, the channels it fans in, and the ceiling on how many of them this instance holds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The families this crate produces. The dependency points this way and not the
# other: telemetry knows nothing about streams, and a frame the multiplex could
# not route is a fact only this crate holds.
af_observability.workspace = true
# The registry code a shed stream answers with.
af_core.workspace = true
# The process's ONE pub/sub connection. A stream costs a subscription on it,
# never a connection of its own — which is the whole reason a wall of tiles is
# affordable.
afd_bus.workspace = true
# The counter snapshot a `hello` carries per fleet. A leaf crate: it knows no
# stream, no hub, and nothing about this crate.
afd_api_wire.workspace = true
# The schedule a lost subscription is retried on: doubling to a ceiling.
backon.workspace = true
# The fan-in polls N subscriptions as one stream, and the tail is a `Stream`
# the HTTP layer hands to axum without this crate knowing axum exists.
futures-util.workspace = true
# The heartbeat cadence, the refresh tick's deadline, and the semaphore the
# concurrent-stream ceiling is counted on.
tokio.workspace = true
# A detached channel ends its own stream on a token, which is what lets the
# fan-in drop one fleet without disturbing the others.
tokio-util.workspace = true
# The two synthetic frames are built as values and serialized, rather than
# printed as JSON-shaped text: a fleet id reaches the wire through the same
# escaping every other string does.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The in-process bus the unit tests and the sequencing suite publish through
# and tail.
afd_bus = { workspace = true, features = ["test-util"] }
# The flaky test bus that refuses a subscribe before it accepts one.
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
# The trace capture a closed tail's line is read back through, and the sink
# subscriber that makes the event macros under test evaluate their fields.
af_core = { workspace = true, features = ["test-util"] }
