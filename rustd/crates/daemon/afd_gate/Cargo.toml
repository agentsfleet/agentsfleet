[package]
name = "afd_gate"
description = "What a fleet's run is permitted: its policy, assembled from the fleet row and the grants a person approved."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Identifiers and registry codes.
af_core = { workspace = true, features = ["sqlx"] }
# What the policy assembly resolves a fleet's approved credentials into.
afd_credential.workspace = true
# The Postgres pool every statement here runs on.
afd_db.workspace = true
# The approved GitHub scope, parsed back into the binding a run is told.
af_fleet_runtime.workspace = true
# The grant status and kind vocabulary this plane shares with the person's.
afd_api_wire.workspace = true
af_wire.workspace = true
# A repair branch names its event as base64url.
base64.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a caller's
# suite reaches this crate's seam with no datastore behind it.
test-util = [
    "af_core/test-util",
    "afd_db/test-util",
    "afd_credential/test-util",
    "af_fleet_runtime/test-util",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
afd_db = { workspace = true, features = ["test-util"] }
# The two-part credential declaration the policy suite assembles from.
afd_credential = { workspace = true, features = ["test-util"] }
# The fleet status the fixtures seed, spelled where the lifecycle declares it.
afd_fleet_lifecycle.workspace = true
# The provider key and posture a resolved provider fixture carries.
af_crypto.workspace = true
afd_billing.workspace = true
