[package]
name = "afd_admin"
description = "Small repositories for agentsfleet platform administration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-util = ["dep:serde_json", "af_core/test-util", "af_crypto/test-util", "afd_db/test-util"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
af_core.workspace = true
af_crypto.workspace = true
afd_db.workspace = true
af_wire.workspace = true
af_inference.workspace = true
# Instants are `jiff::Timestamp`; `TIMESTAMPTZ(3)` columns decode through jiff-sqlx.
jiff.workspace = true
jiff-sqlx.workspace = true
# `derive`: rows decode into named `FromRow` types; `json`: the inference settings column.
sqlx = { workspace = true, features = ["derive", "json"] }
thiserror.workspace = true

[dev-dependencies]
futures-util.workspace = true
afd_billing.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
