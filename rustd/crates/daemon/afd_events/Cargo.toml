[package]
name = "afd_events"
# One aggregated test binary; see tests/events_suite.rs for why.
autotests = false
description = "The narrative log of a fleet: the rows a run writes, the history an operator reads, and the live tail they watch it on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
afd_bus.workspace = true
serde.workspace = true
# Where a steer is accepted before anything is queued. The ledger owns the
# acceptance and the identity; this crate owns the table a runner then writes.
afd_admission.workspace = true
# Identifiers, the clock a row is stamped with, and the registry codes.
af_core = { workspace = true, features = ["sqlx"] }
# The Postgres pool every statement here runs on.
afd_db.workspace = true
# The live tail subscribes through the process's one pub/sub connection, and a
# steer appends to the fleet's stream. Both are this crate's, because both are
# the same question the table answers, asked about the present.
# The status a stopped-fleet refusal names.
afd_fleet_lifecycle.workspace = true
# The event type and status spellings the wire carries.
afd_api_wire.workspace = true
af_wire.workspace = true
# The opaque page cursor. base64url-no-pad, because the value comes back in a
# query string where a `=` would need percent-encoding.
base64.workspace = true
# Every instant a row, a cursor or a `since=` window carries.
jiff.workspace = true
# The `TIMESTAMPTZ` bridge for those instants: row fields decode through it and
# a cursor boundary binds through it.
jiff-sqlx.workspace = true
sqlx = { workspace = true, features = ["json"] }
thiserror.workspace = true
tracing.workspace = true
futures-util.workspace = true
# The history cursor's identifier bound, declared on the decoded cursor.
garde.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a router
# suite reaches this crate's seam with no datastore behind it.
test-util = [
    "afd_admission/test-util",
    "af_core/test-util",
    "afd_db/test-util",
]

[dev-dependencies]
afd_bus = { workspace = true, features = ["test-util"] }
afd_dragonfly = { workspace = true, features = ["test-util"] }
# The capacity refusal the steer unit tests hand the repeat decision.
afd_admission = { workspace = true, features = ["test-util"] }
# The lease and runner statuses the disposition suite seeds a live run under,
# so it spells them as the ledger's own statement compares them.
afd_state.workspace = true
# The `tracing` capture the suites read their log lines back through
# (`af_core::test_util::trace`). A dev-dependency feature only.
af_core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The lane fixture: the shared test database, the role/knob resolution over it,
# and the identifier minting the seeded rows are addressed by. A dev-dependency
# feature only — nothing in this crate's library links any of it.
afd_db = { workspace = true, features = ["test-util"] }
# The backfill suite delivers its live half through a real tail, because the
# claim is about the two sets a client actually holds. Acyclic: `afd_sse` knows
# `afd_dragonfly` and `af_core`, and nothing about this crate.
afd_sse.workspace = true
# A delivered frame is the publisher's bytes forwarded unrewritten, and reading
# the event id back out of them is precisely what a reconnecting client does.
serde_json.workspace = true

[[test]]
name = "events_suite"
path = "tests/events_suite.rs"
