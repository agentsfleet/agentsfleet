[package]
name = "afd_billing"
description = "What a lease costs, what a tenant has, and what a fleet has already spent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The clock a window opens against, and the registry codes.
# The charges cursor is base64url on the wire.
base64.workspace = true
af_core.workspace = true
# The Postgres pool every statement here runs on.
afd_db.workspace = true
# The random half of a ledger row's UUIDv7.
af_crypto.workspace = true
# A fleet's declared budget and dollar ceilings, as its config spells them.
af_fleet_runtime.workspace = true
# The usage line a runner reports, which the rater prices.
af_wire.workspace = true
# The billing families: every reservation and settlement is counted where the
# biller is called, the one place both products and the sweeper pass through.
af_observability.workspace = true
# `Biller` is held as `Arc<dyn Biller>`, and its methods are async.
async-trait.workspace = true
# A month window is a CALENDAR question — `af_core::clock` is the instant type
# and the clock source, and carries no calendar. Same division the events
# crate's `since=` draws.
jiff.workspace = true
# `TIMESTAMPTZ(3)` columns decode and bind through jiff-sqlx.
jiff-sqlx.workspace = true
# Native decision calls retain the exact dated quote used for later receipts.
serde.workspace = true
# `derive`: rows decode into named `FromRow` types.
sqlx = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tracing.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a caller's
# suite reaches this crate's seam with no datastore behind it.
test-util = ["af_core/test-util", "afd_db/test-util"]

[dev-dependencies]
# The integration suite races two reservations on one task.
futures-util.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util"] }
