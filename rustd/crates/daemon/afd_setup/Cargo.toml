[package]
name = "afd_setup"
description = "A workspace's fleets: the create from a first message, read, change and delete, their trigger rows, and the fleet chat's compaction store."
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# A delete ends live work and removes the row in one transaction.
afd_fleet_lifecycle.workspace = true
# The wake a new fleet's first turn rings, after its commit.
afd_bus.workspace = true
af_core = { workspace = true, features = ["sqlx"] }
# The fleet chat's compaction store implements its checkpoint port.
af_context.workspace = true
# The runtime rate a model choice is priced at.
afd_billing.workspace = true
af_crypto.workspace = true
afd_db.workspace = true
# A fleet's model resolves through the owner's registry.
afd_credential.workspace = true
# A fleet's name and its stored network scope.
af_fleet_runtime.workspace = true
af_validate.workspace = true
af_wire.workspace = true
# The run status spelling an archive or a delete marks runs under.
afd_state.workspace = true
afd_turns.workspace = true
# A fleet read lists its grants.
afd_approval.workspace = true
afd_api_wire.workspace = true
garde.workspace = true
hex.workspace = true
# Instants: `TIMESTAMPTZ(3)` columns decode to `jiff::Timestamp` through
# jiff-sqlx.
jiff.workspace = true
jiff-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
afd_bus = { workspace = true, features = ["test-util"] }
# One isolated allocator observer also checks the runner's public secret owner.
af_secrets.workspace = true
afd_approval = { workspace = true, features = ["test-util"] }
afd_turns = { workspace = true, features = ["test-util"] }
afd_db = { workspace = true, features = ["test-util"] }
# A credential refusal's vault cause, built from the vault's own name parser.
afd_vault.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
test-util = ["afd_db/test-util", "afd_bus/test-util"]

[lints]
workspace = true

[[test]]
name = "setup_suite"
path = "tests/setup_suite.rs"

[[test]]
name = "secret_wiping"
path = "tests/secret_wiping.rs"
