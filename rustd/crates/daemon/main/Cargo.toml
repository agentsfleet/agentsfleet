[package]
name = "agentsfleetd"
# One aggregated test binary; see tests/daemon_suite.rs for why.
autotests = false
description = "The daemon: subcommand parsing, boot choreography, and the task supervisor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# A library beside the binary, so the choreography is reachable from a test.
# `main.rs` is the thin part: everything a test would want to drive — boot
# order, the supervisor, the shutdown sequence — lives in the library, because
# a binary crate's internals cannot be linked by an integration suite.
[lib]
name = "agentsfleetd"
path = "src/lib.rs"

[[bin]]
name = "agentsfleetd"
path = "src/main.rs"

[features]
# M-TEST-UTIL. Unlocks the mockable cores the boot path reads through.
test-util = [
    "afd_admin/test-util",
    "afd_setup/test-util",
    "afd_api/test-util",
    "afd_auth/test-util",
    "afd_connector/test-util",
    "afd_cron/test-util",
    "af_core/test-util",
    "af_crypto/test-util",
    "afd_db/test-util",
    # The fixture identity `test_util::runner_stream` serves the runner listener with.
    "af_stream/test-util",
    # The loopback listener `test_util::collector` binds.
    "tokio/net",
]

# The document emitter. NOT default, and NOT reachable from the shipped binary:
# `cargo build --profile dist` names no feature, so an operator cannot ask a
# running daemon what it serves. CI builds with this to regenerate the artifact.
openapi = ["afd_api/openapi"]

[dependencies]
af_config.workspace = true
toml.workspace = true
serde.workspace = true
afd_bus.workspace = true
afd_gateway.workspace = true
af_stream.workspace = true
garde.workspace = true
serde_json.workspace = true
af_inference.workspace = true
afd_admin.workspace = true
# The one turns ledger every producer in this process shares.
afd_turns.workspace = true
# The client every credential exchange is posted through. Built here rather than
# inside the broker because a connection pool and a deadline are composition-root
# decisions, and one client per process is what a pool IS.
# The schedules plane the composition root assembles: the store, the scheduler
# client, and the verifier the fire ingress crosses.
afd_cron.workspace = true
reqwest.workspace = true
# `url::Host`: whether a Slack base names a loopback host, read off the host the
# parser already classified. reqwest re-exports `Url` but not `Host`.
url.workspace = true
afd_api.workspace = true
# The plane traits the composition root implements, one per handler crate,
# over the shared base `afd_http::services::Shared`.
afd_api_ingress.workspace = true
afd_api_operator.workspace = true
afd_api_runner.workspace = true
afd_api_tenant.workspace = true
afd_http.workspace = true
afd_billing.workspace = true
afd_credential.workspace = true
# `signal::shutdown`, the stop `serve` waits on.
af_core = { workspace = true, features = ["signal", "sqlx"] }
# The instant `Services::now` hands every handler.
jiff.workspace = true
# The composition root: this crate is the one that names which directory,
# capability provider and verifier the generic HTTP shell is served through.
# The operator's approval queue. Its own crate, not an `afd_fleet` module:
# showing a person what a fleet wants to do must not pull in runs, money,
# policy and the sweepers.
afd_approval.workspace = true
afd_auth.workspace = true
afd_setup.workspace = true
# The Postgres credential directory the shell authenticates against.
# The live-stream surface the plane hands the router: the pub/sub hub and the
# instance's concurrent-stream ceiling, composed once at boot.
# The product events this daemon reports, and the client behind them.
# The connector answer-delivery worker this process supervises — see
# `crate::outbound`.
afd_outbound.workspace = true
af_observability.workspace = true
# The transport both binaries build through, and the two bridges that feed it
# this daemon's existing spans and log records. The pipelines are `af_otlp`'s;
# which knobs this daemon reads and that it bridges its log records are
# decided here, at the composition root.
af_otlp.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
tracing-opentelemetry.workspace = true
afd_sse.workspace = true
afd_state.workspace = true
# The runner control plane behind the `/v1/runners` verbs.
afd_fleet.workspace = true
# Fleet memory, held once and shared by the run plane and both route families.
afd_memory.workspace = true
afd_gate.workspace = true
# The signed-ingress plane the webhook and App ingress routes resolve through.
afd_ingress.workspace = true
# The connect flow the connector routes act through, assembled here because its
# two vault halves read different workspaces — see `plane/platform.rs`.
afd_connector.workspace = true
# The workspace fleets surface's store, handed to the router as one service.
afd_fleet_lifecycle.workspace = true
# Read-only operator projections are kept off the runner execution crate.
afd_fleet_ops.workspace = true
# The tenant plane: api-keys, command-line credentials, the device-flow login
# surface, and the workspace-ownership resolver the shared layer asks.
afd_tenant.workspace = true
# The workspace secret surface's store, handed to the router as one service.
afd_vault.workspace = true
# The invite email the serving plane sends through.
afd_mail.workspace = true
# The identity provider's side of authentication: the capability claim and the
# key set. Optional at RUNTIME, not at build time — an unconfigured deployment
# holds the refusing variants rather than a different binary.
afd_identity.workspace = true
# The command line. Subcommands, `--port`, `--help` and `--version` are all
# derived from `cli::Cli`; nothing in this crate reads `std::env::args` itself.
clap.workspace = true

# Preflight resolves the master key here rather than in the crypto crate:
# `af_crypto` takes hex, deliberately, because it is the layer that must not
# know where a key came from.
af_crypto.workspace = true
# The pool and client settings boot resolves BEFORE it opens either.
afd_db.workspace = true
afd_runner.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The cancellation token every supervised task stops on.
tokio-util.workspace = true
# The accept loop drives hyper directly: `axum::serve` cannot bound the header
# buffer, and Dimension 5.3 is a bound on the header buffer.
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
# The boot-failure enum composes foreign errors by `From`, so `?` lifts them
# and the source chain survives for the fatal renderer to walk.
thiserror.workspace = true
tracing.workspace = true
# The subscriber every `tracing` emit in this process needs: without one
# installed the macros are no-ops that do not evaluate their fields.
tracing-subscriber.workspace = true

[dev-dependencies]
afd_admin = { workspace = true, features = ["test-util"] }
af_stream = { workspace = true, features = ["test-util"] }
afd_bus = { workspace = true, features = ["test-util"] }
# The `tracing` capture the suites read their log lines back through
# (`af_core::test_util::trace`). A dev-dependency feature only.
af_core = { workspace = true, features = ["test-util"] }
# The unreachable pool the sweeper and boot proofs drive.
afd_db = { workspace = true, features = ["test-util"] }
# `test-util` is what makes an assertion about JOIN_TIMEOUT affordable: with
# time paused and every task parked, the runtime advances to the next deadline
# itself, so the ten-second timeout costs no wall clock in the unit lane.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "net",
    "test-util",
] }
# The accept-fault suite names `CancellationToken` and builds a bare Router.
tokio-util.workspace = true
axum.workspace = true
serde_json.workspace = true
# The stream kinds and inference shapes the configuration and observation
# proofs read.
af_wire.workspace = true
# The TLS posture proof: a rustls client and server over an rcgen certificate.
rcgen.workspace = true
rustls.workspace = true
tempfile.workspace = true
# The suites that drive the Rust runner against this daemon are `af_e2e`'s
# (`crates/e2e/`), so no runner or harness crate is named here.

[lints]
workspace = true

[[test]]
name = "daemon_suite"
path = "tests/daemon_suite.rs"

# A binary of its own: its one test writes the process environment, which is
# sound only while no other test runs beside it.
[[test]]
name = "schedule_proxy"
path = "tests/schedule_proxy.rs"
required-features = ["test-util"]

# Owns the global tracing subscriber, like a real daemon boot.
[[test]]
name = "telemetry_boot"
path = "tests/telemetry_boot.rs"
required-features = ["test-util"]

