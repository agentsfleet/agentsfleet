[package]
name = "afd_api_wire"
# One aggregated test binary; see tests/api_wire_suite.rs for why.
autotests = false
description = "Serde types for the daemon's own API surface: the admin, tenant, operator and ingress planes no runner speaks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The shared protocol: the runner-facing types these API shapes embed
# (`AssignedPolicy`, `CapabilityReport`, `RunnerLiveness`, `SelftestReport`,
# `EventSummary`). `af_wire` never names this crate, so a daemon-only edit
# here rebuilds no runner crate.
af_wire.workspace = true
af_validate.workspace = true
# Bounds are declared on the request types they guard, as in `af_wire`.
garde.workspace = true
# Same discipline as `af_wire`: serde and serde_json at runtime, nothing else.
serde.workspace = true
# Every `_at` field is a `jiff::Timestamp`, written by `af_wire::instant`.
jiff.workspace = true
serde_json.workspace = true
# The schema compiler, off by default, exactly as in `af_wire`.
utoipa = { workspace = true, optional = true }
# The Definition's published shape, read only by the document build so the
# shipped daemon's graph is unchanged.
af_fleet_runtime = { workspace = true, optional = true }

[features]
openapi = ["dep:utoipa", "af_wire/openapi", "dep:af_fleet_runtime", "af_fleet_runtime/openapi"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "api_wire_suite"
path = "tests/api_wire_suite.rs"
