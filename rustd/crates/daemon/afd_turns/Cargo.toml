[package]
name = "afd_turns"
description = "Turns on a thread: durable intake, ordering and backlog budgets, and the history and live stream people read them through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true


[lints]
workspace = true

[dependencies]
serde.workspace = true
futures-util.workspace = true
base64.workspace = true
afd_api_wire.workspace = true
# Best-effort notification transport.
afd_bus.workspace = true
# Identifiers, the instant a row is stamped with, and the registry codes.
af_core = { workspace = true, features = ["sqlx"] }
# The row identifier's entropy. Held by the ledger rather than drawn per call
# — see `Turns`.
af_crypto.workspace = true
# The Postgres pool the ledger lives on.
afd_db.workspace = true
# The semantics marker accepted by the same validator that runtime runs use.
af_fleet_runtime.workspace = true
# The fleet status a runnable turn binds, and the one a refusal names.
afd_fleet_lifecycle.workspace = true
# The live run status the steer's run facts read.
afd_state.workspace = true
# Turn outcome counters.
af_observability.workspace = true
# Event types accepted by producers.
af_wire.workspace = true
# The payload digest a producer key is checked against on a retry, and its
# rendering. `hex::encode` rather than a `{:02x}` loop, for the reason
# `afd_auth::directory` gives.
hex.workspace = true
sha2.workspace = true
# Database timestamp bridge.
jiff.workspace = true
jiff-sqlx.workspace = true
# `derive` for the typed rows every statement decodes into.
sqlx = { workspace = true, features = ["derive", "json"] }
thiserror.workspace = true
tracing.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a
# router suite reaches this crate's seam with no datastore behind it.
test-util = [
    "af_core/test-util",
    "af_crypto/test-util",
    "afd_bus/test-util",
    "afd_db/test-util",
]

[dev-dependencies]
serde_json.workspace = true
afd_sse.workspace = true
afd_state.workspace = true
# The `tracing` capture the failure-line suites read a `reason` back through.
af_core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
# The in-process bus the receipt suites admit over and read wake rings back
# from, and the unreachable one their failure arms use.
afd_bus = { workspace = true, features = ["test-util"] }
# The stalled broker `tests/receipts/queue.rs` implements the bus trait for.
async-trait.workspace = true
# The lane fixture: the shared test database and the identifier minting the
# seeded rows are addressed by.
afd_db = { workspace = true, features = ["test-util"] }
af_crypto = { workspace = true, features = ["test-util"] }
# The error surface reaches THROUGH the chain to the driver's own
# `DatabaseError`, which is the only way to grade what the exhausted-disk
# sample claims to be. A dev-dependency on a crate this one already depends
# on, for a type only the suite names.
sqlx.workspace = true

[[test]]
name = "view_suite"
path = "tests/view/view_suite.rs"
