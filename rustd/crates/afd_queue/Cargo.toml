[package]
name = "afd_queue"
description = "Work moved off the request path: a Sink a producer offers messages to, a Consumer that handles them, and the realizations that connect the two, starting in memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# `Consumer` is held as a trait object, and handling a message is async.
async-trait.workspace = true
# A refused offer is a debug event.
tracing.workspace = true
# The in-memory realization: its channel, its worker task and its retry pauses.
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
