[package]
name = "agentsfleetd"
description = "The daemon: subcommand parsing, boot choreography, and the task supervisor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# A library beside the binary, so the choreography is reachable from a test.
# `main.rs` is the thin part: everything a test would want to drive — boot
# order, the supervisor, the shutdown sequence — lives in the library, because
# a binary crate's internals cannot be linked by an integration suite.
[lib]
name = "agentsfleetd"
path = "src/lib.rs"

[[bin]]
name = "agentsfleetd"
path = "src/main.rs"

[features]
# M-TEST-UTIL. Unlocks the mockable cores the boot path reads through.
test-util = [
    "afd_api/test-util",
    "afd_auth/test-util",
    "afd_core/test-util",
    "afd_crypto/test-util",
    "afd_db/test-util",
    "afd_redis/test-util",
]

[dependencies]
# The client every credential exchange is posted through. Built here rather than
# inside the broker because a connection pool and a deadline are composition-root
# decisions, and one client per process is what a pool IS.
reqwest.workspace = true
afd_api.workspace = true
afd_core.workspace = true
# The composition root: this crate is the one that names which directory,
# capability provider and verifier the generic HTTP shell is served through.
afd_auth.workspace = true
# The Postgres credential directory the shell authenticates against.
afd_state.workspace = true
# The runner control plane behind the `/v1/runners` verbs.
afd_fleet.workspace = true
# The tenant plane: api-keys, command-line credentials, the device-flow login
# surface, and the workspace-ownership resolver the shared layer asks.
afd_tenant.workspace = true
# The S3 client the Fleet Bundle snapshot store is built on. Named HERE and not
# in `afd_fleet` because this is the file that decides the store is Cloudflare
# R2 — `afd_fleet::bundle` takes an already-built `dyn ObjectStore` and knows
# nothing about which one.
object_store.workspace = true
# The identity provider's side of authentication: the capability claim and the
# key set. Optional at RUNTIME, not at build time — an unconfigured deployment
# holds the refusing variants rather than a different binary.
afd_identity.workspace = true
# The command line. Subcommands, `--port`, `--help` and `--version` are all
# derived from `cli::Cli`; nothing in this crate reads `std::env::args` itself.
clap.workspace = true

# Preflight resolves the master key here rather than in the crypto crate:
# `afd_crypto` takes hex, deliberately, because it is the layer that must not
# know where a key came from.
afd_crypto.workspace = true
# The pool and client settings boot resolves BEFORE it opens either.
afd_db.workspace = true
afd_redis.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
# The cancellation token every supervised task stops on.
tokio-util.workspace = true
# The accept loop drives hyper directly: `axum::serve` cannot bound the header
# buffer, and Dimension 5.3 is a bound on the header buffer.
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
# The boot-failure enum composes foreign errors by `From`, so `?` lifts them
# and the source chain survives for the fatal renderer to walk.
thiserror.workspace = true
tracing.workspace = true
# The subscriber every `tracing` emit in this process needs: without one
# installed the macros are no-ops that do not evaluate their fields.
tracing-subscriber.workspace = true

[dev-dependencies]
# `test-util` is what makes an assertion about JOIN_TIMEOUT affordable: with
# time paused and every task parked, the runtime advances to the next deadline
# itself, so the ten-second timeout costs no wall clock in the unit lane.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "net",
    "test-util",
] }
# The accept-fault suite names `CancellationToken` and builds a bare Router.
tokio-util.workspace = true
axum.workspace = true
# §7's end-to-end suite only. It seeds and reads rows through the pool the
# BOOTED daemon opened, so it needs the driver directly rather than through a
# store verb — no verb in this workspace creates a fleet or a wallet, and
# inventing one to serve a test would put a write path nothing ships into a
# shipping crate.
sqlx.workspace = true
# The same suite builds request bodies and reads answers as JSON: it speaks to
# the daemon over a socket, so it holds bytes rather than the wire types, and
# `afd_wire` rides in as the SHAPE those bodies are written against.
serde_json.workspace = true
afd_wire.workspace = true

[lints]
workspace = true
