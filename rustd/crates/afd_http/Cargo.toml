[package]
name = "afd_http"
description = "Shared HTTP protocol, admission, authentication, and refusal substrate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# The published document's shared vocabulary: the descriptions and tags the
# plane crates' annotations name, and the path-parameter shapes they address
# resources by. Those shapes are `IntoParams` derives, which is why the feature
# takes the generator rather than being strings alone.
openapi = ["dep:utoipa"]

[dependencies]
afd_admin.workspace = true
afd_approval.workspace = true
afd_auth.workspace = true
afd_billing.workspace = true
afd_credential.workspace = true
afd_connector.workspace = true
afd_cron.workspace = true
afd_ingress.workspace = true
afd_core.workspace = true
afd_crypto.workspace = true
afd_events.workspace = true
afd_db.workspace = true
afd_fleet.workspace = true
afd_fleet_lifecycle.workspace = true
afd_fleet_ops.workspace = true
afd_library.workspace = true
afd_observability.workspace = true
afd_runner.workspace = true
afd_sse.workspace = true
afd_tenant.workspace = true
afd_vault.workspace = true
afd_wire.workspace = true
axum = { workspace = true, features = ["matched-path", "query"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# The document generator, reachable only under `openapi`. Optional, so the
# default resolve of the substrate every plane depends on is unchanged.
utoipa = { workspace = true, optional = true }

[dev-dependencies]
# The `Refusable` suite grades this crate's adapters against one error of every
# kind the wrapped crates raise. Their `one_of_each_kind` samplers live behind
# `test-util`, and building the kinds by hand instead would let this crate's
# idea of each failure drift from the crate that raises it — which is exactly
# the drift the adapters exist to prevent.
# The `WebhookIngress` adapter is only ever the PRODUCTION `Ingress` in a
# deployment: every router suite substitutes its own stub for the trait, so the
# delegating impl in `services::ingress` is reached by nothing else. Grading it
# needs the three handles it is built from, in their refusing form.
afd_db = { workspace = true, features = ["test-util"] }
afd_redis = { workspace = true, features = ["test-util"] }
afd_core.workspace = true
afd_connector = { workspace = true, features = ["test-util"] }
afd_cron = { workspace = true, features = ["test-util"] }
afd_ingress = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
