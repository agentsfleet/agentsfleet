[package]
name = "afd_runner"
autotests = false
description = "The runner control plane: enrolment, liveness, the verdict over what a host may assert, and the sweepers that notice when one goes quiet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
afd_admission.workspace = true
afd_observability.workspace = true
# Identifiers, the clock a liveness instant is stamped with, the registry codes.
afd_core.workspace = true
garde.workspace = true
# The sentence each enrolment bound earns, keyed by the path garde reports.
afd_validate.workspace = true
const_format.workspace = true
# The entropy a runner credential is minted from, and the token digest.
afd_crypto.workspace = true
# The minted-credential shape an enrolment answers with, and the kind column's
# closed vocabulary.
afd_auth.workspace = true
# The Postgres pool every statement here runs on.
afd_db.workspace = true
# Every instant a runner row, a lease or a history row carries.
jiff.workspace = true
# The `TIMESTAMPTZ` bridge for those instants: row fields decode through it and
# a sentinel or cursor binds through it.
jiff-sqlx.workspace = true
# The stored vocabulary two planes share — admin states, lease statuses, the
# never-seen sentinel — lives below both, where `ADMIN_STATE_*` always has.
afd_state.workspace = true
# The outbound rebuild sweeper restores its transport group.
afd_dragonfly.workspace = true
# The enrolment and heartbeat request shapes, as the frozen wire spells them.
afd_api_wire.workspace = true
afd_wire.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# The sweepers park between passes on a cancellable timer.
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a caller's
# suite reaches this crate's seam with no datastore behind it.
test-util = [
    "afd_admission/test-util",
    "afd_core/test-util",
    "afd_db/test-util",
    "afd_dragonfly/test-util",
]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
afd_admission = { workspace = true, features = ["test-util"] }
afd_db = { workspace = true, features = ["test-util"] }
afd_dragonfly.workspace = true
afd_observability = { workspace = true, features = ["test-util"] }

[[test]]
name = "runner_suite"
path = "tests/runner_suite.rs"
required-features = ["test-util"]
