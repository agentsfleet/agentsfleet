[package]
name = "afd_core"
# One aggregated test binary; see tests/core_suite.rs for why.
autotests = false
description = "Domain primitives shared by every agentsfleetd crate: identity, error codes, bounded values."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# M-TEST-UTIL: the map-backed environment source. Behind a flag because a
# production binary reads the process environment and nothing else.
test-util = []

[dependencies]
serde.workspace = true
# The strong `ETag` digest (`crate::etag`). A wire encoding rather than a
# transport concern: a client cache may hold a tag the Zig daemon computed, and
# both the HTTP edge and the store that compares one inside a row lock have to
# spell it the same way.
sha2.workspace = true
# The text-boundary keyset cursor: a sort key that is text is base64url-encoded
# so a value containing the separator cannot corrupt the boundary. Both binaries
# issue and read these strings, so the encoding is a DATA FORMAT rather than a
# choice — and an encoder is a value-layer concern, which is why the cursor
# lives here rather than beside the handlers that parse one out of a query.
base64.workspace = true
# The object-shape gate every trust boundary deserializes through
# (`crate::json`). A library dependency rather than a dev one since that gate
# shipped: the crates it guards — the runner enrolment body, the JWT header,
# the JWKS document — call it from production paths.
serde_json.workspace = true
thiserror.workspace = true
# Version-7 construction only; the canonical-spelling PARSE stays here, because
# `Uuid::parse_str` normalises case and this product rejects it. See the
# workspace manifest for the full rationale.
uuid.workspace = true

[lints]
workspace = true

[[test]]
name = "core_suite"
path = "tests/core_suite.rs"
