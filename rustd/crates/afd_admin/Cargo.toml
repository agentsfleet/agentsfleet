[package]
name = "afd_admin"
description = "Small repositories for agentsfleet platform administration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-util = ["afd_core/test-util", "afd_crypto/test-util", "afd_db/test-util"]

[dependencies]
afd_core.workspace = true
afd_crypto.workspace = true
afd_db.workspace = true
afd_wire.workspace = true
afd_inference.workspace = true
# Instants are `jiff::Timestamp`; `TIMESTAMPTZ(3)` columns decode through jiff-sqlx.
jiff.workspace = true
jiff-sqlx.workspace = true
# `derive`: rows decode into named `FromRow` types; `json`: the inference settings column.
sqlx = { workspace = true, features = ["derive", "json"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
