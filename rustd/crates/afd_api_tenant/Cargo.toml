[package]
name = "afd_api_tenant"
description = "Tenant-facing HTTP handlers over tenant-owned services."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-util = [
  "afd_fleet/test-util",
  "afd_fleet_lifecycle/test-util",
  "afd_library/test-util",
  "afd_tenant/test-util",
  "afd_vault/test-util",
]
# Generates this plane's half of the OpenAPI document. NOT default: the shipped
# daemon compiles no annotation, no schema string and no collector — the whole
# of it is a build-time tool, and CI is where its compile cost belongs.
openapi = ["dep:utoipa", "afd_http/openapi", "afd_wire/openapi"]

[dependencies]
afd_webhook.workspace = true
afd_ingress.workspace = true
afd_crypto.workspace = true
afd_cron.workspace = true
afd_connector.workspace = true
afd_approval.workspace = true
afd_auth.workspace = true
afd_billing.workspace = true
# The tenant's provider selection: the row the Models page reads and writes.
afd_credential.workspace = true
afd_core.workspace = true
afd_events.workspace = true
afd_fleet.workspace = true
afd_fleet_lifecycle.workspace = true
afd_fleet_runtime.workspace = true
afd_http.workspace = true
afd_library.workspace = true
afd_observability.workspace = true
afd_sse.workspace = true
afd_tenant.workspace = true
afd_vault.workspace = true
afd_wire.workspace = true
# The document generator, reachable only under `openapi`. Optional at every
# member that names it, so the default resolve is unchanged.
utoipa = { workspace = true, optional = true }
axum = { workspace = true, features = ["json", "query"] }
futures-util.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
