[package]
name = "afd_fleet_lifecycle"
# One aggregated test binary; see tests/lifecycle_suite.rs for why.
autotests = false
description = "A workspace's fleets as one shared store: list, live set, counters, purge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The families this crate produces. The dependency points this way and not the
# other: telemetry knows nothing about fleets, and a readiness mark this crate
# could not write is a fact only this crate holds.
afd_observability.workspace = true
# Identifiers, the clock, the registry codes, and the keyset cursor the list
# walk resumes from.
afd_core.workspace = true
# The Postgres pool every statement here runs on, and its one database clock.
afd_db.workspace = true
# Composes that clock into the purge's tombstone statement at compile time.
const_format.workspace = true
# The per-fleet event stream and readiness mark a purge forgets after the row.
afd_dragonfly.workspace = true
# The counter snapshot the live wall's `hello` carries.
afd_api_wire.workspace = true
afd_wire.workspace = true
# One fleet enumeration per workspace per tick, shared by every live stream
# watching it — and `get`/`insert` coalesce the misses a cadence produces.
moka.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a router
# suite reaches this crate's seam with no datastore behind it.
test-util = [
  "afd_core/test-util",
  "afd_db/test-util",
  "afd_dragonfly/test-util",
]

[dev-dependencies]
# The integration lane drives a real Postgres and a real Redis, so it needs a
# runtime with threads under it.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The fixture mints the identifiers its rows carry.
afd_crypto.workspace = true
# The lane fixture and the fleet seed its rows go in through. A dev-dependency
# feature only.
afd_db = { workspace = true, features = ["test-util"] }

[[test]]
name = "lifecycle_suite"
path = "tests/lifecycle_suite.rs"
