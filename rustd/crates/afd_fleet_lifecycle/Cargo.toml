[package]
name = "afd_fleet_lifecycle"
# One aggregated test binary; see tests/lifecycle_suite.rs for why.
autotests = false
description = "A workspace's fleets: install, read, edit, purge — the lifecycle around the runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# The families this crate produces. The dependency points this way and not the
# other: telemetry knows nothing about fleets, and a readiness mark this crate
# could not write is a fact only this crate holds.
afd_observability.workspace = true
# Identifiers, the clock, the registry codes, and the keyset cursor the list
# walk resumes from.
# The retry LOOP around the install's stream setup — the counter and the
# terminal rule, which is where the Zig shipped its bug. The delays stay
# `afd_redis::Backoff`.
backon.workspace = true
afd_core.workspace = true
# Entropy for the fleet identifiers the install mints.
afd_crypto.workspace = true
# The Postgres pool every statement here runs on.
afd_db.workspace = true
# The per-fleet event stream and its consumer group. The install's whole
# guarantee is that both exist before the 201, so this is not an optional edge:
# it is the reason this crate is not a pure Postgres store.
afd_redis.workspace = true
# `SKILL.md` and `TRIGGER.md` are parsed at the write boundary — an install and
# a config PATCH both store the JSON this produces, and neither may store a
# document the lease path could not read back.
afd_fleet_runtime.workspace = true
# One fleet enumeration per workspace per tick, shared by every live stream
# watching it — and `get`/`insert` coalesce the misses a cadence produces.
moka.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# M-TEST-UTIL. Unlocks the refusals a stubbed service answers with, so a router
# suite reaches this crate's seam with no datastore behind it.
test-util = [
  "afd_core/test-util",
  "afd_db/test-util",
  "afd_redis/test-util",
]

[dev-dependencies]
# The integration lane drives a real Postgres and a real Redis, so it needs a
# runtime with threads under it — the concurrent-write race is worthless on a
# single-threaded one, because the interleaving it exists to force cannot happen.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The fixture reaches Redis directly to seed and inspect keys the store owns.
redis = { workspace = true }

[[test]]
name = "lifecycle_suite"
path = "tests/lifecycle_suite.rs"
