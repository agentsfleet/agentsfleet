[package]
name = "af_providers"
description = "The runner's model providers: one trait, the turn it streams, and the wires behind it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# `error_shell!` and the registry code a provider failure is logged under.
af_core.workspace = true
af_inference.workspace = true
# The label vocabulary and closed-set macro a provider measurement is declared in.
af_observability.workspace = true
af_crypto.workspace = true
# The stream text kinds the live tail carries, and the failure classes a
# report names.
af_wire.workspace = true
# The guard every outbound client carries: the resolver that refuses a
# private address, no proxy, no redirect. A tenant's custom: endpoint meets it,
# and the same blocked ranges judge an address literal it names.
af_egress.workspace = true
# The bounded retry of a turn's send, the crate the supervisor's daemon calls
# retry through.
backon.workspace = true
# A turn's request body, shared by every retry without a copy.
# A tool result's image rides the wire as base64.
base64.workspace = true
bytes = { workspace = true, features = ["serde"] }
# A turn streams as a `futures` stream of chunks.
futures-util.workspace = true
# The request and response types rig's HTTP seam speaks.
http.workspace = true
# `Retry-After` in its HTTP-date form.
httpdate.workspace = true
garde.workspace = true
# The one HTTP client every wire posts through, behind rig's HTTP seam.
reqwest.workspace = true
# Each wire: the request rig builds, the stream it decodes, the calls it
# assembles and the reasoning it carries back.
rig-core.workspace = true
# Each wire's request body and streamed events, narrowed at the parse.
serde.workspace = true
# A tool call's arguments.
serde_json.workspace = true
thiserror.workspace = true
# Parse the exact reviewed decision endpoint and retain its typed parse error.
url.workspace = true
# The retry log line, and the level rig's own lines are held to.
tracing.workspace = true

# The TLS listener `testing::tls` serves a fake provider on.
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }

[features]
# M-TEST-UTIL: an observer a suite reads back, and the fake provider's TLS
# listener, for this crate's suites and the runner's.
test-util = ["dep:rcgen", "dep:rustls", "dep:tokio-rustls"]

[dev-dependencies]
# Scoped channel-based logging proof avoids process-wide capture locks.
tracing-subscriber.workspace = true
# Rig's scripted stream exercises unmodeled items and retained terminal failures.
rig-core = { workspace = true, features = ["test-utils"] }
# The log capture the retry and key suites read their lines through.
af_core = { workspace = true, features = ["test-util"] }
# The fake provider: a real listener, so a status, a header and a streamed
# body are proven on the socket rather than assumed by a mock.
axum.workspace = true
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# The connect-refused send the retry suite classifies, and the fake provider
# servers the wire suites stream from.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync", "test-util"] }
# The stop every driven run is given.
tokio-util.workspace = true

[[test]]
name = "decisions"
path = "tests/decisions/main.rs"
# The suite reads its measurements and serves its TLS through `testing`.
required-features = ["test-util"]
