[package]
name = "afd_authoring"
description = "Creator-private fleet drafts, immutable proposals, and bounded authoring attempts."
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
afd_core.workspace = true
afd_inference.workspace = true
afd_billing.workspace = true
afd_identity.workspace = true
afd_crypto.workspace = true
afd_db.workspace = true
afd_credential.workspace = true
afd_connector.workspace = true
afd_fleet_runtime.workspace = true
afd_validate.workspace = true
afd_wire.workspace = true
afd_runner.workspace = true
afd_admission.workspace = true
afd_approval.workspace = true
afd_dragonfly.workspace = true
afd_cron.workspace = true
# The product-analytics reporter the private-chat-to-fleet funnel steps go to,
# each after the commit that made it true.
afd_observability.workspace = true
garde.workspace = true
async-trait.workspace = true
base64.workspace = true
const_format.workspace = true
hex.workspace = true
# Instants: `TIMESTAMPTZ(3)` columns decode to `jiff::Timestamp` through
# jiff-sqlx.
jiff.workspace = true
jiff-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
rig-core.workspace = true
http.workspace = true
futures-util.workspace = true
subtle.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tracing.workspace = true

[dev-dependencies]
afd_runner = { workspace = true, features = ["test-util"] }
afd_approval = { workspace = true, features = ["test-util"] }
afd_admission = { workspace = true, features = ["test-util"] }
afd_db = { workspace = true, features = ["test-util"] }
afd_dragonfly = { workspace = true, features = ["test-util"] }
afd_observability = { workspace = true, features = ["test-util"] }
afd_vault.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util"] }

[features]
test-util = ["afd_db/test-util"]

[lints]
workspace = true

[[test]]
name = "authoring_suite"
path = "tests/authoring_suite.rs"
