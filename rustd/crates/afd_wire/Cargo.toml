[package]
name = "afd_wire"
# One aggregated test binary; see tests/wire_suite.rs for why.
autotests = false
description = "Serde port of the frozen /v1/runners control protocol the daemon and runner exchange."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The workspace's validation crate. Wire bounds are DECLARED on the request
# types they guard, so a handler proves them by calling `validate` rather than
# by re-spelling each cap as an `if`.
garde.workspace = true
# Deliberately NOT afd_core. See the module documentation in src/lib.rs: wire
# types carry primitives, and validating at parse would break byte parity.
serde.workspace = true
# Free-form wire fields (`secrets_map`, event `metadata`) are opaque documents
# the daemon carries verbatim. `preserve_order` is load-bearing: without it an
# object's keys re-serialize in hash order and the byte comparison fails.
serde_json.workspace = true
# The schema compiler, off by default. `ToSchema` touches no `Serialize` impl,
# so a build with this feature on emits the same bytes as one without it — the
# round-trip suite re-proves that rather than asserting it.
utoipa = { workspace = true, optional = true }

[features]
# Generates the OpenAPI schemas for these wire types. NOT default: the shipped
# daemon resolves a dependency graph carrying serde and serde_json alone, which
# is the invariant `the_default_build_carries_no_utoipa` grades.
openapi = ["dep:utoipa"]

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "wire_suite"
path = "tests/wire_suite.rs"
