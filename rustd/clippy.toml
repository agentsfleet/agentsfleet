# Each mechanism below has one owner. A new call that bypasses it fails
# `make lint-rustd` (`disallowed_methods` sits in the denied `clippy::style`
# group), so a fix to the owner reaches every caller instead of the copies.
# The owner itself, and a caller kept on purpose, carries
# `#[expect(clippy::disallowed_methods, reason = "...")]` saying why.
disallowed-methods = [
    { path = "std::time::SystemTime::now", reason = "read the wall clock through afd_core::clock::now" },
    { path = "std::env::var", reason = "read a knob through afd_core::env (optional, or an EnvSource)" },
    { path = "std::env::var_os", reason = "read a knob through afd_core::env (optional, or an EnvSource)" },
    { path = "reqwest::Client::new", reason = "build a client that must ignore an environment proxy with afd_identity::direct; any other client names its bounds on a builder" },
    { path = "reqwest::Client::builder", reason = "build a client that must ignore an environment proxy with afd_identity::direct" },
]

# A test prints its measured evidence into the lane log, so the print lints
# (`print_stdout`, `print_stderr`) skip test code instead of every test file
# carrying an `#[expect]`. A harness-less test target is not test code to
# clippy and still names its reason.
allow-print-in-tests = true
